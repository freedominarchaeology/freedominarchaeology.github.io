<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PointCloud Editor (3-Point Alignment)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: "MS Mincho", "MS 明朝", "Yu Mincho", serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
        }
        
        #viewport-container {
            flex: 1;
            position: relative;
            background-color: #000;
        }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        
        #bottom-panel {
            width: 100%; height: 35vh; min-height: 250px;
            background-color: #252526; border-top: 1px solid #3c3c3c;
            display: flex; flex-direction: row; padding: 10px; gap: 10px;
            z-index: 10; box-shadow: 0 -2px 5px rgba(0,0,0,0.5);
            overflow-x: auto; overflow-y: hidden;
        }
        
        .panel-group {
            background: #2d2d2d; border: 1px solid #3c3c3c; padding: 10px;
            border-radius: 4px; display: flex; flex-direction: column; min-width: 220px;
        }
        .panel-large { flex: 2; min-width: 400px; }
        
        .panel-title { font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px; font-size: 14px; }
        label { display: block; font-size: 12px; margin: 6px 0 2px; }
        input[type="text"], input[type="number"], select, button {
            width: 100%; padding: 6px; background: #333;
            border: 1px solid #555; color: #fff; font-family: inherit; border-radius: 2px;
        }
        input[type="number"] { user-select: text; }
        button { cursor: pointer; background: #0e639c; border: none; margin-top: 5px; font-weight: bold; padding: 8px; }
        button:hover:not(:disabled) { background: #1177bb; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        button.action-btn { background: #15803d; margin-top: 10px; }
        button.action-btn:hover:not(:disabled) { background: #16a34a; }

        .point-item { background-color: #2a2a2a; border: 1px solid transparent; border-radius: 4px; padding: 6px; margin-bottom: 6px; }
        .point-item:hover { background-color: #333; }
        .point-item.active { background-color: #1a2e23; border-color: #4ade80; }
        .coord-grid { display: grid; grid-template-columns: 48px 1fr 1fr 1fr; gap: 4px; align-items: center; font-size: 11px; margin-bottom: 4px; }
        .coord-grid span.label { color: #aaa; text-align: center; }
        .coord-grid span.val { background: #222; padding: 4px; border-radius: 2px; text-align: center; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .coord-grid input { padding: 4px; font-size: 11px; text-align: center; }
        .header-grid { display: grid; grid-template-columns: 48px 1fr 1fr 1fr; gap: 4px; font-size: 12px; margin-bottom: 4px; text-align: center; color: #aaa; padding-right: 8px; }

        #info-overlay {
            position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7);
            padding: 8px 12px; border-radius: 4px; font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="viewport-container">
    <canvas id="renderCanvas"></canvas>
    <div id="info-overlay">
        <span id="stat-points">点数: 0</span> | <span id="stat-contours">等高線: 0</span>
    </div>
</div>

<div id="bottom-panel">
    <div class="panel-group">
        <label for="lang-select" id="lbl-lang">言語 / Language</label>
        <select id="lang-select" onchange="changeLanguage(this.value)">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
        
        <div class="panel-title" id="title-file" style="margin-top: 15px;">ファイル操作</div>
        <input type="file" id="file-input" accept=".ply" style="display:none;" onchange="handleFileSelect(event)">
        <button id="btn-import" onclick="document.getElementById('file-input').click()">PLYインポート</button>
        <button id="btn-export" onclick="exportPLY()" disabled>PLYエクスポート</button>
    </div>

    <!-- 座標リスト・編集パネル -->
    <div class="panel-group panel-large">
        <div class="panel-title" id="title-selection">選択点一覧 / 座標補正</div>
        <div style="font-size: 11px; color: #aaa; margin-bottom: 6px;" id="desc-align">
            1点選択: 平行移動のみ適用<br>3点選択: 3点に基づく移動・回転・スケール補正を適用
        </div>
        <div class="header-grid"><span></span><span>X</span><span>Y</span><span>Z</span></div>
        <div id="points-list-container" style="overflow-y: auto; flex: 1; background: #1e1e1e; border: 1px solid #444; padding: 6px;"></div>
        <button id="btn-apply" class="action-btn" onclick="applyAlignment()" disabled>座標補正を適用</button>
    </div>

    <div class="panel-group">
        <div class="panel-title" id="title-contour">等高線設定</div>
        <label id="lbl-step">間隔 (Step)</label>
        <input type="number" id="contour-step" value="1.0" step="0.1" min="0.01">
        <button id="btn-gen-contour" onclick="generateContours()" disabled>等高線生成</button>
    </div>
</div>

<script>
/** 辞書データ **/
const i18n = {
    ja: {
        titleFile: "ファイル操作", import: "PLYインポート", export: "PLYエクスポート", titleSelection: "選択点一覧 / 座標補正",
        titleContour: "等高線設定", step: "等高線ピッチ (Z)", generate: "等高線生成", points: "点数: ", contours: "等高線ライン数: ",
        before: "変更前", after: "変更後", apply: "座標補正を適用", desc: "1点選択: 平行移動のみ適用<br>3点選択: 3点に基づく移動・回転・スケール補正を適用",
        errPoints: "補正を行うには、点を1つ（平行移動）または3つ（移動・回転・スケール）選択してください。", errLine: "3点が同一直線上に近いため計算できません。別の3点を選んでください。", msgSuccess: "座標補正を適用しました。"
    },
    en: {
        titleFile: "File Operations", import: "Import PLY", export: "Export PLY", titleSelection: "Selected Points / Alignment",
        titleContour: "Contour Settings", step: "Interval (Z)", generate: "Generate Contours", points: "Points: ", contours: "Contours: ",
        before: "Original", after: "Target", apply: "Apply Alignment", desc: "1 point: Translation only<br>3 points: Translation, Rotation & Scale based on 3 points",
        errPoints: "Please select exactly 1 point (for translation) or 3 points (for translation, rotation, and scale).", errLine: "Selected points are nearly collinear. Please select non-collinear points.", msgSuccess: "Alignment applied successfully."
    }
};

let currentLang = 'ja';
function changeLanguage(lang) {
    currentLang = lang;
    const t = i18n[lang];
    document.getElementById('title-file').innerText = t.titleFile;
    document.getElementById('btn-import').innerText = t.import;
    document.getElementById('btn-export').innerText = t.export;
    document.getElementById('title-selection').innerText = t.titleSelection;
    document.getElementById('title-contour').innerText = t.titleContour;
    document.getElementById('lbl-step').innerText = t.step;
    document.getElementById('btn-gen-contour').innerText = t.generate;
    document.getElementById('btn-apply').innerText = t.apply;
    document.getElementById('desc-align').innerHTML = t.desc;
    updateUIInfo();
    updateSelectionUI();
}

/** 3Dエンジン 状態管理 **/
let pointCloudData = null; // [x,y,z, r,g,b] 
let pointCount = 0;
let contourLines = [];

// 複数選択・補正管理
let selectedIndices = []; 
let activeIndex = -1;     
let targetCoords = {}; // 各点の目標座標 { idx: {x, y, z} }

let camera = { rotX: 0.5, rotY: 0.5, zoom: 1.0, panX: 0, panY: 0 };
let isDragging = false, dragMode = 0; 
let lastMouse = { x: 0, y: 0 };
let initialPinchDist = null, lastTouchCenter = null;

const canvas = document.getElementById('renderCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
let canvasWidth = 0, canvasHeight = 0;
let renderReq = null;

function initCanvas() {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    canvas.addEventListener('mousedown', e => { isDragging = true; dragMode = (e.button === 0) ? 0 : 1; lastMouse = { x: e.clientX, y: e.clientY }; });
    canvas.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
        if (dragMode === 0) { camera.rotY += dx * 0.005; camera.rotX += dy * 0.005; }
        else { camera.panX += dx; camera.panY += dy; }
        lastMouse = { x: e.clientX, y: e.clientY };
        requestRender();
    });
    window.addEventListener('mouseup', e => {
        isDragging = false;
        if (pointCount > 0 && Math.abs(e.clientX - lastMouse.x) < 3 && Math.abs(e.clientY - lastMouse.y) < 3) selectPointAt(e.clientX, e.clientY);
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault()); 
    canvas.addEventListener('wheel', e => { camera.zoom *= (e.deltaY > 0) ? 0.9 : 1.1; requestRender(); }, { passive: true });
}

function resizeCanvas() {
    canvasWidth = canvas.parentElement.clientWidth; canvasHeight = canvas.parentElement.clientHeight;
    canvas.width = canvasWidth; canvas.height = canvasHeight; requestRender();
}

function freeMemory() {
    pointCloudData = null; contourLines = [];
    selectedIndices = []; targetCoords = {}; activeIndex = -1; pointCount = 0;
    updateSelectionUI();
}

function handleFileSelect(evt) {
    const file = evt.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            freeMemory(); parsePLY(e.target.result);
            document.getElementById('btn-export').disabled = false;
            document.getElementById('btn-gen-contour').disabled = false;
            updateUIInfo(); camera = { rotX: 0.5, rotY: 0.5, zoom: 1.0, panX: 0, panY: 0 }; requestRender();
        } catch (err) { alert("PLY Load Error"); }
    };
    reader.readAsArrayBuffer(file);
}

function parsePLY(buffer) {
    const dec = new TextDecoder('utf-8');
    const headerText = dec.decode(new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 10240)));
    let isBinary = false, headerLength = 0, vertexCount = 0;
    
    const lines = headerText.split('\n');
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim().replace(/\s+/g, ' ');
        if (line.includes('binary_little_endian')) isBinary = true;
        if (line.startsWith('element vertex')) vertexCount = parseInt(line.split(' ')[2], 10);
        if (line === 'end_header') { headerLength = headerText.indexOf('end_header') + 11; break; }
    }
    pointCount = vertexCount;
    pointCloudData = new Float32Array(pointCount * 6); 

    // 簡易パーサー（実際のプロパティ位置検知は省略して標準的なxyz, rgbを想定）
    if (isBinary) {
        const view = new DataView(buffer, headerLength);
        let off = 0;
        for (let i = 0; i < pointCount; i++) {
            let idx = i * 6;
            pointCloudData[idx] = view.getFloat32(off, true); pointCloudData[idx+1] = view.getFloat32(off+4, true); pointCloudData[idx+2] = view.getFloat32(off+8, true);
            pointCloudData[idx+3] = view.getUint8(off+12); pointCloudData[idx+4] = view.getUint8(off+13); pointCloudData[idx+5] = view.getUint8(off+14);
            off += 15; // float*3 + uchar*3 (アライメント注意。汎用的にはプロパティ解析が必要ですが簡略化)
            // ※実際には入力ファイルの構造に合わせてオフセットを計算する必要がありますが、文字数制限のため単純化しています。
        }
    } else {
        const dataStr = dec.decode(buffer).substring(headerLength).trim();
        const dataArray = dataStr.split(/\s+/);
        let ptr = 0;
        for (let i = 0; i < pointCount; i++) {
            let idx = i * 6;
            pointCloudData[idx] = parseFloat(dataArray[ptr]); pointCloudData[idx+1] = parseFloat(dataArray[ptr+1]); pointCloudData[idx+2] = parseFloat(dataArray[ptr+2]);
            pointCloudData[idx+3] = parseInt(dataArray[ptr+3]); pointCloudData[idx+4] = parseInt(dataArray[ptr+4]); pointCloudData[idx+5] = parseInt(dataArray[ptr+5]);
            ptr += 6; // x y z r g b
        }
    }
}

function requestRender() { if (!renderReq) { renderReq = requestAnimationFrame(() => { render(); renderReq = null; }); } }

function render() {
    if (canvasWidth === 0 || canvasHeight === 0) return;
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    if (!pointCloudData || pointCount === 0) return;

    const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
    const data = imgData.data;
    const cx = canvasWidth / 2 + camera.panX, cy = canvasHeight / 2 + camera.panY;
    const scale = 100 * camera.zoom;
    const cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX);
    const cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);

    for (let i = 0; i < pointCount; i++) {
        const idx = i * 6;
        let x = pointCloudData[idx], y = pointCloudData[idx+1], z = pointCloudData[idx+2];
        let x1 = x * cosY + z * sinY, z1 = -x * sinY + z * cosY;
        let y1 = y * cosX - z1 * sinX, z2 = y * sinX + z1 * cosX;
        const proj = scale / (z2 + 500);
        let px = Math.floor(cx + x1 * proj), py = Math.floor(cy - y1 * proj);

        if (px >= 0 && px < canvasWidth - 1 && py >= 0 && py < canvasHeight - 1) {
            let r = pointCloudData[idx+3], g = pointCloudData[idx+4], b = pointCloudData[idx+5];
            let p = (py * canvasWidth + px) * 4;
            data[p] = r; data[p+1] = g; data[p+2] = b; data[p+3] = 255;
            data[p+4] = r; data[p+5] = g; data[p+6] = b; data[p+7] = 255;
            let pDown = p + (canvasWidth * 4);
            data[pDown] = r; data[pDown+1] = g; data[pDown+2] = b; data[pDown+3] = 255;
            data[pDown+4] = r; data[pDown+5] = g; data[pDown+6] = b; data[pDown+7] = 255;
        }
    }
    ctx.putImageData(imgData, 0, 0);

    selectedIndices.forEach(idx => {
        let x = pointCloudData[idx*6], y = pointCloudData[idx*6+1], z = pointCloudData[idx*6+2];
        let x1 = x * cosY + z * sinY, z1 = -x * sinY + z * cosY;
        let y1 = y * cosX - z1 * sinX, z2 = y * sinX + z1 * cosX;
        let px = cx + x1 * (scale / (z2 + 500)), py = cy - y1 * (scale / (z2 + 500));
        ctx.fillStyle = '#fff'; ctx.fillRect(px - 3, py - 3, 6, 6);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(px - 3, py - 3, 6, 6);
    });
}

function selectPointAt(mx, my) {
    const cx = canvasWidth/2 + camera.panX, cy = canvasHeight/2 + camera.panY;
    const scale = 100 * camera.zoom;
    const cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX);
    const cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);

    let minDist = 20, closest = -1;
    for (let i = 0; i < pointCount; i++) {
        const idx = i * 6;
        let x = pointCloudData[idx], y = pointCloudData[idx+1], z = pointCloudData[idx+2];
        let x1 = x * cosY + z * sinY, z1 = -x * sinY + z * cosY;
        let y1 = y * cosX - z1 * sinX, z2 = y * sinX + z1 * cosX;
        let px = cx + x1 * (scale / (z2 + 500)), py = cy - y1 * (scale / (z2 + 500));
        let dist = Math.hypot(px - mx, py - my);
        if (dist < minDist) { minDist = dist; closest = i; }
    }

    if (closest !== -1) {
        if (!selectedIndices.includes(closest)) {
            selectedIndices.push(closest);
            // 初期状態は現在の座標を入れておく
            targetCoords[closest] = {
                x: pointCloudData[closest*6],
                y: pointCloudData[closest*6+1],
                z: pointCloudData[closest*6+2]
            };
        }
        activeIndex = closest;
        updateSelectionUI();
        requestRender();
    }
}

function updateSelectionUI() {
    const container = document.getElementById('points-list-container');
    container.innerHTML = ''; 
    const t = i18n[currentLang];
    
    document.getElementById('btn-apply').disabled = (selectedIndices.length === 0);

    selectedIndices.forEach((idx) => {
        const base = idx * 6;
        let origX = pointCloudData[base], origY = pointCloudData[base+1], origZ = pointCloudData[base+2];
        let tgt = targetCoords[idx];

        const item = document.createElement('div');
        item.className = 'point-item' + (idx === activeIndex ? ' active' : '');
        item.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; align-items:center;">
                <span style="font-weight:bold; font-size:12px;">[ ID: ${idx} ]</span>
                <button onclick="removePoint(${idx})" title="削除" style="width:24px; height:24px; padding:0; margin:0; line-height:1; background:#c53030;">×</button>
            </div>
            <div class="coord-grid">
                <span class="label">${t.before}</span>
                <span class="val" title="${origX}">${origX.toFixed(3)}</span>
                <span class="val" title="${origY}">${origY.toFixed(3)}</span>
                <span class="val" title="${origZ}">${origZ.toFixed(3)}</span>
            </div>
            <div class="coord-grid">
                <span class="label" style="color:#4ade80;">${t.after}</span>
                <input type="number" step="any" value="${tgt.x}" onchange="updateTarget(${idx}, 'x', this.value)">
                <input type="number" step="any" value="${tgt.y}" onchange="updateTarget(${idx}, 'y', this.value)">
                <input type="number" step="any" value="${tgt.z}" onchange="updateTarget(${idx}, 'z', this.value)">
            </div>
        `;
        container.appendChild(item);
    });
}

function updateTarget(idx, axis, val) {
    const v = parseFloat(val);
    if(!isNaN(v)) targetCoords[idx][axis] = v;
}

function removePoint(idx) {
    selectedIndices = selectedIndices.filter(i => i !== idx);
    delete targetCoords[idx];
    updateSelectionUI(); requestRender();
}


/** 3点 アライメント数学ロジック **/
const vec = {
    sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
    dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
    cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
    mag: (a) => Math.hypot(a[0], a[1], a[2]),
    norm: (a) => { const m = Math.hypot(a[0], a[1], a[2]); return m===0 ? [0,0,0] : [a[0]/m, a[1]/m, a[2]/m]; }
};

function getBasis(p1, p2, p3) {
    let vx = vec.norm(vec.sub(p2, p1));
    let v_tmp = vec.norm(vec.sub(p3, p1));
    let cross_p = vec.cross(vx, v_tmp);
    if (vec.mag(cross_p) < 1e-8) return null; // 同一直線上にある場合エラー
    let vz = vec.norm(cross_p);
    let vy = vec.norm(vec.cross(vz, vx));
    return { vx, vy, vz };
}

// 補正処理本体
function applyAlignment() {
    const t = i18n[currentLang];
    
    if (selectedIndices.length === 1) {
        // --- 1点指定の場合: 平行移動 ---
        let idx = selectedIndices[0];
        let p = [pointCloudData[idx*6], pointCloudData[idx*6+1], pointCloudData[idx*6+2]];
        let q = [targetCoords[idx].x, targetCoords[idx].y, targetCoords[idx].z];
        let dx = q[0] - p[0], dy = q[1] - p[1], dz = q[2] - p[2];
        
        for (let i = 0; i < pointCount; i++) {
            pointCloudData[i*6]   += dx;
            pointCloudData[i*6+1] += dy;
            pointCloudData[i*6+2] += dz;
        }
        
    } else if (selectedIndices.length === 3) {
        // --- 3点指定の場合: 移動・回転・スケール ---
        let i1 = selectedIndices[0], i2 = selectedIndices[1], i3 = selectedIndices[2];
        let p1 = [pointCloudData[i1*6], pointCloudData[i1*6+1], pointCloudData[i1*6+2]];
        let p2 = [pointCloudData[i2*6], pointCloudData[i2*6+1], pointCloudData[i2*6+2]];
        let p3 = [pointCloudData[i3*6], pointCloudData[i3*6+1], pointCloudData[i3*6+2]];
        
        let q1 = [targetCoords[i1].x, targetCoords[i1].y, targetCoords[i1].z];
        let q2 = [targetCoords[i2].x, targetCoords[i2].y, targetCoords[i2].z];
        let q3 = [targetCoords[i3].x, targetCoords[i3].y, targetCoords[i3].z];

        const basisP = getBasis(p1, p2, p3);
        const basisQ = getBasis(q1, q2, q3);
        
        if (!basisP || !basisQ) {
            alert(t.errLine); return;
        }

        // 2点間の距離の比率でスケール（縮尺）も補正
        const scale = vec.mag(vec.sub(q2, q1)) / vec.mag(vec.sub(p2, p1));

        for (let i = 0; i < pointCount; i++) {
            let base = i * 6;
            let p = [pointCloudData[base], pointCloudData[base+1], pointCloudData[base+2]];
            
            // 元の3点座標系(p) におけるローカル座標を算出
            let dp = vec.sub(p, p1);
            let lx = vec.dot(dp, basisP.vx) * scale;
            let ly = vec.dot(dp, basisP.vy) * scale;
            let lz = vec.dot(dp, basisP.vz) * scale;
            
            // 目標の3点座標系(q) に投影してワールド座標に戻す
            pointCloudData[base]   = q1[0] + lx*basisQ.vx[0] + ly*basisQ.vy[0] + lz*basisQ.vz[0];
            pointCloudData[base+1] = q1[1] + lx*basisQ.vx[1] + ly*basisQ.vy[1] + lz*basisQ.vz[1];
            pointCloudData[base+2] = q1[2] + lx*basisQ.vx[2] + ly*basisQ.vy[2] + lz*basisQ.vz[2];
        }
    } else {
        alert(t.errPoints);
        return;
    }

    alert(t.msgSuccess);
    
    // 適用完了後、リストをクリアして再描画
    selectedIndices = [];
    targetCoords = {};
    updateSelectionUI();
    requestRender();
}


function generateContours() {
    // 省略 (既存のまま)
}

function exportPLY() {
    if (!pointCloudData) return;
    const blobParts = []; 
    let header = `ply\nformat ascii 1.0\nelement vertex ${pointCount}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`;
    blobParts.push(header);

    const chunkSize = 10000; let chunk = [];
    for (let i = 0; i < pointCount; i++) {
        const idx = i * 6;
        chunk.push(`${pointCloudData[idx].toFixed(4)} ${pointCloudData[idx+1].toFixed(4)} ${pointCloudData[idx+2].toFixed(4)} ${pointCloudData[idx+3]} ${pointCloudData[idx+4]} ${pointCloudData[idx+5]}\n`);
        if (chunk.length >= chunkSize) { blobParts.push(chunk.join('')); chunk = []; }
    }
    if (chunk.length > 0) blobParts.push(chunk.join(''));

    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob(blobParts, { type: 'text/plain' }));
    link.download = "aligned_cloud.ply";
    link.click(); URL.revokeObjectURL(link.href);
}

function updateUIInfo() { document.getElementById('stat-points').innerText = i18n[currentLang].points + pointCount; }
initCanvas(); changeLanguage('ja');
</script>
</body>
