<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PointCloud Editor (Touch & Mouse Support)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: sans-serif; background-color: #1e1e1e; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        #viewport-container { flex: 1; position: relative; background-color: #000; }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        
        #bottom-panel {
            width: 100%; height: 35vh; min-height: 250px; background-color: #252526; border-top: 1px solid #3c3c3c;
            display: flex; flex-direction: row; padding: 10px; gap: 10px; z-index: 10; box-shadow: 0 -2px 5px rgba(0,0,0,0.5); overflow-x: auto; overflow-y: hidden;
        }
        
        .panel-group { background: #2d2d2d; border: 1px solid #3c3c3c; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; min-width: 220px; }
        .panel-large { flex: 2; min-width: 400px; }
        
        .panel-title { font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px; font-size: 14px; }
        label { display: block; font-size: 12px; margin: 6px 0 2px; }
        input[type="text"], input[type="number"], select, button { width: 100%; padding: 6px; background: #333; border: 1px solid #555; color: #fff; font-family: inherit; border-radius: 2px; }
        input[type="number"] { user-select: text; }
        input[type="range"] { width: 100%; margin-top: 5px; cursor: pointer; }
        
        button { cursor: pointer; background: #0e639c; border: none; margin-top: 5px; font-weight: bold; padding: 8px; }
        button:hover:not(:disabled) { background: #1177bb; } button:disabled { background: #444; color: #888; cursor: not-allowed; }
        button.action-btn { background: #15803d; margin-top: 10px; } button.action-btn:hover:not(:disabled) { background: #16a34a; }

        .point-item { background-color: #2a2a2a; border: 1px solid transparent; border-radius: 4px; padding: 6px; margin-bottom: 6px; }
        .point-item.active { background-color: #1a2e23; border-color: #4ade80; }
        .coord-grid { display: grid; grid-template-columns: 48px 1fr 1fr 1fr; gap: 4px; align-items: center; font-size: 11px; margin-bottom: 4px; }
        .coord-grid span.label { color: #aaa; text-align: center; }
        .coord-grid span.val { background: #222; padding: 4px; border-radius: 2px; text-align: center; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .coord-grid input { padding: 4px; font-size: 11px; text-align: center; }
        .header-grid { display: grid; grid-template-columns: 48px 1fr 1fr 1fr; gap: 4px; font-size: 12px; margin-bottom: 4px; text-align: center; color: #aaa; padding-right: 8px; }
        #info-overlay { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>

<div id="viewport-container">
    <canvas id="renderCanvas"></canvas>
    <div id="info-overlay">
        <span id="stat-points">点数: 0</span>
    </div>
</div>

<div id="bottom-panel">
    <div class="panel-group">
        <div class="panel-title">ファイル操作</div>
        <input type="file" id="file-input" accept=".ply" style="display:none;" onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('file-input').click()">PLYインポート</button>
        <button id="btn-export" onclick="exportPLY()" disabled>PLYエクスポート</button>
        
        <div class="panel-title" style="margin-top: 15px;">表示設定</div>
        <label>点のサイズ (隙間を埋める)</label>
        <input type="range" id="point-size" min="1" max="15" value="2" oninput="requestRender()">
    </div>

    <div class="panel-group panel-large">
        <div class="panel-title">選択点一覧 / 座標補正</div>
        <div style="font-size: 11px; color: #aaa; margin-bottom: 6px;">
            1点選択: 平行移動のみ適用<br>3点選択: 3点に基づく移動・回転・スケール補正を適用
        </div>
        <div class="header-grid"><span></span><span>X</span><span>Y</span><span>Z</span></div>
        <div id="points-list-container" style="overflow-y: auto; flex: 1; background: #1e1e1e; border: 1px solid #444; padding: 6px;"></div>
        <button id="btn-apply" class="action-btn" onclick="applyAlignment()" disabled>座標補正を適用</button>
    </div>
</div>

<script>
let pointCloudData = null; let pointCount = 0;
let selectedIndices = []; let activeIndex = -1; let targetCoords = {};
let camera = { rotX: 0.5, rotY: 0.5, zoom: 1.0, panX: 0, panY: 0 };
let viewCenter = { x: 0, y: 0, z: 0 }; let viewScale = 1.0;

let isDragging = false, dragMode = 0; 
let lastMouse = { x: 0, y: 0 }; let touchStartPos = { x: 0, y: 0 };
let initialPinchDist = null; // タッチ拡大縮小用
let hoverIndex = -1; let hoverTimeout = null;

const canvas = document.getElementById('renderCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
let canvasWidth = 0, canvasHeight = 0; let renderReq = null;

function initCanvas() {
    resizeCanvas(); window.addEventListener('resize', resizeCanvas);
    
    // PC用マウスイベント
    canvas.addEventListener('mousedown', e => { 
        isDragging = true; 
        dragMode = (e.button === 2 || e.button === 1) ? 1 : 0; 
        lastMouse = { x: e.clientX, y: e.clientY }; touchStartPos = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('mousemove', e => {
        if (isDragging) {
            const dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
            if (dragMode === 0) { camera.rotY += dx * 0.005; camera.rotX += dy * 0.005; }
            else { camera.panX += dx; camera.panY += dy; }
            lastMouse = { x: e.clientX, y: e.clientY }; requestRender();
        } else {
            lastMouse = { x: e.clientX, y: e.clientY };
            if (hoverTimeout) clearTimeout(hoverTimeout);
            hoverTimeout = setTimeout(() => {
                if (pointCount > 0) {
                    let prevHover = hoverIndex; hoverIndex = findPointAt(lastMouse.x, lastMouse.y);
                    if (prevHover !== hoverIndex) requestRender();
                }
            }, 30);
        }
    });
    window.addEventListener('mouseup', e => {
        if (!isDragging) return;
        isDragging = false;
        if (pointCount > 0 && Math.abs(e.clientX - touchStartPos.x) < 3 && Math.abs(e.clientY - touchStartPos.y) < 3) {
            let hit = findPointAt(e.clientX, e.clientY);
            if (hit !== -1) {
                if (!selectedIndices.includes(hit)) {
                    selectedIndices.push(hit);
                    targetCoords[hit] = { x: pointCloudData[hit*6], y: pointCloudData[hit*6+1], z: pointCloudData[hit*6+2] };
                }
                activeIndex = hit; updateSelectionUI(); requestRender();
            }
        }
    });
    
    // スマホ・タブレット等 タッチイベント（1本指：回転、2本指：ピンチイン・アウト拡大縮小）
    canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            isDragging = true; dragMode = 0;
            lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            initialPinchDist = null;
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
    }, {passive: true});

    canvas.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && initialPinchDist !== null) {
            // 2本指ピンチによる拡大縮小
            let currentDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            let factor = currentDist / initialPinchDist;
            camera.zoom *= factor;
            initialPinchDist = currentDist;
            requestRender();
        } else if (e.touches.length === 1 && isDragging) {
            // 1本指による回転
            const dx = e.touches[0].clientX - lastMouse.x, dy = e.touches[0].clientY - lastMouse.y;
            camera.rotY += dx * 0.005; camera.rotX += dy * 0.005;
            lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            requestRender();
        }
    }, {passive: true});

    canvas.addEventListener('touchend', e => {
        if (e.touches.length < 2) initialPinchDist = null;
        if (e.touches.length === 0 && isDragging) {
            isDragging = false;
            // タップ（選択）判定
            if (pointCount > 0 && Math.abs(lastMouse.x - touchStartPos.x) < 5 && Math.abs(lastMouse.y - touchStartPos.y) < 5) {
                let hit = findPointAt(touchStartPos.x, touchStartPos.y);
                if (hit !== -1) {
                    if (!selectedIndices.includes(hit)) {
                        selectedIndices.push(hit);
                        targetCoords[hit] = { x: pointCloudData[hit*6], y: pointCloudData[hit*6+1], z: pointCloudData[hit*6+2] };
                    }
                    activeIndex = hit; updateSelectionUI(); requestRender();
                }
            }
        }
    }, {passive: true});

    canvas.addEventListener('contextmenu', e => e.preventDefault()); 
    canvas.addEventListener('wheel', e => { camera.zoom *= (e.deltaY > 0) ? 0.9 : 1.1; requestRender(); }, { passive: true });
}

function resizeCanvas() {
    canvasWidth = canvas.parentElement.clientWidth; canvasHeight = canvas.parentElement.clientHeight;
    canvas.width = canvasWidth; canvas.height = canvasHeight; requestRender();
}

function freeMemory() {
    pointCloudData = null; selectedIndices = []; targetCoords = {};
    activeIndex = -1; hoverIndex = -1; pointCount = 0; updateSelectionUI();
}

function handleFileSelect(evt) {
    const file = evt.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            freeMemory(); parsePLY(e.target.result);
            document.getElementById('btn-export').disabled = false;
            document.getElementById('stat-points').innerText = "点数: " + pointCount;
            camera = { rotX: 0.5, rotY: 0.5, zoom: 1.0, panX: 0, panY: 0 }; requestRender();
        } catch (err) { alert("PLY Load Error"); }
    };
    reader.readAsArrayBuffer(file);
}

function parsePLY(buffer) {
    const dec = new TextDecoder('utf-8');
    const headerText = dec.decode(new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 10240)));
    let isBinary = false, headerLength = 0, vertexCount = 0;
    
    const lines = headerText.split('\n');
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim().replace(/\s+/g, ' ');
        if (line.includes('binary_little_endian')) isBinary = true;
        if (line.startsWith('element vertex')) vertexCount = parseInt(line.split(' ')[2], 10);
        if (line === 'end_header') { headerLength = headerText.indexOf('end_header') + 11; break; }
    }
    pointCount = vertexCount; pointCloudData = new Float32Array(pointCount * 6); 

    let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

    if (isBinary) {
        const view = new DataView(buffer, headerLength); let off = 0;
        for (let i = 0; i < pointCount; i++) {
            let idx = i * 6;
            let x = view.getFloat32(off, true), y = view.getFloat32(off+4, true), z = view.getFloat32(off+8, true);
            pointCloudData[idx] = x; pointCloudData[idx+1] = y; pointCloudData[idx+2] = z;
            pointCloudData[idx+3] = view.getUint8(off+12); pointCloudData[idx+4] = view.getUint8(off+13); pointCloudData[idx+5] = view.getUint8(off+14);
            off += 15;
            if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; if(z<minZ)minZ=z; if(z>maxZ)maxZ=z;
        }
    } else {
        const dataStr = dec.decode(buffer).substring(headerLength).trim();
        const dataArray = dataStr.split(/\s+/); let ptr = 0;
        for (let i = 0; i < pointCount; i++) {
            let idx = i * 6;
            let x = parseFloat(dataArray[ptr]), y = parseFloat(dataArray[ptr+1]), z = parseFloat(dataArray[ptr+2]);
            pointCloudData[idx] = x; pointCloudData[idx+1] = y; pointCloudData[idx+2] = z;
            pointCloudData[idx+3] = parseInt(dataArray[ptr+3]); pointCloudData[idx+4] = parseInt(dataArray[ptr+4]); pointCloudData[idx+5] = parseInt(dataArray[ptr+5]);
            ptr += 6; 
            if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; if(z<minZ)minZ=z; if(z>maxZ)maxZ=z;
        }
    }
    viewCenter = { x: (minX + maxX)/2, y: (minY + maxY)/2, z: (minZ + maxZ)/2 };
    let maxRange = Math.max(maxX - minX, maxY - minY, maxZ - minZ);
    viewScale = maxRange === 0 ? 1 : 300 / maxRange;
}

function requestRender() { if (!renderReq) { renderReq = requestAnimationFrame(() => { render(); renderReq = null; }); } }

function render() {
    if (canvasWidth === 0 || canvasHeight === 0) return;
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    if (!pointCloudData || pointCount === 0) return;

    const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
    const data = imgData.data;
    const cx = canvasWidth / 2 + camera.panX, cy = canvasHeight / 2 + camera.panY;
    const scale = 100 * camera.zoom;
    const cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX);
    const cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);
    
    const pSize = parseInt(document.getElementById('point-size').value) || 1;
    const pSizeHalf = Math.floor(pSize / 2);

    for (let i = 0; i < pointCount; i++) {
        const idx = i * 6;
        let vx = (pointCloudData[idx] - viewCenter.x) * viewScale;
        let vy = (pointCloudData[idx+1] - viewCenter.y) * viewScale;
        let vz = (pointCloudData[idx+2] - viewCenter.z) * viewScale;

        let x1 = vx * cosY + vz * sinY, z1 = -vx * sinY + vz * cosY;
        let y1 = vy * cosX - z1 * sinX, z2 = vy * sinX + z1 * cosX;
        
        if (z2 + 500 < 10) continue;

        const proj = scale / (z2 + 500);
        let px = Math.floor(cx + x1 * proj), py = Math.floor(cy - y1 * proj);

        if (px >= pSizeHalf && px < canvasWidth - pSize && py >= pSizeHalf && py < canvasHeight - pSize) {
            let r = pointCloudData[idx+3], g = pointCloudData[idx+4], b = pointCloudData[idx+5];
            if (pSize === 1) {
                let p = (py * canvasWidth + px) * 4;
                data[p] = r; data[p+1] = g; data[p+2] = b; data[p+3] = 255;
            } else {
                let rowStart = (py - pSizeHalf) * canvasWidth;
                for (let dy = 0; dy < pSize; dy++) {
                    let base = (rowStart + px - pSizeHalf) * 4;
                    for (let dx = 0; dx < pSize; dx++) {
                        data[base] = r; data[base+1] = g; data[base+2] = b; data[base+3] = 255;
                        base += 4;
                    }
                    rowStart += canvasWidth;
                }
            }
        }
    }
    ctx.putImageData(imgData, 0, 0);

    const drawHighlight = (idx, color, size) => {
        let vx = (pointCloudData[idx*6] - viewCenter.x) * viewScale, vy = (pointCloudData[idx*6+1] - viewCenter.y) * viewScale, vz = (pointCloudData[idx*6+2] - viewCenter.z) * viewScale;
        let x1 = vx * cosY + vz * sinY, z1 = -vx * sinY + vz * cosY;
        let y1 = vy * cosX - z1 * sinX, z2 = vy * sinX + z1 * cosX;
        let px = cx + x1 * (scale / (z2 + 500)), py = cy - y1 * (scale / (z2 + 500));
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI*2); ctx.stroke();
    };

    if (hoverIndex !== -1 && !selectedIndices.includes(hoverIndex)) drawHighlight(hoverIndex, '#ffff00', 12);
    selectedIndices.forEach(idx => drawHighlight(idx, '#4ade80', 8));
}

function findPointAt(mx, my) {
    const cx = canvasWidth/2 + camera.panX, cy = canvasHeight/2 + camera.panY;
    const scale = 100 * camera.zoom;
    const cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX), cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);

    let bestIdx = -1, minZ = Infinity;
    for (let i = 0; i < pointCount; i++) {
        const idx = i * 6;
        let vx = (pointCloudData[idx] - viewCenter.x) * viewScale, vy = (pointCloudData[idx+1] - viewCenter.y) * viewScale, vz = (pointCloudData[idx+2] - viewCenter.z) * viewScale;
        let x1 = vx * cosY + vz * sinY, z1 = -vx * sinY + vz * cosY;
        let y1 = vy * cosX - z1 * sinX, z2 = vy * sinX + z1 * cosX;
        
        if (z2 + 500 < 10) continue;
        let px = cx + x1 * (scale / (z2 + 500)), py = cy - y1 * (scale / (z2 + 500));
        if (Math.hypot(px - mx, py - my) <= 25 && z2 < minZ) { minZ = z2; bestIdx = i; }
    }
    return bestIdx;
}

function updateSelectionUI() {
    const container = document.getElementById('points-list-container'); container.innerHTML = '';
    document.getElementById('btn-apply').disabled = (selectedIndices.length === 0);
    selectedIndices.forEach((idx) => {
        const base = idx * 6; let origX = pointCloudData[base], origY = pointCloudData[base+1], origZ = pointCloudData[base+2]; let tgt = targetCoords[idx];
        const item = document.createElement('div');
        item.className = 'point-item' + (idx === activeIndex ? ' active' : '');
        item.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; align-items:center;">
                <span style="font-weight:bold; font-size:12px;">[ ID: ${idx} ]</span>
                <button onclick="removePoint(${idx})" title="削除" style="width:24px; height:24px; padding:0; margin:0; line-height:1; background:#c53030;">×</button>
            </div>
            <div class="coord-grid"><span class="label">変更前</span><span class="val" title="${origX}">${origX.toFixed(3)}</span><span class="val" title="${origY}">${origY.toFixed(3)}</span><span class="val" title="${origZ}">${origZ.toFixed(3)}</span></div>
            <div class="coord-grid"><span class="label" style="color:#4ade80;">変更後</span>
                <input type="number" step="any" value="${tgt.x}" onchange="updateTarget(${idx}, 'x', this.value)">
                <input type="number" step="any" value="${tgt.y}" onchange="updateTarget(${idx}, 'y', this.value)">
                <input type="number" step="any" value="${tgt.z}" onchange="updateTarget(${idx}, 'z', this.value)">
            </div>`;
        container.appendChild(item);
    });
}

function updateTarget(idx, axis, val) { const v = parseFloat(val); if(!isNaN(v)) targetCoords[idx][axis] = v; }
function removePoint(idx) { selectedIndices = selectedIndices.filter(i => i !== idx); delete targetCoords[idx]; updateSelectionUI(); requestRender(); }

const vec = {
    sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]], dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
    cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
    mag: (a) => Math.hypot(a[0], a[1], a[2]), norm: (a) => { const m = Math.hypot(a[0], a[1], a[2]); return m===0 ? [0,0,0] : [a[0]/m, a[1]/m, a[2]/m]; }
};

function getBasis(p1, p2, p3) {
    let vx = vec.norm(vec.sub(p2, p1)), v_tmp = vec.norm(vec.sub(p3, p1)), cross_p = vec.cross(vx, v_tmp);
    if (vec.mag(cross_p) < 1e-8) return null;
    let vz = vec.norm(cross_p), vy = vec.norm(vec.cross(vz, vx)); return { vx, vy, vz };
}

function applyAlignment() {
    if (selectedIndices.length === 1) {
        let idx = selectedIndices[0], p = [pointCloudData[idx*6], pointCloudData[idx*6+1], pointCloudData[idx*6+2]], q = [targetCoords[idx].x, targetCoords[idx].y, targetCoords[idx].z];
        let dx = q[0] - p[0], dy = q[1] - p[1], dz = q[2] - p[2];
        for (let i = 0; i < pointCount; i++) { pointCloudData[i*6] += dx; pointCloudData[i*6+1] += dy; pointCloudData[i*6+2] += dz; }
    } else if (selectedIndices.length === 3) {
        let i1 = selectedIndices[0], i2 = selectedIndices[1], i3 = selectedIndices[2];
        let p1 = [pointCloudData[i1*6], pointCloudData[i1*6+1], pointCloudData[i1*6+2]], p2 = [pointCloudData[i2*6], pointCloudData[i2*6+1], pointCloudData[i2*6+2]], p3 = [pointCloudData[i3*6], pointCloudData[i3*6+1], pointCloudData[i3*6+2]];
        let q1 = [targetCoords[i1].x, targetCoords[i1].y, targetCoords[i1].z], q2 = [targetCoords[i2].x, targetCoords[i2].y, targetCoords[i2].z], q3 = [targetCoords[i3].x, targetCoords[i3].y, targetCoords[i3].z];
        const basisP = getBasis(p1, p2, p3), basisQ = getBasis(q1, q2, q3);
        if (!basisP || !basisQ) { alert("3点が同一直線上に近いため計算できません。"); return; }
        const scale = vec.mag(vec.sub(q2, q1)) / vec.mag(vec.sub(p2, p1));
        for (let i = 0; i < pointCount; i++) {
            let base = i * 6, p = [pointCloudData[base], pointCloudData[base+1], pointCloudData[base+2]];
            let dp = vec.sub(p, p1), lx = vec.dot(dp, basisP.vx) * scale, ly = vec.dot(dp, basisP.vy) * scale, lz = vec.dot(dp, basisP.vz) * scale;
            pointCloudData[base] = q1[0] + lx*basisQ.vx[0] + ly*basisQ.vy[0] + lz*basisQ.vz[0];
            pointCloudData[base+1] = q1[1] + lx*basisQ.vx[1] + ly*basisQ.vy[1] + lz*basisQ.vz[1];
            pointCloudData[base+2] = q1[2] + lx*basisQ.vx[2] + ly*basisQ.vy[2] + lz*basisQ.vz[2];
        }
    } else { alert("補正を行うには、点を1つまたは3つ選択してください。"); return; }

    alert("座標補正を適用しました。"); selectedIndices = []; targetCoords = {}; updateSelectionUI(); requestRender();
}

function exportPLY() {
    if (!pointCloudData) return;
    const blobParts = [`ply\nformat ascii 1.0\nelement vertex ${pointCount}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`];
    const chunkSize = 10000; let chunk = [];
    for (let i = 0; i < pointCount; i++) {
        const idx = i * 6;
        chunk.push(`${pointCloudData[idx].toFixed(4)} ${pointCloudData[idx+1].toFixed(4)} ${pointCloudData[idx+2].toFixed(4)} ${pointCloudData[idx+3]} ${pointCloudData[idx+4]} ${pointCloudData[idx+5]}\n`);
        if (chunk.length >= chunkSize) { blobParts.push(chunk.join('')); chunk = []; }
    }
    if (chunk.length > 0) blobParts.push(chunk.join(''));
    const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob(blobParts, { type: 'text/plain' }));
    link.download = "aligned_cloud.ply"; link.click(); URL.revokeObjectURL(link.href);
}

initCanvas();
</script>
