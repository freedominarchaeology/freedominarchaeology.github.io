            document.getElementById('thBelly').innerText = t.thBelly;

            document.getElementById('thDate').innerText = t.thDate;
            document.getElementById('exportLabel').innerText = t.exportLabel;
            document.getElementById('exportBtn').innerText = t.exportBtn;
            document.getElementById('section2Title').innerText = t.section2Title;
            document.getElementById('treeNote').innerText = t.treeNote;
            document.getElementById('pdfPrintBtn').innerText = t.pdfPrintBtn;

            // すでに分析結果が表示されている場合はテーブルや系統樹のテキストも更新するために再描画
            if (analyzedItemsData.length > 0) {
                updateTableAndTreeUI();
            }
        }

        let analyzedItemsData = [];

        async function runAnalysis() {
            const t = i18n[currentLang];
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert(t.alertNoFiles);
                return;
            }

            let loadedImages = [];
            try {
                for (let i = 0; i < fileInput.files.length; i++) {
                    let file = fileInput.files[i];
                    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        let pdfImages = await extractImagesFromPDF(file);
                        loadedImages.push(...pdfImages);
                    } else {
                        let dataUrl = await loadFileAsDataURL(file);
                        let img = await loadImage(dataUrl);
                        loadedImages.push({ name: file.name, dataUrl: dataUrl, img: img });
                    }
                }
            } catch (err) {
                console.error(err);
                alert(t.alertError);
                return;
            }

            if (loadedImages.length < 2) {
                alert(t.alertMinFiles + loadedImages.length + '件)');
                return;
            }

            analyzedItemsData = [];
            let timestampIso = new Date().toISOString();

            let rawAnalyses = loadedImages.map(item => {
                let analysis = analyzeArtifactParts(item.img);
                return { item, analysis };
            });

            let maxActualW = Math.max(...rawAnalyses.map(r => r.analysis.actualWidth), 1);
            let maxActualH = Math.max(...rawAnalyses.map(r => r.analysis.actualHeight), 1);

            rawAnalyses.forEach((raw, i) => {
                let a = raw.analysis;
                let sizeScaleW = a.actualWidth / maxActualW;
                let sizeScaleH = a.actualHeight / maxActualH;

                a.vector = [a.neckPos, a.neckDepth, a.bellyPos, a.bellyWidth, a.taperRate, sizeScaleW, sizeScaleH];

                analyzedItemsData.push({
                    id: i + 1,
                    name: raw.item.name,
                    dataUrl: raw.item.dataUrl,
                    img: raw.item.img,
                    analysis: a,
                    timestamp: timestampIso
                });
            });

            rawAnalyses = null;

            updateTableAndTreeUI();
            document.getElementById('resultSection').style.display = 'block';
        }

        function updateTableAndTreeUI() {
            const t = i18n[currentLang];
            let tbody = document.querySelector('#ratioTable tbody');
            tbody.innerHTML = '';
            analyzedItemsData.forEach((item) => {
                let a = item.analysis;
                let statusText = (a.hasRim ? t.rimPresent : t.rimAbsent) + " / " + (a.hasBase ? t.basePresent : t.baseAbsent);
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${item.dataUrl}" alt=""></td>
                    <td style="text-align: left; word-break: break-all;"><b>No.${item.id}</b> ${item.name}</td>
                    <td>${statusText}</td>
                    <td>${a.actualWidth} × ${a.actualHeight} px</td>
                    <td>${t.neckLabel}${(a.neckPos*100).toFixed(0)}% / ${t.depthLabel}${a.neckDepth.toFixed(2)}</td>
                    <td>${t.bellyLabel}${(a.bellyPos*100).toFixed(0)}% / ${t.widthLabel}${a.bellyWidth.toFixed(2)}</td>
                    <td>${t.taperLabel}${a.taperRate.toFixed(2)}</td>
                    <td style="font-size: 10px; color: #555;">${item.timestamp}</td>
                `;
                tbody.appendChild(tr);
            });

            let rootCluster = buildHierarchicalTree(analyzedItemsData);
            drawDendrogram(rootCluster, analyzedItemsData);
        }

        async function extractImagesFromPDF(file) {
            let arrayBuffer = await file.arrayBuffer();
            let loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            let pdfDoc = await loadingTask.promise;
            let results = [];

            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                let page = await pdfDoc.getPage(pageNum);
                let viewport = page.getViewport({ scale: 1.2 });
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                let dataUrl = canvas.toDataURL('image/png');
                let img = await loadImage(dataUrl);

                results.push({
                    name: `${file.name} (P.${pageNum})`,
                    dataUrl: dataUrl,
                    img: img
                });

                canvas.width = 1;
                canvas.height = 1;
                ctx = null;
                canvas = null;
            }
            return results;
        }

        function loadFileAsDataURL(file) {
            return new Promise((resolve) => {
                let reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function loadImage(src) {
            return new Promise((resolve) => {
                let img = new Image();
                img.onload = () => resolve(img);
                img.src = src;
            });
        }

        function analyzeArtifactParts(img) {
            let canvas = document.createElement('canvas');
            let ctx = canvas.getContext('2d');
            canvas.width = 100;
            canvas.height = 100;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 100, 100);
            ctx.drawImage(img, 0, 0, 100, 100);
            
            let imgData = ctx.getImageData(0, 0, 100, 100);
            let data = imgData.data;
            
            let rowWidths = new Array(100).fill(0);
            let minY = 100, maxY = 0;

            for (let y = 0; y < 100; y++) {
                let left = 100, right = 0, count = 0;
                for (let x = 0; x < 100; x++) {
                    let idx = (y * 100 + x) * 4;
                    if (data[idx] < 240 || data[idx+1] < 240 || data[idx+2] < 240) {
                        count++;
                        if (x < left) left = x;
                        if (x > right) right = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
                if (count > 0) {
                    rowWidths[y] = right - left + 1;
                }
            }

            let height = maxY - minY + 1;
            let hasRim = (minY <= 5);
            let hasBase = (maxY >= 94);

            let profile = new Array(100).fill(0);
            for (let y = minY; y <= maxY; y++) {
                let targetY = Math.floor(((y - minY) / (height || 1)) * 99);
                profile[targetY] = rowWidths[y];
            }

            let maxW = 0, maxIdx = 50;
            let minW = 999, minIdx = 20;
            for (let i = 0; i < 100; i++) {
                if (profile[i] > maxW) { maxW = profile[i]; maxIdx = i; }
                if (i > 5 && i < 90 && profile[i] > 0 && profile[i] < minW) { minW = profile[i]; minIdx = i; }
            }

            let neckPos = minIdx / 100.0;
            let neckDepth = minW / (maxW || 1);
            let bellyPos = maxIdx / 100.0;
            let bellyWidth = maxW / 100.0;
            let taperRate = profile[90] / (maxW || 1);

            let actualWidth = img.naturalWidth || img.width || 100;
            let actualHeight = img.naturalHeight || img.height || 100;

            canvas.width = 1;
            canvas.height = 1;
            ctx = null;
            canvas = null;

            return {
                hasRim: hasRim,
                hasBase: hasBase,
                profile: profile,
                neckPos: neckPos,
                neckDepth: neckDepth,
                bellyPos: bellyPos,
                bellyWidth: bellyWidth,
                taperRate: taperRate,
                actualWidth: actualWidth,
                actualHeight: actualHeight
            };
        }

        function buildHierarchicalTree(items) {
            let clusters = items.map((item, idx) => ({
                id: 'leaf_' + idx,
                items: [idx],
                height: 0,
                left: null,
                right: null,
                name: item.name
            }));

            let n = items.length;
            let distMatrix = Array(n).fill(0).map(() => Array(n).fill(0));
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    if (i === j) {
                        distMatrix[i][j] = 0;
                    } else {
                        let v1 = items[i].analysis.vector;
                        let v2 = items[j].analysis.vector;
                        let sum = 0;
                        for (let k = 0; k < v1.length; k++) {
                            sum += Math.pow(v1[k] - v2[k], 2);
                        }
                        distMatrix[i][j] = Math.sqrt(sum);
                    }
                }
            }

            while (clusters.length > 1) {
                let minDist = Infinity;
                let c1 = -1, c2 = -1;

                for (let i = 0; i < clusters.length; i++) {
                    for (let j = i + 1; j < clusters.length; j++) {
                        let d = 0;
                        let count = 0;
                        for (let ii of clusters[i].items) {
                            for (let jj of clusters[j].items) {
                                d += distMatrix[ii][jj];
                                count++;
                            }
                        }
                        let avgDist = d / count;
                        if (avgDist < minDist) {
                            minDist = avgDist;
                            c1 = i;
                            c2 = j;
                        }
                    }
                }

                let leftCluster = clusters[c1];
                let rightCluster = clusters[c2];
                let newCluster = {
                    id: 'node_' + Math.random(),
                    items: [...leftCluster.items, ...rightCluster.items],
                    height: minDist,
                    left: leftCluster,
                    right: rightCluster,
                    name: null
                };

                clusters = clusters.filter((_, idx) => idx !== c1 && idx !== c2);
                clusters.push(newCluster);
            }

            return clusters[0];
        }

        function drawDendrogram(root, items) {
            let canvas = document.getElementById('treeCanvas');
            let ctx = canvas.getContext('2d');

            let paddingLeft = 60;
            let paddingRight = 240;
            let paddingTop = 50;
            let paddingBottom = 50;
            
            let stepY = 80; 
            let totalHeight = Math.max(650, items.length * stepY + paddingTop + paddingBottom);
            let totalWidth = 1150;

            canvas.width = totalWidth;
            canvas.height = totalHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let drawWidth = canvas.width - paddingLeft - paddingRight;
            let drawHeight = canvas.height - paddingTop - paddingBottom;

            let leaves = [];
            function getLeaves(node) {
                if (!node.left && !node.right) {
                    leaves.push(node);
                } else {
                    if (node.left) getLeaves(node.left);
                    if (node.right) getLeaves(node.right);
                }
            }
            getLeaves(root);

            let leafStepY = drawHeight / (leaves.length + 1);
            let leafYMap = {};
            leaves.forEach((leaf, idx) => {
                leafYMap[leaf.id] = paddingTop + leafStepY * (idx + 1);
            });

            let maxHeight = getMaxHeight(root);
            if (maxHeight === 0) maxHeight = 1;

            function drawNode(node) {
                if (!node.left && !node.right) {
                    let y = leafYMap[node.id];
                    let x = paddingLeft + drawWidth;
                    return { x: x, y: y };
                }

                let leftPos = drawNode(node.left);
                let rightPos = drawNode(node.right);

                let currentX = paddingLeft + (1.0 - (node.height / maxHeight)) * drawWidth;
                let currentY = (leftPos.y + rightPos.y) / 2;

                ctx.strokeStyle = '#2b6cb0';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.moveTo(currentX, leftPos.y);
                ctx.lineTo(currentX, rightPos.y);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(currentX, leftPos.y);
                ctx.lineTo(leftPos.x, leftPos.y);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(currentX, rightPos.y);
                ctx.lineTo(rightPos.x, rightPos.y);
                ctx.stroke();

                return { x: currentX, y: currentY };
            }

            drawNode(root);

            leaves.forEach((leaf) => {
                let y = leafYMap[leaf.id];
                let itemIndex = parseInt(leaf.items[0]);
                let item = items[itemIndex];
                let tipX = paddingLeft + drawWidth;

                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(tipX, y);
                ctx.lineTo(tipX + 15, y);
                ctx.stroke();

                let thumbHeight = 55;
                let imgAspect = item.img.width / (item.img.height || 1);
                let thumbWidth = thumbHeight * imgAspect;

                if (thumbWidth > 80) {
                    thumbWidth = 80;
                    thumbHeight = thumbWidth / imgAspect;
                }

                ctx.drawImage(item.img, tipX + 20, y - thumbHeight / 2, thumbWidth, thumbHeight);

                ctx.fillStyle = '#1a202c';
                ctx.font = '12px "MS Mincho", "MS Gothic", sans-serif';
                ctx.fillText(`No.${item.id}: ${item.name} (${item.analysis.actualWidth}x${item.analysis.actualHeight}px)`, tipX + thumbWidth + 30, y + 4);
            });
        }

        function getMaxHeight(node) {
            if (!node.left && !node.right) return 0;
            let hLeft = node.left ? getMaxHeight(node.left) : 0;
            let hRight = node.right ? getMaxHeight(node.right) : 0;
            return Math.max(node.height, hLeft, hRight);
        }

        function exportTableData() {
            const t = i18n[currentLang];
            if (analyzedItemsData.length === 0) {
                alert(t.alertNoExport);
                return;
            }

            let format = document.getElementById('exportFormat').value;

            let exportRows = analyzedItemsData.map(item => ({
                ID: item.id,
                Name: item.name,
                HasRim: item.analysis.hasRim ? "Yes" : "No",
                HasBase: item.analysis.hasBase ? "Yes" : "No",
                ActualWidth_px: item.analysis.actualWidth,
                ActualHeight_px: item.analysis.actualHeight,
                NeckPositionRatio: Number(item.analysis.neckPos.toFixed(3)),
                NeckDepthDegree: Number(item.analysis.neckDepth.toFixed(3)),
                BellyPositionRatio: Number(item.analysis.bellyPos.toFixed(3)),
                BellyWidthRatio: Number(item.analysis.bellyWidth.toFixed(3)),
                TaperRate: Number(item.analysis.taperRate.toFixed(3)),
                Timestamp: item.timestamp
            }));

            if (format === 'csv' || format === 'tsv') {
                let sep = format === 'csv' ? ',' : '\t';
                let headers = Object.keys(exportRows[0]);
                let csvContent = headers.join(sep) + '\r\n';
                
                exportRows.forEach(row => {
                    let values = headers.map(h => `"${String(row[h]).replace(/"/g, '""')}"`);
                    csvContent += values.join(sep) + '\r\n';
                });

                downloadFile(csvContent, `artifact_size_analysis.${format}`, format === 'csv' ? 'text/csv;charset=utf-8;' : 'text/tab-separated-values;charset=utf-8;');
            
            } else if (format === 'json') {
                let jsonStr = JSON.stringify(exportRows, null, 4);
                downloadFile(jsonStr, 'artifact_size_analysis.json', 'application/json;charset=utf-8;');

            } else if (format === 'xlsx') {
                let worksheet = XLSX.utils.json_to_sheet(exportRows);
                let workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "SizeAnalysis");
                XLSX.writeFile(workbook, 'artifact_size_analysis.xlsx');

            } else if (format === 'xml') {
                let xmlStr = '<?xml version="1.0" encoding="UTF-8"?>\n<ArtifactSizeAnalysisRecords>\n';
                exportRows.forEach(row => {
                    xmlStr += '  <Record>\n';
                    for (let key in row) {
                        xmlStr += `    <${key}>${escapeXml(String(row[key]))}</${key}>\n`;
                    }
                    xmlStr += '  </Record>\n';
                });
                xmlStr += '</ArtifactSizeAnalysisRecords>';
                downloadFile(xmlStr, 'artifact_size_analysis.xml', 'application/xml;charset=utf-8;');
            }
        }

        function downloadFile(content, fileName, mimeType) {
            let blob = new Blob([content], { type: mimeType });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function escapeXml(str) {
            return str.replace(/[<>&'"]/g, function (c) {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }
    </script>
