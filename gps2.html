<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高精度平面直角座標測位アプリ（考古学フィールドワーク対応版）</title>
    <!-- jsPDFライブラリの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }
        
        .glass { 
            background: rgba(0, 0, 0, 0.95); 
            backdrop-filter: blur(4px); 
            border-bottom: 1px solid #333; 
            padding: 10px 12px; 
            position: absolute; 
            top: 0; 
            left: 0;
            width: 100%; 
            z-index: 20;
            max-height: 50vh; 
            overflow-y: auto; 
            touch-action: pan-y; 
        }
        
        .crosshair { position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        .crosshair-h { width: 40px; height: 2px; background: red; position: absolute; left: -20px; top: -1px; }
        .crosshair-v { width: 2px; height: 40px; background: red; position: absolute; top: -20px; left: -1px; }

        #register-panel {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 420px;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 12px;
            z-index: 15;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            max-height: 45vh; 
            overflow-y: auto; 
            touch-action: pan-y; 
        }
        #register-panel input { width: 100%; background: #222; color: #fff; border: 1px solid #555; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
        .flex-row { display: flex; gap: 6px; margin-top: 6px; }

        .data-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 4px; 
            font-size: 12px; 
            flex-wrap: wrap; 
            word-break: break-word;
            gap: 4px;
        }
        
        button { background: #222; color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; border-color: #666; }
        button.success { background: #16a34a; border-color: #22c55e; }
        button.primary { background: #2563eb; border-color: #3b82f6; }
        button.warning { background: #d97706; border-color: #f59e0b; }
        button.danger { background: #dc2626; border-color: #ef4444; }
        button.record { background: #ca8a04; border-color: #eab308; color: #fff; }

        #settings-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; touch-action: auto; }
        .modal-content { background: #111; border: 1px solid #444; padding: 20px; border-radius: 8px; width: 380px; max-width: 95%; text-align: left; max-height: 90vh; overflow-y: auto; touch-action: pan-y; }
        .modal-content label { display: block; font-size: 12px; margin-top: 10px; color: #aaa; }
        .modal-content select { width: 100%; background: #222; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; margin-top: 4px; font-size: 13px; }
        
        .point-item { background: #1a1a1a; border: 1px solid #333; padding: 6px 8px; margin-top: 6px; border-radius: 4px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    </style>
</head>
<body>

    <header class="glass">
        <div class="data-row" style="align-items: center;">
            <span id="gps-status" style="color: #fbbf24; font-weight: bold;">位置情報を取得中...</span>
            <div style="display: flex; gap: 4px;">
                <button id="pause-btn" class="warning">⏸️ 一時停止</button>
                <button id="settings-btn">⚙️ 管理/設定</button>
            </div>
        </div>
        <hr style="border:0; border-top:1px solid #333; margin: 4px 0;">
        <div class="data-row"><span>緯度:</span> <span id="lat-display" style="color: #22d3ee;">---</span></div>
        <div class="data-row"><span>経度:</span> <span id="lon-display" style="color: #22d3ee;">---</span></div>
        <div class="data-row"><span>適用座標系:</span> <span id="zone-display" style="color: #38bdf8; font-weight: bold;">自動判定中...</span></div>
        <div class="data-row"><span>平面 X (北進):</span> <span id="grid-x" style="color: #4ade80; font-weight: bold; font-size: 14px;">---</span></div>
        <div class="data-row"><span>平面 Y (東進):</span> <span id="grid-y" style="color: #4ade80; font-weight: bold; font-size: 14px;">---</span></div>
        <div class="data-row"><span>標高 Z (補正後):</span> <span id="alt-display" style="color: #facc15; font-weight: bold; font-size: 14px;">---</span></div>
        
        <hr style="border:0; border-top:1px solid #222; margin: 4px 0;">
        <div class="data-row" style="font-size: 11px;">
            <span>🌱 育成レベル: <span id="growth-level-display" style="color: #facc15; font-weight: bold;">Lv.0 (未学習)</span></span>
            <span>補正状態: <span id="training-status" style="color: #fca5a5;">標準測位</span></span>
        </div>
        
        <div style="margin-top: 6px; display: flex; gap: 6px;">
            <button id="log-toggle-btn" class="primary" style="flex: 1; padding: 8px; font-size: 13px;">🔴 ログ記録開始</button>
            <button id="export-csv-btn" class="success" style="padding: 8px; font-size: 12px;">📊 CSV保存</button>
        </div>
    </header>

    <div class="crosshair">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
    </div>

    <div id="register-panel">
        <!-- 遺物・遺構点（黄色）登録領域 -->
        <div style="color: #eab308; font-weight: bold; font-size: 12px; text-align: center; margin-bottom: 4px;">🟡 遺物・遺構記録点（任意測位点）の登録</div>
        <div class="flex-row">
            <input type="text" id="rec-name" placeholder="点名/遺物名 (例: 須恵器片01)">
            <button id="add-rec-btn" class="record" style="white-space: nowrap; padding: 6px 12px;">📍 現在地を記録</button>
        </div>

        <hr style="border:0; border-top:1px solid #333; margin: 8px 0;">

        <!-- 既知点（基準点）登録領域 -->
        <div style="color: #38bdf8; font-weight: bold; font-size: 12px; text-align: center; margin-bottom: 4px;">🎯 基準点（既知点）の学習登録</div>
        <input type="text" id="kp-name" placeholder="既知点名 (例: トレンチ基準点A)">
        <div class="flex-row">
            <input type="number" id="kp-x" placeholder="X座標(m)" step="0.001">
            <input type="number" id="kp-y" placeholder="Y座標(m)" step="0.001">
            <input type="number" id="kp-z" placeholder="Z(任意)" step="0.001" style="width: 70px;">
        </div>
        <button id="add-kp-btn" class="primary" style="width: 100%; padding: 8px; margin-top: 6px; font-size: 12px;">➕ 基準点として学習・登録</button>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: #fff; text-align: center;">⚙️ 設定 ＆ データ管理</h3>
            
            <label>平面直角座標系の選択</label>
            <select id="zone-select">
                <option value="auto">🌐 自動判定 (推奨)</option>
                <option value="1">第1系 (沖縄県)</option>
                <option value="2">第2系 (鹿児島・熊本一部)</option>
                <option value="3">第3系 (九州中部)</option>
                <option value="4">第4系 (四国)</option>
                <option value="5">第5系 (中国地方)</option>
                <option value="6">第6系 (近畿地方)</option>
                <option value="7">第7系 (中部西側)</option>
                <option value="8">第8系 (中部東側・関東部)</option>
                <option value="9">第9系 (関東地方)</option>
                <option value="10">第10系 (東北南部)</option>
                <option value="11">第11系 (北海道道南)</option>
                <option value="12">第12系 (北海道道央)</option>
                <option value="13">第13系 (北海道道東)</option>
                <option value="14">第14系以降 (島嶼部)</option>
            </select>

            <label style="display: flex; align-items: center; color: #fca5a5; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 10px;">
                <input type="checkbox" id="in-invertalt" style="width: 16px; height: 16px; margin-right: 8px;">
                標高の上下逆転現象を直す
            </label>

            <button id="sync-auto-btn" class="success" style="width: 100%; padding: 8px; margin-top: 10px;">⏱️ 5秒間スタティック平均化（ブレ除去）</button>

            <hr style="border:0; border-top:1px solid #333; margin: 12px 0;">

            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label style="color: #eab308; font-weight: bold;">🟡 登録済み遺物・記録点</label>
                <span id="rec-count" style="color: #eab308; font-size: 11px;">0箇所</span>
            </div>
            <div style="margin-top: 6px; max-height: 120px; overflow-y: auto; touch-action: pan-y;" id="rec-list-container"></div>

            <hr style="border:0; border-top:1px solid #333; margin: 12px 0;">

            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label style="color: #38bdf8; font-weight: bold;">🌱 登録済み既知点（基準点）</label>
                <span id="growth-count" style="color: #4ade80; font-size: 11px;">0箇所</span>
            </div>
            <div style="margin-top: 6px; max-height: 120px; overflow-y: auto; touch-action: pan-y;" id="kp-list-container"></div>

            <hr style="border:0; border-top:1px solid #333; margin: 12px 0;">

            <button id="sensor-permission-btn" class="primary" style="width: 100%; padding: 8px; margin-bottom: 8px;">📱 スマホセンサー（PDR）有効化</button>
            <button id="clear-all-data-btn" class="danger" style="width: 100%; padding: 8px; font-size: 12px;">🗑️ 化けた旧データを全消去・初期化</button>

            <div style="margin-top: 12px;">
                <button id="close-settings" class="success" style="width: 100%; padding: 10px; font-size: 14px;">保存して閉じる</button>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        const JAPANESE_FONT_FAMILY = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif';

        let isLogging = false;
        let routeLog = [];
        let logTimer = null;

        const safeGetStorage = (key, defaultVal, isFloat = false) => {
            try {
                const val = localStorage.getItem(key);
                if (val === null) return defaultVal;
                return isFloat ? parseFloat(val) || defaultVal : val;
            } catch (e) {
                return defaultVal;
            }
        };

        let config = {
            selectedZone: safeGetStorage('conf_zone', 'auto'),
            altOff: safeGetStorage('conf_altoff', 0, true),
            invertAlt: localStorage.getItem('conf_invertalt') === 'true',
            shiftX: safeGetStorage('conf_shiftx', 0, true),
            shiftY: safeGetStorage('conf_shifty', 0, true),
            hasCalibrated: localStorage.getItem('conf_hascalibrated') === 'true'
        };

        let knownPoints = [];
        try {
            const savedKp = localStorage.getItem('conf_known_points');
            if (savedKp) {
                const parsed = JSON.parse(savedKp);
                if (Array.isArray(parsed)) knownPoints = parsed;
            }
        } catch (e) { knownPoints = []; }

        let recordedPoints = [];
        try {
            const savedRec = localStorage.getItem('conf_recorded_points');
            if (savedRec) {
                const parsed = JSON.parse(savedRec);
                if (Array.isArray(parsed)) recordedPoints = parsed;
            }
        } catch (e) { recordedPoints = []; }

        const SMOOTHING_SIZE = 4;
        let latHistory = [];
        let lonHistory = [];
        let altHistory = [];

        let latestLat = 0;
        let latestLon = 0;
        let latestRawAlt = null;
        
        let watchId = null;
        let isPaused = false;

        let pdrX = 0;
        let pdrY = 0;
        let lastHeading = 0;
        let samplingTimer = null;
        let orientationHandler = null;
        let motionHandler = null;

        document.getElementById('zone-select').value = config.selectedZone;
        document.getElementById('in-invertalt').checked = config.invertAlt;
        renderKnownPointsList();
        renderRecordedPointsList();
        updateGrowthUI();

        function getCurrentTransformedCoords() {
            if (latestLat === 0 || latestLon === 0) return null;
            const activeZone = config.selectedZone === 'auto' ? getAutoZone(latestLat, latestLon) : parseInt(config.selectedZone);
            const rawPlane = calculatePlaneRectangular(latestLat, latestLon, activeZone);
            const transformed = applyHelmertTransformation(rawPlane.x, rawPlane.y);
            
            const safePdrX = isNaN(pdrX) ? 0 : pdrX;
            const safePdrY = isNaN(pdrY) ? 0 : pdrY;
            
            let finalX = transformed.x + safePdrX;
            let finalY = transformed.y + safePdrY;
            let finalZ = null;

            if (latestRawAlt !== null && !isNaN(latestRawAlt)) {
                let altProc = latestRawAlt;
                if (config.invertAlt) altProc = -altProc;
                finalZ = altProc + config.altOff;
            }

            return { x: finalX, y: finalY, z: finalZ };
        }

        document.getElementById('add-rec-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('rec-name');
            const userEnteredName = nameInput.value ? String(nameInput.value).trim() : '';
            const name = userEnteredName !== '' ? userEnteredName : `記録点_${recordedPoints.length + 1}`;

            const coords = getCurrentTransformedCoords();
            if (!coords) {
                alert('⚠️ 現在地のGPS信号が取得できていません。');
                return;
            }

            const newPoint = {
                id: Date.now(),
                name: name,
                x: coords.x,
                y: coords.y,
                z: coords.z,
                time: new Date().toLocaleString('ja-JP')
            };

            recordedPoints.push(newPoint);
            saveRecordedPoints();
            nameInput.value = '';
            renderRecordedPointsList();
            alert(`🟡 記録点「${name}」を記録しました！`);
        });

        function saveRecordedPoints() {
            try {
                localStorage.setItem('conf_recorded_points', JSON.stringify(recordedPoints));
            } catch (e) {}
        }

        function renderRecordedPointsList() {
            const container = document.getElementById('rec-list-container');
            const countEl = document.getElementById('rec-count');
            if (countEl) countEl.innerText = recordedPoints.length + '箇所';
            
            if (!container) return;
            container.innerHTML = '';
            
            if (recordedPoints.length === 0) {
                container.innerHTML = '<div style="font-size:11px; color:#666; text-align:center; padding:6px;">記録された点はありません</div>';
                return;
            }

            recordedPoints.forEach((pt) => {
                const zStr = pt.z !== null && pt.z !== undefined ? pt.z.toFixed(2) : '---';
                const div = document.createElement('div');
                div.className = 'point-item';

                const infoDiv = document.createElement('div');
                infoDiv.style.flex = '1';
                infoDiv.style.minWidth = '140px';

                const titleDiv = document.createElement('div');
                titleDiv.style.color = '#eab308';
                titleDiv.style.fontWeight = 'bold';
                titleDiv.style.marginBottom = '2px';
                titleDiv.textContent = pt.name;

                const detailDiv = document.createElement('div');
                detailDiv.style.color = '#aaa';
                detailDiv.style.fontSize = '10px';
                detailDiv.textContent = `X: ${pt.x.toFixed(2)}, Y: ${pt.y.toFixed(2)}, Z: ${zStr}`;

                infoDiv.appendChild(titleDiv);
                infoDiv.appendChild(detailDiv);

                const delBtn = document.createElement('button');
                delBtn.className = 'danger';
                delBtn.style.fontSize = '10px';
                delBtn.style.padding = '3px 6px';
                delBtn.textContent = '削除';
                delBtn.onclick = () => deleteRecordedPoint(pt.id);

                div.appendChild(infoDiv);
                div.appendChild(delBtn);
                container.appendChild(div);
            });
        }

        window.deleteRecordedPoint = function(id) {
            if(!confirm("この記録点を削除しますか？")) return;
            recordedPoints = recordedPoints.filter(p => p.id !== id);
            saveRecordedPoints();
            renderRecordedPointsList();
        };

        // CSV自動ダウンロード機能
        document.getElementById('export-csv-btn').addEventListener('click', exportCSV);

        function exportCSV() {
            if (recordedPoints.length === 0 && routeLog.length === 0 && knownPoints.length === 0) {
                alert("出力する測量データがありません。");
                return;
            }

            let csvContent = "\uFEFF種別,名称/ID,日時,X座標(m),Y座標(m),Z標高(m)\n";

            recordedPoints.forEach(p => {
                const zVal = p.z !== null && p.z !== undefined ? p.z.toFixed(3) : '';
                csvContent += `記録点,"${p.name.replace(/"/g, '""')}",${p.time || ''},${p.x.toFixed(3)},${p.y.toFixed(3)},${zVal}\n`;
            });

            knownPoints.forEach(p => {
                const zVal = p.targetZ !== null && p.targetZ !== undefined ? p.targetZ.toFixed(3) : '';
                csvContent += `基準点,"${p.name.replace(/"/g, '""')}",,${p.targetX.toFixed(3)},${p.targetY.toFixed(3)},${zVal}\n`;
            });

            routeLog.forEach((p, idx) => {
                const timeStr = new Date(p.time).toLocaleString('ja-JP');
                csvContent += `軌跡ログ,Track_${idx+1},${timeStr},${p.x.toFixed(3)},${p.y.toFixed(3)},\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `測量ログ_${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.getElementById('clear-all-data-btn').addEventListener('click', () => {
            if (confirm("これまでに保存された全記録点・基準点・ログが完全に消去されます。\nデータを一括リセットしますか？")) {
                localStorage.clear();
                recordedPoints = [];
                knownPoints = [];
                routeLog = [];
                config.shiftX = 0;
                config.shiftY = 0;
                config.hasCalibrated = false;
                renderRecordedPointsList();
                renderKnownPointsList();
                updateGrowthUI();
                alert("旧データおよび全記録を正常に初期化・消去しました。");
            }
        });

        // ログ記録 & PDF直接ダウンロード出力
        const logToggleBtn = document.getElementById('log-toggle-btn');
        logToggleBtn.addEventListener('click', () => {
            if (!isLogging) {
                routeLog = [];
                isLogging = true;
                logToggleBtn.innerText = "⏹️ 記録停止＆出力";
                logToggleBtn.className = "danger";

                logTimer = setInterval(() => {
                    const coords = getCurrentTransformedCoords();
                    if (coords && !isNaN(coords.x) && !isNaN(coords.y)) {
                        routeLog.push({ x: coords.x, y: coords.y, time: Date.now() });
                    }
                }, 1000);

            } else {
                isLogging = false;
                logToggleBtn.innerText = "🔴 ログ記録開始";
                logToggleBtn.className = "primary";
                
                if (logTimer !== null) {
                    clearInterval(logTimer);
                    logTimer = null;
                }

                exportCSV();
                generatePDFReport();
            }
        });

        // PDF自動生成 ＆ 直接ダウンロード処理
        function generatePDFReport() {
            try {
                if (typeof window.jspdf === 'undefined') {
                    alert('PDF生成ライブラリが読み込まれていません。');
                    return;
                }

                const validLog = routeLog.filter(p => !isNaN(p.x) && !isNaN(p.y));
                const validKnown = knownPoints.filter(kp => !isNaN(kp.targetX) && !isNaN(kp.targetY));
                const validRec = recordedPoints.filter(rp => !isNaN(rp.x) && !isNaN(rp.y));

                if (validLog.length === 0 && validKnown.length === 0 && validRec.length === 0) {
                    alert("PDFに出力する有効な座標データがありません。");
                    return;
                }

                const canvas = document.createElement('canvas');
                const W = 1240, H = 1754; // A4縦サイズ比率
                canvas.width = W; canvas.height = H;
                const ctx = canvas.getContext('2d');

                // 背景（白）
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);

                // ヘッダー情報
                ctx.fillStyle = '#111827';
                ctx.font = `bold 28px ${JAPANESE_FONT_FAMILY}`;
                ctx.fillText('考古学フィールドワーク 測位・軌跡描画レポート', 80, 70);

                ctx.font = `14px ${JAPANESE_FONT_FAMILY}`;
                ctx.fillStyle = '#4b5563';
                const nowStr = new Date().toLocaleString('ja-JP');
                ctx.fillText(`出力日時: ${nowStr}   |   記録点: ${validRec.length}箇所   |   基準点: ${validKnown.length}箇所   |   軌跡ログ点: ${validLog.length}点`, 80, 100);

                // 外枠線
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 2;
                ctx.strokeRect(60, 120, W - 120, H - 180);

                const margin = 200; // マージン拡大によるはみ出しガード
                const drawWidth = W - (margin * 2);
                const drawHeight = H - (margin * 2) - 40;

                // 範囲算出
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                const allPoints = [
                    ...validLog.map(p => ({ x: p.x, y: p.y })),
                    ...validKnown.map(p => ({ x: p.targetX, y: p.targetY })),
                    ...validRec.map(p => ({ x: p.x, y: p.y }))
                ];

                allPoints.forEach(p => {
                    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
                });

                // 範囲のパディング確保（引き出し線飛び出し防止用）
                let rangeX = maxX - minX;
                let rangeY = maxY - minY;
                if (rangeX === 0) { minX -= 10; maxX += 10; rangeX = 20; }
                if (rangeY === 0) { minY -= 10; maxY += 10; rangeY = 20; }

                const padX = rangeX * 0.15;
                const padY = rangeY * 0.15;
                minX -= padX; maxX += padX;
                minY -= padY; maxY += padY;

                const maxRange = Math.max(maxX - minX, maxY - minY, 20);
                const scale = Math.min(drawWidth / maxRange, drawHeight / maxRange);

                function toCanvasCoord(x, y) {
                    const px = margin + (y - minY) * scale + (drawWidth - (maxY - minY) * scale) / 2;
                    const py = margin + 40 + drawHeight - ((x - minX) * scale + (drawHeight - (maxX - minX) * scale) / 2);
                    return { x: px, y: py };
                }

                // 1. メッシュ線（グリッド線）描画
                function getNiceGridInterval(range) {
                    const raw = range / 6;
                    const exponent = Math.floor(Math.log10(raw));
                    const fraction = raw / Math.pow(10, exponent);
                    let nice;
                    if (fraction < 1.5) nice = 1;
                    else if (fraction < 3.5) nice = 2;
                    else if (fraction < 7.5) nice = 5;
                    else nice = 10;
                    return Math.max(0.1, nice * Math.pow(10, exponent));
                }

                const gridInterval = getNiceGridInterval(maxRange);
                const startX = Math.floor(minX / gridInterval) * gridInterval;
                const endX = Math.ceil(maxX / gridInterval) * gridInterval;
                const startY = Math.floor(minY / gridInterval) * gridInterval;
                const endY = Math.ceil(maxY / gridInterval) * gridInterval;

                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 1.5;
                ctx.font = `12px ${JAPANESE_FONT_FAMILY}`;
                ctx.fillStyle = '#6b7280';

                // 縦格子線 (Y/東進)
                for (let yVal = startY; yVal <= endY; yVal += gridInterval) {
                    const p = toCanvasCoord(minX, yVal);
                    if (p.x >= margin && p.x <= W - margin) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, margin + 40);
                        ctx.lineTo(p.x, margin + 40 + drawHeight);
                        ctx.stroke();
                        ctx.fillText(`Y:${yVal.toFixed(1)}m`, p.x - 20, margin + 40 + drawHeight + 22);
                    }
                }

                // 横格子線 (X/北進)
                for (let xVal = startX; xVal <= endX; xVal += gridInterval) {
                    const p = toCanvasCoord(xVal, minY);
                    if (p.y >= margin + 40 && p.y <= margin + 40 + drawHeight) {
                        ctx.beginPath();
                        ctx.moveTo(margin, p.y);
                        ctx.lineTo(margin + drawWidth, p.y);
                        ctx.stroke();
                        ctx.fillText(`X:${xVal.toFixed(1)}m`, margin - 90, p.y + 4);
                    }
                }

                // 2. ログルート（赤線）描画
                if (validLog.length > 0) {
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    validLog.forEach((p, idx) => {
                        const cv = toCanvasCoord(p.x, p.y);
                        if (idx === 0) ctx.moveTo(cv.x, cv.y);
                        else ctx.lineTo(cv.x, cv.y);
                    });
                    ctx.stroke();

                    // 軌跡点
                    validLog.forEach(p => {
                        const cv = toCanvasCoord(p.x, p.y);
                        ctx.fillStyle = 'rgba(239, 68, 68, 0.6)';
                        ctx.beginPath();
                        ctx.arc(cv.x, cv.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                // 3. 縮尺スケールバー描画
                const scaleMeters = gridInterval;
                const scalePx = scaleMeters * scale;
                const sbX = margin + 10;
                const sbY = margin + 40 + drawHeight - 15;

                ctx.strokeStyle = '#111827';
                ctx.fillStyle = '#111827';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(sbX, sbY);
                ctx.lineTo(sbX + scalePx, sbY);
                ctx.moveTo(sbX, sbY - 8);
                ctx.lineTo(sbX, sbY + 8);
                ctx.moveTo(sbX + scalePx, sbY - 8);
                ctx.lineTo(sbX + scalePx, sbY + 8);
                ctx.stroke();

                ctx.font = `bold 14px ${JAPANESE_FONT_FAMILY}`;
                ctx.fillText(`0`, sbX - 4, sbY - 12);
                ctx.fillText(`${scaleMeters} m`, sbX + scalePx - 15, sbY - 12);
                ctx.font = `12px ${JAPANESE_FONT_FAMILY}`;
                ctx.fillText(`縮尺スケール`, sbX, sbY + 24);

                // 4. 基準点・記録点 ＆ 引き出し線描画（画面外飛び出しクランプ付き）
                function drawAnnotatedPointCanvas(ptX, ptY, ptZ, rawName, pointColorHex, labelPrefix) {
                    const cvPt = toCanvasCoord(ptX, ptY);
                    const nameStr = String(rawName || '名称未設定');
                    const zText = ptZ !== null && ptZ !== undefined ? ptZ.toFixed(3) : '---';
                    const titleText = `${labelPrefix}${nameStr}`;

                    // 点本体
                    ctx.fillStyle = pointColorHex;
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(cvPt.x, cvPt.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // テキストボックスの幅・高さ
                    ctx.font = `bold 14px ${JAPANESE_FONT_FAMILY}`;
                    const boxWidth = Math.max(ctx.measureText(titleText).width, 140) + 20;
                    const boxHeight = 74;

                    // 点の位置（左右・上下）に応じてデフォルト引き出し方向を切り替え
                    let offsetX = cvPt.x > W / 2 ? -boxWidth - 50 : 50;
                    let offsetY = cvPt.y > H / 2 ? -boxHeight - 20 : 20;

                    let textX = cvPt.x + offsetX;
                    let textY = cvPt.y + offsetY;

                    // 描画範囲外への飛び出し・途切れを防止する絶対境界ガード（クランプ処理）
                    const minBoundaryX = 70;
                    const maxBoundaryX = W - boxWidth - 70;
                    const minBoundaryY = 140;
                    const maxBoundaryY = H - boxHeight - 70;

                    if (textX < minBoundaryX) textX = minBoundaryX;
                    if (textX > maxBoundaryX) textX = maxBoundaryX;
                    if (textY < minBoundaryY) textY = minBoundaryY;
                    if (textY > maxBoundaryY) textY = maxBoundaryY;

                    // リーダー線（引き出し線）の端点計算
                    const lineTargetX = textX < cvPt.x ? textX + boxWidth : textX;
                    const lineTargetY = textY + boxHeight / 2;

                    ctx.strokeStyle = '#4b5563';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(cvPt.x, cvPt.y);
                    ctx.lineTo(lineTargetX, lineTargetY);
                    ctx.stroke();

                    // 注釈ボックス背景
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.strokeStyle = '#9ca3af';
                    ctx.lineWidth = 1;
                    ctx.fillRect(textX, textY, boxWidth, boxHeight);
                    ctx.strokeRect(textX, textY, boxWidth, boxHeight);

                    // 注釈テキスト
                    ctx.fillStyle = '#000000';
                    ctx.font = `bold 14px ${JAPANESE_FONT_FAMILY}`;
                    ctx.fillText(titleText, textX + 10, textY + 20);
                    ctx.font = `12px ${JAPANESE_FONT_FAMILY}`;
                    ctx.fillText(`X: ${ptX.toFixed(3)}`, textX + 10, textY + 38);
                    ctx.fillText(`Y: ${ptY.toFixed(3)}`, textX + 10, textY + 53);
                    ctx.fillText(`Z: ${zText}`, textX + 10, textY + 68);
                }

                validKnown.forEach(kp => drawAnnotatedPointCanvas(kp.targetX, kp.targetY, kp.targetZ, kp.name, "#2563eb", "基準: "));
                validRec.forEach(rp => drawAnnotatedPointCanvas(rp.x, rp.y, rp.z, rp.name, "#eab308", "記録: "));

                // PDF生成およびダウンロード処理
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                doc.addImage(imgData, 'PNG', 0, 0, 210, 297);
                doc.save(`archaeology_survey_${Date.now()}.pdf`);
            } catch (err) {
                alert("PDF生成中にエラーが発生しました: " + err.message);
            }
        }

        function applyHelmertTransformation(rawX, rawY) {
            const n = knownPoints.length;
            if (n === 0) return { x: rawX + config.shiftX, y: rawY + config.shiftY };
            if (n === 1) return { x: rawX + knownPoints[0].shiftX, y: rawY + knownPoints[0].shiftY };

            let sum_x = 0, sum_y = 0, sum_X = 0, sum_Y = 0;
            const points = knownPoints.map(kp => {
                const rX = kp.targetX - kp.shiftX; 
                const rY = kp.targetY - kp.shiftY; 
                sum_x += rX; sum_y += rY; sum_X += kp.targetX; sum_Y += kp.targetY;
                return { x: rX, y: rY, X: kp.targetX, Y: kp.targetY };
            });

            const mean_x = sum_x / n, mean_y = sum_y / n, mean_X = sum_X / n, mean_Y = sum_Y / n;
            let num_a = 0, num_b = 0, den = 0;
            points.forEach(p => {
                const u = p.x - mean_x, v = p.y - mean_y, U = p.X - mean_X, V = p.Y - mean_Y;
                num_a += (u * U + v * V); num_b += (u * V - v * U); den += (u * u + v * v);
            });

            let a = den !== 0 ? num_a / den : 1, b = den !== 0 ? num_b / den : 0;
            const c = mean_X - a * mean_x + b * mean_y, d = mean_Y - b * mean_x - a * mean_y;

            return { x: a * rawX - b * rawY + c, y: b * rawX + a * rawY + d };
        }

        function initSensors() {
            const btn = document.getElementById('sensor-permission-btn');
            if (btn) {
                btn.style.background = '#16a34a';
                btn.innerText = '📱 センサー有効化済み';
            }
            orientationHandler = (e) => {
                if (e && typeof e.alpha === 'number') {
                    lastHeading = e.alpha * (Math.PI / 180);
                }
            };
            window.addEventListener('deviceorientation', orientationHandler);

            let lastAccZ = 0;
            motionHandler = (e) => {
                try {
                    const acc = e && e.accelerationIncludingGravity;
                    if (!acc) return;
                    const curZ = typeof acc.z === 'number' ? acc.z : 0;
                    if (Math.abs(curZ - lastAccZ) > 2.5) {
                        const heading = isNaN(lastHeading) ? 0 : lastHeading;
                        pdrX += Math.cos(heading) * 0.65 * 0.05;
                        pdrY += Math.sin(heading) * 0.65 * 0.05;
                    }
                    lastAccZ = curZ;
                } catch (err) {}
            };
            window.addEventListener('devicemotion', motionHandler);
        }

        function toDMS(deg) {
            if (isNaN(deg)) return '---';
            const abs = Math.abs(deg);
            const d = Math.floor(abs);
            const mNot = (abs - d) * 60;
            const m = Math.floor(mNot);
            const s = ((mNot - m) * 60).toFixed(5);
            return `${d}°${String(m).padStart(2, '0')}′${String(s).padStart(5, '0')}″`;
        }

        function getAutoZone(lat, lon) {
            let zone = 9;
            if (lat < 28) {
                if (lon < 125.5) zone = 16;
                else if (lon < 129.0) zone = 15;
                else if (lon < 133.0) zone = 17;
                else zone = 14;
            } else if (lat > 42) {
                if (lon < 141.75) zone = 11;
                else if (lon < 143.075) zone = 12;
                else zone = 13;
            } else {
                if (lon < 130.25) zone = 1;
                else if (lon < 131.75) zone = 2;
                else if (lon < 132.85) zone = 3;
                else if (lon < 133.85) zone = 4;
                else if (lon < 135.2) zone = 5;
                else if (lon < 136.6) zone = 6;
                else if (lon < 137.8) zone = 7;
                else if (lon < 139.2) zone = 8;
                else if (lon < 140.175) zone = 9;
                else zone = 10;
            }
            return zone;
        }

        function calculatePlaneRectangular(lat, lon, zone) {
            const zones = {
                1:  { phi0: 33.166666667, lam0: 129.5 },
                2:  { phi0: 33.0,          lam0: 131.0 },
                3:  { phi0: 36.0,          lam0: 132.166666667 },
                4:  { phi0: 33.0,          lam0: 133.5 },
                5:  { phi0: 36.0,          lam0: 134.333333333 },
                6:  { phi0: 36.0,          lam0: 136.0 },
                7:  { phi0: 36.0,          lam0: 137.166666667 },
                8:  { phi0: 36.0,          lam0: 138.5 },
                9:  { phi0: 36.0,          lam0: 139.833333333 },
                10: { phi0: 40.0,          lam0: 140.75 },
                11: { phi0: 44.0,          lam0: 141.333333333 },
                12: { phi0: 44.0,          lam0: 142.25 },
                13: { phi0: 44.0,          lam0: 144.0 },
                14: { phi0: 26.0,          lam0: 142.0 },
                15: { phi0: 26.0,          lam0: 127.5 },
                16: { phi0: 26.0,          lam0: 124.0 },
                17: { phi0: 26.0,          lam0: 131.0 }
            };
            const zConfig = zones[zone] || zones[9];
            const phi0 = zConfig.phi0 * Math.PI / 180;
            const lam0 = zConfig.lam0 * Math.PI / 180;
            const m0 = 0.9999;
            const φ = lat * Math.PI / 180;
            const λ = lon * Math.PI / 180;
            const a = 6378137.0, f = 1 / 298.257222101, b = a * (1 - f);
            const e2 = (a*a - b*b) / (a*a), e2_prime = (a*a - b*b) / (b*b);

            function m(latRad) {
                const n_val = f / (2 - f);
                const A_val = (a / (1 + n_val)) * (1 + n_val*n_val/4 + Math.pow(n_val,4)/64);
                const b_val = (3 * n_val / 2) - (9 * Math.pow(n_val, 3) / 16);
                const c_val = (15 * Math.pow(n_val, 2) / 16) - (15 * Math.pow(n_val, 4) / 32);
                const d_val = (35 * Math.pow(n_val, 3) / 48);
                const e_val = (315 * Math.pow(n_val, 4) / 512);
                return A_val * (latRad - b_val * Math.sin(2*latRad) + c_val * Math.sin(4*latRad) - d_val * Math.sin(6*latRad) + e_val * Math.sin(8*latRad));
            }
            const S = m(φ), S0 = m(phi0);
            const N = a / Math.sqrt(1 - e2 * Math.sin(φ)*Math.sin(φ));
            const T = Math.tan(φ)*Math.tan(φ), C = e2_prime * Math.cos(φ)*Math.cos(φ), A_diff = (λ - lam0) * Math.cos(φ);
            const xCalc = S - S0 + N * Math.tan(φ) * (A_diff*A_diff/2 + (5 - T + 9*C + 4*C*C) * Math.pow(A_diff, 4)/24);
            const yCalc = N * (A_diff + (1 - T + C) * Math.pow(A_diff, 3)/6);
            return { x: xCalc * m0, y: yCalc * m0 };
        }

        function startGeolocation() {
            if (!('geolocation' in navigator)) {
                const statusEl = document.getElementById('gps-status');
                if (statusEl) statusEl.innerText = "GPS非対応";
                return;
            }
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    if (isPaused || !pos || !pos.coords) return;
                    try {
                        const curLat = pos.coords.latitude;
                        const curLon = pos.coords.longitude;
                        const curAlt = pos.coords.altitude;
                        
                        latHistory.push(curLat);
                        lonHistory.push(curLon);
                        if (latHistory.length > SMOOTHING_SIZE) latHistory.shift();
                        if (lonHistory.length > SMOOTHING_SIZE) lonHistory.shift();
                        
                        latestLat = latHistory.reduce((a, b) => a + b, 0) / latHistory.length;
                        latestLon = lonHistory.reduce((a, b) => a + b, 0) / lonHistory.length;

                        if (curAlt !== null) {
                            altHistory.push(curAlt);
                            if (altHistory.length > SMOOTHING_SIZE) altHistory.shift();
                            latestRawAlt = altHistory.reduce((a, b) => a + b, 0) / altHistory.length;
                        } else {
                            latestRawAlt = null;
                        }
                        
                        document.getElementById('lat-display').innerText = toDMS(latestLat);
                        document.getElementById('lon-display').innerText = toDMS(latestLon);

                        const coords = getCurrentTransformedCoords();
                        const activeZone = config.selectedZone === 'auto' ? getAutoZone(latestLat, latestLon) : parseInt(config.selectedZone);
                        document.getElementById('zone-display').innerText = config.selectedZone === 'auto' ? `自動 (第${activeZone}系)` : `手動 (第${activeZone}系)`;

                        if (coords) {
                            document.getElementById('grid-x').innerText = coords.x.toFixed(3) + ' m';
                            document.getElementById('grid-y').innerText = coords.y.toFixed(3) + ' m';
                            document.getElementById('alt-display').innerText = coords.z !== null ? coords.z.toFixed(3) + ' m' : '未取得';
                        }
                        
                        const statusEl = document.getElementById('gps-status');
                        if (statusEl) {
                            statusEl.innerText = "測位中";
                            statusEl.style.color = "#4ade80";
                        }
                    } catch (err) {}
                },
                (err) => {
                    if (!isPaused) {
                        const statusEl = document.getElementById('gps-status');
                        if (statusEl) {
                            statusEl.innerText = "GPS待機/エラー (" + (err.code) + ")";
                            statusEl.style.color = "#ef4444";
                        }
                    }
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        startGeolocation();
    </script>
