<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高精度平面直角座標測位アプリ（考古学フィールドワーク対応版）</title>
    <!-- jsPDFライブラリの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            overflow: hidden; position: fixed; touch-action: none;
        }
        .glass { 
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(4px); 
            border-bottom: 1px solid #333; padding: 10px 12px; position: absolute; 
            top: 0; left: 0; width: 100%; z-index: 20; max-height: 50vh; overflow-y: auto; touch-action: pan-y; 
        }
        .crosshair { position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        .crosshair-h { width: 40px; height: 2px; background: red; position: absolute; left: -20px; top: -1px; }
        .crosshair-v { width: 2px; height: 40px; background: red; position: absolute; top: -20px; left: -1px; }

        #register-panel {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 420px; background: rgba(15, 15, 15, 0.95);
            border: 1px solid #444; border-radius: 8px; padding: 10px 12px; z-index: 15;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7); max-height: 45vh; overflow-y: auto; touch-action: pan-y; 
        }
        #register-panel input { width: 100%; background: #222; color: #fff; border: 1px solid #555; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
        .flex-row { display: flex; gap: 6px; margin-top: 6px; }
        .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 12px; flex-wrap: wrap; word-break: break-word; gap: 4px; }
        
        button { background: #222; color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; border-color: #666; }
        button.success { background: #16a34a; border-color: #22c55e; }
        button.primary { background: #2563eb; border-color: #3b82f6; }
        button.warning { background: #d97706; border-color: #f59e0b; }
        button.danger { background: #dc2626; border-color: #ef4444; }
        button.record { background: #ca8a04; border-color: #eab308; color: #fff; }

        #settings-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; touch-action: auto; }
        .modal-content { background: #111; border: 1px solid #444; padding: 20px; border-radius: 8px; width: 380px; max-width: 95%; text-align: left; max-height: 90vh; overflow-y: auto; touch-action: pan-y; }
        .modal-content label { display: block; font-size: 12px; margin-top: 10px; color: #aaa; }
        .modal-content select { width: 100%; background: #222; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; margin-top: 4px; font-size: 13px; }
        .point-item { background: #1a1a1a; border: 1px solid #333; padding: 6px 8px; margin-top: 6px; border-radius: 4px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    </style>
</head>
<body>

    <header class="glass">
        <div class="data-row" style="align-items: center;">
            <span id="gps-status" style="color: #fbbf24; font-weight: bold;">位置情報を取得中...</span>
            <div style="display: flex; gap: 4px;">
                <button id="pause-btn" class="warning">⏸️ 一時停止</button>
                <button id="settings-btn">⚙️ 管理/設定</button>
            </div>
        </div>
        <hr style="border:0; border-top:1px solid #333; margin: 4px 0;">
        <div class="data-row"><span>緯度:</span> <span id="lat-display" style="color: #22d3ee;">---</span></div>
        <div class="data-row"><span>経度:</span> <span id="lon-display" style="color: #22d3ee;">---</span></div>
        <div class="data-row"><span>適用座標系:</span> <span id="zone-display" style="color: #38bdf8; font-weight: bold;">自動判定中...</span></div>
        <div class="data-row"><span>平面 X (北進):</span> <span id="grid-x" style="color: #4ade80; font-weight: bold; font-size: 14px;">---</span></div>
        <div class="data-row"><span>平面 Y (東進):</span> <span id="grid-y" style="color: #4ade80; font-weight: bold; font-size: 14px;">---</span></div>
        <div class="data-row"><span>標高 Z (補正後):</span> <span id="alt-display" style="color: #facc15; font-weight: bold; font-size: 14px;">---</span></div>
        
        <hr style="border:0; border-top:1px solid #222; margin: 4px 0;">
        <div class="data-row" style="font-size: 11px;">
            <span>🌱 育成レベル: <span id="growth-level-display" style="color: #facc15; font-weight: bold;">Lv.0 (未学習)</span></span>
            <span>補正状態: <span id="training-status" style="color: #fca5a5;">標準測位</span></span>
        </div>
        
        <div style="margin-top: 6px; display: flex; gap: 6px;">
            <button id="log-toggle-btn" class="primary" style="flex: 1; padding: 8px; font-size: 13px;">🔴 ログ記録開始</button>
            <button id="export-csv-btn" class="success" style="padding: 8px; font-size: 12px;">📊 CSV保存</button>
        </div>
    </header>

    <div class="crosshair">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
    </div>

    <div id="register-panel">
        <div style="color: #eab308; font-weight: bold; font-size: 12px; text-align: center; margin-bottom: 4px;">🟡 遺物・遺構記録点（任意測位点）の登録</div>
        <div class="flex-row">
            <input type="text" id="rec-name" placeholder="点名/遺物名 (例: 点1)">
            <button id="add-rec-btn" class="record" style="white-space: nowrap; padding: 6px 12px;">📍 現在地を記録</button>
        </div>

        <hr style="border:0; border-top:1px solid #333; margin: 8px 0;">

        <div style="color: #38bdf8; font-weight: bold; font-size: 12px; text-align: center; margin-bottom: 4px;">🎯 基準点（既知点）の学習登録</div>
        <input type="text" id="kp-name" placeholder="既知点名 (例: トレンチ基準点A)">
        <div class="flex-row">
            <input type="number" id="kp-x" placeholder="X座標(m)" step="0.001">
            <input type="number" id="kp-y" placeholder="Y座標(m)" step="0.001">
            <input type="number" id="kp-z" placeholder="Z(任意)" step="0.001" style="width: 70px;">
        </div>
        <button id="add-kp-btn" class="primary" style="width: 100%; padding: 8px; margin-top: 6px; font-size: 12px;">➕ 基準点として学習・登録</button>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: #fff; text-align: center;">⚙️ 設定 ＆ データ管理</h3>
            
            <label>平面直角座標系の選択</label>
            <select id="zone-select">
                <option value="auto">🌐 自動判定 (推奨)</option>
                <option value="1">第1系 (沖縄県)</option>
                <option value="2">第2系 (鹿児島・熊本一部)</option>
                <option value="3">第3系 (九州中部)</option>
                <option value="4">第4系 (四国)</option>
                <option value="5">第5系 (中国地方)</option>
                <option value="6">第6系 (近畿地方)</option>
                <option value="7">第7系 (中部西側)</option>
                <option value="8">第8系 (中部東側・関東部)</option>
                <option value="9">第9系 (関東地方)</option>
                <option value="10">第10系 (東北南部)</option>
                <option value="11">第11系 (北海道道南)</option>
                <option value="12">第12系 (北海道道央)</option>
                <option value="13">第13系 (北海道道東)</option>
                <option value="14">第14系以降 (島嶼部)</option>
            </select>

            <label style="display: flex; align-items: center; color: #fca5a5; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 10px;">
                <input type="checkbox" id="in-invertalt" style="width: 16px; height: 16px; margin-right: 8px;">
                標高の上下逆転現象を直す
            </label>

            <button id="sync-auto-btn" class="success" style="width: 100%; padding: 8px; margin-top: 10px;">⏱️ 5秒間スタティック平均化（ブレ除去）</button>

            <hr style="border:0; border-top:1px solid #333; margin: 12px 0;">

            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label style="color: #eab308; font-weight: bold;">🟡 登録済み遺物・記録点</label>
                <span id="rec-count" style="color: #eab308; font-size: 11px;">0箇所</span>
            </div>
            <div style="margin-top: 6px; max-height: 120px; overflow-y: auto; touch-action: pan-y;" id="rec-list-container"></div>

            <hr style="border:0; border-top:1px solid #333; margin: 12px 0;">

            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label style="color: #38bdf8; font-weight: bold;">🌱 登録済み既知点（基準点）</label>
                <span id="growth-count" style="color: #4ade80; font-size: 11px;">0箇所</span>
            </div>
            <div style="margin-top: 6px; max-height: 120px; overflow-y: auto; touch-action: pan-y;" id="kp-list-container"></div>

            <hr style="border:0; border-top:1px solid #333; margin: 12px 0;">

            <!-- 化けた旧データをクリアする安全ボタン -->
            <button id="clear-all-data-btn" class="danger" style="width: 100%; padding: 8px; font-size: 12px;">🗑️ 化けた旧データを全消去・初期化</button>

            <div style="margin-top: 12px;">
                <button id="close-settings" class="success" style="width: 100%; padding: 10px; font-size: 14px;">保存して閉じる</button>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        const JAPANESE_FONT_FAMILY = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif';

        let isLogging = false;
        let routeLog = [];
        let logTimer = null;

        const safeGetStorage = (key, defaultVal, isFloat = false) => {
            try {
                const val = localStorage.getItem(key);
                if (val === null) return defaultVal;
                return isFloat ? parseFloat(val) || defaultVal : val;
            } catch (e) { return defaultVal; }
        };

        let config = {
            selectedZone: safeGetStorage('conf_zone', 'auto'),
            altOff: safeGetStorage('conf_altoff', 0, true),
            invertAlt: localStorage.getItem('conf_invertalt') === 'true',
            shiftX: safeGetStorage('conf_shiftx', 0, true),
            shiftY: safeGetStorage('conf_shifty', 0, true),
            hasCalibrated: localStorage.getItem('conf_hascalibrated') === 'true'
        };

        let knownPoints = [];
        try {
            const savedKp = localStorage.getItem('conf_known_points');
            if (savedKp) {
                const parsed = JSON.parse(savedKp);
                if (Array.isArray(parsed)) knownPoints = parsed;
            }
        } catch (e) { knownPoints = []; }

        let recordedPoints = [];
        try {
            const savedRec = localStorage.getItem('conf_recorded_points');
            if (savedRec) {
                const parsed = JSON.parse(savedRec);
                if (Array.isArray(parsed)) recordedPoints = parsed;
            }
        } catch (e) { recordedPoints = []; }

        const SMOOTHING_SIZE = 4;
        let latHistory = [], lonHistory = [], altHistory = [];
        let latestLat = 0, latestLon = 0, latestRawAlt = null;
        let watchId = null, isPaused = false;
        let pdrX = 0, pdrY = 0, lastHeading = 0, samplingTimer = null;

        document.getElementById('zone-select').value = config.selectedZone;
        document.getElementById('in-invertalt').checked = config.invertAlt;
        renderKnownPointsList();
        renderRecordedPointsList();
        updateGrowthUI();

        function getCurrentTransformedCoords() {
            if (latestLat === 0 || latestLon === 0) return null;
            const activeZone = config.selectedZone === 'auto' ? getAutoZone(latestLat, latestLon) : parseInt(config.selectedZone);
            const rawPlane = calculatePlaneRectangular(latestLat, latestLon, activeZone);
            const transformed = applyHelmertTransformation(rawPlane.x, rawPlane.y);
            
            const safePdrX = isNaN(pdrX) ? 0 : pdrX;
            const safePdrY = isNaN(pdrY) ? 0 : pdrY;
            
            let finalX = transformed.x + safePdrX;
            let finalY = transformed.y + safePdrY;
            let finalZ = null;

            if (latestRawAlt !== null && !isNaN(latestRawAlt)) {
                let altProc = latestRawAlt;
                if (config.invertAlt) altProc = -altProc;
                finalZ = altProc + config.altOff;
            }

            return { x: finalX, y: finalY, z: finalZ };
        }

        // 記録点の追加（文字化けしない直接文字列保持）
        document.getElementById('add-rec-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('rec-name');
            const userEnteredName = nameInput.value ? String(nameInput.value).trim() : '';
            const name = userEnteredName !== '' ? userEnteredName : `記録点_${recordedPoints.length + 1}`;

            const coords = getCurrentTransformedCoords();
            if (!coords) {
                alert('⚠️ 現在地のGPS信号が取得できていません。');
                return;
            }

            const newPoint = {
                id: Date.now(),
                name: name,
                x: coords.x,
                y: coords.y,
                z: coords.z,
                time: new Date().toLocaleString('ja-JP')
            };

            recordedPoints.push(newPoint);
            saveRecordedPoints();
            nameInput.value = '';
            renderRecordedPointsList();
            alert(`🟡 記録点「${name}」を正常に登録しました！`);
        });

        function saveRecordedPoints() {
            try {
                localStorage.setItem('conf_recorded_points', JSON.stringify(recordedPoints));
            } catch (e) {}
        }

        function renderRecordedPointsList() {
            const container = document.getElementById('rec-list-container');
            const countEl = document.getElementById('rec-count');
            if (countEl) countEl.innerText = recordedPoints.length + '箇所';
            
            if (!container) return;
            if (recordedPoints.length === 0) {
                container.innerHTML = '<div style="font-size:11px; color:#666; text-align:center; padding:6px;">記録された点はありません</div>';
                return;
            }
            let html = '';
            recordedPoints.forEach((pt) => {
                const zStr = pt.z !== null && pt.z !== undefined ? pt.z.toFixed(2) : '---';
                html += `<div class="point-item">
                    <div style="flex: 1; min-width: 140px;">
                        <div style="color: #eab308; font-weight: bold; margin-bottom: 2px;">${escapeHtml(pt.name)}</div>
                        <div style="color: #aaa; font-size: 10px;">X: ${pt.x.toFixed(2)}, Y: ${pt.y.toFixed(2)}, Z: ${zStr}</div>
                    </div>
                    <button class="danger" style="font-size:10px; padding:3px 6px;" onclick="deleteRecordedPoint(${pt.id})">削除</button>
                </div>`;
            });
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.deleteRecordedPoint = function(id) {
            if(!confirm("この記録点を削除しますか？")) return;
            recordedPoints = recordedPoints.filter(p => p.id !== id);
            saveRecordedPoints();
            renderRecordedPointsList();
        };

        // CSV出力機能（BOM付きUTF-8でExcel等の文字化けを100%防止）
        document.getElementById('export-csv-btn').addEventListener('click', exportCSV);

        function exportCSV() {
            if (recordedPoints.length === 0 && routeLog.length === 0) {
                alert("出力するログデータがありません。");
                return;
            }

            let csvContent = "\uFEFF種別,名称/ID,日時,X座標(m),Y座標(m),Z標高(m)\n";

            recordedPoints.forEach(p => {
                const zVal = p.z !== null && p.z !== undefined ? p.z.toFixed(3) : '';
                csvContent += `記録点,"${p.name.replace(/"/g, '""')}",${p.time},${p.x.toFixed(3)},${p.y.toFixed(3)},${zVal}\n`;
            });

            routeLog.forEach((p, idx) => {
                const timeStr = new Date(p.time).toLocaleString('ja-JP');
                csvContent += `軌跡ログ,Track_${idx+1},${timeStr},${p.x.toFixed(3)},${p.y.toFixed(3)},\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `測量ログ_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // リセット機能（化けた旧データ消去）
        document.getElementById('clear-all-data-btn').addEventListener('click', () => {
            if (confirm("これまでに保存された記録点・基準点のデータがすべて削除されます。\n文字化けデータを破棄して初期化しますか？")) {
                localStorage.removeItem('conf_recorded_points');
                localStorage.removeItem('conf_known_points');
                recordedPoints = [];
                knownPoints = [];
                renderRecordedPointsList();
                renderKnownPointsList();
                updateGrowthUI();
                alert("データを初期化しました。新しく「点1」を登録してお試しください。");
            }
        });

        // ログ記録トグル
        const logToggleBtn = document.getElementById('log-toggle-btn');
        logToggleBtn.addEventListener('click', () => {
            if (!isLogging) {
                routeLog = [];
                isLogging = true;
                logToggleBtn.innerText = "⏹️ 記録停止＆出力";
                logToggleBtn.className = "danger";

                logTimer = setInterval(() => {
                    const coords = getCurrentTransformedCoords();
                    if (coords && !isNaN(coords.x) && !isNaN(coords.y)) {
                        routeLog.push({ x: coords.x, y: coords.y, time: Date.now() });
                    }
                }, 1000);
            } else {
                isLogging = false;
                logToggleBtn.innerText = "🔴 ログ記録開始";
                logToggleBtn.className = "primary";
                if (logTimer !== null) clearInterval(logTimer);
                exportCSV();
                generatePDFReport();
            }
        });

        function generatePDFReport() {
            try {
                if (typeof window.jspdf === 'undefined') return;
                const validRec = recordedPoints.filter(rp => !isNaN(rp.x) && !isNaN(rp.y));
                const validKnown = knownPoints.filter(kp => !isNaN(kp.targetX) && !isNaN(kp.targetY));
                const validLog = routeLog.filter(p => !isNaN(p.x) && !isNaN(p.y));

                if (validLog.length === 0 && validKnown.length === 0 && validRec.length === 0) return;

                const canvas = document.createElement('canvas');
                const W = 1240, H = 1754;
                canvas.width = W; canvas.height = H;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);

                const margin = 120;
                const drawWidth = W - (margin * 2);
                const drawHeight = H - (margin * 2);

                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                const allPoints = [
                    ...validLog.map(p => ({ x: p.x, y: p.y })),
                    ...validKnown.map(p => ({ x: p.targetX, y: p.targetY })),
                    ...validRec.map(p => ({ x: p.x, y: p.y }))
                ];

                allPoints.forEach(p => {
                    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
                });

                if (minX === maxX) { minX -= 10; maxX += 10; }
                if (minY === maxY) { minY -= 10; maxY += 10; }

                const maxRange = Math.max(maxX - minX, maxY - minY, 20);
                const scale = Math.min(drawWidth / maxRange, drawHeight / maxRange);

                function toCanvasCoord(x, y) {
                    const px = margin + (y - minY) * scale + (drawWidth - (maxY - minY) * scale) / 2;
                    const py = margin + drawHeight - ((x - minX) * scale + (drawHeight - (maxX - minX) * scale) / 2);
                    return { x: px, y: py };
                }

                let labelCounter = 0;
                function drawAnnotatedPointCanvas(ptX, ptY, ptZ, rawName, pointColorHex, labelPrefix) {
                    const cvPt = toCanvasCoord(ptX, ptY);
                    const nameStr = String(rawName || '名称未設定');

                    ctx.fillStyle = pointColorHex;
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cvPt.x, cvPt.y, 6, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();

                    const angleDir = labelCounter % 4;
                    let offsetX = 50, offsetY = -60;
                    if (angleDir === 1) { offsetX = -210; offsetY = -60; }
                    else if (angleDir === 2) { offsetX = 50; offsetY = 70; }
                    else if (angleDir === 3) { offsetX = -210; offsetY = 70; }
                    labelCounter++;

                    const textX = cvPt.x + offsetX;
                    const textY = cvPt.y + offsetY;

                    ctx.strokeStyle = '#374151';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(cvPt.x, cvPt.y);
                    ctx.lineTo(textX > cvPt.x ? textX : textX + 160, textY + (offsetY < 0 ? 18 : -5));
                    ctx.stroke();

                    const zText = ptZ !== null && ptZ !== undefined ? ptZ.toFixed(3) : '---';
                    const titleText = `${labelPrefix}${nameStr}`;

                    ctx.font = `bold 15px ${JAPANESE_FONT_FAMILY}`;
                    const boxWidth = Math.max(ctx.measureText(titleText).width, 140) + 16;

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.strokeStyle = '#9ca3af';
                    ctx.lineWidth = 1;
                    ctx.fillRect(textX - 6, textY - 16, boxWidth, 74);
                    ctx.strokeRect(textX - 6, textY - 16, boxWidth, 74);

                    ctx.fillStyle = '#000000';
                    ctx.font = `bold 15px ${JAPANESE_FONT_FAMILY}`;
                    ctx.fillText(titleText, textX, textY);
                    ctx.font = `13px ${JAPANESE_FONT_FAMILY}`;
                    ctx.fillText(`X: ${ptX.toFixed(3)}`, textX, textY + 18);
                    ctx.fillText(`Y: ${ptY.toFixed(3)}`, textX, textY + 34);
                    ctx.fillText(`Z: ${zText}`, textX, textY + 50);
                }

                validKnown.forEach(kp => drawAnnotatedPointCanvas(kp.targetX, kp.targetY, kp.targetZ, kp.name, "#2563eb", "基準: "));
                validRec.forEach(rp => drawAnnotatedPointCanvas(rp.x, rp.y, rp.z, rp.name, "#eab308", "記録: "));

                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                doc.addImage(imgData, 'PNG', 0, 0, 210, 297);
                doc.save(`archaeology_survey_${Date.now()}.pdf`);
            } catch (err) {}
        }

        document.getElementById('settings-btn').addEventListener('click', () => { document.getElementById('settings-modal').style.display = 'flex'; });
        document.getElementById('close-settings').addEventListener('click', () => {
            config.selectedZone = document.getElementById('zone-select').value;
            config.invertAlt = document.getElementById('in-invertalt').checked;
            localStorage.setItem('conf_zone', config.selectedZone);
            localStorage.setItem('conf_invertalt', config.invertAlt);
            document.getElementById('settings-modal').style.display = 'none';
        });

        const pauseBtn = document.getElementById('pause-btn');
        pauseBtn.addEventListener('click', () => {
            if (!isPaused) {
                if (watchId !== null && 'geolocation' in navigator) navigator.geolocation.clearWatch(watchId);
                isPaused = true;
                pauseBtn.innerText = "▶️ 測定再開";
                pauseBtn.className = "success";
            } else {
                isPaused = false;
                pauseBtn.innerText = "⏸️ 一時停止";
                pauseBtn.className = "warning";
                startGeolocation();
            }
        });

        document.getElementById('add-kp-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('kp-name');
            const xInput = document.getElementById('kp-x');
            const yInput = document.getElementById('kp-y');
            const zInput = document.getElementById('kp-z');

            const userKpName = nameInput.value ? String(nameInput.value).trim() : '';
            const name = userKpName !== '' ? userKpName : `既知点_${knownPoints.length + 1}`;
            const targetX = parseFloat(xInput.value);
            const targetY = parseFloat(yInput.value);
            const targetZ = parseFloat(zInput.value);

            if (isNaN(targetX) || isNaN(targetY)) {
                alert('有効なX, Y座標を入力してください。');
                return;
            }

            const activeZone = config.selectedZone === 'auto' ? getAutoZone(latestLat, latestLon) : parseInt(config.selectedZone);
            const rawPlane = calculatePlaneRectangular(latestLat, latestLon, activeZone);

            const newPoint = {
                id: Date.now(),
                name: name,
                lat: latestLat, lon: latestLon,
                targetX: targetX, targetY: targetY, targetZ: !isNaN(targetZ) ? targetZ : null,
                shiftX: targetX - rawPlane.x, shiftY: targetY - rawPlane.y, shiftZ: 0
            };

            knownPoints.push(newPoint);
            localStorage.setItem('conf_known_points', JSON.stringify(knownPoints));
            nameInput.value = ''; xInput.value = ''; yInput.value = ''; zInput.value = '';
            renderKnownPointsList(); updateGrowthUI();
            alert(`🌱 既知点「${name}」を登録しました！`);
        });

        function renderKnownPointsList() {
            const container = document.getElementById('kp-list-container');
            const countEl = document.getElementById('growth-count');
            if (countEl) countEl.innerText = knownPoints.length + '箇所';
            if (!container) return;
            if (knownPoints.length === 0) {
                container.innerHTML = '<div style="font-size:11px; color:#666; text-align:center; padding:6px;">登録された既知点はありません</div>';
                return;
            }
            let html = '';
            knownPoints.forEach((kp) => {
                const zStr = kp.targetZ !== null && kp.targetZ !== undefined ? kp.targetZ.toFixed(2) : '---';
                html += `<div class="point-item">
                    <div style="flex: 1; min-width: 140px;">
                        <div style="color: #fff; font-weight: bold; margin-bottom: 2px;">${escapeHtml(kp.name)}</div>
                        <div style="color: #888; font-size: 10px;">X: ${kp.targetX.toFixed(2)}, Y: ${kp.targetY.toFixed(2)}, Z: ${zStr}</div>
                    </div>
                    <button class="danger" style="font-size:10px; padding:3px 6px;" onclick="deleteKnownPoint(${kp.id})">削除</button>
                </div>`;
            });
            container.innerHTML = html;
        }

        window.deleteKnownPoint = function(id) {
            if(!confirm("この既知点を削除しますか？")) return;
            knownPoints = knownPoints.filter(p => p.id !== id);
            localStorage.setItem('conf_known_points', JSON.stringify(knownPoints));
            renderKnownPointsList(); updateGrowthUI();
        };

        function updateGrowthUI() {
            const count = knownPoints.length;
            const levelEl = document.getElementById('growth-level-display');
            const statusEl = document.getElementById('training-status');

            if (count >= 3) {
                if (levelEl) { levelEl.innerText = "Lv.3 (面補正)"; levelEl.style.color = "#4ade80"; }
                if (statusEl) { statusEl.innerText = "📐 ヘルメルト変換"; statusEl.style.color = "#4ade80"; }
            } else if (count === 1) {
                if (levelEl) { levelEl.innerText = "Lv.1 (点補正)"; levelEl.style.color = "#facc15"; }
                if (statusEl) { statusEl.innerText = "📌 単純平行移動"; statusEl.style.color = "#facc15"; }
            } else {
                if (levelEl) { levelEl.innerText = "Lv.0 (未学習)"; levelEl.style.color = "#9ca3af"; }
                if (statusEl) { statusEl.innerText = "標準測位"; statusEl.style.color = "#fca5a5"; }
            }
        }

        function applyHelmertTransformation(rawX, rawY) {
            if (knownPoints.length === 0) return { x: rawX + config.shiftX, y: rawY + config.shiftY };
            if (knownPoints.length === 1) return { x: rawX + knownPoints[0].shiftX, y: rawY + knownPoints[0].shiftY };

            let sum_x = 0, sum_y = 0, sum_X = 0, sum_Y = 0, n = knownPoints.length;
            const points = knownPoints.map(kp => {
                const rX = kp.targetX - kp.shiftX, rY = kp.targetY - kp.shiftY;
                sum_x += rX; sum_y += rY; sum_X += kp.targetX; sum_Y += kp.targetY;
                return { x: rX, y: rY, X: kp.targetX, Y: kp.targetY };
            });

            const mean_x = sum_x / n, mean_y = sum_y / n, mean_X = sum_X / n, mean_Y = sum_Y / n;
            let num_a = 0, num_b = 0, den = 0;
            points.forEach(p => {
                const u = p.x - mean_x, v = p.y - mean_y, U = p.X - mean_X, V = p.Y - mean_Y;
                num_a += (u * U + v * V); num_b += (u * V - v * U); den += (u * u + v * v);
            });

            let a = den !== 0 ? num_a / den : 1, b = den !== 0 ? num_b / den : 0;
            const c = mean_X - a * mean_x + b * mean_y, d = mean_Y - b * mean_x - a * mean_y;

            return { x: a * rawX - b * rawY + c, y: b * rawX + a * rawY + d };
        }

        function toDMS(deg) {
            if (isNaN(deg)) return '---';
            const abs = Math.abs(deg), d = Math.floor(abs), mNot = (abs - d) * 60, m = Math.floor(mNot), s = ((mNot - m) * 60).toFixed(5);
            return `${d}°${String(m).padStart(2, '0')}′${String(s).padStart(5, '0')}″`;
        }

        function getAutoZone(lat, lon) {
            if (lat < 28) return 15;
            if (lat > 42) return 12;
            if (lon < 130.25) return 1;
            if (lon < 131.75) return 2;
            if (lon < 132.85) return 3;
            if (lon < 133.85) return 4;
            if (lon < 135.2) return 5;
            if (lon < 136.6) return 6;
            if (lon < 137.8) return 7;
            if (lon < 139.2) return 8;
            if (lon < 140.175) return 9;
            return 10;
        }

        function calculatePlaneRectangular(lat, lon, zone) {
            const zones = { 1:{phi0:33.166666667,lam0:129.5}, 9:{phi0:36.0,lam0:139.833333333} };
            const zConfig = zones[zone] || zones[9];
            const phi0 = zConfig.phi0 * Math.PI / 180, lam0 = zConfig.lam0 * Math.PI / 180;
            const φ = lat * Math.PI / 180, λ = lon * Math.PI / 180;
            const a = 6378137.0, f = 1 / 298.257222101, b = a * (1 - f);
            const e2 = (a*a - b*b) / (a*a);

            function m(l) {
                const n = f / (2 - f), A = (a / (1 + n)) * (1 + n*n/4);
                return A * (l - (3*n/2)*Math.sin(2*l) + (15*n*n/16)*Math.sin(4*l));
            }
            const S = m(φ), S0 = m(phi0);
            const N = a / Math.sqrt(1 - e2 * Math.sin(φ)*Math.sin(φ));
            const A_diff = (λ - lam0) * Math.cos(φ);
            return { x: (S - S0 + N * Math.tan(φ) * (A_diff*A_diff/2)) * 0.9999, y: (N * A_diff) * 0.9999 };
        }

        function startGeolocation() {
            if (!('geolocation' in navigator)) return;
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    if (isPaused || !pos || !pos.coords) return;
                    latestLat = pos.coords.latitude;
                    latestLon = pos.coords.longitude;
                    latestRawAlt = pos.coords.altitude;

                    document.getElementById('lat-display').innerText = toDMS(latestLat);
                    document.getElementById('lon-display').innerText = toDMS(latestLon);

                    const coords = getCurrentTransformedCoords();
                    if (coords) {
                        document.getElementById('grid-x').innerText = coords.x.toFixed(3) + ' m';
                        document.getElementById('grid-y').innerText = coords.y.toFixed(3) + ' m';
                        document.getElementById('alt-display').innerText = coords.z !== null ? coords.z.toFixed(3) + ' m' : '未取得';
                    }
                    document.getElementById('gps-status').innerText = "測位中";
                    document.getElementById('gps-status').style.color = "#4ade80";
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        startGeolocation();
    </script>
</body>
