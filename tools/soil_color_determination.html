<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>土層色調判定アプリ (セキュア・軽量版)</title>
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E5%9C%9f%E5%B1%A4%E8%89%B2%E8%AA%BF%E5%88%A4%E5%AE%9A%22%2C%22short_name%22%3A%22%E5%9C%9F%E8%89%B2%E5%88%A4%E5%AE%9A%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23121212%22%2C%22theme_color%22%3A%22%231f2937%22%2C%22icons%22%3A%5B%5D%7D">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #333333;
            --danger-color: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            line-height: 1.5;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.25rem; text-align: center; margin-bottom: 16px; color: #f3f4f6; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #9ca3af;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger-color); margin-top: 8px; }
        .btn-danger:hover { background-color: #dc2626; }
        input[type="file"] { display: none; }
        
        .canvas-container {
            position: relative;
            width: 100%;
            text-align: center;
            overflow: hidden;
            background: #000;
            border-radius: 6px;
            margin-top: 8px;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            touch-action: none;
        }
        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        label { font-size: 0.875rem; display: block; margin-bottom: 4px; color: #d1d5db; }
        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        .range-val { float: right; color: var(--accent-color); font-family: monospace; }
        .result-box {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #252525;
            padding: 12px;
            border-radius: 6px;
        }
        .color-preview { width: 60px; height: 60px; border-radius: 4px; border: 2px solid #fff; flex-shrink: 0; }
        .munsell-value { font-size: 1.25rem; font-weight: bold; color: #60a5fa; font-family: monospace; }
        .error-msg { color: var(--danger-color); font-size: 0.85rem; margin-top: 8px; text-align: center; }
        .instructions { font-size: 0.75rem; color: #9ca3af; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>土層色調判定アプリ（高安定・安全版）</h1>

    <div class="card">
        <h2>1. 画像取得</h2>
        <label class="btn" for="cameraInput">背面カメラで撮影する</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
        
        <label class="btn" for="fileInput" style="background-color: #4b5563; margin-bottom: 0;">既存画像を選択</label>
        <input type="file" id="fileInput" accept="image/*">
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <div class="card" id="editorCard" style="display:none;">
        <h2>2. 測定範囲の指定 (ROI)</h2>
        <p class="instructions">画像上の均質な土層部分をタッチまたはドラッグして範囲を指定してください。</p>
        <div class="canvas-container">
            <canvas id="imageCanvas"></canvas>
        </div>
        <button class="btn btn-danger" id="clearMemoryBtn">メモリを即時解放してリセット</button>
    </div>

    <div class="card" id="correctionCard" style="display:none;">
        <h2>3. 照明環境・ホワイトバランス補正</h2>
        <div class="controls-grid">
            <div>
                <label for="presetSelect">光源プリセット</label>
                <select id="presetSelect">
                    <option value="none">標準 (補正なし)</option>
                    <option value="sun">直射日光 (昼光)</option>
                    <option value="shade">曇天・日陰 (青み軽減)</option>
                    <option value="led">LEDライト (赤み補正)</option>
                    <option value="fluorescent">蛍光灯 (緑み補正)</option>
                </select>
            </div>
            <div>
                <label>色温度調整 (Kelvin) <span id="tempVal" class="range-val">0</span></label>
                <input type="range" id="tempRange" min="-100" max="100" value="0">
            </div>
            <div>
                <label>色かぶり補正 (Tint) <span id="tintVal" class="range-val">0</span></label>
                <input type="range" id="tintRange" min="-100" max="100" value="0">
            </div>
        </div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <h2>4. 判定結果 (補正済み平均)</h2>
        <div class="result-box">
            <div id="colorPreview" class="color-preview"></div>
            <div class="result-info">
                <div>近似マンセル値:</div>
                <div id="munsellResult" class="munsell-value">---</div>
                <div id="rgbResult" style="color: #9ca3af; font-size: 0.8rem; margin-top: 4px;">RGB: (---, ---, ---)</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 完全オフライン用 Service Worker（外部通信なし）
    if ('serviceWorker' in navigator) {
        try {
            const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => e.claim()); self.addEventListener('fetch', e => {});`;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        } catch (err) {
            console.warn("SW registration skipped");
        }
    }

    let img = null;
    let canvas = document.getElementById('imageCanvas');
    let ctx = canvas.getContext('2d', { willReadFrequently: true }); // パフォーマンスとメモリ最適化
    
    let roi = { x: 0, y: 0, size: 50 };
    let isDragging = false;

    document.getElementById('cameraInput').addEventListener('change', handleImageLoad);
    document.getElementById('fileInput').addEventListener('change', handleImageLoad);
    document.getElementById('presetSelect').addEventListener('change', applyPresetAndProcess);
    document.getElementById('tempRange').addEventListener('input', updateValues);
    document.getElementById('tintRange').addEventListener('input', updateValues);
    document.getElementById('clearMemoryBtn').addEventListener('click', freeMemoryAndReset);

    function showError(msg) {
        document.getElementById('errorMsg').textContent = msg;
    }

    function handleImageLoad(e) {
        const file = e.target.files[0];
        if (!file) return;

        // セキュリティ・クラッシュ防止：ファイルサイズのバリデーション（例: 30MB以上は拒否してメモリ枯渇を防ぐ）
        if (file.size > 30 * 1024 * 1024) {
            showError("ファイルサイズが大きすぎます（30MB以下にしてください）。");
            return;
        }

        showError("");
        const reader = new FileReader();
        
        reader.onload = function(event) {
            // 既存の画像オブジェクトがあればメモリ解放を促す
            if (img) {
                img.src = "";
                img = null;
            }

            img = new Image();
            img.onload = function() {
                try {
                    // 解像度が高すぎる場合に適正サイズへ圧縮・制限してクラッシュ（Out of Memory）を防ぐ
                    const maxDim = 1200;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = (width * maxDim) / height;
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;

                    roi.size = Math.floor(Math.min(canvas.width, canvas.height) * 0.15);
                    roi.x = Math.floor((canvas.width - roi.size) / 2);
                    roi.y = Math.floor((canvas.height - roi.size) / 2);

                    document.getElementById('editorCard').style.display = 'block';
                    document.getElementById('correctionCard').style.display = 'block';
                    document.getElementById('resultCard').style.display = 'block';

                    processImage();
                } catch (err) {
                    showError("画像の描画処理中にエラーが発生しました。");
                }
            };
            
            img.onerror = function() {
                showError("有効な画像ファイルではありません。");
            };

            img.src = event.target.result;
        };

        reader.onerror = function() {
            showError("ファイルの読み込みに失敗しました。");
        };

        try {
            reader.readAsDataURL(file);
        } catch (err) {
            showError("メモリ不足、またはファイル読み込みエラーです。");
        }
        
        // inputの値をリセットして同じファイルの再選択を可能にする
        e.target.value = '';
    }

    // メモリの即時解放とリセット処理
    function freeMemoryAndReset() {
        if (ctx && canvas) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = 1;
            canvas.height = 1;
        }
        if (img) {
            img.src = "";
            img = null;
        }
        
        // UI非表示化
        document.getElementById('editorCard').style.display = 'none';
        document.getElementById('correctionCard').style.display = 'none';
        document.getElementById('resultCard').style.display = 'none';
        showError("");

        // ガベージコレクションの手動トリガー促進（可能なブラウザ環境向け）
        if (window.gc) {
            try { window.gc(); } catch(e) {}
        }
    }

    function getEventPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', drag);
    canvas.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', startDrag, {passive: false});
    canvas.addEventListener('touchmove', drag, {passive: false});
    canvas.addEventListener('touchend', endDrag);

    function startDrag(e) {
        e.preventDefault();
        isDragging = true;
        updateRoiPos(e);
    }

    function drag(e) {
        if (!isDragging) return;
        e.preventDefault();
        updateRoiPos(e);
    }

    function endDrag() {
        isDragging = false;
    }

    function updateRoiPos(e) {
        const pos = getEventPos(e);
        roi.x = Math.max(0, Math.min(pos.x - roi.size / 2, canvas.width - roi.size));
        roi.y = Math.max(0, Math.min(pos.y - roi.size / 2, canvas.height - roi.size));
        processImage();
    }

    function applyPresetAndProcess() {
        const preset = document.getElementById('presetSelect').value;
        const tempRange = document.getElementById('tempRange');
        const tintRange = document.getElementById('tintRange');

        switch(preset) {
            case 'sun': tempRange.value = 10; tintRange.value = 0; break;
            case 'shade': tempRange.value = -30; tintRange.value = 10; break;
            case 'led': tempRange.value = 25; tintRange.value = -10; break;
            case 'fluorescent': tempRange.value = 0; tintRange.value = 20; break;
            default: tempRange.value = 0; tintRange.value = 0; break;
        }
        updateValues();
    }

    function updateValues() {
        document.getElementById('tempVal').textContent = document.getElementById('tempRange').value;
        document.getElementById('tintVal').textContent = document.getElementById('tintRange').value;
        processImage();
    }

    function processImage() {
        if (!img) return;
        try {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.strokeRect(roi.x, roi.y, roi.size, roi.size);

            const imageData = ctx.getImageData(roi.x, roi.y, roi.size, roi.size);
            const data = imageData.data;

            let rSum = 0, gSum = 0, bSum = 0;
            let count = data.length / 4;

            const temp = parseInt(document.getElementById('tempRange').value);
            const tint = parseInt(document.getElementById('tintRange').value);

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i+1];
                let b = data[i+2];

                r = Math.min(255, Math.max(0, r + temp));
                b = Math.min(255, Math.max(0, b - temp));
                g = Math.min(255, Math.max(0, g - tint));

                rSum += r;
                gSum += g;
                bSum += b;
            }

            let avgR = Math.round(rSum / count);
            let avgG = Math.round(gSum / count);
            let avgB = Math.round(bSum / count);

            const hex = `#${((1 << 24) + (avgR << 16) + (avgG << 8) + avgB).toString(16).slice(1)}`;
            document.getElementById('colorPreview').style.backgroundColor = hex;
            document.getElementById('rgbResult').textContent = `RGB: (${avgR}, ${avgG}, ${avgB})`;

            const munsell = getApproximateMunsell(avgR, avgG, avgB);
            document.getElementById('munsellResult').textContent = munsell;
        } catch (err) {
            showError("画像解析中にエラーが発生しました。");
        }
    }

    function getApproximateMunsell(r, g, b) {
        const database = [
            { name: "2.5YR 2/1 (黒色)", r: 40, g: 35, b: 30 },
            { name: "7.5YR 2.5/1 (黒褐色)", r: 55, g: 45, b: 35 },
            { name: "10YR 3/2 (黒褐色)", r: 75, g: 60, b: 45 },
            { name: "10YR 4/3 (暗褐色)", r: 100, g: 80, b: 60 },
            { name: "10YR 5/4 (明褐色)", r: 135, g: 110, b: 85 },
            { name: "10YR 6/4 (にぶい黄褐色)", r: 170, g: 145, b: 110 },
            { name: "7.5YR 5/6 (明赤褐色)", r: 155, g: 110, b: 75 },
            { name: "5YR 4/6 (赤褐色)", r: 130, g: 80, b: 50 },
            { name: "2.5Y 6/2 (灰黄褐色)", r: 160, g: 150, b: 130 },
            { name: "5Y 5/2 (オリーブ灰色)", r: 120, g: 125, b: 110 }
        ];

        let minDistance = Infinity;
        let closestName = "判定中 / 範囲外";

        for (let item of database) {
            let dist = Math.sqrt(
                Math.pow(r - item.r, 2) + 
                Math.pow(g - item.g, 2) + 
                Math.pow(b - item.b, 2)
            );
            if (dist < minDistance) {
                minDistance = dist;
                closestName = item.name;
            }
        }
        return closestName;
    }
</script>

</body>
</html>
