<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家系図アプリケーション - Family Tree Builder</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f4f7f6',
                            100: '#e3ebe8',
                            500: '#2c5e50',
                            600: '#234b40',
                            700: '#1b3a32',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Core CSS (フォールバック & 印刷設定) -->
    <style>
        /* システムフォントおよび明朝体の指定 */
        body {
            font-family: "Hiragino Mincho ProN", "MS Mincho", "MS 明朝", "Yu Mincho", "Georgia", serif;
            background-color: #f8faf9;
            color: #2b2b2b;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        /* 印刷・PDF出力用スタイル */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            #tree-container {
                overflow: visible !important;
                width: 100% !important;
                height: auto !important;
                transform: scale(0.95);
                transform-origin: top left;
            }
            .tree-node-card {
                box-shadow: none !important;
                border: 1px solid #666 !important;
                break-inside: avoid;
            }
        }

        /* ツリーコネクタ接続線 */
        .tree-line {
            position: absolute;
            background-color: #718096;
            z-index: 1;
            pointer-events: none;
        }

        /* ノードカードスタイル */
        .tree-node-card {
            transition: all 0.2s ease-in-out;
            z-index: 2;
        }
        .tree-node-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* CDNフォールバック構造 */
        .flex-container { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col text-slate-800">

    <!-- ナビゲーション・ヘッダー（印刷非表示） -->
    <header class="no-print bg-slate-900 text-stone-100 shadow-md border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <h1 class="text-xl font-bold tracking-wide" id="app-title">家系図アプリケーション</h1>
            </div>

            <!-- 操作ボタン・言語選択 -->
            <div class="flex flex-wrap items-center gap-2">
                <!-- 新規メンバー追加 -->
                <button id="btn-add-root" class="bg-emerald-700 hover:bg-emerald-600 text-white text-sm px-3 py-1.5 rounded flex items-center gap-1 transition shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span id="lbl-add-root">新規メンバー追加</span>
                </button>

                <!-- PDF/印刷 -->
                <button id="btn-print" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-3 py-1.5 rounded flex items-center gap-1 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    <span id="lbl-print">印刷 / PDF</span>
                </button>

                <!-- 保存 (JSON) -->
                <button id="btn-export" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-3 py-1.5 rounded flex items-center gap-1 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span id="lbl-export">保存 (JSON)</span>
                </button>

                <!-- 読み込み (JSON) -->
                <label class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-3 py-1.5 rounded cursor-pointer flex items-center gap-1 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span id="lbl-import">読み込み</span>
                    <input type="file" id="file-import" accept=".json" class="hidden">
                </label>

                <!-- リセット -->
                <button id="btn-clear" class="bg-red-900/80 hover:bg-red-800 text-red-200 text-sm px-2.5 py-1.5 rounded transition" title="Clear All">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>

                <!-- 多言語選択 -->
                <select id="lang-select" class="bg-slate-800 text-stone-200 border border-slate-600 rounded text-sm px-2 py-1.5 focus:outline-none focus:border-emerald-500">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ko">한국어</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>
    </header>

    <!-- メイン表示領域 -->
    <main class="flex-1 relative overflow-auto p-4 md:p-8" id="main-viewport">
        <div id="tree-container" class="relative min-w-max min-h-[600px] mx-auto p-8 flex flex-col items-center">
            <!-- 動的描画エリア -->
        </div>
    </main>

    <!-- トースト通知 -->
    <div id="toast-message" class="no-print fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2 border border-slate-700">
        <span id="toast-text">メッセージ</span>
    </div>

    <!-- メンバー入力・編集モーダル -->
    <div id="modal-overlay" class="no-print fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-2xl border border-stone-200 w-full max-w-lg p-6 m-4 transform transition-all">
            <div class="flex justify-between items-center border-b border-stone-200 pb-3 mb-4">
                <h2 id="modal-title" class="text-lg font-bold text-slate-800">人物情報の編集</h2>
                <button id="modal-close-btn" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
            </div>

            <form id="member-form" onsubmit="return false;" class="space-y-4">
                <input type="hidden" id="edit-id">

                <!-- 氏名 -->
                <div>
                    <label id="lbl-form-name" class="block text-sm font-semibold text-slate-700 mb-1">氏名</label>
                    <input type="text" id="input-name" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <!-- 生年月日 ＆ 没年月日 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label id="lbl-form-birth" class="block text-sm font-semibold text-slate-700 mb-1">生年月日</label>
                        <input type="date" id="input-birth" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label id="lbl-form-death" class="block text-sm font-semibold text-slate-700 mb-1">没年月日（空欄可）</label>
                        <input type="date" id="input-death" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <!-- 性別 / メモ -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label id="lbl-form-gender" class="block text-sm font-semibold text-slate-700 mb-1">性別 / デザイン</label>
                        <select id="input-gender" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="male" id="opt-male">男性</option>
                            <option value="female" id="opt-female">女性</option>
                            <option value="other" id="opt-other">その他 / 未指定</option>
                        </select>
                    </div>
                    <div>
                        <label id="lbl-form-notes" class="block text-sm font-semibold text-slate-700 mb-1">メモ / 続柄など</label>
                        <input type="text" id="input-notes" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="長男, 本家 等">
                    </div>
                </div>

                <!-- 関係性（親・配偶者） -->
                <div class="border-t border-stone-200 pt-4 mt-2">
                    <h3 id="lbl-relations-title" class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">関係性の設定</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label id="lbl-form-parent" class="block text-xs text-slate-600 mb-1">親を選択</label>
                            <select id="input-parent-id" class="w-full px-2 py-1.5 border border-stone-300 rounded text-sm focus:outline-none">
                                <option value="" id="opt-none-parent">なし (ルート)</option>
                            </select>
                        </div>
                        <div>
                            <label id="lbl-form-spouse" class="block text-xs text-slate-600 mb-1">配偶者を選択</label>
                            <select id="input-spouse-id" class="w-full px-2 py-1.5 border border-stone-300 rounded text-sm focus:outline-none">
                                <option value="" id="opt-none-spouse">なし</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- アクションボタン -->
                <div class="flex justify-between items-center pt-4 border-t border-stone-200 mt-6">
                    <button type="button" id="btn-delete-member" class="bg-red-100 hover:bg-red-200 text-red-700 text-sm px-3 py-2 rounded-md transition hidden">
                        <span id="lbl-delete">削除</span>
                    </button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" id="btn-cancel-modal" class="bg-stone-200 hover:bg-stone-300 text-slate-700 text-sm px-4 py-2 rounded-md transition">
                            <span id="lbl-cancel">キャンセル</span>
                        </button>
                        <button type="submit" id="btn-save-member" class="bg-emerald-700 hover:bg-emerald-600 text-white text-sm px-4 py-2 rounded-md transition shadow">
                            <span id="lbl-save">保存</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

        /**

         */
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /**
         * 年齢・享年計算関数
         */
        function calculateAgeInfo(birthStr, deathStr) {
            if (!birthStr) return { text: i18n[currentLang].unknownBirth, isDeceased: false };

            const birthDate = new Date(birthStr);
            if (isNaN(birthDate.getTime())) {
                return { text: i18n[currentLang].unknownBirth, isDeceased: false };
            }

            const isDeceased = Boolean(deathStr);
            const endDate = isDeceased ? new Date(deathStr) : new Date();

            if (isNaN(endDate.getTime())) {
                return { text: i18n[currentLang].unknownBirth, isDeceased: false };
            }

            let age = endDate.getFullYear() - birthDate.getFullYear();
            const monthDiff = endDate.getMonth() - birthDate.getMonth();

            if (monthDiff < 0 || (monthDiff === 0 && endDate.getDate() < birthDate.getDate())) {
                age--;
            }

            if (age < 0) age = 0;

            const langObj = i18n[currentLang];
            if (isDeceased) {
                return {
                    text: `${langObj.deceasedPrefix}${age}${langObj.deceasedSuffix}`,
                    isDeceased: true
                };
            } else {
                return {
                    text: `${langObj.agePrefix}${age}${langObj.ageSuffix}`,
                    isDeceased: false
                };
            }
        }

        /**
         * ローカルストレージ保存
         */
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(familyData));
            } catch (e) {
                console.error("Failed to save to localStorage", e);
            }
        }

        /**
         * ローカルストレージ読込（初期データ無し）
         */
        function loadData() {
            try {
                const json = localStorage.getItem(STORAGE_KEY);
                if (json) {
                    familyData = JSON.parse(json);
                } else {
                    familyData = []; // 初期起動時は常に空
                }
            } catch (e) {
                console.error("Failed to load from localStorage", e);
                familyData = [];
            }
        }

        /**
         * メインツリーのレンダリング
         */
        function renderTree() {
            const container = document.getElementById('tree-container');
            if (!container) return;

            // 既存の線をクリア
            const lines = container.querySelectorAll('.tree-line');
            lines.forEach(line => line.remove());
            container.innerHTML = '';

            // データが1件もない場合（初期表示ガイド）
            if (familyData.length === 0) {
                const lang = i18n[currentLang];
                container.innerHTML = `
                    <div class="text-center py-20 px-6 max-w-md my-auto bg-white rounded-2xl border border-stone-200 shadow-sm">
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-2">${escapeHtml(lang.noDataTitle)}</h3>
                        <p class="text-sm text-slate-500 mb-6 leading-relaxed">${escapeHtml(lang.noDataDesc)}</p>
                        <button id="btn-add-first-member" class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium text-sm px-5 py-2.5 rounded-lg transition shadow">
                            + ${escapeHtml(lang.addRoot)}
                        </button>
                    </div>
                `;

                document.getElementById('btn-add-first-member')?.addEventListener('click', () => openModal());
                return;
            }

            // ルートノードの抽出（親を持たない人物）
            const rootMembers = familyData.filter(m => !m.parentId);
            
            const treeWrap = document.createElement('div');
            treeWrap.className = "flex flex-wrap justify-center gap-12 pt-4";

            rootMembers.forEach(root => {
                const nodeEl = createSubTreeDOM(root.id);
                if (nodeEl) treeWrap.appendChild(nodeEl);
            });

            container.appendChild(treeWrap);

            // コネクタ接続線の遅延描画
            setTimeout(() => {
                drawConnections();
            }, 50);
        }

        /**
         * 再帰的なサブツリーDOM構造作成
         */
        function createSubTreeDOM(memberId) {
            const member = familyData.find(m => m.id === memberId);
            if (!member) return null;

            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col items-center relative node-wrapper";
            wrapper.dataset.id = member.id;

            const coupleBox = document.createElement('div');
            coupleBox.className = "flex items-center gap-4 relative mb-8";

            // 本人
            const primaryCard = createMemberCardHTML(member);
            coupleBox.appendChild(primaryCard);

            // 配偶者
            if (member.spouseId) {
                const spouse = familyData.find(m => m.id === member.spouseId);
                if (spouse) {
                    const spouseCard = createMemberCardHTML(spouse, true);
                    coupleBox.appendChild(spouseCard);
                }
            }

            wrapper.appendChild(coupleBox);

            // 子供リスト取得
            let children = familyData.filter(m => m.parentId === member.id);
            if (member.spouseId) {
                const spouseChildren = familyData.filter(m => m.parentId === member.spouseId);
                spouseChildren.forEach(sc => {
                    if (!children.some(c => c.id === sc.id)) {
                        children.push(sc);
                    }
                });
            }

            if (children.length > 0) {
                const childrenBox = document.createElement('div');
                childrenBox.className = "flex justify-center gap-8 relative pt-6 children-container";

                children.forEach(child => {
                    const childSubTree = createSubTreeDOM(child.id);
                    if (childSubTree) childrenBox.appendChild(childSubTree);
                });

                wrapper.appendChild(childrenBox);
            }

            return wrapper;
        }

        /**
         * メンバーカードHTML生成
         */
        function createMemberCardHTML(member, isSpouse = false) {
            const ageInfo = calculateAgeInfo(member.birth, member.death);
            const card = document.createElement('div');
            
            let genderStyle = "border-slate-300 bg-white";
            if (member.gender === 'male') {
                genderStyle = "border-sky-300 bg-sky-50/40";
            } else if (member.gender === 'female') {
                genderStyle = "border-rose-300 bg-rose-50/40";
            }

            card.className = `tree-node-card w-52 p-3 rounded-lg border-2 shadow-sm ${genderStyle} flex flex-col justify-between relative`;
            card.dataset.memberId = member.id;

            const nameHtml = escapeHtml(member.name || '名称未設定');
            const notesHtml = escapeHtml(member.notes || '');
            const birthHtml = escapeHtml(member.birth || '');
            const deathHtml = escapeHtml(member.death || '');

            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-base text-slate-800 leading-tight">${nameHtml}</span>
                        <button class="btn-card-edit text-slate-400 hover:text-emerald-700 p-1 no-print" data-id="${member.id}" title="${i18n[currentLang].edit}">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 210.3H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                    </div>
                    ${notesHtml ? `<div class="text-xs text-emerald-800 font-medium mb-1">${notesHtml}</div>` : ''}
                    <div class="text-xs text-slate-500 space-y-0.5">
                        ${birthHtml ? `<div>生: ${birthHtml}</div>` : ''}
                        ${deathHtml ? `<div class="text-slate-600">没: ${deathHtml}</div>` : ''}
                    </div>
                </div>
                <div class="mt-2 pt-2 border-t border-slate-200/60 flex justify-between items-center text-xs">
                    <span class="${ageInfo.isDeceased ? 'text-slate-600 font-medium' : 'text-emerald-700 font-semibold'}">${ageInfo.text}</span>
                </div>
                <div class="no-print mt-2 flex gap-1 justify-end pt-1 border-t border-slate-100">
                    <button class="btn-card-add-child text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded" data-id="${member.id}">
                        + ${i18n[currentLang].addChild}
                    </button>
                    ${!member.spouseId ? `
                    <button class="btn-card-add-spouse text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded" data-id="${member.id}">
                        + ${i18n[currentLang].addSpouse}
                    </button>
                    ` : ''}
                </div>
            `;

            return card;
        }

        /**
         * コネクタ線の作図
         */
        function drawConnections() {
            const container = document.getElementById('tree-container');
            if (!container) return;

            const oldLines = container.querySelectorAll('.tree-line');
            oldLines.forEach(l => l.remove());

            const containerRect = container.getBoundingClientRect();
            const nodeWrappers = container.querySelectorAll('.node-wrapper');

            nodeWrappers.forEach(wrapper => {
                const childrenContainer = wrapper.querySelector(':scope > .children-container');
                
                if (childrenContainer) {
                    const coupleBox = wrapper.querySelector(':scope > .flex');
                    if (!coupleBox) return;

                    const parentRect = coupleBox.getBoundingClientRect();
                    const parentX = parentRect.left + parentRect.width / 2 - containerRect.left;
                    const parentY = parentRect.bottom - containerRect.top;

                    const childSubTrees = childrenContainer.querySelectorAll(':scope > .node-wrapper');
                    if (childSubTrees.length === 0) return;

                    let minX = Infinity;
                    let maxX = -Infinity;
                    const childPoints = [];

                    childSubTrees.forEach(childWrapper => {
                        const childCoupleBox = childWrapper.querySelector(':scope > .flex');
                        if (!childCoupleBox) return;

                        const childRect = childCoupleBox.getBoundingClientRect();
                        const childX = childRect.left + childRect.width / 2 - containerRect.left;
                        const childY = childRect.top - containerRect.top;

                        if (childX < minX) minX = childX;
                        if (childX > maxX) maxX = childX;

                        childPoints.push({ x: childX, y: childY });
                    });

                    const midY = parentY + 12;

                    createLine(container, parentX, parentY, parentX, midY);
                    createLine(container, minX, midY, maxX, midY);
                    childPoints.forEach(pt => {
                        createLine(container, pt.x, midY, pt.x, pt.y);
                    });
                }
            });
        }

        function createLine(container, x1, y1, x2, y2) {
            const line = document.createElement('div');
            line.className = 'tree-line';

            if (x1 === x2) {
                const top = Math.min(y1, y2);
                const height = Math.abs(y2 - y1);
                line.style.left = `${x1}px`;
                line.style.top = `${top}px`;
                line.style.width = '2px';
                line.style.height = `${height}px`;
            } else if (y1 === y2) {
                const left = Math.min(x1, x2);
                const width = Math.abs(x2 - x1);
                line.style.left = `${left}px`;
                line.style.top = `${y1}px`;
                line.style.width = `${width}px`;
                line.style.height = '2px';
            }

            container.appendChild(line);
        }

        /**
         * 多言語UI切り替え
         */
        function updateI18nUI() {
            const lang = i18n[currentLang];
            if (!lang) return;

            document.getElementById('app-title').textContent = lang.title;
            document.getElementById('lbl-add-root').textContent = lang.addRoot;
            document.getElementById('lbl-print').textContent = lang.print;
            document.getElementById('lbl-export').textContent = lang.export;
            document.getElementById('lbl-import').textContent = lang.import;

            document.getElementById('lbl-form-name').textContent = lang.name;
            document.getElementById('lbl-form-birth').textContent = lang.birth;
            document.getElementById('lbl-form-death').textContent = lang.death;
            document.getElementById('lbl-form-gender').textContent = lang.gender;
            document.getElementById('opt-male').textContent = lang.male;
            document.getElementById('opt-female').textContent = lang.female;
            document.getElementById('opt-other').textContent = lang.other;
            document.getElementById('lbl-form-notes').textContent = lang.notes;
            document.getElementById('lbl-relations-title').textContent = lang.relationsTitle;
            document.getElementById('lbl-form-parent').textContent = lang.parent;
            document.getElementById('lbl-form-spouse').textContent = lang.spouse;
            document.getElementById('opt-none-parent').textContent = lang.noneParent;
            document.getElementById('opt-none-spouse').textContent = lang.none;

            document.getElementById('lbl-save').textContent = lang.save;
            document.getElementById('lbl-cancel').textContent = lang.cancel;
            document.getElementById('lbl-delete').textContent = lang.delete;

            renderTree();
        }

        /**
         * トースト通知表示
         */
        function showToast(text) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            if (!toast || !toastText) return;

            toastText.textContent = text;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        /**
         * モーダル開閉
         */
        function openModal(memberId = null, defaultParentId = null, defaultSpouseId = null) {
            const modal = document.getElementById('modal-overlay');
            const form = document.getElementById('member-form');
            const modalTitle = document.getElementById('modal-title');
            const btnDelete = document.getElementById('btn-delete-member');

            form.reset();
            populateSelectOptions(memberId);

            if (memberId) {
                const member = familyData.find(m => m.id === memberId);
                if (!member) return;

                modalTitle.textContent = i18n[currentLang].editTitle;
                document.getElementById('edit-id').value = member.id;
                document.getElementById('input-name').value = member.name || '';
                document.getElementById('input-birth').value = member.birth || '';
                document.getElementById('input-death').value = member.death || '';
                document.getElementById('input-gender').value = member.gender || 'male';
                document.getElementById('input-notes').value = member.notes || '';
                document.getElementById('input-parent-id').value = member.parentId || '';
                document.getElementById('input-spouse-id').value = member.spouseId || '';

                btnDelete.classList.remove('hidden');
            } else {
                modalTitle.textContent = i18n[currentLang].addTitle;
                document.getElementById('edit-id').value = '';
                document.getElementById('input-parent-id').value = defaultParentId || '';
                document.getElementById('input-spouse-id').value = defaultSpouseId || '';
                btnDelete.classList.add('hidden');
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('modal-overlay');
            if (modal) modal.classList.add('hidden');
        }

        function populateSelectOptions(currentEditId) {
            const parentSelect = document.getElementById('input-parent-id');
            const spouseSelect = document.getElementById('input-spouse-id');

            parentSelect.innerHTML = `<option value="">${escapeHtml(i18n[currentLang].noneParent)}</option>`;
            spouseSelect.innerHTML = `<option value="">${escapeHtml(i18n[currentLang].none)}</option>`;

            familyData.forEach(m => {
                if (m.id === currentEditId) return;

                const optP = document.createElement('option');
                optP.value = m.id;
                optP.textContent = `${m.name} (${m.birth || '生年不明'})`;
                parentSelect.appendChild(optP);

                const optS = document.createElement('option');
                optS.value = m.id;
                optS.textContent = `${m.name} (${m.birth || '生年不明'})`;
                spouseSelect.appendChild(optS);
            });
        }

        /**
         * 登録・更新処理
         */
        function handleFormSave() {
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('input-name').value.trim();
            const birth = document.getElementById('input-birth').value;
            const death = document.getElementById('input-death').value;
            const gender = document.getElementById('input-gender').value;
            const notes = document.getElementById('input-notes').value.trim();
            const parentId = document.getElementById('input-parent-id').value || null;
            const spouseId = document.getElementById('input-spouse-id').value || null;

            if (!name) return;

            if (editId) {
                const member = familyData.find(m => m.id === editId);
                if (member) {
                    if (member.spouseId && member.spouseId !== spouseId) {
                        const oldSpouse = familyData.find(m => m.id === member.spouseId);
                        if (oldSpouse) oldSpouse.spouseId = null;
                    }

                    member.name = name;
                    member.birth = birth;
                    member.death = death;
                    member.gender = gender;
                    member.notes = notes;
                    member.parentId = parentId;
                    member.spouseId = spouseId;

                    if (spouseId) {
                        const newSpouse = familyData.find(m => m.id === spouseId);
                        if (newSpouse) newSpouse.spouseId = member.id;
                    }
                }
            } else {
                const newId = 'mem_' + Date.now();
                const newMember = {
                    id: newId,
                    name,
                    birth,
                    death,
                    gender,
                    notes,
                    parentId,
                    spouseId
                };

                familyData.push(newMember);

                if (spouseId) {
                    const spouse = familyData.find(m => m.id === spouseId);
                    if (spouse) spouse.spouseId = newId;
                }
            }

            saveData();
            renderTree();
            closeModal();
        }

        /**
         * 削除処理
         */
        function handleMemberDelete() {
            const editId = document.getElementById('edit-id').value;
            if (!editId) return;

            if (confirm(i18n[currentLang].confirmDelete)) {
                familyData.forEach(m => {
                    if (m.spouseId === editId) m.spouseId = null;
                    if (m.parentId === editId) m.parentId = null;
                });

                familyData = familyData.filter(m => m.id !== editId);
                saveData();
                renderTree();
                closeModal();
            }
        }

        /**
         * JSONエクスポート
         */
        function exportJSON() {
            try {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(familyData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `family_tree_${new Date().toISOString().slice(0, 10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            } catch (e) {
                console.error("Export error", e);
            }
        }

        /**
         * JSONインポート
         */
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        familyData = imported;
                        saveData();
                        renderTree();
                        showToast(i18n[currentLang].importSuccess);
                    } else {
                        showToast(i18n[currentLang].importError);
                    }
                } catch (err) {
                    showToast(i18n[currentLang].importError);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        /**
         * 全データ削除・リセット
         */
        function clearAllData() {
            if (confirm(i18n[currentLang].confirmClear)) {
                familyData = [];
                saveData();
                renderTree();
            }
        }

        /**
         * イベント設定
         */
        function setupEventListeners() {
            document.getElementById('lang-select').addEventListener('change', (e) => {
                currentLang = e.target.value;
                updateI18nUI();
            });

            document.getElementById('btn-add-root').addEventListener('click', () => openModal());
            document.getElementById('btn-print').addEventListener('click', () => window.print());
            document.getElementById('btn-export').addEventListener('click', exportJSON);
            document.getElementById('file-import').addEventListener('change', importJSON);
            document.getElementById('btn-clear').addEventListener('click', clearAllData);

            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
            document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);
            document.getElementById('btn-save-member').addEventListener('click', handleFormSave);
            document.getElementById('btn-delete-member').addEventListener('click', handleMemberDelete);

            const treeContainer = document.getElementById('tree-container');
            treeContainer.addEventListener('click', (e) => {
                const editBtn = e.target.closest('.btn-card-edit');
                if (editBtn) {
                    openModal(editBtn.dataset.id);
                    return;
                }

                const addChildBtn = e.target.closest('.btn-card-add-child');
                if (addChildBtn) {
                    openModal(null, addChildBtn.dataset.id, null);
                    return;
                }

                const addSpouseBtn = e.target.closest('.btn-card-add-spouse');
                if (addSpouseBtn) {
                    openModal(null, null, addSpouseBtn.dataset.id);
                    return;
                }
            });

            window.addEventListener('resize', () => {
                drawConnections();
            });
        }

        // 初期化処理
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            setupEventListeners();
            updateI18nUI();
        });
    </script>
</body>
</html>
