<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家系図アプリ - Family Tree</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"MS Mincho"', '"MS 明朝"', '"Hiragino Mincho ProN"', 'serif'],
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* 印刷専用スタイル (A4/A3横向き印刷最適化) */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt;
      }
      .no-print {
        display: none !important;
      }
      #main-container {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
      #tree-canvas-container {
        border: none !important;
        overflow: visible !important;
        background: white !important;
      }
      .tree-node {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #1e293b !important;
        background: #ffffff !important;
      }
      @page {
        size: A3 landscape;
        margin: 10mm;
      }
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* ツリー線のスタイル定義 */
    .tree-branch-vertical {
      width: 2px;
      background-color: #94a3b8;
    }
    .tree-branch-horizontal {
      height: 2px;
      background-color: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-amber-200">

  <!-- ヘッダー / 操作バー -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <h1 id="app-title" class="text-xl font-bold tracking-tight font-serif text-amber-100">家系図アプリ</h1>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- 基準ルート選択 -->
        <div class="relative flex items-center">
          <label for="root-select" class="text-xs text-slate-400 mr-1 hidden sm:inline" id="lbl-view-root">視点:</label>
          <select id="root-select" class="bg-slate-800 text-slate-200 text-xs rounded-lg px-2 py-1.5 border border-slate-700 focus:outline-none focus:ring-1 focus:ring-amber-500">
            <!-- 動的追加 -->
          </select>
        </div>

        <!-- 言語選択 -->
        <select id="lang-select" class="bg-slate-800 text-slate-200 text-xs rounded-lg px-2 py-1.5 border border-slate-700 focus:outline-none focus:ring-1 focus:ring-amber-500">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
        </select>

        <!-- バックアップ保存 -->
        <button id="btn-export" class="inline-flex items-center px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition">
          <svg class="w-3.5 h-3.5 mr-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span id="lbl-export">バックアップ</span>
        </button>

        <!-- インポート -->
        <label class="inline-flex items-center px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition cursor-pointer">
          <svg class="w-3.5 h-3.5 mr-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          <span id="lbl-import">復元</span>
          <input type="file" id="file-import" accept=".json" class="hidden">
        </label>

        <!-- 印刷 / PDF -->
        <button id="btn-print" class="inline-flex items-center px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-medium rounded-lg shadow transition">
          <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          <span id="lbl-print">印刷 / PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="main-container" class="flex-grow max-w-full w-full p-4 sm:p-6 flex flex-col space-y-4">
    
    <!-- 空データ表示 -->
    <div id="empty-state" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center my-auto transition-all no-print max-w-md mx-auto">
      <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
      </div>
      <h2 id="empty-title" class="text-xl font-bold text-slate-800 font-serif mb-2">家系図データがありません</h2>
      <p id="empty-desc" class="text-slate-500 text-xs mb-6">最初の人物（ご自身またはご先祖様）を登録して家系図の作成を開始しましょう。</p>
      <button id="btn-add-root" class="inline-flex items-center px-5 py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-medium rounded-xl shadow-md transition transform active:scale-95 text-sm">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        <span id="lbl-add-first">最初の人物を登録する</span>
      </button>
    </div>

    <!-- 家系図キャンバス領域 -->
    <div id="tree-section" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 flex-grow flex flex-col hidden overflow-hidden relative">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 no-print flex-shrink-0">
        <div class="flex items-center space-x-3">
          <h2 id="tree-title" class="text-base font-bold text-slate-800 font-serif flex items-center">
            <svg class="w-5 h-5 mr-1.5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            家系図
          </h2>
          <span class="text-xs text-slate-400 hidden sm:inline">（ドラッグやスクロールで広い領域を操作できます）</span>
        </div>
        <button id="btn-clear-all" class="text-xs text-rose-500 hover:text-rose-700 transition">
          <span id="lbl-clear-all">すべてのデータを削除</span>
        </button>
      </div>

      <!-- スクロール可能な広大キャンバス (レイアウト崩れを防ぐ flex-nowrap / min-w-max 構造) -->
      <div id="tree-canvas-container" class="flex-grow overflow-auto p-8 relative min-h-[550px] flex justify-center items-start cursor-grab active:cursor-grabbing">
        <div id="tree-root-view" class="flex flex-col items-center min-w-max flex-shrink-0 pb-16">
          <!-- JSで動的にツリー構築 -->
        </div>
      </div>
    </div>
  </main>

  <!-- 人物編集・詳細ダイアログ -->
  <div id="person-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-lg w-full overflow-hidden transform transition-all">
      <div class="bg-slate-800 px-6 py-4 flex items-center justify-between">
        <h3 id="modal-title" class="text-base font-bold text-white font-serif">人物情報の編集</h3>
        <button id="btn-modal-close" class="text-slate-400 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form id="person-form" class="p-6 space-y-4">
        <input type="hidden" id="field-id">

        <div>
          <label id="lbl-name" class="block text-xs font-semibold text-slate-600 mb-1">氏名 *</label>
          <input type="text" id="field-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition text-sm" placeholder="例: 山田 太郎">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label id="lbl-birth" class="block text-xs font-semibold text-slate-600 mb-1">生年月日 (YYYY-MM-DD)</label>
            <input type="date" id="field-birth" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition text-sm">
          </div>

          <div>
            <label id="lbl-death" class="block text-xs font-semibold text-slate-600 mb-1">没年月日（任意）</label>
            <input type="date" id="field-death" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition text-sm">
          </div>
        </div>

        <div>
          <label id="lbl-note" class="block text-xs font-semibold text-slate-600 mb-1">メモ・備考</label>
          <textarea id="field-note" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition text-xs" placeholder="出生地、称号、メモなど"></textarea>
        </div>

        <!-- 関連人物追加ボタン群 -->
        <div id="relations-group" class="pt-3 border-t border-slate-100 space-y-2">
          <p id="lbl-add-rel" class="text-xs font-semibold text-slate-500">家族関係を追加</p>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" id="btn-add-parent" class="px-2.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg border border-indigo-200 transition flex items-center justify-center">
              <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
              <span id="lbl-add-parent-text">親を追加</span>
            </button>
            <button type="button" id="btn-add-spouse" class="px-2.5 py-2 bg-pink-50 hover:bg-pink-100 text-pink-700 text-xs font-medium rounded-lg border border-pink-200 transition flex items-center justify-center">
              <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
              <span id="lbl-add-spouse-text">配偶者を追加</span>
            </button>
            <button type="button" id="btn-add-child" class="px-2.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-medium rounded-lg border border-emerald-200 transition flex items-center justify-center">
              <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
              <span id="lbl-add-child-text">子供を追加</span>
            </button>
          </div>
        </div>

        <div class="pt-4 flex items-center justify-between border-t border-slate-100">
          <button type="button" id="btn-delete-person" class="px-3 py-2 text-rose-600 hover:bg-rose-50 text-xs font-medium rounded-lg transition">
            <span id="lbl-delete">削除</span>
          </button>
          <div class="flex space-x-2">
            <button type="button" id="btn-modal-cancel" class="px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 text-xs font-medium rounded-lg transition">
              <span id="lbl-cancel">キャンセル</span>
            </button>
            <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-medium rounded-lg shadow transition">
              <span id="lbl-save">保存</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 既存人物との紐付け選択モーダル -->
  <div id="link-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-md w-full overflow-hidden">
      <div class="bg-slate-800 px-6 py-4 flex items-center justify-between">
        <h3 id="link-modal-title" class="text-base font-bold text-white font-serif">家族関係の登録方法</h3>
        <button id="btn-link-close" class="text-slate-400 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <!-- 新規作成ボタン -->
        <button id="btn-create-new-rel" class="w-full py-3 px-4 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold shadow transition flex items-center justify-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          <span id="lbl-create-new-rel">新規の人物を作成して追加</span>
        </button>

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-3 text-slate-400 text-xs">または</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- 既存メンバーから選択 -->
        <div>
          <label id="lbl-select-existing" class="block text-xs font-semibold text-slate-600 mb-1">登録済みの人物から選択して追加</label>
          <select id="select-existing-person" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs bg-white">
            <!-- 動的追加 -->
          </select>
          <button id="btn-confirm-link" class="w-full mt-3 py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-medium transition">
            <span id="lbl-confirm-link">選択した人物を連結する</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white no-print">
    &copy; 家系図アプリ - Safe & Secure Client-side Family Tree Builder
  </footer>

      // 状態管理
      let currentLang = 'ja';
      let familyData = {}; // ID -> Person
      let rootId = null;   // 表示基準ルートID

      // 一意ID生成
      function generateId() {
        return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
      }

      // 精密な年齢計算
      function calculateAge(birthDateStr, deathDateStr) {
        if (!birthDateStr) return null;
        const birthDate = new Date(birthDateStr);
        if (isNaN(birthDate.getTime())) return null;

        const endDate = deathDateStr ? new Date(deathDateStr) : new Date();
        if (isNaN(endDate.getTime())) return null;

        let age = endDate.getFullYear() - birthDate.getFullYear();
        const m = endDate.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && endDate.getDate() < birthDate.getDate())) {
          age--;
        }
        return age >= 0 ? age : 0;
      }

      // LocalStorage同期
      function loadStorage() {
        try {
          const stored = localStorage.getItem('family_tree_data_v2');
          if (stored) {
            const parsed = JSON.parse(stored);
            familyData = parsed.nodes || {};
            rootId = parsed.rootId || null;
          }
        } catch (e) {
          console.error(e);
          familyData = {};
          rootId = null;
        }
      }

      function saveStorage() {
        try {
          localStorage.setItem('family_tree_data_v2', JSON.stringify({ nodes: familyData, rootId: rootId }));
        } catch (e) {
          console.error(e);
        }
      }

      // 言語更新
      function updateLanguage(lang) {
        currentLang = translations[lang] ? lang : 'ja';
        const dict = translations[currentLang];

        document.getElementById('app-title').textContent = dict.appTitle;
        document.getElementById('lbl-export').textContent = dict.exportBtn;
        document.getElementById('lbl-import').textContent = dict.importBtn;
        document.getElementById('lbl-print').textContent = dict.printBtn;
        document.getElementById('lbl-view-root').textContent = dict.viewRootLabel;
        document.getElementById('empty-title').textContent = dict.emptyTitle;
        document.getElementById('empty-desc').textContent = dict.emptyDesc;
        document.getElementById('lbl-add-first').textContent = dict.addFirstBtn;
        document.getElementById('tree-title').childNodes[2].textContent = ' ' + dict.treeTitle;
        document.getElementById('lbl-clear-all').textContent = dict.clearAll;

        document.getElementById('lbl-name').textContent = dict.nameLabel;
        document.getElementById('lbl-birth').textContent = dict.birthLabel;
        document.getElementById('lbl-death').textContent = dict.deathLabel;
        document.getElementById('lbl-note').textContent = dict.noteLabel;
        document.getElementById('lbl-add-rel').textContent = dict.addRelLabel;

        document.getElementById('lbl-add-parent-text').textContent = dict.addParent;
        document.getElementById('lbl-add-spouse-text').textContent = dict.addSpouse;
        document.getElementById('lbl-add-child-text').textContent = dict.addChild;

        document.getElementById('lbl-delete').textContent = dict.delete;
        document.getElementById('lbl-cancel').textContent = dict.cancel;
        document.getElementById('lbl-save').textContent = dict.save;

        document.getElementById('link-modal-title').textContent = dict.linkTitle;
        document.getElementById('lbl-create-new-rel').textContent = dict.createNewRel;
        document.getElementById('lbl-select-existing').textContent = dict.selectExisting;
        document.getElementById('lbl-confirm-link').textContent = dict.confirmLink;

        updateRootSelectOptions();
        renderTree();
      }

      // 視点切り替えドロップダウン更新
      function updateRootSelectOptions() {
        elements.rootSelect.innerHTML = '';
        const keys = Object.keys(familyData);
        if (keys.length === 0) return;

        if (!rootId || !familyData[rootId]) {
          rootId = keys[0];
        }

        keys.forEach(id => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = familyData[id].name || '無名';
          if (id === rootId) opt.selected = true;
          elements.rootSelect.appendChild(opt);
        });
      }

      // メインの家系図描画処理 (折り返しなし・完全に配置崩れを防ぐ構造)
      function renderTree() {
        const keys = Object.keys(familyData);
        if (keys.length === 0 || !rootId || !familyData[rootId]) {
          elements.emptyState.classList.remove('hidden');
          elements.treeSection.classList.add('hidden');
          return;
        }

        elements.emptyState.classList.add('hidden');
        elements.treeSection.classList.remove('hidden');

        elements.treeRootView.innerHTML = '';
        const renderedSet = new Set(); // 重複レンダリング防止ガード

        const treeDOM = buildSubTree(rootId, renderedSet);
        if (treeDOM) {
          elements.treeRootView.appendChild(treeDOM);
        }
      }

      // 再帰的ツリー構造組み立て (最上位の親から子供へ降りる階層構築)
      function buildSubTree(personId, renderedSet) {
        if (!personId || !familyData[personId] || renderedSet.has(personId)) {
          return null;
        }

        renderedSet.add(personId);
        const person = familyData[personId];
        const dict = translations[currentLang];

        // 1つのノードユニット (折り返し禁止 flex-shrink-0)
        const unitDiv = document.createElement('div');
        unitDiv.className = 'flex flex-col items-center flex-shrink-0 relative';

        // --- 親の表示（上方向へ探索・表示） ---
        const unrenderedParents = (person.parentIds || []).filter(pid => familyData[pid] && !renderedSet.has(pid));
        if (unrenderedParents.length > 0) {
          const parentsRow = document.createElement('div');
          parentsRow.className = 'flex items-center space-x-6 flex-shrink-0 mb-3';

          unrenderedParents.forEach(pid => {
            const pTree = buildSubTree(pid, renderedSet);
            if (pTree) parentsRow.appendChild(pTree);
          });

          unitDiv.appendChild(parentsRow);

          // 親から下への接続線
          const parentConnectLine = document.createElement('div');
          parentConnectLine.className = 'w-0.5 h-4 bg-slate-400 flex-shrink-0';
          unitDiv.appendChild(parentConnectLine);
        }

        // --- 本人 ＋ 配偶者 のペアブロック ---
        const pairWrapper = document.createElement('div');
        pairWrapper.className = 'flex items-center space-x-3 flex-shrink-0 relative z-10';

        // 本人カード
        const primaryCard = createPersonCard(person, dict);
        pairWrapper.appendChild(primaryCard);

        // 配偶者カード群
        if (person.spouseIds && person.spouseIds.length > 0) {
          person.spouseIds.forEach(spouseId => {
            if (familyData[spouseId] && !renderedSet.has(spouseId)) {
              renderedSet.add(spouseId);

              // 婚姻線 (ピンクの横線)
              const conn = document.createElement('div');
              conn.className = 'w-4 h-0.5 bg-pink-400 flex-shrink-0';
              pairWrapper.appendChild(conn);

              const spouseCard = createPersonCard(familyData[spouseId], dict);
              pairWrapper.appendChild(spouseCard);
            }
          });
        }

        unitDiv.appendChild(pairWrapper);

        // --- 子供たちのブロック ---
        const validChildren = (person.childrenIds || []).filter(cid => familyData[cid] && !renderedSet.has(cid));

        if (validChildren.length > 0) {
          // 親ブロックから下へ伸びる直線
          const downLine = document.createElement('div');
          downLine.className = 'w-0.5 h-6 bg-slate-400 flex-shrink-0';
          unitDiv.appendChild(downLine);

          // 子供たちを並べる横一列コンテナ (絶対折り返さない)
          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'flex space-x-8 flex-shrink-0 relative pt-3';

          // 兄弟同士を結ぶ上部水平ガイド線
          if (validChildren.length > 1) {
            const topLine = document.createElement('div');
            topLine.className = 'absolute top-0 left-6 right-6 h-0.5 bg-slate-400';
            childrenContainer.appendChild(topLine);
          }

          validChildren.forEach(childId => {
            // 各子供への引き込み垂直線を持つラップコンテナ
            const childWrapper = document.createElement('div');
            childWrapper.className = 'flex flex-col items-center flex-shrink-0 relative';

            if (validChildren.length > 1) {
              const childInLine = document.createElement('div');
              childInLine.className = 'w-0.5 h-3 bg-slate-400 absolute -top-3';
              childWrapper.appendChild(childInLine);
            }

            const childSubTree = buildSubTree(childId, renderedSet);
            if (childSubTree) {
              childWrapper.appendChild(childSubTree);
              childrenContainer.appendChild(childWrapper);
            }
          });

          unitDiv.appendChild(childrenContainer);
        }

        return unitDiv;
      }

      // 人物カード要素の生成
      function createPersonCard(person, dict) {
        const card = document.createElement('div');
        card.className = 'tree-node bg-white border border-slate-300 hover:border-amber-500 rounded-xl p-3 shadow-sm hover:shadow-md transition w-44 flex-shrink-0 cursor-pointer group relative';

        const ageVal = calculateAge(person.birth, person.death);
        let ageText = '';
        if (ageVal !== null) {
          ageText = person.death ? dict.ageAtDeathFormat.replace('{age}', ageVal) : dict.ageFormat.replace('{age}', ageVal);
        }

        card.innerHTML = `
          <div>
            <div class="font-bold text-slate-800 text-sm font-serif truncate group-hover:text-amber-600 transition">${escapeHTML(person.name || '無名')}</div>
            <div class="text-[11px] text-slate-500 mt-1 space-y-0.5">
              <div>${person.birth || '----'}</div>
              ${person.death ? `<div class="text-slate-400">† ${person.death}</div>` : ''}
              ${ageText ? `<div class="text-amber-700 font-medium text-[10px]">${ageText}</div>` : ''}
            </div>
            ${person.note ? `<div class="text-[10px] text-slate-400 mt-1 truncate border-t border-slate-100 pt-1">${escapeHTML(person.note)}</div>` : ''}
          </div>
        `;

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(person.id);
        });

        return card;
      }

      // XSSエスケープ
      function escapeHTML(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      }

      // モーダル表示
      function openModal(titleText, personData = {}) {
        elements.fieldId.value = personData.id || '';
        elements.fieldName.value = personData.name || '';
        elements.fieldBirth.value = personData.birth || '';
        elements.fieldDeath.value = personData.death || '';
        elements.fieldNote.value = personData.note || '';

        if (personData.id) {
          elements.relationsGroup.classList.remove('hidden');
          elements.btnDeletePerson.classList.remove('hidden');
        } else {
          elements.relationsGroup.classList.add('hidden');
          elements.btnDeletePerson.classList.add('hidden');
        }

        elements.personModal.classList.remove('hidden');
      }

      function closeModal() {
        elements.personModal.classList.add('hidden');
        elements.personForm.reset();
      }

      function openEditModal(personId) {
        const person = familyData[personId];
        if (person) {
          const dict = translations[currentLang];
          openModal(dict.modalTitleEdit, person);
        }
      }

      // 関連人物の紐付けダイアログを開く
      function openLinkModal(sourceId, relType) {
        linkContext = { sourceId, relType };
        elements.selectExistingPerson.innerHTML = '';

        const keys = Object.keys(familyData).filter(id => id !== sourceId);
        keys.forEach(id => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = familyData[id].name || '無名';
          elements.selectExistingPerson.appendChild(opt);
        });

        elements.linkModal.classList.remove('hidden');
      }

      function closeLinkModal() {
        elements.linkModal.classList.add('hidden');
      }

      // ２つのノードを双方向に紐付け
      function connectNodes(sourceId, targetId, relType) {
        if (!sourceId || !targetId || !familyData[sourceId] || !familyData[targetId]) return;

        const source = familyData[sourceId];
        const target = familyData[targetId];

        source.parentIds = source.parentIds || [];
        source.spouseIds = source.spouseIds || [];
        source.childrenIds = source.childrenIds || [];

        target.parentIds = target.parentIds || [];
        target.spouseIds = target.spouseIds || [];
        target.childrenIds = target.childrenIds || [];

        if (relType === 'parent') {
          if (!source.parentIds.includes(targetId)) source.parentIds.push(targetId);
          if (!target.childrenIds.includes(sourceId)) target.childrenIds.push(sourceId);
        } else if (relType === 'spouse') {
          if (!source.spouseIds.includes(targetId)) source.spouseIds.push(targetId);
          if (!target.spouseIds.includes(sourceId)) target.spouseIds.push(sourceId);
        } else if (relType === 'child') {
          if (!source.childrenIds.includes(targetId)) source.childrenIds.push(targetId);
          if (!target.parentIds.includes(sourceId)) target.parentIds.push(sourceId);
        }

        saveStorage();
      }

      // イベントリスナー構築
      function setupEventListeners() {
        // 多言語
        elements.langSelect.addEventListener('change', e => updateLanguage(e.target.value));

        // 視点ルート切り替え
        elements.rootSelect.addEventListener('change', e => {
          rootId = e.target.value;
          saveStorage();
          renderTree();
        });

        // 最初の人物作成
        elements.btnAddRoot.addEventListener('click', () => {
          const newId = generateId();
          familyData[newId] = { id: newId, name: '', birth: '', death: '', note: '', parentIds: [], spouseIds: [], childrenIds: [] };
          rootId = newId;
          saveStorage();
          updateRootSelectOptions();
          openEditModal(newId);
        });

        elements.btnModalClose.addEventListener('click', closeModal);
        elements.btnModalCancel.addEventListener('click', closeModal);

        // 保存
        elements.personForm.addEventListener('submit', e => {
          e.preventDefault();
          const pId = elements.fieldId.value;
          if (!pId || !familyData[pId]) return;

          familyData[pId].name = elements.fieldName.value.trim();
          familyData[pId].birth = elements.fieldBirth.value;
          familyData[pId].death = elements.fieldDeath.value;
          familyData[pId].note = elements.fieldNote.value.trim();

          saveStorage();
          closeModal();
          updateRootSelectOptions();
          renderTree();
        });

        // 削除
        elements.btnDeletePerson.addEventListener('click', () => {
          const dict = translations[currentLang];
          if (!confirm(dict.confirmDeletePerson)) return;

          const pId = elements.fieldId.value;
          if (pId && familyData[pId]) {
            Object.values(familyData).forEach(p => {
              p.parentIds = (p.parentIds || []).filter(id => id !== pId);
              p.spouseIds = (p.spouseIds || []).filter(id => id !== pId);
              p.childrenIds = (p.childrenIds || []).filter(id => id !== pId);
            });

            delete familyData[pId];

            if (rootId === pId) {
              const keys = Object.keys(familyData);
              rootId = keys.length > 0 ? keys[0] : null;
            }

            saveStorage();
            closeModal();
            updateRootSelectOptions();
            renderTree();
          }
        });

        // 関係追加ボタン
        elements.btnAddParent.addEventListener('click', () => {
          const currentId = elements.fieldId.value;
          closeModal();
          openLinkModal(currentId, 'parent');
        });
        elements.btnAddSpouse.addEventListener('click', () => {
          const currentId = elements.fieldId.value;
          closeModal();
          openLinkModal(currentId, 'spouse');
        });
        elements.btnAddChild.addEventListener('click', () => {
          const currentId = elements.fieldId.value;
          closeModal();
          openLinkModal(currentId, 'child');
        });

        // リンクモーダル操作
        elements.btnLinkClose.addEventListener('click', closeLinkModal);

        // 新規作成して紐付け
        elements.btnCreateNewRel.addEventListener('click', () => {
          const newId = generateId();
          familyData[newId] = { id: newId, name: '', birth: '', death: '', note: '', parentIds: [], spouseIds: [], childrenIds: [] };
          connectNodes(linkContext.sourceId, newId, linkContext.relType);
          closeLinkModal();
          openEditModal(newId);
        });

        // 既存選択して紐付け
        elements.btnConfirmLink.addEventListener('click', () => {
          const targetId = elements.selectExistingPerson.value;
          if (targetId) {
            connectNodes(linkContext.sourceId, targetId, linkContext.relType);
            closeLinkModal();
            renderTree();
          }
        });

        // すべてのデータ削除
        elements.btnClearAll.addEventListener('click', () => {
          const dict = translations[currentLang];
          if (confirm(dict.confirmClear)) {
            familyData = {};
            rootId = null;
            saveStorage();
            updateRootSelectOptions();
            renderTree();
          }
        });

        // バックアップJSON
        elements.btnExport.addEventListener('click', () => {
          try {
            const dataStr = JSON.stringify({ nodes: familyData, rootId: rootId }, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `family_tree_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          } catch (e) {
            alert('バックアップ出力に失敗しました。');
          }
        });

        // インポート
        elements.fileImport.addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = evt => {
            try {
              const imported = JSON.parse(evt.target.result);
              if (imported && imported.nodes) {
                familyData = imported.nodes;
                rootId = imported.rootId || Object.keys(familyData)[0] || null;
                saveStorage();
                updateRootSelectOptions();
                renderTree();
              } else {
                alert('無効なファイルフォーマットです。');
              }
            } catch (err) {
              alert('ファイルの読み込みに失敗しました。');
            }
            elements.fileImport.value = '';
          };
          reader.readAsText(file);
        });

        // 印刷/PDF
        elements.btnPrint.addEventListener('click', () => window.print());

        // ドラッグ（パン）操作の実装
        let isDragging = false;
        let startX, startY, scrollLeft, scrollTop;

        const container = elements.treeCanvasContainer;
        container.addEventListener('mousedown', e => {
          if (e.target.closest('.tree-node')) return; // ノードクリック時は無視
          isDragging = true;
          startX = e.pageX - container.offsetLeft;
          startY = e.pageY - container.offsetTop;
          scrollLeft = container.scrollLeft;
          scrollTop = container.scrollTop;
        });

        container.addEventListener('mouseleave', () => isDragging = false);
        container.addEventListener('mouseup', () => isDragging = false);

        container.addEventListener('mousemove', e => {
          if (!isDragging) return;
          e.preventDefault();
          const x = e.pageX - container.offsetLeft;
          const y = e.pageY - container.offsetTop;
          const walkX = (x - startX) * 1.5;
          const walkY = (y - startY) * 1.5;
          container.scrollLeft = scrollLeft - walkX;
          container.scrollTop = scrollTop - walkY;
        });
      }

      // 初期化
      function init() {
        loadStorage();
        setupEventListeners();
        updateLanguage('ja');
      }

      init();

    })();
  </script>
</body>
</html>
