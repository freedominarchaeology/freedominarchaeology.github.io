<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家系図アプリ - Family Tree</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"MS Mincho"', '"MS 明朝"', '"Hiragino Mincho ProN"', 'serif'],
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* 印刷専用スタイル (PDF/印刷最適化) */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt;
      }
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      #main-container {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        box-shadow: none !important;
      }
      #tree-canvas-container {
        border: none !important;
        overflow: visible !important;
        background: white !important;
      }
      .tree-node {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #1e293b !important;
        background: #ffffff !important;
      }
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* ノード間の接続線の表現 */
    .tree-branch-line {
      position: absolute;
      background-color: #94a3b8;
      z-index: 0;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

  <!-- ヘッダー / 操作バー -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <h1 id="app-title" class="text-xl font-bold tracking-tight font-serif text-amber-100">家系図アプリ</h1>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-4">
        <!-- 多言語対応選択 -->
        <div class="relative">
          <select id="lang-select" class="bg-slate-800 text-slate-200 text-xs sm:text-sm rounded-lg px-2 sm:px-3 py-1.5 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
          </select>
        </div>

        <!-- バックアップ出力 -->
        <button id="btn-export" class="inline-flex items-center px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-medium rounded-lg border border-slate-700 transition">
          <svg class="w-4 h-4 mr-1.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span id="lbl-export">バックアップ</span>
        </button>

        <!-- インポート -->
        <label class="inline-flex items-center px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-medium rounded-lg border border-slate-700 transition cursor-pointer">
          <svg class="w-4 h-4 mr-1.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          <span id="lbl-import">復元</span>
          <input type="file" id="file-import" accept=".json" class="hidden">
        </label>

        <!-- PDF/印刷 -->
        <button id="btn-print" class="inline-flex items-center px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm font-medium rounded-lg shadow transition">
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          <span id="lbl-print">印刷 / PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="main-container" class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col space-y-6">
    
    <!-- 空データ時の説明 兼 登録ボタン -->
    <div id="empty-state" class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 text-center my-auto transition-all no-print">
      <div class="max-w-md mx-auto space-y-4">
        <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        </div>
        <h2 id="empty-title" class="text-xl font-bold text-slate-800 font-serif">家系図データが登録されていません</h2>
        <p id="empty-desc" class="text-slate-500 text-sm">最初の人物（あなた、またはご先祖様など）を登録して家系図の作成を開始しましょう。</p>
        <button id="btn-add-root" class="inline-flex items-center px-5 py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-medium rounded-lg shadow-md transition transform active:scale-95">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          <span id="lbl-add-first">最初の人物を登録する</span>
        </button>
      </div>
    </div>

    <!-- 家系図キャンバス領域 -->
    <div id="tree-section" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-grow flex flex-col hidden overflow-hidden relative">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100 no-print">
        <h2 id="tree-title" class="text-lg font-bold text-slate-800 font-serif flex items-center">
          <svg class="w-5 h-5 mr-2 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          家系図プレビュー
        </h2>
        <button id="btn-clear-all" class="text-xs text-rose-500 hover:text-rose-700 hover:underline transition">
          <span id="lbl-clear-all">すべてのデータを削除</span>
        </button>
      </div>

      <!-- インタラクティブツリー容器 -->
      <div id="tree-canvas-container" class="flex-grow overflow-auto p-8 relative min-h-[500px] flex justify-center items-start">
        <div id="tree-root-view" class="flex flex-col items-center space-y-12 relative min-w-max">
          <!-- JSで動的にツリー構造をレンダリング -->
        </div>
      </div>
    </div>
  </main>

  <!-- 編集・新規登録モーダル -->
  <div id="person-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
    <div class="bg-white rounded-xl shadow-2xl border border-slate-100 max-w-lg w-full overflow-hidden transform transition-all">
      <div class="bg-slate-800 px-6 py-4 flex items-center justify-between">
        <h3 id="modal-title" class="text-lg font-bold text-white font-serif">人物情報の編集</h3>
        <button id="btn-modal-close" class="text-slate-400 hover:text-white transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form id="person-form" class="p-6 space-y-4">
        <input type="hidden" id="field-id">

        <div>
          <label id="lbl-name" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">氏名 *</label>
          <input type="text" id="field-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition" placeholder="例: 山田 太郎">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label id="lbl-birth" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">生年月日</label>
            <input type="date" id="field-birth" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
          </div>

          <div>
            <label id="lbl-death" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">没年月日（任意）</label>
            <input type="date" id="field-death" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
          </div>
        </div>

        <div>
          <label id="lbl-note" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">メモ・備考</label>
          <textarea id="field-note" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition text-sm" placeholder="出生地、称号、メモなど"></textarea>
        </div>

        <!-- 関連人物追加ボタンエリア (文字表記の明瞭化) -->
        <div id="relations-group" class="pt-2 border-t border-slate-100 space-y-2">
          <p id="lbl-add-rel" class="text-xs font-semibold text-slate-500 mb-2">家族関係を追加</p>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" id="btn-add-parent" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg border border-indigo-200 transition flex items-center justify-center">
              <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
              <span id="lbl-add-parent-text">親を追加</span>
            </button>
            <button type="button" id="btn-add-spouse" class="px-3 py-2 bg-pink-50 hover:bg-pink-100 text-pink-700 text-xs font-medium rounded-lg border border-pink-200 transition flex items-center justify-center">
              <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
              <span id="lbl-add-spouse-text">配偶者を追加</span>
            </button>
            <button type="button" id="btn-add-child" class="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-medium rounded-lg border border-emerald-200 transition flex items-center justify-center">
              <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
              <span id="lbl-add-child-text">子供を追加</span>
            </button>
          </div>
        </div>

        <div class="pt-4 flex items-center justify-between border-t border-slate-100">
          <button type="button" id="btn-delete-person" class="px-3 py-2 text-rose-600 hover:bg-rose-50 text-xs font-medium rounded-lg transition">
            <span id="lbl-delete">削除</span>
          </button>
          <div class="flex space-x-2">
            <button type="button" id="btn-modal-cancel" class="px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm font-medium rounded-lg transition">
              <span id="lbl-cancel">キャンセル</span>
            </button>
            <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-sm font-medium rounded-lg shadow transition">
              <span id="lbl-save">保存</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white no-print">
    &copy; 家系図アプリ - Safe & Secure Client-side Family Tree Builder
  </footer>

        treeSection: document.getElementById('tree-section'),
        treeRootView: document.getElementById('tree-root-view'),
        btnClearAll: document.getElementById('btn-clear-all'),
        personModal: document.getElementById('person-modal'),
        btnModalClose: document.getElementById('btn-modal-close'),
        btnModalCancel: document.getElementById('btn-modal-cancel'),
        personForm: document.getElementById('person-form'),
        fieldId: document.getElementById('field-id'),
        fieldName: document.getElementById('field-name'),
        fieldBirth: document.getElementById('field-birth'),
        fieldDeath: document.getElementById('field-death'),
        fieldNote: document.getElementById('field-note'),
        relationsGroup: document.getElementById('relations-group'),
        btnAddParent: document.getElementById('btn-add-parent'),
        btnAddSpouse: document.getElementById('btn-add-spouse'),
        btnAddChild: document.getElementById('btn-add-child'),
        btnDeletePerson: document.getElementById('btn-delete-person')
      };

      // ID生成（堅牢な一意ID）
      function generateId() {
        return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
      }

      // 年齢計算関数
      function calculateAge(birthDateStr, deathDateStr) {
        if (!birthDateStr) return null;
        const birthDate = new Date(birthDateStr);
        if (isNaN(birthDate.getTime())) return null;

        const endDate = deathDateStr ? new Date(deathDateStr) : new Date();
        if (isNaN(endDate.getTime())) return null;

        let age = endDate.getFullYear() - birthDate.getFullYear();
        const m = endDate.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && endDate.getDate() < birthDate.getDate())) {
          age--;
        }
        return age >= 0 ? age : 0;
      }

      // ストレージ読み込み＆書き込み
      function loadStorage() {
        try {
          const stored = localStorage.getItem('family_tree_data');
          if (stored) {
            const parsed = JSON.parse(stored);
            familyData = parsed.nodes || {};
            rootId = parsed.rootId || null;
          }
        } catch (e) {
          console.error('Failed to load local storage:', e);
          familyData = {};
          rootId = null;
        }
      }

      function saveStorage() {
        try {
          const dataToSave = { nodes: familyData, rootId: rootId };
          localStorage.setItem('family_tree_data', JSON.stringify(dataToSave));
        } catch (e) {
          console.error('Failed to save to local storage:', e);
        }
      }

      // 多言語切替表示の適用
      function updateLanguage(lang) {
        currentLang = translations[lang] ? lang : 'ja';
        const dict = translations[currentLang];

        document.getElementById('app-title').textContent = dict.appTitle;
        document.getElementById('lbl-export').textContent = dict.exportBtn;
        document.getElementById('lbl-import').textContent = dict.importBtn;
        document.getElementById('lbl-print').textContent = dict.printBtn;
        document.getElementById('empty-title').textContent = dict.emptyTitle;
        document.getElementById('empty-desc').textContent = dict.emptyDesc;
        document.getElementById('lbl-add-first').textContent = dict.addFirstBtn;
        document.getElementById('tree-title').childNodes[2].textContent = ' ' + dict.treeTitle;
        document.getElementById('lbl-clear-all').textContent = dict.clearAll;

        document.getElementById('lbl-name').textContent = dict.nameLabel;
        document.getElementById('lbl-birth').textContent = dict.birthLabel;
        document.getElementById('lbl-death').textContent = dict.deathLabel;
        document.getElementById('lbl-note').textContent = dict.noteLabel;
        document.getElementById('lbl-add-rel').textContent = dict.addRelLabel;

        document.getElementById('lbl-add-parent-text').textContent = dict.addParent;
        document.getElementById('lbl-add-spouse-text').textContent = dict.addSpouse;
        document.getElementById('lbl-add-child-text').textContent = dict.addChild;

        document.getElementById('lbl-delete').textContent = dict.delete;
        document.getElementById('lbl-cancel').textContent = dict.cancel;
        document.getElementById('lbl-save').textContent = dict.save;

        renderTree();
      }

      // ツリー再描画メイン処理 (重複レンダリングの完全防止)
      function renderTree() {
        const keys = Object.keys(familyData);
        if (keys.length === 0 || !rootId || !familyData[rootId]) {
          elements.emptyState.classList.remove('hidden');
          elements.treeSection.classList.add('hidden');
          return;
        }

        elements.emptyState.classList.add('hidden');
        elements.treeSection.classList.remove('hidden');

        elements.treeRootView.innerHTML = '';
        const renderedSet = new Set(); // 描画済みIDの追跡

        // 基準ルートから探索して描画
        const treeElement = buildNodeElement(rootId, renderedSet);
        if (treeElement) {
          elements.treeRootView.appendChild(treeElement);
        }
      }

      // ノードの再帰構築
      function buildNodeElement(personId, renderedSet) {
        if (!personId || !familyData[personId] || renderedSet.has(personId)) {
          return null;
        }

        renderedSet.add(personId);
        const person = familyData[personId];
        const dict = translations[currentLang];

        // 階層コンテナ
        const container = document.createElement('div');
        container.className = 'flex flex-col items-center relative';

        // 1. 本人 ＆ 配偶者カード領域
        const pairWrapper = document.createElement('div');
        pairWrapper.className = 'flex items-center space-x-4 relative z-10';

        // 本人カード
        const primaryCard = createPersonCardHTML(person, dict);
        pairWrapper.appendChild(primaryCard);

        // 配偶者カード
        if (person.spouseIds && person.spouseIds.length > 0) {
          person.spouseIds.forEach(spouseId => {
            if (familyData[spouseId] && !renderedSet.has(spouseId)) {
              renderedSet.add(spouseId);
              const spouseCard = createPersonCardHTML(familyData[spouseId], dict);
              
              // 配偶者との接続線 (横線)
              const connLine = document.createElement('div');
              connLine.className = 'w-4 h-0.5 bg-pink-400';
              
              pairWrapper.appendChild(connLine);
              pairWrapper.appendChild(spouseCard);
            }
          });
        }

        container.appendChild(pairWrapper);

        // 2. 子供領域
        const validChildren = (person.childrenIds || []).filter(cid => familyData[cid] && !renderedSet.has(cid));
        
        if (validChildren.length > 0) {
          // 下方向への接続垂直線
          const verticalDown = document.createElement('div');
          verticalDown.className = 'w-0.5 h-6 bg-slate-300';
          container.appendChild(verticalDown);

          // 子グループコンテナ
          const childrenGroup = document.createElement('div');
          childrenGroup.className = 'flex space-x-8 relative pt-4';

          // 子同士をつなぐ上部水平線
          if (validChildren.length > 1) {
            const topLine = document.createElement('div');
            topLine.className = 'absolute top-0 left-1/4 right-1/4 h-0.5 bg-slate-300';
            childrenGroup.appendChild(topLine);
          }

          validChildren.forEach(childId => {
            const childNode = buildNodeElement(childId, renderedSet);
            if (childNode) {
              childrenGroup.appendChild(childNode);
            }
          });

          container.appendChild(childrenGroup);
        }

        return container;
      }

      // 単体人物カードHTML要素生成
      function createPersonCardHTML(person, dict) {
        const card = document.createElement('div');
        card.className = 'tree-node bg-white border border-slate-300 rounded-xl p-3 shadow-sm hover:shadow-md transition w-44 flex flex-col justify-between cursor-pointer group relative';
        
        const ageVal = calculateAge(person.birth, person.death);
        let ageText = '';
        if (ageVal !== null) {
          if (person.death) {
            ageText = dict.ageAtDeathFormat.replace('{age}', ageVal);
          } else {
            ageText = dict.ageFormat.replace('{age}', ageVal);
          }
        }

        card.innerHTML = `
          <div>
            <div class="font-bold text-slate-800 text-sm font-serif truncate group-hover:text-amber-600 transition">${escapeHTML(person.name || '無名')}</div>
            <div class="text-[11px] text-slate-500 mt-1 space-y-0.5">
              <div>${person.birth || '----'}</div>
              ${person.death ? `<div class="text-slate-400">† ${person.death}</div>` : ''}
              ${ageText ? `<div class="text-amber-700 font-medium text-[10px]">${ageText}</div>` : ''}
            </div>
            ${person.note ? `<div class="text-[10px] text-slate-400 mt-1 truncate border-t border-slate-100 pt-1">${escapeHTML(person.note)}</div>` : ''}
          </div>
        `;

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(person.id);
        });

        return card;
      }

      // HTMLエスケープ（XSS防止）
      function escapeHTML(str) {
        return String(str).replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      // モーダル操作
      function openModal(titleText, personData = {}) {
        const dict = translations[currentLang];
        document.getElementById('modal-title').textContent = titleText;
        elements.fieldId.value = personData.id || '';
        elements.fieldName.value = personData.name || '';
        elements.fieldBirth.value = personData.birth || '';
        elements.fieldDeath.value = personData.death || '';
        elements.fieldNote.value = personData.note || '';

        if (personData.id) {
          elements.relationsGroup.classList.remove('hidden');
          elements.btnDeletePerson.classList.remove('hidden');
        } else {
          elements.relationsGroup.classList.add('hidden');
          elements.btnDeletePerson.classList.add('hidden');
        }

        elements.personModal.classList.remove('hidden');
      }

      function closeModal() {
        elements.personModal.classList.add('hidden');
        elements.personForm.reset();
      }

      function openEditModal(personId) {
        const person = familyData[personId];
        if (person) {
          const dict = translations[currentLang];
          openModal(dict.modalTitleEdit, person);
        }
      }

      // 関連人物追加のアクション
      function handleAddRelation(type) {
        const currentId = elements.fieldId.value;
        if (!currentId || !familyData[currentId]) return;

        const newId = generateId();
        const newPerson = { id: newId, name: '', birth: '', death: '', note: '', parentIds: [], spouseIds: [], childrenIds: [] };
        
        if (type === 'parent') {
          newPerson.childrenIds.push(currentId);
          familyData[currentId].parentIds = familyData[currentId].parentIds || [];
          familyData[currentId].parentIds.push(newId);
          // もし根ノードに親を追加した場合、その親を新しい根（仮）に昇格させる
          if (rootId === currentId) {
            rootId = newId;
          }
        } else if (type === 'spouse') {
          newPerson.spouseIds.push(currentId);
          familyData[currentId].spouseIds = familyData[currentId].spouseIds || [];
          familyData[currentId].spouseIds.push(newId);
        } else if (type === 'child') {
          newPerson.parentIds.push(currentId);
          familyData[currentId].childrenIds = familyData[currentId].childrenIds || [];
          familyData[currentId].childrenIds.push(newId);
        }

        familyData[newId] = newPerson;
        saveStorage();
        closeModal();
        openEditModal(newId);
      }

      // イベントリスナー設定
      function setupEventListeners() {
        // 多言語切り替え
        elements.langSelect.addEventListener('change', (e) => {
          updateLanguage(e.target.value);
        });

        // 最初の人物登録
        elements.btnAddRoot.addEventListener('click', () => {
          const newId = generateId();
          familyData[newId] = { id: newId, name: '', birth: '', death: '', note: '', parentIds: [], spouseIds: [], childrenIds: [] };
          rootId = newId;
          saveStorage();
          openEditModal(newId);
        });

        // モーダル閉じる
        elements.btnModalClose.addEventListener('click', closeModal);
        elements.btnModalCancel.addEventListener('click', closeModal);

        // フォーム保存
        elements.personForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const pId = elements.fieldId.value;
          if (!pId || !familyData[pId]) return;

          familyData[pId].name = elements.fieldName.value.trim();
          familyData[pId].birth = elements.fieldBirth.value;
          familyData[pId].death = elements.fieldDeath.value;
          familyData[pId].note = elements.fieldNote.value.trim();

          saveStorage();
          closeModal();
          renderTree();
        });

        // 削除
        elements.btnDeletePerson.addEventListener('click', () => {
          const dict = translations[currentLang];
          if (!confirm(dict.confirmDeletePerson)) return;

          const pId = elements.fieldId.value;
          if (pId && familyData[pId]) {
            // 他のノードからの参照削除
            Object.values(familyData).forEach(p => {
              p.parentIds = (p.parentIds || []).filter(id => id !== pId);
              p.spouseIds = (p.spouseIds || []).filter(id => id !== pId);
              p.childrenIds = (p.childrenIds || []).filter(id => id !== pId);
            });

            delete familyData[pId];

            if (rootId === pId) {
              const remainingKeys = Object.keys(familyData);
              rootId = remainingKeys.length > 0 ? remainingKeys[0] : null;
            }

            saveStorage();
            closeModal();
            renderTree();
          }
        });

        // 家族関係追加ボタン
        elements.btnAddParent.addEventListener('click', () => handleAddRelation('parent'));
        elements.btnAddSpouse.addEventListener('click', () => handleAddRelation('spouse'));
        elements.btnAddChild.addEventListener('click', () => handleAddRelation('child'));

        // すべて削除
        elements.btnClearAll.addEventListener('click', () => {
          const dict = translations[currentLang];
          if (confirm(dict.confirmClear)) {
            familyData = {};
            rootId = null;
            saveStorage();
            renderTree();
          }
        });

        // バックアップ (JSONダウンロード)
        elements.btnExport.addEventListener('click', () => {
          try {
            const dataStr = JSON.stringify({ nodes: familyData, rootId: rootId }, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `family_tree_backup_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          } catch (e) {
            alert('バックアップの出力に失敗しました。');
          }
        });

        // インポート
        elements.fileImport.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const imported = JSON.parse(evt.target.result);
              if (imported && imported.nodes) {
                familyData = imported.nodes;
                rootId = imported.rootId || Object.keys(familyData)[0] || null;
                saveStorage();
                renderTree();
              } else {
                alert('無効なファイル形式です。');
              }
            } catch (err) {
              alert('ファイルの読み込みに失敗しました。');
            }
            elements.fileImport.value = '';
          };
          reader.readAsText(file);
        });

        // 印刷 / PDF
        elements.btnPrint.addEventListener('click', () => {
          window.print();
        });
      }

      // 初期化処理
      function init() {
        loadStorage();
        setupEventListeners();
        updateLanguage('ja');
      }

      // 実行開始
      init();

    })();
  </script>
</body>
</html>
