<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伝統的家系図エディタ - Family Tree</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"MS Mincho"', '"MS 明朝"', '"Hiragino Mincho ProN"', 'serif'],
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* 印刷/PDF出力設定 */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 10pt;
      }
      .no-print {
        display: none !important;
      }
      #main-container {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
      #tree-canvas-container {
        border: none !important;
        overflow: visible !important;
        background: white !important;
      }
      .tree-node-card {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #1e293b !important;
        background: #ffffff !important;
      }
      @page {
        size: A3 landscape;
        margin: 10mm;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-amber-200">

  <!-- ヘッダー / 操作バー -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <svg class="w-7 h-7 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <h1 id="app-title" class="text-lg font-bold font-serif text-amber-100">伝統的家系図エディタ</h1>
      </div>

      <div class="flex items-center space-x-2">
        <select id="lang-select" class="bg-slate-800 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 border border-slate-700 focus:outline-none">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
        <button id="btn-export" class="inline-flex items-center px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition">
          <span id="lbl-export">バックアップ</span>
        </button>
        <label class="inline-flex items-center px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition cursor-pointer">
          <span id="lbl-import">復元</span>
          <input type="file" id="file-import" accept=".json" class="hidden">
        </label>
        <button id="btn-print" class="inline-flex items-center px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-medium rounded-lg shadow transition">
          <span id="lbl-print">印刷 / PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="main-container" class="flex-grow max-w-full w-full p-4 sm:p-6 flex flex-col space-y-4">

    <!-- 枠組み構成コントローラー -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 no-print">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div>
          <h2 class="text-sm font-bold text-slate-800 font-serif flex items-center">
            <svg class="w-4 h-4 mr-2 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            世代枠の追加・家系図の構築
          </h2>
          <p class="text-xs text-slate-500 mt-1">ボタンで各世代の枠を作成し、カードをクリックして氏名・生没年・続柄や線の種類（実線・二重線・点線）を設定してください。</p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button id="btn-add-p-grandparent" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg border border-slate-300 transition">
            + 父方祖父母枠
          </button>
          <button id="btn-add-m-grandparent" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg border border-slate-300 transition">
            + 母方祖父母枠
          </button>
          <button id="btn-add-parents" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg border border-indigo-200 transition">
            + 両親枠
          </button>
          <button id="btn-add-sibling" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-medium rounded-lg border border-amber-200 transition">
            + 兄弟姉妹枠 (同世代)
          </button>
          <button id="btn-add-spouse" class="px-3 py-1.5 bg-pink-50 hover:bg-pink-100 text-pink-700 text-xs font-medium rounded-lg border border-pink-200 transition">
            + 配偶者枠
          </button>
          <button id="btn-add-child" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-medium rounded-lg border border-emerald-200 transition">
            + 子供枠 (下世代)
          </button>
          <button id="btn-clear-all" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-medium rounded-lg border border-rose-200 transition ml-auto">
            リセット
          </button>
        </div>
      </div>
    </div>

    <!-- 家系図表示キャンバス（世代絶対構造） -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex-grow flex flex-col overflow-hidden relative min-h-[600px]">
      <div id="tree-canvas-container" class="flex-grow overflow-auto p-8 relative flex justify-center items-start cursor-grab active:cursor-grabbing">
        
        <div id="tree-grid" class="flex flex-col space-y-16 items-center min-w-max relative z-10 pb-20">
          
          <!-- 1. 祖父母世代 (Gen -2) -->
          <div class="flex flex-col items-center w-full relative">
            <div class="text-[11px] font-serif font-bold text-slate-400 absolute left-0 uppercase tracking-widest no-print">祖父母世代 (上)</div>
            <div class="flex items-center space-x-12">
              <div id="container-p-grandparents" class="flex space-x-4"></div>
              <div id="container-m-grandparents" class="flex space-x-4"></div>
            </div>
            <div class="w-0.5 h-8 bg-slate-300 mt-3"></div>
          </div>

          <!-- 2. 両親世代 (Gen -1) -->
          <div class="flex flex-col items-center w-full relative">
            <div class="text-[11px] font-serif font-bold text-slate-400 absolute left-0 uppercase tracking-widest no-print">両親世代</div>
            <div id="container-parents" class="flex items-center space-x-6"></div>
            <div class="w-0.5 h-8 bg-slate-300 mt-3"></div>
          </div>

          <!-- 3. 本人・兄弟姉妹・配偶者世代 (Gen 0) -->
          <div class="flex flex-col items-center w-full relative">
            <div class="text-[11px] font-serif font-bold text-slate-400 absolute left-0 uppercase tracking-widest no-print">本人・兄弟・配偶者</div>
            <div id="container-self-siblings" class="flex items-center space-x-6"></div>
            <div class="w-0.5 h-8 bg-slate-300 mt-3"></div>
          </div>

          <!-- 4. 子供・孫世代 (Gen +1) -->
          <div class="flex flex-col items-center w-full relative">
            <div class="text-[11px] font-serif font-bold text-slate-400 absolute left-0 uppercase tracking-widest no-print">子供世代 (下)</div>
            <div id="container-children" class="flex items-center space-x-6"></div>
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- 人物情報・線の種類編集ダイアログ -->
  <div id="person-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-lg w-full overflow-hidden">
      <div class="bg-slate-800 px-6 py-4 flex items-center justify-between">
        <h3 id="modal-title" class="text-base font-bold text-white font-serif">人物および線の詳細設定</h3>
        <button id="btn-modal-close" class="text-slate-400 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form id="person-form" class="p-6 space-y-4">
        <input type="hidden" id="field-id">

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">氏名 *</label>
          <input type="text" id="field-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm" placeholder="例: 山田 太郎">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">生年月日 (西暦年)</label>
            <input type="number" id="field-birth-y" placeholder="1980" min="1000" max="9999" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">没年月日 (任意)</label>
            <input type="number" id="field-death-y" placeholder="2020" min="1000" max="9999" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">線の種類・関係性の区別</label>
          <select id="field-line-type" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-amber-500">
            <option value="solid">実線（通常の婚姻・親子・実子）</option>
            <option value="double">二重線（再婚 / 前妻・後妻の区別など）</option>
            <option value="dashed">点線（養子縁組・その他）</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">メモ・備考</label>
          <textarea id="field-note" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-amber-500" placeholder="続柄、長男、養子などのメモ"></textarea>
        </div>

        <div class="pt-4 flex items-center justify-between border-t border-slate-100">
          <button type="button" id="btn-delete-person" class="px-3 py-2 text-rose-600 hover:bg-rose-50 text-xs font-medium rounded-lg transition">
            この枠を削除
          </button>
          <div class="flex space-x-2">
            <button type="button" id="btn-modal-cancel" class="px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 text-xs font-medium rounded-lg transition">
              キャンセル
            </button>
            <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-medium rounded-lg shadow transition">
              保存
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white no-print">
    &copy; 伝統的家系図エディタ - Grid-based Traditional Family Tree Builder
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';

      let currentLang = 'ja';
      let treeData = {
        pGrandfather: null, pGrandmother: null,
        mGrandfather: null, mGrandmother: null,
        father: null, mother: null,
        self: { id: 'self', role: '本人', name: '', birthY: '', deathY: '', lineType: 'solid', note: '' },
        spouses: [],
        siblings: [],
        children: []
      };

      const elements = {
        langSelect: document.getElementById('lang-select'),
        btnExport: document.getElementById('btn-export'),
        fileImport: document.getElementById('file-import'),
        btnPrint: document.getElementById('btn-print'),
        containerPGrandparents: document.getElementById('container-p-grandparents'),
        containerMGrandparents: document.getElementById('container-m-grandparents'),
        containerParents: document.getElementById('container-parents'),
        containerSelfSiblings: document.getElementById('container-self-siblings'),
        containerChildren: document.getElementById('container-children'),
        personModal: document.getElementById('person-modal'),
        btnModalClose: document.getElementById('btn-modal-close'),
        btnModalCancel: document.getElementById('btn-modal-cancel'),
        personForm: document.getElementById('person-form'),
        fieldId: document.getElementById('field-id'),
        fieldName: document.getElementById('field-name'),
        fieldBirthY: document.getElementById('field-birth-y'),
        fieldDeathY: document.getElementById('field-death-y'),
        fieldLineType: document.getElementById('field-line-type'),
        fieldNote: document.getElementById('field-note'),
        btnDeletePerson: document.getElementById('btn-delete-person')
      };

      function generateId() {
        return 'node_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
      }

      function loadStorage() {
        try {
          const stored = localStorage.getItem('traditional_family_tree_v1');
          if (stored) {
            treeData = JSON.parse(stored);
          }
        } catch (e) {
          console.error(e);
        }
      }

      function saveStorage() {
        try {
          localStorage.setItem('traditional_family_tree_v1', JSON.stringify(treeData));
        } catch (e) {
          console.error(e);
        }
      }

      // カード作成（線のスタイル反映：実線、二重線、点線）
      function createCardElement(data, roleLabel, isPrimary = false) {
        const card = document.createElement('div');
        const hasData = data && data.name;

        // 線の種類に応じたボーダースタイル（実線・二重線・点線）
        let borderStyle = 'border-slate-700';
        let lineIndicator = '';
        if (data && data.lineType === 'double') {
          borderStyle = 'border-amber-600 border-4';
          lineIndicator = '<span class="text-[9px] bg-amber-100 text-amber-800 px-1 rounded">二重線</span>';
        } else if (data && data.lineType === 'dashed') {
          borderStyle = 'border-slate-500 border-dashed';
          lineIndicator = '<span class="text-[9px] bg-slate-100 text-slate-700 px-1 rounded">点線(養子)</span>';
        }

        card.className = `tree-node-card border-2 ${hasData ? `${borderStyle} bg-white shadow-sm` : 'bg-slate-50 border-dashed border-slate-300 hover:border-amber-400'} rounded-xl p-3 w-40 sm:w-44 flex flex-col justify-between cursor-pointer transition flex-shrink-0 relative`;

        card.innerHTML = `
          <div>
            <div class="text-[10px] font-bold ${isPrimary ? 'text-amber-700' : 'text-slate-400'} uppercase mb-1 flex items-center justify-between">
              <span>${roleLabel}</span>
              ${lineIndicator}
            </div>
            ${hasData ? `
              <div class="font-bold text-slate-800 text-sm font-serif truncate">${escapeHTML(data.name)}</div>
              <div class="text-[10px] text-slate-500 mt-1 space-y-0.5">
                <div>生年: ${data.birthY ? data.birthY + '年' : '----'}</div>
                ${data.deathY ? `<div>没年: ${data.deathY}年</div>` : ''}
              </div>
              ${data.note ? `<div class="text-[9px] text-slate-400 mt-1 truncate border-t border-slate-100 pt-1">${escapeHTML(data.note)}</div>` : ''}
            ` : `
              <div class="text-xs text-slate-400 text-center py-3 flex flex-col items-center">
                <svg class="w-4 h-4 mb-1 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                <span>クリックして入力</span>
              </div>
            `}
          </div>
        `;

        card.addEventListener('click', () => openModal(data, roleLabel));
        return card;
      }

      function escapeHTML(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      }

      function renderGrid() {
        // 祖父母
        elements.containerPGrandparents.innerHTML = '';
        if (treeData.pGrandfather || treeData.pGrandmother) {
          if (treeData.pGrandfather) elements.containerPGrandparents.appendChild(createCardElement(treeData.pGrandfather, '父方 祖父'));
          if (treeData.pGrandmother) elements.containerPGrandparents.appendChild(createCardElement(treeData.pGrandmother, '父方 祖母'));
        }

        elements.containerMGrandparents.innerHTML = '';
        if (treeData.mGrandfather || treeData.mGrandmother) {
          if (treeData.mGrandfather) elements.containerMGrandparents.appendChild(createCardElement(treeData.mGrandfather, '母方 祖父'));
          if (treeData.mGrandmother) elements.containerMGrandparents.appendChild(createCardElement(treeData.mGrandmother, '母方 祖母'));
        }

        // 両親
        elements.containerParents.innerHTML = '';
        if (treeData.father) elements.containerParents.appendChild(createCardElement(treeData.father, '父親'));
        if (treeData.mother) elements.containerParents.appendChild(createCardElement(treeData.mother, '母親'));

        // 本人・兄弟姉妹（年齢順にソートして左から右へ配置）
        elements.containerSelfSiblings.innerHTML = '';
        
        // 兄弟姉妹を出生年順（古い順＝左、若い順＝右）に整列
        const sortedSiblings = [...(treeData.siblings || [])].sort((a, b) => (parseInt(a.birthY) || 0) - (parseInt(b.birthY) || 0));
        sortedSiblings.forEach((sib, idx) => {
          elements.containerSelfSiblings.appendChild(createCardElement(sib, `兄弟/姉妹 (${idx + 1})`));
        });

        // 本人
        elements.containerSelfSiblings.appendChild(createCardElement(treeData.self, '本人 (あなた)', true));

        // 配偶者
        (treeData.spouses || []).forEach((sp, idx) => {
          elements.containerSelfSiblings.appendChild(createCardElement(sp, `配偶者 (${idx + 1})`));
        });

        // 子供（年齢順に左から右へ配置）
        elements.containerChildren.innerHTML = '';
        const sortedChildren = [...(treeData.children || [])].sort((a, b) => (parseInt(a.birthY) || 0) - (parseInt(b.birthY) || 0));
        sortedChildren.forEach((child, idx) => {
          elements.containerChildren.appendChild(createCardElement(child, `子供 (${idx + 1})`));
        });
      }

      function openModal(data, roleLabel) {
        elements.fieldId.value = data.id || '';
        elements.fieldName.value = data.name || '';
        elements.fieldBirthY.value = data.birthY || '';
        elements.fieldDeathY.value = data.deathY || '';
        elements.fieldLineType.value = data.lineType || 'solid';
        elements.fieldNote.value = data.note || '';

        if (data.id === 'self') {
          elements.btnDeletePerson.classList.add('hidden');
        } else {
          elements.btnDeletePerson.classList.remove('hidden');
        }

        elements.personModal.classList.remove('hidden');
      }

      function closeModal() {
        elements.personModal.classList.add('hidden');
        elements.personForm.reset();
      }

      // イベント設定
      document.getElementById('btn-add-p-grandparent').addEventListener('click', () => {
        if (!treeData.pGrandfather) treeData.pGrandfather = { id: 'pgf', name: '', birthY: '', deathY: '', lineType: 'solid', note: '' };
        if (!treeData.pGrandmother) treeData.pGrandmother = { id: 'pgm', name: '', birthY: '', deathY: '', lineType: 'solid', note: '' };
        saveStorage(); renderGrid();
      });

      document.getElementById('btn-add-m-grandparent').addEventListener('click', () => {
        if (!treeData.mGrandfather) treeData.mGrandfather = { id: 'mgf', name: '', birthY: '', deathY: '', lineType: 'solid', note: '' };
        if (!treeData.mGrandmother) treeData.mGrandmother = { id: 'mgm', name: '', birthY: '', deathY: '', lineType: 'solid', note: '' };
        saveStorage(); renderGrid();
      });

      document.getElementById('btn-add-parents').addEventListener('click', () => {
        if (!treeData.father) treeData.father = { id: 'fat', name: '', birthY: '', deathY: '', lineType: 'solid', note: '' };
        if (!treeData.mother) treeData.mother = { id: 'mot', name: '', birthY: '', deathY: '', lineType: 'solid', note: '' };
        saveStorage(); renderGrid();
      });

      document.getElementById('btn-add-sibling').addEventListener('click', () => {
        treeData.siblings.push({ id: generateId(), name: '', birthY: '', deathY: '', lineType: 'solid', note: '' });
        saveStorage(); renderGrid();
      });

      document.getElementById('btn-add-spouse').addEventListener('click', () => {
        treeData.spouses.push({ id: generateId(), name: '', birthY: '', deathY: '', lineType: 'solid', note: '' });
        saveStorage(); renderGrid();
      });

      document.getElementById('btn-add-child').addEventListener('click', () => {
        treeData.children.push({ id: generateId(), name: '', birthY: '', deathY: '', lineType: 'solid', note: '' });
        saveStorage(); renderGrid();
      });

      document.getElementById('btn-clear-all').addEventListener('click', () => {
        if (confirm('すべての枠組みとデータをリセットしますか？')) {
          treeData = {
            pGrandfather: null, pGrandmother: null,
            mGrandfather: null, mGrandmother: null,
            father: null, mother: null,
            self: { id: 'self', role: '本人', name: '', birthY: '', deathY: '', lineType: 'solid', note: '' },
            spouses: [], siblings: [], children: []
          };
          saveStorage(); renderGrid();
        }
      });

      elements.btnModalClose.addEventListener('click', closeModal);
      elements.btnModalCancel.addEventListener('click', closeModal);

      elements.personForm.addEventListener('submit', e => {
        e.preventDefault();
        const id = elements.fieldId.value;
        const updated = {
          id: id,
          name: elements.fieldName.value.trim(),
          birthY: elements.fieldBirthY.value.trim(),
          deathY: elements.fieldDeathY.value.trim(),
          lineType: elements.fieldLineType.value,
          note: elements.fieldNote.value.trim()
        };

        if (id === 'self') treeData.self = updated;
        else if (id === 'fat') treeData.father = updated;
        else if (id === 'mot') treeData.mother = updated;
        else if (id === 'pgf') treeData.pGrandfather = updated;
        else if (id === 'pgm') treeData.pGrandmother = updated;
        else if (id === 'mgf') treeData.mGrandfather = updated;
        else if (id === 'mgm') treeData.mGrandmother = updated;
        else {
          let found = treeData.siblings.find(s => s.id === id);
          if (found) Object.assign(found, updated);
          found = treeData.spouses.find(s => s.id === id);
          if (found) Object.assign(found, updated);
          found = treeData.children.find(c => c.id === id);
          if (found) Object.assign(found, updated);
        }

        saveStorage();
        closeModal();
        renderGrid();
      });

      elements.btnDeletePerson.addEventListener('click', () => {
        const id = elements.fieldId.value;
        if (id === 'self') return;
        if (confirm('この枠を削除しますか？')) {
          if (id === 'fat') treeData.father = null;
          else if (id === 'mot') treeData.mother = null;
          else if (id === 'pgf') treeData.pGrandfather = null;
          else if (id === 'pgm') treeData.pGrandmother = null;
          else if (id === 'mgf') treeData.mGrandfather = null;
          else if (id === 'mgm') treeData.mGrandmother = null;
          else {
            treeData.siblings = treeData.siblings.filter(s => s.id !== id);
            treeData.spouses = treeData.spouses.filter(s => s.id !== id);
            treeData.children = treeData.children.filter(c => c.id !== id);
          }
          saveStorage();
          closeModal();
          renderGrid();
        }
      });

      elements.btnExport.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(treeData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `family_tree_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      });

      elements.fileImport.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data && data.self) {
              treeData = data;
              saveStorage();
              renderGrid();
            }
          } catch (err) { alert('読み込みに失敗しました。'); }
        };
        reader.readAsText(file);
      });

      elements.btnPrint.addEventListener('click', () => window.print());

      loadStorage();
      renderGrid();
    });
  </script>
</body>
</html>
