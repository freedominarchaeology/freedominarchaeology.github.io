        }
        /* コード表示領域は読みやすい等幅フォント */
        code, pre, textarea {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        /* オフライン・CDN障害時のフォールバック基本スタイル */
        .fallback-bg { background-color: #f8fafc; }
        .fallback-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.5rem; }
        .fallback-btn { background-color: #2563eb; color: #ffffff; padding: 0.5rem 1rem; border-radius: 0.375rem; }
    </style>
</head>

            // --- 3. アプリケーション状態変数 ---
            let currentLang = 'ja';
            let currentSample = samples[0];
            let debounceTimer = null;

            // DOMエレメントのキャッシュ
            const langSelect = document.getElementById('lang-select');
            const categorySelect = document.getElementById('category-select');
            const searchInput = document.getElementById('search-input');
            const sampleListEl = document.getElementById('sample-list');
            const sampleCountEl = document.getElementById('sample-count');
            
            const currentTitleEl = document.getElementById('current-sample-title');
            const currentDescEl = document.getElementById('current-sample-desc');
            const currentCategoryEl = document.getElementById('current-sample-category');
            
            const codeEditor = document.getElementById('code-editor');
            const previewIframe = document.getElementById('preview-iframe');
            
            const btnReset = document.getElementById('btn-reset-code');
            const btnCopy = document.getElementById('btn-copy-code');
            const btnSkeleton = document.getElementById('btn-load-skeleton');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');

            // --- 4. 初期化処理 ---
            function init() {
                setupEventListeners();
                renderLanguageUI();
                renderSampleList();
                loadSample(samples[0]);
            }

            // --- 5. イベントリスナー登録 ---
            function setupEventListeners() {
                // 言語切替
                langSelect.addEventListener('change', function (e) {
                    currentLang = e.target.value;
                    renderLanguageUI();
                    renderSampleList();
                    updateCurrentSampleText();
                });

                // フィルタ・検索
                categorySelect.addEventListener('change', renderSampleList);
                searchInput.addEventListener('input', renderSampleList);

                // エディタ入力時（デバウンスでメモリとCPU消費を抑えてプレビュー更新）
                codeEditor.addEventListener('input', function () {
                    if (debounceTimer) clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(updatePreview, 250);
                });

                // 各種ボタン
                btnReset.addEventListener('click', function () {
                    if (currentSample) {
                        codeEditor.value = currentSample.code;
                        updatePreview();
                    }
                });

                btnCopy.addEventListener('click', copyCodeToClipboard);

                btnSkeleton.addEventListener('click', function () {
                    const skeletonSample = samples.find(s => s.id === 'full-skeleton-page');
                    if (skeletonSample) {
                        categorySelect.value = 'all';
                        searchInput.value = '';
                        renderSampleList();
                        loadSample(skeletonSample);
                    }
                });
            }

            // --- 6. 多言語UIレンダリング ---
            function renderLanguageUI() {
                const t = translations[currentLang] || translations.ja;

                document.getElementById('ui-app-title').textContent = t.appTitle;
                document.getElementById('ui-badge').textContent = t.badge;
                document.getElementById('ui-lang-label').textContent = t.langLabel;
                document.getElementById('ui-search-label').textContent = t.searchLabel;
                searchInput.placeholder = t.searchPlaceholder;
                document.getElementById('ui-category-label').textContent = t.categoryLabel;
                document.getElementById('opt-all').textContent = t.optAll;
                document.getElementById('ui-list-title').textContent = t.listTitle;
                document.getElementById('ui-btn-skeleton').textContent = t.btnSkeleton;
                document.getElementById('ui-btn-reset').textContent = t.btnReset;
                document.getElementById('ui-btn-copy').textContent = t.btnCopy;

                // カテゴリ選択肢の言語更新
                const opts = categorySelect.querySelectorAll('option');
                opts.forEach(opt => {
                    const val = opt.value;
                    if (val !== 'all' && t.categories[val]) {
                        opt.textContent = t.categories[val];
                    }
                });
            }

            // --- 7. サンプルリスト描画 (フィルタ・検索対応) ---
            function renderSampleList() {
                const catFilter = categorySelect.value;
                const keyword = searchInput.value.trim().toLowerCase();

                // フィルタリング
                const filtered = samples.filter(s => {
                    const matchCat = (catFilter === 'all') || (s.category === catFilter);
                    const matchKey = !keyword || 
                                     s.title.toLowerCase().includes(keyword) || 
                                     s.desc.toLowerCase().includes(keyword) || 
                                     s.code.toLowerCase().includes(keyword);
                    return matchCat && matchKey;
                });

                sampleCountEl.textContent = filtered.length;
                sampleListEl.innerHTML = '';

                if (filtered.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'p-4 text-center text-xs text-slate-400 font-sans';
                    empty.textContent = '該当するサンプルが見つかりませんでした。';
                    sampleListEl.appendChild(empty);
                    return;
                }

                filtered.forEach(s => {
                    const btn = document.createElement('button');
                    const isActive = currentSample && currentSample.id === s.id;
                    btn.className = `w-full text-left p-3 text-sm transition font-sans flex flex-col gap-1 ${
                        isActive ? 'bg-blue-50 border-l-4 border-blue-600 font-bold text-blue-900' : 'hover:bg-slate-50 text-slate-700'
                    }`;

                    btn.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="truncate">${escapeHtml(s.title)}</span>
                        </div>
                    `;

                    btn.addEventListener('click', function () {
                        loadSample(s);
                        renderSampleList(); // アクティブ項目のハイライト更新
                    });

                    sampleListEl.appendChild(btn);
                });
            }

            // --- 8. サンプル読み込み ---
            function loadSample(sample) {
                currentSample = sample;
                codeEditor.value = sample.code;
                updateCurrentSampleText();
                updatePreview();
            }

            function updateCurrentSampleText() {
                if (!currentSample) return;
                const t = translations[currentLang] || translations.ja;
                currentTitleEl.textContent = currentSample.title;
                currentDescEl.textContent = currentSample.desc;
                currentCategoryEl.textContent = t.categories[currentSample.category] || currentSample.category;
            }

            // --- 9. プレビューの安全な生成 (iframe srcdoc) ---
            function updatePreview() {
                const code = codeEditor.value;
                
                // 完全なHTMLテンプレートか部分コードか判定し、安全なスタイルラッパーを付与
                let finalDoc = '';
                if (code.trim().toLowerCase().startsWith('<!doctype') || code.trim().toLowerCase().startsWith('<html')) {
                    finalDoc = code;
                } else {
                    finalDoc = `
                        <!DOCTYPE html>
                        <html lang="ja">
                        <head>
                            <meta charset="UTF-8">
                            <style>
                                body {
                                    font-family: "Hiragino Mincho ProN", "MS Mincho", "ＭＳ 明朝", serif;
                                    padding: 15px;
                                    color: #1e293b;
                                    line-height: 1.6;
                                }
                            </style>
                        </head>
                        <body>
                            ${code}
                        </body>
                        </html>
                    `;
                }

                try {
                    previewIframe.srcdoc = finalDoc;
                } catch (e) {
                    console.error('Preview error:', e);
                }
            }

            // --- 10. クリップボードへのコピー機能 ---
            function copyCodeToClipboard() {
                const code = codeEditor.value;
                const t = translations[currentLang] || translations.ja;

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(code).then(() => {
                        showToast(t.toastCopied);
                    }).catch(() => {
                        fallbackCopy(code, t);
                    });
                } else {
                    fallbackCopy(code, t);
                }
            }

            function fallbackCopy(text, t) {
                try {
                    codeEditor.select();
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showToast(t.toastCopied);
                    } else {
                        showToast(t.toastError);
                    }
                } catch (err) {
                    showToast(t.toastError);
                }
            }

            function showToast(msg) {
                toastMsg.textContent = msg;
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2500);
            }

            function escapeHtml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // アプリ起動
            document.addEventListener('DOMContentLoaded', init);

        })();
    </script>
</body>
</html>
