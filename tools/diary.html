<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Diary - カレンダー日記帳</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"MS Mincho"', '"MS 明朝"', 'Hiragino Mincho ProN', 'serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: "MS Mincho", "MS 明朝", "Hiragino Mincho ProN", serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Print / PDF Export Styling */
        @media print {
            body {
                background: white !important;
            }
            header, footer, .no-print {
                display: none !important;
            }
            .print-container {
                display: block !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
        }
    </style>
</head>
<body class="text-slate-700 antialiased selection:bg-sky-200 selection:text-sky-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white/85 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-sky-100 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-sky-200">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent" id="app-title">
                    Stellar Diary
                </h1>
            </div>
            <div class="flex items-center space-x-3">
                <!-- PDF Export Menu Dropdown -->
                <div class="relative">
                    <select id="pdf-export-select" class="appearance-none bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs sm:text-sm font-semibold rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 pr-8 cursor-pointer shadow-sm transition hover:bg-indigo-100">
                        <option value="" disabled selected data-i18n="pdf_menu_title">📄 PDF出力...</option>
                        <option value="day" data-i18n="pdf_day">日毎出力 (選択中)</option>
                        <option value="month" data-i18n="pdf_month">月毎出力 (表示中)</option>
                        <option value="year" data-i18n="pdf_year">年毎出力 (表示中)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-indigo-600">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>

                <!-- Backup & Restore Buttons -->
                <div class="hidden sm:flex items-center space-x-2">
                    <button id="backup-btn" class="px-3 py-2 text-xs font-semibold rounded-lg bg-sky-50 text-sky-700 hover:bg-sky-100 border border-sky-200 transition flex items-center space-x-1.5 shadow-sm" title="バックアップ">
                        <i class="fa-solid fa-download"></i>
                        <span data-i18n="backup">バックアップ</span>
                    </button>
                    <label class="cursor-pointer px-3 py-2 text-xs font-semibold rounded-lg bg-sky-50 text-sky-700 hover:bg-sky-100 border border-sky-200 transition flex items-center space-x-1.5 shadow-sm" title="復旧">
                        <i class="fa-solid fa-upload"></i>
                        <span data-i18n="restore">復旧</span>
                        <input type="file" id="restore-input" accept=".json" class="hidden">
                    </label>
                </div>

                <!-- Language Selector -->
                <div class="relative">
                    <select id="lang-select" class="appearance-none bg-sky-50 border border-sky-200 text-sky-800 text-sm rounded-lg focus:ring-sky-500 focus:border-sky-500 block p-2.5 pr-8 cursor-pointer shadow-sm transition hover:bg-sky-100">
                        <option value="ja">日本語</option>
                        <option value="en">English</option>
                        <option value="zh">中文</option>
                        <option value="ko">한국어</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-sky-600">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Calendar & Navigation -->
        <section class="lg:col-span-5 flex flex-col space-y-6 no-print">
            <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-xl shadow-sky-100/50 p-6 border border-sky-100">
                <!-- Calendar Header -->
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-bold text-slate-800" id="calendar-month-year">2026年 10月</h2>
                    <div class="flex items-center space-x-1">
                        <button id="prev-month-btn" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-sky-50 text-sky-600 transition" aria-label="Previous Month">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button id="today-btn" class="px-3 py-1 text-xs font-semibold rounded-full bg-sky-50 text-sky-600 hover:bg-sky-100 transition" data-i18n="today">
                            今日
                        </button>
                        <button id="next-month-btn" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-sky-50 text-sky-600 transition" aria-label="Next Month">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Days of Week Header -->
                <div class="calendar-grid text-center text-xs font-bold text-slate-400 mb-2">
                    <span class="text-rose-500" data-i18n="sun">日</span>
                    <span data-i18n="mon">月</span>
                    <span data-i18n="tue">火</span>
                    <span data-i18n="wed">水</span>
                    <span data-i18n="thu">木</span>
                    <span data-i18n="fri">金</span>
                    <span class="text-sky-500" data-i18n="sat">土</span>
                </div>

                <!-- Calendar Days Grid -->
                <div id="calendar-days" class="calendar-grid gap-y-1 text-sm">
                    <!-- Dynamic Days Injected Here -->
                </div>
            </div>

            <!-- Quick Stats / Overview Card -->
            <div class="bg-gradient-to-br from-sky-500 to-indigo-600 text-white rounded-2xl shadow-xl shadow-sky-200/50 p-6 flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-medium opacity-90" data-i18n="total_entries">総日記数</h3>
                    <p class="text-3xl font-extrabold mt-1" id="total-entries-count">0</p>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl backdrop-blur-sm">
                    <i class="fa-solid fa-feather"></i>
                </div>
            </div>
        </section>

        <!-- Right Column: Diary Editor / Viewer -->
        <section class="lg:col-span-7 flex flex-col">
            <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-xl shadow-sky-100/50 p-6 sm:p-8 border border-sky-100 flex-grow flex flex-col">

                    <div>
                        <span class="text-xs font-semibold px-3 py-1 rounded-full bg-sky-100 text-sky-700 inline-block mb-1" id="selected-date-badge">2026年10月14日</span>

                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="delete-btn" class="hidden px-4 py-2 text-sm font-semibold rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 transition items-center space-x-2">
                            <i class="fa-solid fa-trash-can"></i>
                            <span data-i18n="delete">削除</span>
                        </button>
                        <button id="save-btn" class="px-5 py-2 text-sm font-semibold rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-md shadow-sky-200 hover:opacity-95 transition flex items-center space-x-2">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span data-i18n="save">保存する</span>
                        </button>
                    </div>
                </div>

                <!-- Diary Form Content -->
                <div class="space-y-6 flex-grow flex flex-col no-print">
                    <!-- Title Input -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2" data-i18n="title_label">タイトル</label>
                        <input type="text" id="diary-title" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition text-slate-800 font-medium" placeholder="今日のタイトルを入力...">
                    </div>

                    <!-- Content Textarea -->
                    <div class="flex-grow flex flex-col">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2" data-i18n="content_label">本文</label>
                        <textarea id="diary-content" class="w-full flex-grow min-h-[180px] p-4 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition text-slate-800 resize-y" placeholder="今日あった出来事や感情を自由に書き留めましょう..."></textarea>
                    </div>

                    <!-- Photo Attachment Section -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2" data-i18n="photo_label">写真添付</label>
                        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                            <label class="cursor-pointer px-4 py-2.5 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 rounded-xl text-sm font-semibold transition flex items-center space-x-2 shadow-sm">
                                <i class="fa-solid fa-camera"></i>
                                <span data-i18n="choose_photo">写真を選択</span>
                                <input type="file" id="photo-input" accept="image/*" class="hidden">
                            </label>
                            <span id="photo-name" class="text-xs text-slate-400 truncate max-w-xs" data-i18n="no_photo">選択されていません</span>
                        </div>
                        
                        <!-- Photo Preview Container -->
                        <div id="photo-preview-container" class="mt-4 hidden relative group w-full max-w-sm rounded-xl overflow-hidden border border-slate-200 bg-slate-50 shadow-sm">
                            <img id="photo-preview" src="" alt="Preview" class="w-full h-48 object-cover">
                            <button id="remove-photo-btn" type="button" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-rose-600/80 hover:bg-rose-600 text-white flex items-center justify-center transition shadow-md" aria-label="Remove photo">
                                <i class="fa-solid fa-xmark text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Print Preview / Hidden Export Container -->
    <div id="print-area" class="hidden print-container p-8 bg-white text-slate-800">
        <!-- Dynamic Print Content injected here -->
    </div>

    <!-- Footer -->
    <footer class="mt-auto py-6 text-center text-xs text-slate-400 border-t border-sky-100 bg-white/40 no-print">
        <p>&copy; 2026 Stellar Diary. All rights reserved.</p>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-in-out bg-slate-800 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-sm no-print">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">保存しました</span>
    </div>

        const photoInput = document.getElementById('photo-input');
        const photoName = document.getElementById('photo-name');
        const photoPreviewContainer = document.getElementById('photo-preview-container');
        const photoPreview = document.getElementById('photo-preview');
        const removePhotoBtn = document.getElementById('remove-photo-btn');
        const saveBtn = document.getElementById('save-btn');
        const deleteBtn = document.getElementById('delete-btn');
        const backupBtn = document.getElementById('backup-btn');
        const restoreInput = document.getElementById('restore-input');
        const printArea = document.getElementById('print-area');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // Helper: Format Date to YYYY-MM-DD
        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // Initialize Application
        function initApp() {
            try {
                loadDiariesFromStorage();
                const today = new Date();
                state.selectedDateStr = formatDateKey(today);

                setupEventListeners();
                updateUI();
            } catch (error) {
                console.error("Initialization error:", error);
            }
        }

        // LocalStorage Operations
        function loadDiariesFromStorage() {
            try {
                const stored = localStorage.getItem('stellar_diaries');
                if (stored) {
                    state.diaries = JSON.parse(stored);
                }
            } catch (e) {
                console.error("Failed to load from localStorage", e);
                state.diaries = {};
            }
        }

        function saveDiariesToStorage() {
            try {
                localStorage.setItem('stellar_diaries', JSON.stringify(state.diaries));
            } catch (e) {
                console.error("Failed to save to localStorage", e);
            }
        }

        // Event Listeners Setup
        function setupEventListeners() {
            try {
                langSelect.addEventListener('change', (e) => {
                    state.currentLang = e.target.value;
                    updateUI();
                });

                pdfExportSelect.addEventListener('change', (e) => {
                    const mode = e.target.value;
                    if (mode) {
                        exportPDF(mode);
                        pdfExportSelect.value = ""; // Reset dropdown
                    }
                });

                prevMonthBtn.addEventListener('click', () => {
                    state.currentDate.setMonth(state.currentDate.getMonth() - 1);
                    renderCalendar();
                });

                nextMonthBtn.addEventListener('click', () => {
                    state.currentDate.setMonth(state.currentDate.getMonth() + 1);
                    renderCalendar();
                });

                todayBtn.addEventListener('click', () => {
                    state.currentDate = new Date();
                    state.selectedDateStr = formatDateKey(state.currentDate);
                    renderCalendar();
                    loadSelectedDiary();
                });

                photoInput.addEventListener('change', handlePhotoSelection);
                removePhotoBtn.addEventListener('click', clearPhoto);

                saveBtn.addEventListener('click', saveDiary);
                deleteBtn.addEventListener('click', deleteDiary);

                backupBtn.addEventListener('click', handleBackup);
                restoreInput.addEventListener('change', handleRestore);
            } catch (e) {
                console.error("Error setting up event listeners", e);
            }
        }

        // PDF Export Handler (Day, Month, Year)
        function exportPDF(mode) {
            try {
                let htmlContent = '';
                const t = translations[state.currentLang];
                const year = state.currentDate.getFullYear();
                const month = state.currentDate.getMonth() + 1;

                if (mode === 'day') {
                    const entry = state.diaries[state.selectedDateStr];
                    if (!entry) {
                        alert(t.no_entry_alert);
                        return;
                    }
                    const parts = state.selectedDateStr.split('-');
                    const dateFormatted = t.dateFormat(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));

                    htmlContent = `
                        <div style="font-family: 'MS Mincho', 'MS 明朝', serif; padding: 20px; color: #1e293b;">
                            <h1 style="font-size: 24px; border-bottom: 2px solid #0ea5e9; padding-bottom: 8px; margin-bottom: 16px;">Stellar Diary - ${dateFormatted}</h1>
                            <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">${escapeHtml(entry.title || '(無題)')}</h2>
                            <div style="font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 20px;">${escapeHtml(entry.content || '')}</div>
                            ${entry.photo ? `<div style="margin-top: 20px;"><img src="${entry.photo}" style="max-width: 100%; max-height: 400px; border-radius: 8px;" /></div>` : ''}
                        </div>
                    `;
                } else if (mode === 'month') {
                    // Filter entries for current year & month
                    const prefix = `${year}-${String(month).padStart(2, '0')}`;
                    const matchingKeys = Object.keys(state.diaries).filter(k => k.startsWith(prefix)).sort();

                    if (matchingKeys.length === 0) {
                        alert(t.no_entry_alert);
                        return;
                    }

                    htmlContent = `
                        <div style="font-family: 'MS Mincho', 'MS 明朝', serif; padding: 20px; color: #1e293b;">
                            <h1 style="font-size: 24px; border-bottom: 2px solid #0ea5e9; padding-bottom: 8px; margin-bottom: 24px;">Stellar Diary - ${year}年 ${month}月</h1>
                    `;
                    matchingKeys.forEach(k => {
                        const entry = state.diaries[k];
                        const parts = k.split('-');
                        const dateFormatted = t.dateFormat(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
                        htmlContent += `
                            <div style="margin-bottom: 30px; page-break-inside: avoid; border-bottom: 1px dashed #cbd5e1; padding-bottom: 20px;">
                                <h3 style="font-size: 14px; color: #0284c7; margin-bottom: 4px;">${dateFormatted}</h3>
                                <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">${escapeHtml(entry.title || '(無題)')}</h2>
                                <div style="font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 12px;">${escapeHtml(entry.content || '')}</div>
                                ${entry.photo ? `<div><img src="${entry.photo}" style="max-width: 100%; max-height: 300px; border-radius: 6px;" /></div>` : ''}
                            </div>
                        `;
                    });
                    htmlContent += `</div>`;
                } else if (mode === 'year') {
                    // Filter entries for current year
                    const prefix = `${year}-`;
                    const matchingKeys = Object.keys(state.diaries).filter(k => k.startsWith(prefix)).sort();

                    if (matchingKeys.length === 0) {
                        alert(t.no_entry_alert);
                        return;
                    }

                    htmlContent = `
                        <div style="font-family: 'MS Mincho', 'MS 明朝', serif; padding: 20px; color: #1e293b;">
                            <h1 style="font-size: 24px; border-bottom: 2px solid #0ea5e9; padding-bottom: 8px; margin-bottom: 24px;">Stellar Diary - ${year}年</h1>
                    `;
                    matchingKeys.forEach(k => {
                        const entry = state.diaries[k];
                        const parts = k.split('-');
                        const dateFormatted = t.dateFormat(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
                        htmlContent += `
                            <div style="margin-bottom: 30px; page-break-inside: avoid; border-bottom: 1px dashed #cbd5e1; padding-bottom: 20px;">
                                <h3 style="font-size: 14px; color: #0284c7; margin-bottom: 4px;">${dateFormatted}</h3>
                                <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">${escapeHtml(entry.title || '(無題)')}</h2>
                                <div style="font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 12px;">${escapeHtml(entry.content || '')}</div>
                                ${entry.photo ? `<div><img src="${entry.photo}" style="max-width: 100%; max-height: 300px; border-radius: 6px;" /></div>` : ''}
                            </div>
                        `;
                    });
                    htmlContent += `</div>`;
                }

                printArea.innerHTML = htmlContent;
                window.print();
            } catch (e) {
                console.error("PDF Export error:", e);
                alert("PDF出力に失敗しました。");
            }
        }

        // Simple HTML Escape helper
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Backup Function (Export JSON via Blob)
        function handleBackup() {
            try {
                const jsonString = JSON.stringify(state.diaries, null, 2);
                const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = url;
                const dateString = formatDateKey(new Date());
                downloadAnchor.download = `stellar_diary_backup_${dateString}.json`;
                
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                
                setTimeout(() => {
                    document.body.removeChild(downloadAnchor);
                    URL.revokeObjectURL(url);
                }, 100);

                showToast(translations[state.currentLang].backup_success, 'success');
            } catch (e) {
                console.error("Backup error:", e);
                showToast("Backup failed", 'error');
            }
        }

        // Restore Function (Import JSON)
        function handleRestore(e) {
            try {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (parsedData && typeof parsedData === 'object') {
                            state.diaries = parsedData;
                            saveDiariesToStorage();
                            updateUI();
                            loadSelectedDiary();
                            showToast(translations[state.currentLang].restore_success, 'success');
                        } else {
                            throw new Error("Invalid format");
                        }
                    } catch (err) {
                        console.error("Parse error:", err);
                        showToast(translations[state.currentLang].restore_error, 'error');
                    } finally {
                        restoreInput.value = '';
                    }
                };
                reader.readAsText(file);
            } catch (e) {
                console.error("Restore error:", e);
                showToast(translations[state.currentLang].restore_error, 'error');
                restoreInput.value = '';
            }
        }

        // UI Translation and Text Updates
        function updateUI() {
            try {
                const t = translations[state.currentLang];
                
                document.getElementById('app-title').textContent = t.app_title;
                todayBtn.textContent = t.today;
                document.querySelector('[data-i18n="sun"]').textContent = t.sun;
                document.querySelector('[data-i18n="mon"]').textContent = t.mon;
                document.querySelector('[data-i18n="tue"]').textContent = t.tue;
                document.querySelector('[data-i18n="wed"]').textContent = t.wed;
                document.querySelector('[data-i18n="thu"]').textContent = t.thu;
                document.querySelector('[data-i18n="fri"]').textContent = t.fri;
                document.querySelector('[data-i18n="sat"]').textContent = t.sat;
                document.querySelector('[data-i18n="total_entries"]').textContent = t.total_entries;
                selectedDateTitle.textContent = t.diary_form_title;
                deleteBtn.querySelector('span').textContent = t.delete;
                saveBtn.querySelector('span').textContent = t.save;
                document.querySelector('[data-i18n="backup"]').textContent = t.backup;
                document.querySelector('[data-i18n="restore"]').textContent = t.restore;
                document.querySelector('[data-i18n="title_label"]').textContent = t.title_label;
                document.querySelector('[data-i18n="content_label"]').textContent = t.content_label;
                document.querySelector('[data-i18n="photo_label"]').textContent = t.photo_label;
                document.querySelector('[data-i18n="choose_photo"]').textContent = t.choose_photo;

                // PDF Dropdown Options text update
                pdfExportSelect.options[0].text = t.pdf_menu_title;
                pdfExportSelect.options[1].text = t.pdf_day;
                pdfExportSelect.options[2].text = t.pdf_month;
                pdfExportSelect.options[3].text = t.pdf_year;

                if (!state.currentPhotoBase64) {
                    photoName.textContent = t.no_photo;
                }
                diaryTitleInput.placeholder = t.title_placeholder;
                diaryContentInput.placeholder = t.content_placeholder;

                totalEntriesCount.textContent = Object.keys(state.diaries).length;

                renderCalendar();
                updateSelectedDateHeader();
            } catch (e) {
                console.error("Error updating UI", e);
            }
        }

        // Render Calendar
        function renderCalendar() {
            try {
                const year = state.currentDate.getFullYear();
                const month = state.currentDate.getMonth();

                if (state.currentLang === 'ja' || state.currentLang === 'zh' || state.currentLang === 'ko') {
                    calendarMonthYear.textContent = `${year}年 ${month + 1}月`;
                } else if (state.currentLang === 'fr') {
                    const monthsFr = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
                    calendarMonthYear.textContent = `${monthsFr[month]} ${year}`;
                } else if (state.currentLang === 'es') {
                    const monthsEs = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                    calendarMonthYear.textContent = `${monthsEs[month]} ${year}`;
                } else {
                    const monthsEn = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                    calendarMonthYear.textContent = `${monthsEn[month]} ${year}`;
                }

                calendarDays.innerHTML = '';

                const firstDayIndex = new Date(year, month, 1).getDay();
                const lastDay = new Date(year, month + 1, 0).getDate();
                const prevLastDay = new Date(year, month, 0).getDate();
                const todayKey = formatDateKey(new Date());

                for (let i = firstDayIndex; i > 0; i--) {
                    const dayNum = prevLastDay - i + 1;
                    const cell = document.createElement('div');
                    cell.className = 'aspect-square flex items-center justify-center text-slate-300 text-xs cursor-default select-none';
                    cell.textContent = dayNum;
                    calendarDays.appendChild(cell);
                }

                for (let i = 1; i <= lastDay; i++) {
                    const dateObj = new Date(year, month, i);
                    const dateStr = formatDateKey(dateObj);
                    const hasDiary = state.diaries[dateStr] !== undefined;
                    const isSelected = dateStr === state.selectedDateStr;
                    const isToday = dateStr === todayKey;

                    const cell = document.createElement('div');
                    let baseClasses = 'aspect-square m-0.5 rounded-xl flex flex-col items-center justify-center relative cursor-pointer transition text-xs sm:text-sm font-medium ';
                    
                    if (isSelected) {
                        baseClasses += 'bg-gradient-to-tr from-sky-500 to-indigo-600 text-white shadow-md shadow-sky-200 ring-2 ring-sky-300 ';
                    } else if (isToday) {
                        baseClasses += 'bg-sky-100 text-sky-800 font-bold border border-sky-300 hover:bg-sky-200 ';
                    } else {
                        baseClasses += 'hover:bg-sky-50 text-slate-700 ';
                    }

                    cell.className = baseClasses;
                    
                    const numSpan = document.createElement('span');
                    numSpan.textContent = i;
                    cell.appendChild(numSpan);

                    if (hasDiary) {
                        const dot = document.createElement('span');
                        dot.className = `w-1.5 h-1.5 rounded-full mt-1 ${isSelected ? 'bg-white' : 'bg-sky-500'}`;
                        cell.appendChild(dot);
                    }

                    cell.addEventListener('click', () => {
                        state.selectedDateStr = dateStr;
                        loadSelectedDiary();
                        renderCalendar();
                    });

                    calendarDays.appendChild(cell);
                }

                const totalCells = firstDayIndex + lastDay;
                const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
                for (let i = 1; i <= remainingCells; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'aspect-square flex items-center justify-center text-slate-300 text-xs cursor-default select-none';
                    cell.textContent = i;
                    calendarDays.appendChild(cell);
                }
            } catch (e) {
                console.error("Error rendering calendar", e);
            }
        }

        // Update Selected Date Header & Load Diary Data
        function updateSelectedDateHeader() {
            try {
                const parts = state.selectedDateStr.split('-');
                const y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                const d = parseInt(parts[2], 10);

                const t = translations[state.currentLang];
                selectedDateBadge.textContent = t.dateFormat(y, m, d);
            } catch (e) {
                console.error("Error updating selected date header", e);
            }
        }

        function loadSelectedDiary() {
            try {
                updateSelectedDateHeader();
                const entry = state.diaries[state.selectedDateStr];

                if (entry) {
                    diaryTitleInput.value = entry.title || '';
                    diaryContentInput.value = entry.content || '';
                    if (entry.photo) {
                        state.currentPhotoBase64 = entry.photo;
                        photoPreview.src = entry.photo;
                        photoPreviewContainer.classList.remove('hidden');
                        photoName.textContent = translations[state.currentLang].choose_photo + ' (Attached)';
                    } else {
                        clearPhotoState();
                    }
                    deleteBtn.classList.remove('hidden');
                    deleteBtn.classList.add('flex');
                } else {
                    diaryTitleInput.value = '';
                    diaryContentInput.value = '';
                    clearPhotoState();
                    deleteBtn.classList.add('hidden');
                    deleteBtn.classList.remove('flex');
                }
            } catch (e) {
                console.error("Error loading selected diary", e);
            }
        }

        // Photo Handling
        function handlePhotoSelection(e) {
            try {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    state.currentPhotoBase64 = uploadEvent.target.result;
                    photoPreview.src = state.currentPhotoBase64;
                    photoPreviewContainer.classList.remove('hidden');
                    photoName.textContent = file.name;
                };
                reader.readAsDataURL(file);
            } catch (e) {
                console.error("Error handling photo selection", e);
            }
        }

        function clearPhoto() {
            try {
                photoInput.value = '';
                clearPhotoState();
            } catch (e) {
                console.error("Error clearing photo", e);
            }
        }

        function clearPhotoState() {
            state.currentPhotoBase64 = null;
            photoPreview.src = '';
            photoPreviewContainer.classList.add('hidden');
            photoName.textContent = translations[state.currentLang].no_photo;
        }

        // Save Diary
        function saveDiary() {
            try {
                const title = diaryTitleInput.value.trim();
                const content = diaryContentInput.value.trim();

                if (!title && !content && !state.currentPhotoBase64) return;

                state.diaries[state.selectedDateStr] = {
                    title: title,
                    content: content,
                    photo: state.currentPhotoBase64,
                    updatedAt: new Date().toISOString()
                };

                saveDiariesToStorage();
                updateUI();
                loadSelectedDiary();
                showToast(translations[state.currentLang].saved_success, 'success');
            } catch (e) {
                console.error("Error saving diary", e);
                showToast("Error saving diary", 'error');
            }
        }

        // Delete Diary
        function deleteDiary() {
            try {
                const t = translations[state.currentLang];
                if (!confirm(t.confirm_delete)) return;

                if (state.diaries[state.selectedDateStr]) {
                    delete state.diaries[state.selectedDateStr];
                    saveDiariesToStorage();
                    updateUI();
                    loadSelectedDiary();
                    showToast(t.deleted_success, 'success');
                }
            } catch (e) {
                console.error("Error deleting diary", e);
            }
        }

        // Toast Notification
        let toastTimeout = null;
        function showToast(message, type = 'success') {
            try {
                if (toastTimeout) clearTimeout(toastTimeout);

                toastMessage.textContent = message;
                const icon = document.getElementById('toast-icon');
                if (type === 'success') {
                    icon.className = "fa-solid fa-circle-check text-emerald-400";
                } else {
                    icon.className = "fa-solid fa-circle-exclamation text-rose-400";
                }

                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                toastTimeout = setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            } catch (e) {
                console.error("Error showing toast", e);
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
