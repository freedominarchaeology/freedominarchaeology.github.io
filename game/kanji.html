<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>かんじ れんしゅう / Kanji Practice</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "MS Mincho", "MS 明朝", "Yu Mincho", "游明朝", serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 5px 0;
        }

        h1 {
            font-size: 1.2rem;
            color: #2c3e50;
        }

        select {
            font-family: sans-serif;
            font-size: 0.9rem;
            padding: 5px 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
        }

        .controls {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .controls select {
            flex: 1;
            min-width: 120px;
            padding: 8px;
            font-size: 1rem;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-panel {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .kanji-info {
            font-size: 1rem;
            font-weight: bold;
            color: #34495e;
            min-height: 1.5em;
            word-break: break-all;
        }

        /* 漢字手書き領域 */
        .canvas-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            border: 4px solid #34495e;
            border-radius: 8px;
            background-color: #fff;
            /* 田の字補助線 */
            background-image: 
                linear-gradient(to right, transparent 49.5%, #e0e0e0 49.5%, #e0e0e0 50.5%, transparent 50.5%),
                linear-gradient(to bottom, transparent 49.5%, #e0e0e0 49.5%, #e0e0e0 50.5%, transparent 50.5%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* 判定オーバーレイ表示 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .overlay.show {
            opacity: 1;
        }

        .result-mark {
            font-family: sans-serif;
            font-weight: bold;
            font-size: 130px;
            line-height: 1;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .mark-double { color: #ff4757; } /* ◎ 二重丸 */
        .mark-single { color: #2ed573; } /* ○ 丸 */
        .mark-triangle { color: #ffa502; } /* △ 三角 */
        .mark-cross { color: #57606f; } /* × バツ */

        .score-text {
            font-family: sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.9);
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        button {
            font-family: sans-serif;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-check { background-color: #2ecc71; color: white; }
        .btn-next  { background-color: #3498db; color: white; }

        @media (max-height: 600px) {
            .canvas-wrapper { width: 220px; height: 220px; }
            .result-mark { font-size: 100px; }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="title-text">かんじ れんしゅう</h1>
        <select id="lang-select" aria-label="Language Select">
            <option value="ja" selected>日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </header>

    <div class="controls">
        <select id="grade-select" aria-label="Grade Select"></select>
        <select id="kanji-select" aria-label="Kanji Select"></select>
    </div>

    <div class="app-container">
        <div class="info-panel">
            <div class="kanji-info" id="kanji-info">読み: -</div>
        </div>

        <div class="canvas-wrapper">
            <!-- ガイド文字描画層 -->
            <canvas id="bgCanvas" width="280" height="280"></canvas>
            <!-- ユーザー手書き描画層 -->
            <canvas id="drawCanvas" width="280" height="280"></canvas>
            
            <!-- 判定マーク overlay -->
            <div class="overlay" id="overlay">
                <div class="result-mark" id="result-mark">◎</div>
                <div class="score-text" id="score-text">100%</div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-clear" id="btn-clear">けす</button>
            <button class="btn-check" id="btn-check">できた！</button>
            <button class="btn-next"  id="btn-next">つぎへ</button>
        </div>
    </div>

    function getAudioContext() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    // 正解音（ピンポン）
    function playSuccessSound() {
        const ctx = getAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'sine';

        osc1.frequency.setValueAtTime(659.25, now); // E5
        osc2.frequency.setValueAtTime(830.61, now + 0.15); // G#5

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc1.stop(now + 0.15);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.8);
    }

        const ctx = getAudioContext();

        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc2.type = 'sawtooth';

        osc1.frequency.setValueAtTime(140, now);
        osc2.frequency.setValueAtTime(143, now); // わずかにずらして唸りを生む

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.setValueAtTime(0.01, now + 0.2);
        gain.gain.setValueAtTime(0.2, now + 0.25);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.55);
        osc2.stop(now + 0.55);
    }

    // 言語切り替え
    function updateLanguage() {
        const texts = i18n[currentLang];
        titleText.textContent = texts.title;
        btnClear.textContent = texts.clear;
        btnCheck.textContent = texts.check;
        btnNext.textContent = texts.next;

        const prevGrade = gradeSelect.value;
        gradeSelect.innerHTML = '';
        texts.grades.forEach((g, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = g;
            gradeSelect.appendChild(opt);
        });
        gradeSelect.value = prevGrade !== "" && prevGrade < texts.grades.length ? prevGrade : 0;

        updateKanjiList();
    }

    // 漢字ドロップダウンの更新
    function updateKanjiList() {
        currentGrade = parseInt(gradeSelect.value, 10) || 0;
        const list = kanjiData[currentGrade] || kanjiData[0];
        
        kanjiSelect.innerHTML = '';
        list.forEach((item, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `${idx + 1}. ${item.char}`;
            kanjiSelect.appendChild(opt);
        });

        currentKanjiIndex = 0;
        kanjiSelect.value = 0;
        loadCurrentKanji();
    }

    // 漢字および復元読み仮名の読み込み
    function loadCurrentKanji() {
        clearCanvas();
        hideOverlay();
        updateKanjiInfo();
        drawBackgroundKanji();
    }

    function updateKanjiInfo() {
        const list = kanjiData[currentGrade] || kanjiData[0];
        const item = list[currentKanjiIndex];
        const label = i18n[currentLang].read;
        if (item) {
            kanjiInfo.textContent = `${label}: ${item.read}`;
        } else {
            kanjiInfo.textContent = '';
        }
    }

    // ガイド漢字を描画
    function drawBackgroundKanji() {
        const list = kanjiData[currentGrade] || kanjiData[0];
        const item = list[currentKanjiIndex];
        if (!item) return;

        bgCtx.fillStyle = '#ffffff';
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

        bgCtx.font = '200px "MS Mincho", "MS 明朝", "Yu Mincho", "游明朝", serif';
        bgCtx.textAlign = 'center';
        bgCtx.textBaseline = 'middle';
        bgCtx.fillStyle = '#dcdde1'; // 灰色の見本
        bgCtx.fillText(item.char, bgCanvas.width / 2, bgCanvas.height / 2 + 15);
    }

    // タッチ・マウス位置座標の取得
    function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (drawCanvas.width / rect.width),
            y: (clientY - rect.top) * (drawCanvas.height / rect.height)
        };
    }

    function startDrawing(e) {
        e.preventDefault();
        getAudioContext();
        isDrawing = true;
        hasDrawn = true;
        const pos = getPos(e);
        drawCtx.beginPath();
        drawCtx.moveTo(pos.x, pos.y);
        drawCtx.strokeStyle = '#2c3e50';
        drawCtx.lineWidth = 16;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        drawCtx.lineTo(pos.x, pos.y);
        drawCtx.stroke();
    }

    function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        drawCtx.closePath();
    }

    function clearCanvas() {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        hasDrawn = false;
        hideOverlay();
    }

    /**
     * 見本（bgCanvas）とユーザー手書き（drawCanvas）のピクセル合致率判定
     */
    function evaluateDrawing() {
        if (!hasDrawn) return;

        const width = drawCanvas.width;
        const height = drawCanvas.height;

        const bgData = bgCtx.getImageData(0, 0, width, height).data;
        const drawData = drawCtx.getImageData(0, 0, width, height).data;

        let guidePixels = 0;
        let drawnPixels = 0;
        let overlapPixels = 0;

        for (let i = 0; i < bgData.length; i += 4) {
            // 背景ガイド文字が存在するピクセル（白色 #FFFFFF 以外のピクセル）
            const isGuide = (bgData[i] < 240 || bgData[i+1] < 240 || bgData[i+2] < 240);
            // ユーザーの手書き線が存在するピクセル（アルファ値 > 0）
            const isDrawn = (drawData[i + 3] > 50);

            if (isGuide) guidePixels++;
            if (isDrawn) drawnPixels++;
            if (isGuide && isDrawn) overlapPixels++;
        }

        if (guidePixels === 0 || drawnPixels === 0) return;

        // カバー率（見本をどれだけ覆えたか）と 精度（はみ出しの少なさ）
        const coverage = overlapPixels / guidePixels;
        const precision = overlapPixels / drawnPixels;
        
        // 総合スコア（0%〜100%）
        const score = Math.round(((coverage * 0.6) + (precision * 0.4)) * 100);

        showResult(score);
    }

    // 判定マークと音声の出力
    function showResult(score) {
        resultMark.className = 'result-mark';
        scoreText.textContent = `一致度: ${score}%`;

        if (score >= 75) {
            // ◎ 二重丸（合格）
            resultMark.textContent = '◎';
            resultMark.classList.add('mark-double');
            playSuccessSound();
        } else if (score >= 55) {
            // ○ 丸（合格）
            resultMark.textContent = '○';
            resultMark.classList.add('mark-single');
            playSuccessSound();
        } else if (score >= 35) {
            // △ 三角（もう一歩）
            resultMark.textContent = '△';
            resultMark.classList.add('mark-triangle');
            playBuzzerSound();
        } else {
            // × バツ（不合格ブザー）
            resultMark.textContent = '×';
            resultMark.classList.add('mark-cross');
            playBuzzerSound();
        }

        overlay.classList.add('show');
    }

    function hideOverlay() {
        overlay.classList.remove('show');
    }

    function nextKanji() {
        const list = kanjiData[currentGrade] || kanjiData[0];
        if (list.length === 0) return;
        currentKanjiIndex = (currentKanjiIndex + 1) % list.length;
        kanjiSelect.value = currentKanjiIndex;
        loadCurrentKanji();
    }

    function initEvents() {
        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            updateLanguage();
        });

        gradeSelect.addEventListener('change', () => {
            updateKanjiList();
        });

        kanjiSelect.addEventListener('change', (e) => {
            currentKanjiIndex = parseInt(e.target.value, 10) || 0;
            loadCurrentKanji();
        });

        btnClear.addEventListener('click', clearCanvas);
        btnCheck.addEventListener('click', evaluateDrawing);
        btnNext.addEventListener('click', nextKanji);

        drawCanvas.addEventListener('mousedown', startDrawing);
        drawCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
        drawCanvas.addEventListener('touchmove', draw, { passive: false });
        drawCanvas.addEventListener('touchend', stopDrawing);
    }

    function init() {
        initEvents();
        updateLanguage();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
