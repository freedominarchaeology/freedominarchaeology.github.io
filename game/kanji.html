<!DOCTYPE html>          
<html lang="ja">          
<head>          
    <meta charset="UTF-8">          
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">          
    <title>かんじ れんしゅう / Kanji Practice</title>          
    <style>          
        * {          
            box-sizing: border-box;          
            touch-action: manipulation;          
            margin: 0;          
            padding: 0;          
        }          
          
        body {          
            font-family: sans-serif;          
            background-color: #f4f7f6;          
            color: #333;          
            display: flex;          
            flex-direction: column;          
            align-items: center;          
            min-height: 100vh;          
            padding: 10px;          
        }          
          
        header {          
            width: 100%;          
            max-width: 600px;          
            display: flex;          
            justify-content: space-between;          
            align-items: center;          
            margin-bottom: 10px;          
            padding: 5px 0;          
        }          
          
        h1 {          
            font-size: 1.2rem;          
            color: #2c3e50;          
        }          
          
        select {          
            font-family: sans-serif;          
            font-size: 0.9rem;          
            padding: 5px 8px;          
            border-radius: 5px;          
            border: 1px solid #ccc;          
            background-color: #fff;          
        }          
          
        .controls {          
            width: 100%;          
            max-width: 600px;          
            display: flex;          
            gap: 8px;          
            margin-bottom: 15px;          
            flex-wrap: wrap;          
        }          
          
        .controls select {          
            flex: 1;          
            min-width: 110px;          
            padding: 8px;          
            font-size: 0.95rem;          
        }          
          
        .app-container {          
            width: 100%;          
            max-width: 600px;          
            background: #ffffff;          
            border-radius: 12px;          
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);          
            padding: 15px;          
            display: flex;          
            flex-direction: column;          
            align-items: center;          
        }          
          
        .info-panel {          
            width: 100%;          
            text-align: center;          
            margin-bottom: 10px;          
        }          
          
        .kanji-info {          
            font-size: 1rem;          
            font-weight: bold;          
            color: #34495e;          
            min-height: 1.5em;          
            word-break: break-all;          
        }          
          
        /* 漢字手書き領域 */          
        .canvas-wrapper {          
            position: relative;          
            width: 280px;          
            height: 280px;          
            border: 4px solid #34495e;          
            border-radius: 8px;          
            background-color: #fff;          
            /* 田の字補助線 */          
            background-image:           
                linear-gradient(to right, transparent 49.5%, #e0e0e0 49.5%, #e0e0e0 50.5%, transparent 50.5%),          
                linear-gradient(to bottom, transparent 49.5%, #e0e0e0 49.5%, #e0e0e0 50.5%, transparent 50.5%);          
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);          
            margin-bottom: 15px;          
        }          
          
        canvas {          
            position: absolute;          
            top: 0;          
            left: 0;          
            width: 100%;          
            height: 100%;          
            touch-action: none;          
        }          
          
        /* 判定オーバーレイ表示 */          
        .overlay {          
            position: absolute;          
            top: 0;          
            left: 0;          
            width: 100%;          
            height: 100%;          
            display: flex;          
            flex-direction: column;          
            justify-content: center;          
            align-items: center;          
            pointer-events: none;          
            opacity: 0;          
            transition: opacity 0.2s ease;          
            background-color: rgba(255, 255, 255, 0.35);          
        }          
          
        .overlay.show {          
            opacity: 1;          
        }          
          
        .result-mark {          
            font-family: sans-serif;          
            font-weight: bold;          
            font-size: 130px;          
            line-height: 1;          
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);          
        }          
          
        .mark-double { color: #ff4757; } /* ◎ 二重丸 */          
        .mark-single { color: #2ed573; } /* ○ 丸 */          
        .mark-triangle { color: #ffa502; } /* △ 三角 */          
        .mark-cross { color: #57606f; } /* × バツ */          
          
        .score-text {          
            font-family: sans-serif;          
            font-size: 1.1rem;          
            font-weight: bold;          
            color: #2c3e50;          
            background: rgba(255, 255, 255, 0.95);          
            padding: 4px 12px;          
            border-radius: 12px;          
            margin-top: 5px;          
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);          
        }          
          
        .buttons {          
            display: flex;          
            gap: 10px;          
            width: 100%;          
            justify-content: center;          
        }          
          
        button {          
            font-family: sans-serif;          
            padding: 10px 20px;          
            font-size: 1rem;          
            font-weight: bold;          
            border: none;          
            border-radius: 6px;          
            cursor: pointer;          
            transition: background 0.2s, transform 0.1s;          
        }          
          
        button:active {          
            transform: scale(0.96);          
        }          
          
        .btn-clear { background-color: #e74c3c; color: white; }          
        .btn-check { background-color: #2ecc71; color: white; }          
        .btn-next  { background-color: #3498db; color: white; }          
          
        @media (max-height: 600px) {          
            .canvas-wrapper { width: 220px; height: 220px; }          
            .result-mark { font-size: 100px; }          
        }          
    </style>          
</head>

            {char:"裏",read:"リ / うら"}, {char:"律",read:"リツ, リチ"}, {char:"臨",read:"リン / のぞむ"}, {char:"朗",read:"ロウ / ほがらか"},

    // --- State variables ---          
    let currentLang = 'ja';          
    let currentGradeIndex = 0;          
    let currentKanjiIndex = 0;          
    let currentFont = 'gothic';          
    let isDrawing = false;          
    let lastPoint = null;          
          
    // DOM elements          
    const langSelect = document.getElementById('lang-select');          
    const gradeSelect = document.getElementById('grade-select');          
    const kanjiSelect = document.getElementById('kanji-select');          
    const fontSelect = document.getElementById('font-select');          
    const titleText = document.getElementById('title-text');          
    const kanjiInfo = document.getElementById('kanji-info');          
    const btnClear = document.getElementById('btn-clear');          
    const btnCheck = document.getElementById('btn-check');          
    const btnNext = document.getElementById('btn-next');          
    const overlay = document.getElementById('overlay');          
    const resultMark = document.getElementById('result-mark');          
    const scoreText = document.getElementById('score-text');          
          
    const bgCanvas = document.getElementById('bgCanvas');          
    const drawCanvas = document.getElementById('drawCanvas');          
    const bgCtx = bgCanvas.getContext('2d');          
    const drawCtx = drawCanvas.getContext('2d');          
          
    // Initialization          
    function init() {          
        setupEventListeners();          
        updateLanguage(currentLang);          
    }          
          
    function updateLanguage(lang) {          
        currentLang = lang;          
        const texts = i18n[lang] || i18n.ja;          
                  
        titleText.textContent = texts.title;          
        btnClear.textContent = texts.clear;          
        btnCheck.textContent = texts.check;          
        btnNext.textContent = texts.next;          
          
        // Grade Select rebuild          
        gradeSelect.innerHTML = '';          
        texts.grades.forEach((g, idx) => {          
            const opt = document.createElement('option');          
            opt.value = idx;          
            opt.textContent = g;          
            gradeSelect.appendChild(opt);          
        });          
        gradeSelect.value = currentGradeIndex;          
          
        populateKanjiSelect();          
        loadCurrentKanji();          
    }          
          
    function populateKanjiSelect() {          
        kanjiSelect.innerHTML = '';          
        const list = kanjiData[currentGradeIndex] || [];          
        list.forEach((item, idx) => {          
            const opt = document.createElement('option');          
            opt.value = idx;          
            opt.textContent = `${idx + 1}. ${item.char}`;          
            kanjiSelect.appendChild(opt);          
        });          
        kanjiSelect.value = currentKanjiIndex;          
    }          
          
    function loadCurrentKanji() {          
        hideOverlay();          
        clearDrawCanvas();          
                  
        const list = kanjiData[currentGradeIndex] || [];          
        if (list.length === 0) return;          
        if (currentKanjiIndex >= list.length) currentKanjiIndex = 0;          
          
        const item = list[currentKanjiIndex];          
        const texts = i18n[currentLang] || i18n.ja;          
        kanjiInfo.textContent = `${texts.read}: ${item.read || '-'}`;          
          
        drawGuideKanji(item.char);          
    }          
          
    function drawGuideKanji(char) {          
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);          
        bgCtx.save();          
        bgCtx.fillStyle = '#e2e8f0';          
        bgCtx.font = `200px ${fontFamilies[currentFont]}`;          
        bgCtx.textAlign = 'center';          
        bgCtx.textBaseline = 'middle';          
        bgCtx.fillText(char, bgCanvas.width / 2, bgCanvas.height / 2 + 10);          
        bgCtx.restore();          
    }          
          
    function clearDrawCanvas() {          
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);          
    }          
          
    function hideOverlay() {          
        overlay.classList.remove('show');          
    }          
          
    // Event Handlers          
    function setupEventListeners() {          
        langSelect.addEventListener('change', (e) => updateLanguage(e.target.value));          
        gradeSelect.addEventListener('change', (e) => {          
            currentGradeIndex = parseInt(e.target.value, 10);          
            currentKanjiIndex = 0;          
            populateKanjiSelect();          
            loadCurrentKanji();          
        });          
        kanjiSelect.addEventListener('change', (e) => {          
            currentKanjiIndex = parseInt(e.target.value, 10);          
            loadCurrentKanji();          
        });          
        fontSelect.addEventListener('change', (e) => {          
            currentFont = e.target.value;          
            loadCurrentKanji();          
        });          
          
        btnClear.addEventListener('click', () => {          
            clearDrawCanvas();          
            hideOverlay();          
        });          
          
        btnNext.addEventListener('click', () => {          
            const list = kanjiData[currentGradeIndex] || [];          
            currentKanjiIndex = (currentKanjiIndex + 1) % list.length;          
            kanjiSelect.value = currentKanjiIndex;          
            loadCurrentKanji();          
        });          
          
        btnCheck.addEventListener('click', evaluateDrawing);          
          
        // Drawing events          
        drawCanvas.addEventListener('mousedown', startDrawing);          
        drawCanvas.addEventListener('mousemove', draw);          
        drawCanvas.addEventListener('mouseup', stopDrawing);          
        drawCanvas.addEventListener('mouseleave', stopDrawing);          
          
        drawCanvas.addEventListener('touchstart', (e) => {          
            e.preventDefault();          
            const touch = e.touches[0];          
            startDrawing(touch);          
        });          
        drawCanvas.addEventListener('touchmove', (e) => {          
            e.preventDefault();          
            const touch = e.touches[0];          
            draw(touch);          
        });          
        drawCanvas.addEventListener('touchend', stopDrawing);          
    }          
          
    function getCanvasPoint(e) {          
        const rect = drawCanvas.getBoundingClientRect();          
        return {          
            x: (e.clientX - rect.left) * (drawCanvas.width / rect.width),          
            y: (e.clientY - rect.top) * (drawCanvas.height / rect.height)          
        };          
    }          
          
    function startDrawing(e) {          
        hideOverlay();          
        isDrawing = true;          
        lastPoint = getCanvasPoint(e);          
    }          
          
    function draw(e) {          
        if (!isDrawing) return;          
        const currentPoint = getCanvasPoint(e);          
                  
        drawCtx.beginPath();          
        drawCtx.moveTo(lastPoint.x, lastPoint.y);          
        drawCtx.lineTo(currentPoint.x, currentPoint.y);          
        drawCtx.strokeStyle = '#2c3e50';          
        drawCtx.lineWidth = 14;          
        drawCtx.lineCap = 'round';          
        drawCtx.lineJoin = 'round';          
        drawCtx.stroke();          
          
        lastPoint = currentPoint;          
    }          
          
    function stopDrawing() {          
        isDrawing = false;          
    }          
          
    // Evaluation Logic          
    function evaluateDrawing() {          
        const w = drawCanvas.width;          
        const h = drawCanvas.height;          
        const drawData = drawCtx.getImageData(0, 0, w, h).data;          
                  
        // Render target kanji to temporary offscreen canvas for comparison          
        const tempCanvas = document.createElement('canvas');          
        tempCanvas.width = w;          
        tempCanvas.height = h;          
        const tempCtx = tempCanvas.getContext('2d');          
                  
        const list = kanjiData[currentGradeIndex] || [];          
        const char = list[currentKanjiIndex].char;          
                  
        tempCtx.fillStyle = '#000000';          
        tempCtx.font = `200px ${fontFamilies[currentFont]}`;          
        tempCtx.textAlign = 'center';          
        tempCtx.textBaseline = 'middle';          
        tempCtx.fillText(char, w / 2, h / 2 + 10);          
                  
        const targetData = tempCtx.getImageData(0, 0, w, h).data;          
          
        let targetPixelCount = 0;          
        let userPixelCount = 0;          
        let matchPixelCount = 0;          
          
        for (let i = 0; i < drawData.length; i += 4) {          
            const userAlpha = drawData[i + 3];          
            const targetAlpha = targetData[i + 3];          
          
            const isUserDrawn = userAlpha > 50;          
            const isTargetDrawn = targetAlpha > 50;          
          
            if (isTargetDrawn) targetPixelCount++;          
            if (isUserDrawn) userPixelCount++;          
            if (isUserDrawn && isTargetDrawn) matchPixelCount++;          
        }          
          
        if (userPixelCount === 0) {          
            showResult('×', '0%', 'mark-cross');          
            return;          
        }          
          
        const recallScore = matchPixelCount / targetPixelCount; // How much of target covered          
        const precisionScore = matchPixelCount / userPixelCount; // How accurate user strokes are          
        const score = Math.round(((recallScore * 0.6) + (precisionScore * 0.4)) * 100);          
          
        let mark = '×';          
        let markClass = 'mark-cross';          
          
        if (score >= 80) {          
            mark = '◎';          
            markClass = 'mark-double';          
        } else if (score >= 60) {          
            mark = '○';          
            markClass = 'mark-single';          
        } else if (score >= 40) {          
            mark = '△';          
            markClass = 'mark-triangle';          
        }          
          
        showResult(mark, `${score}%`, markClass);          
    }          
          
    function showResult(mark, scoreStr, markClass) {          
        resultMark.textContent = mark;          
        resultMark.className = `result-mark ${markClass}`;          
        scoreText.textContent = scoreStr;          
        overlay.classList.add('show');          
    }          
          
    init();          
})();
