<!DOCTYPE html>    
<html lang="ja">    
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    
    <title>かんじ れんしゅう / Kanji Practice</title>    
    <style>    
        * {    
            box-sizing: border-box;    
            touch-action: manipulation;    
            margin: 0;    
            padding: 0;    
        }    
    
        body {    
            font-family: sans-serif;    
            background-color: #f4f7f6;    
            color: #333;    
            display: flex;    
            flex-direction: column;    
            align-items: center;    
            min-height: 100vh;    
            padding: 10px;    
        }    
    
        header {    
            width: 100%;    
            max-width: 600px;    
            display: flex;    
            justify-content: space-between;    
            align-items: center;    
            margin-bottom: 10px;    
            padding: 5px 0;    
        }    
    
        h1 {    
            font-size: 1.2rem;    
            color: #2c3e50;    
        }    
    
        select {    
            font-family: sans-serif;    
            font-size: 0.9rem;    
            padding: 5px 8px;    
            border-radius: 5px;    
            border: 1px solid #ccc;    
            background-color: #fff;    
        }    
    
        .controls {    
            width: 100%;    
            max-width: 600px;    
            display: flex;    
            gap: 8px;    
            margin-bottom: 15px;    
            flex-wrap: wrap;    
        }    
    
        .controls select {    
            flex: 1;    
            min-width: 110px;    
            padding: 8px;    
            font-size: 0.95rem;    
        }    
    
        .app-container {    
            width: 100%;    
            max-width: 600px;    
            background: #ffffff;    
            border-radius: 12px;    
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);    
            padding: 15px;    
            display: flex;    
            flex-direction: column;    
            align-items: center;    
        }    
    
        .info-panel {    
            width: 100%;    
            text-align: center;    
            margin-bottom: 10px;    
        }    
    
        .kanji-info {    
            font-size: 1rem;    
            font-weight: bold;    
            color: #34495e;    
            min-height: 1.5em;    
            word-break: break-all;    
        }    
    
        /* 漢字手書き領域 */    
        .canvas-wrapper {    
            position: relative;    
            width: 280px;    
            height: 280px;    
            border: 4px solid #34495e;    
            border-radius: 8px;    
            background-color: #fff;    
            /* 田の字補助線 */    
            background-image:     
                linear-gradient(to right, transparent 49.5%, #e0e0e0 49.5%, #e0e0e0 50.5%, transparent 50.5%),    
                linear-gradient(to bottom, transparent 49.5%, #e0e0e0 49.5%, #e0e0e0 50.5%, transparent 50.5%);    
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);    
            margin-bottom: 15px;    
        }    
    
        canvas {    
            position: absolute;    
            top: 0;    
            left: 0;    
            width: 100%;    
            height: 100%;    
            touch-action: none;    
        }    
    
        /* 判定オーバーレイ表示 */    
        .overlay {    
            position: absolute;    
            top: 0;    
            left: 0;    
            width: 100%;    
            height: 100%;    
            display: flex;    
            flex-direction: column;    
            justify-content: center;    
            align-items: center;    
            pointer-events: none;    
            opacity: 0;    
            transition: opacity 0.2s ease;    
            background-color: rgba(255, 255, 255, 0.35);    
        }    
    
        .overlay.show {    
            opacity: 1;    
        }    
    
        .result-mark {    
            font-family: sans-serif;    
            font-weight: bold;    
            font-size: 130px;    
            line-height: 1;    
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);    
        }    
    
        .mark-double { color: #ff4757; } /* ◎ 二重丸 */    
        .mark-single { color: #2ed573; } /* ○ 丸 */    
        .mark-triangle { color: #ffa502; } /* △ 三角 */    
        .mark-cross { color: #57606f; } /* × バツ */    
    
        .score-text {    
            font-family: sans-serif;    
            font-size: 1.1rem;    
            font-weight: bold;    
            color: #2c3e50;    
            background: rgba(255, 255, 255, 0.95);    
            padding: 4px 12px;    
            border-radius: 12px;    
            margin-top: 5px;    
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);    
        }    
    
        .buttons {    
            display: flex;    
            gap: 10px;    
            width: 100%;    
            justify-content: center;    
        }    
    
        button {    
            font-family: sans-serif;    
            padding: 10px 20px;    
            font-size: 1rem;    
            font-weight: bold;    
            border: none;    
            border-radius: 6px;    
            cursor: pointer;    
            transition: background 0.2s, transform 0.1s;    
        }    
    
        button:active {    
            transform: scale(0.96);    
        }    
    
        .btn-clear { background-color: #e74c3c; color: white; }    
        .btn-check { background-color: #2ecc71; color: white; }    
        .btn-next  { background-color: #3498db; color: white; }    
    
        @media (max-height: 600px) {    
            .canvas-wrapper { width: 220px; height: 220px; }    
            .result-mark { font-size: 100px; }    
        }    
    </style>    
</head>

        <select id="lang-select" aria-label="Language Select">

    <div class="controls">

    </div>    
    
    <div class="app-container">    
        <div class="info-panel">

        </div>    
    
        <div class="canvas-wrapper">

            <canvas id="drawCanvas" width="280" height="280"></canvas>    
                
            <div class="overlay" id="overlay">

            </div>    
        </div>    
    
        <div class="buttons">    
            <button class="btn-clear" id="btn-clear">けす</button>

    const titleText = document.getElementById('title-text');    
    const kanjiInfo = document.getElementById('kanji-info');    
        
    const bgCanvas = document.getElementById('bgCanvas');    
    const bgCtx = bgCanvas.getContext('2d', { willReadFrequently: true });    
    const drawCanvas = document.getElementById('drawCanvas');    
    const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });    
    
    // 判定計算用（判定膨張処理用の非表示Canvas）    
    const maskCanvas = document.createElement('canvas');    
    maskCanvas.width = 280;    
    maskCanvas.height = 280;    
    const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });    
    
    const btnClear = document.getElementById('btn-clear');    
    const btnCheck = document.getElementById('btn-check');    
    const btnNext = document.getElementById('btn-next');    
    const overlay = document.getElementById('overlay');    
    const resultMark = document.getElementById('result-mark');    
    const scoreText = document.getElementById('score-text');    
    
    let audioCtx = null;    
    
    function getAudioContext() {    
        if (!audioCtx) {    
            const AudioContext = window.AudioContext || window.webkitAudioContext;    
            if (AudioContext) audioCtx = new AudioContext();    
        }    
        if (audioCtx && audioCtx.state === 'suspended') {    
            audioCtx.resume();    
        }    
        return audioCtx;    
    }    
    
    function playSuccessSound() {    
        const ctx = getAudioContext();    
        if (!ctx) return;    
    
        const now = ctx.currentTime;    
        const osc1 = ctx.createOscillator();    
        const osc2 = ctx.createOscillator();    
        const gain = ctx.createGain();    
    
        osc1.type = 'sine';    
        osc2.type = 'sine';    
    
        osc1.frequency.setValueAtTime(659.25, now);    
        osc2.frequency.setValueAtTime(830.61, now + 0.15);    
    
        gain.gain.setValueAtTime(0.3, now);    
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);    
    
        osc1.connect(gain);    
        osc2.connect(gain);    
        gain.connect(ctx.destination);    
    
        osc1.start(now);    
        osc1.stop(now + 0.15);    
        osc2.start(now + 0.15);    
        osc2.stop(now + 0.8);    
    }    
    
    function playBuzzerSound() {    
        const ctx = getAudioContext();    
        if (!ctx) return;    
    
        const now = ctx.currentTime;    
        const osc1 = ctx.createOscillator();    
        const osc2 = ctx.createOscillator();    
        const gain = ctx.createGain();    
    
        osc1.type = 'sawtooth';    
        osc2.type = 'sawtooth';    
    
        osc1.frequency.setValueAtTime(140, now);    
        osc2.frequency.setValueAtTime(143, now);    
    
        gain.gain.setValueAtTime(0.2, now);    
        gain.gain.setValueAtTime(0.01, now + 0.2);    
        gain.gain.setValueAtTime(0.2, now + 0.25);    
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);    
    
        osc1.connect(gain);    
        osc2.connect(gain);    
        gain.connect(ctx.destination);    
    
        osc1.start(now);    
        osc2.start(now);    
        osc1.stop(now + 0.55);    
        osc2.stop(now + 0.55);    
    }    
    
    function updateLanguage() {    
        const texts = i18n[currentLang];    
        titleText.textContent = texts.title;    
        btnClear.textContent = texts.clear;    
        btnCheck.textContent = texts.check;    
        btnNext.textContent = texts.next;    
    
        const prevGrade = gradeSelect.value;    
        gradeSelect.innerHTML = '';    
        texts.grades.forEach((g, idx) => {    
            const opt = document.createElement('option');    
            opt.value = idx;    
            opt.textContent = g;    
            gradeSelect.appendChild(opt);    
        });    
        gradeSelect.value = prevGrade !== "" && prevGrade < texts.grades.length ? prevGrade : 0;    
    
        updateKanjiList();    
    }    
    
    function updateKanjiList() {    
        currentGrade = parseInt(gradeSelect.value, 10) || 0;    
        const list = kanjiData[currentGrade] || kanjiData[0];    
            
        kanjiSelect.innerHTML = '';    
        list.forEach((item, idx) => {    
            const opt = document.createElement('option');    
            opt.value = idx;    
            opt.textContent = `${idx + 1}. ${item.char}`;    
            kanjiSelect.appendChild(opt);    
        });    
    
        currentKanjiIndex = 0;    
        kanjiSelect.value = 0;    
        loadCurrentKanji();    
    }    
    
    function loadCurrentKanji() {    
        clearCanvas();    
        hideOverlay();    
        updateKanjiInfo();    
        drawBackgroundKanji();    
    }    
    
    function updateKanjiInfo() {    
        const list = kanjiData[currentGrade] || kanjiData[0];    
        const item = list[currentKanjiIndex];    
        const label = i18n[currentLang].read;    
        if (item) {    
            kanjiInfo.textContent = `${label}: ${item.read}`;    
        } else {    
            kanjiInfo.textContent = '';    
        }    
    }    
    
    // 選択中のフォント（明朝／ゴシック）で文字を描画    
    function drawBackgroundKanji() {    
        const list = kanjiData[currentGrade] || kanjiData[0];    
        const item = list[currentKanjiIndex];    
        if (!item) return;    
    
        bgCtx.fillStyle = '#ffffff';    
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);    
    
        bgCtx.font = `200px ${fontFamilies[currentFont]}`;    
        bgCtx.textAlign = 'center';    
        bgCtx.textBaseline = 'middle';    
        bgCtx.fillStyle = '#dcdde1';    
        bgCtx.fillText(item.char, bgCanvas.width / 2, bgCanvas.height / 2 + 15);    
    }    
    
    function getPos(e) {    
        const rect = drawCanvas.getBoundingClientRect();    
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;    
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;    
        return {    
            x: (clientX - rect.left) * (drawCanvas.width / rect.width),    
            y: (clientY - rect.top) * (drawCanvas.height / rect.height)    
        };    
    }    
    
    function startDrawing(e) {    
        e.preventDefault();    
        getAudioContext();    
        isDrawing = true;    
        hasDrawn = true;    
        const pos = getPos(e);    
        drawCtx.beginPath();    
        drawCtx.moveTo(pos.x, pos.y);    
        drawCtx.strokeStyle = '#2c3e50';    
        drawCtx.lineWidth = 14;    
        drawCtx.lineCap = 'round';    
        drawCtx.lineJoin = 'round';    
    }    
    
    function draw(e) {    
        if (!isDrawing) return;    
        e.preventDefault();    
        const pos = getPos(e);    
        drawCtx.lineTo(pos.x, pos.y);    
        drawCtx.stroke();    
    }    
    
    function stopDrawing() {    
        if (!isDrawing) return;    
        isDrawing = false;    
        drawCtx.closePath();    
    }    
    
    function clearCanvas() {    
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);    
        hasDrawn = false;    
        hideOverlay();    
    }    
    
    /**    
     * 【厳格判定ロジック】    
     * 塗りつぶし対策：はみ出しペナルティの導入と太幅許容エリアの生成    
     */    
    function evaluateDrawing() {    
        if (!hasDrawn) return;    
    
        const list = kanjiData[currentGrade] || kanjiData[0];    
        const item = list[currentKanjiIndex];    
        if (!item) return;    
    
        const width = 280;    
        const height = 280;    
    
        // 1. 正解許容ゾーン（マスク）を作成：太い線幅で文字を描画して多少のズレを許容    
        maskCtx.fillStyle = '#ffffff';    
        maskCtx.fillRect(0, 0, width, height);    
        maskCtx.font = `200px ${fontFamilies[currentFont]}`;    
        maskCtx.textAlign = 'center';    
        maskCtx.textBaseline = 'middle';    
        maskCtx.strokeStyle = '#000000';    
        maskCtx.lineWidth = 32; // 太い輪郭でなぞりの誤差を許容    
        maskCtx.strokeText(item.char, width / 2, height / 2 + 15);    
        maskCtx.fillStyle = '#000000';    
        maskCtx.fillText(item.char, width / 2, height / 2 + 15);    
    
        // 2. ピクセル取得    
        const bgData = bgCtx.getImageData(0, 0, width, height).data;      // 見本（細い線）    
        const maskData = maskCtx.getImageData(0, 0, width, height).data;  // 正解許容エリア（太線）    
        const drawData = drawCtx.getImageData(0, 0, width, height).data;  // 子供の手書き線    
    
        let targetPixels = 0;     // 見本のピクセル数    
        let userPixels = 0;       // 手書きの全ピクセル数    
        let coveredPixels = 0;    // 正しい線をなぞれたピクセル数    
        let outOfBoundsPixels = 0;// 許容エリア外にはみ出した（塗りつぶした）ピクセル数    
    
        for (let i = 0; i < bgData.length; i += 4) {    
            const isTarget = (bgData[i] < 240 || bgData[i+1] < 240 || bgData[i+2] < 240);    
            const isAllowed = (maskData[i] < 200 || maskData[i+1] < 200 || maskData[i+2] < 200);    
            const isDrawn = (drawData[i + 3] > 50);    
    
            if (isTarget) targetPixels++;    
            if (isDrawn) {    
                userPixels++;    
                if (isAllowed) {    
                    coveredPixels++;    
                } else {    
                    outOfBoundsPixels++; // はみ出し（塗り潰し）領域    
                }    
            }    
        }    
    
        if (targetPixels === 0 || userPixels === 0) return;    
    
        // 【計算】なぞり達成度（0.0〜1.0）    
        const coverage = Math.min(1.0, coveredPixels / (targetPixels * 0.85));    
    
        // 【計算】はみ出しペナルティ率（はみ出しピクセル数 / 手書き全ピクセル数）    
        const penaltyRatio = outOfBoundsPixels / userPixels;    
    
        // 最終スコア（％）：達成度から「はみ出しペナルティ（2.0倍の重み）」を減算    
        let finalScore = Math.round((coverage - (penaltyRatio * 2.0)) * 100);    
        if (finalScore < 0) finalScore = 0;    
    
        showResult(finalScore);    
    }    
    
    function showResult(score) {    
        resultMark.className = 'result-mark';    
        scoreText.textContent = `てんすう: ${score}てん`;    
    
        if (score >= 70) {    
            resultMark.textContent = '◎';    
            resultMark.classList.add('mark-double');    
            playSuccessSound();    
        } else if (score >= 45) {    
            resultMark.textContent = '○';    
            resultMark.classList.add('mark-single');    
            playSuccessSound();    
        } else if (score >= 20) {    
            resultMark.textContent = '△';    
            resultMark.classList.add('mark-triangle');    
            playBuzzerSound();    
        } else {    
            resultMark.textContent = '×';    
            resultMark.classList.add('mark-cross');    
            playBuzzerSound();    
        }    
    
        overlay.classList.add('show');    
    }    
    
    function hideOverlay() {    
        overlay.classList.remove('show');    
    }    
    
    function nextKanji() {    
        const list = kanjiData[currentGrade] || kanjiData[0];    
        if (list.length === 0) return;    
        currentKanjiIndex = (currentKanjiIndex + 1) % list.length;    
        kanjiSelect.value = currentKanjiIndex;    
        loadCurrentKanji();    
    }    
    
    function initEvents() {    
        langSelect.addEventListener('change', (e) => {    
            currentLang = e.target.value;    
            updateLanguage();    
        });    
    
        gradeSelect.addEventListener('change', () => {    
            updateKanjiList();    
        });    
    
        kanjiSelect.addEventListener('change', (e) => {    
            currentKanjiIndex = parseInt(e.target.value, 10) || 0;    
            loadCurrentKanji();    
        });    
    
        // フォント切替イベント    
        fontSelect.addEventListener('change', (e) => {    
            currentFont = e.target.value;    
            loadCurrentKanji();    
        });    
    
        btnClear.addEventListener('click', clearCanvas);    
        btnCheck.addEventListener('click', evaluateDrawing);    
        btnNext.addEventListener('click', nextKanji);    
    
        drawCanvas.addEventListener('mousedown', startDrawing);    
        drawCanvas.addEventListener('mousemove', draw);    
        window.addEventListener('mouseup', stopDrawing);    
    
        drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });    
        drawCanvas.addEventListener('touchmove', draw, { passive: false });    
        drawCanvas.addEventListener('touchend', stopDrawing);    
    }    
    
    function init() {    
        initEvents();    
        updateLanguage();    
    }    
    
    if (document.readyState === 'loading') {    
        document.addEventListener('DOMContentLoaded', init);    
    } else {    
        init();    
    }    
})();    
</script>    
</body>    
</html>
