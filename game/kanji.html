<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>かんじ れんしゅう / Kanji Practice</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "MS Mincho", "MS 明朝", "Yu Mincho", "游明朝", serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 5px 0;
        }

        h1 {
            font-size: 1.2rem;
            color: #2c3e50;
        }

        select {
            font-family: sans-serif;
            font-size: 0.9rem;
            padding: 5px 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
        }

        .controls {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .controls select {
            flex: 1;
            min-width: 120px;
            padding: 8px;
            font-size: 1rem;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-panel {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .kanji-info {
            font-size: 1rem;
            font-weight: bold;
            color: #34495e;
            min-height: 1.5em;
        }

        .canvas-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            border: 4px solid #34495e;
            border-radius: 8px;
            background-color: #fff;
            /* 十字の補助線（田の字枠） */
            background-image: 
                linear-gradient(to right, transparent 49.5%, #e0e0e0 49.5%, #e0e0e0 50.5%, transparent 50.5%),
                linear-gradient(to bottom, transparent 49.5%, #e0e0e0 49.5%, #e0e0e0 50.5%, transparent 50.5%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.show {
            opacity: 1;
        }

        .flower-mark {
            width: 220px;
            height: 220px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        button {
            font-family: sans-serif;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-check { background-color: #2ecc71; color: white; }
        .btn-next  { background-color: #3498db; color: white; }

        @media (max-height: 600px) {
            .canvas-wrapper { width: 220px; height: 220px; }
            .flower-mark { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="title-text">漢字練習</h1>
        <select id="lang-select" aria-label="Language Select">
            <option value="ja" selected>日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </header>

    <div class="controls">
        <select id="grade-select" aria-label="Grade Select"></select>
        <select id="kanji-select" aria-label="Kanji Select"></select>
    </div>

    <div class="app-container">
        <div class="info-panel">
            <div class="kanji-info" id="kanji-info"></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="bgCanvas" width="280" height="280"></canvas>
            <canvas id="drawCanvas" width="280" height="280"></canvas>
            
            <div class="overlay" id="overlay">
                <svg class="flower-mark" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" stroke="#ff4757" stroke-width="8" fill="none" stroke-dasharray="251" stroke-dashoffset="0"/>
                    <circle cx="50" cy="50" r="28" stroke="#ff4757" stroke-width="5" fill="none"/>
                </svg>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-clear" id="btn-clear">けす</button>
            <button class="btn-check" id="btn-check">できた！</button>
            <button class="btn-next"  id="btn-next">つぎへ</button>
        </div>
    </div>

<script>
(function() {
    'use strict';

    const i18n = {
        ja: { title: "かんじ れんしゅう", grades: ["小1 (80字)", "小2 (160字)", "小3 (200字)", "小4 (200字)", "小5 (185字)", "小6 (181字)"], clear: "けす", check: "できた！", next: "つぎへ", read: "かんじ" },
        en: { title: "Kanji Practice", grades: ["Grade 1 (80)", "Grade 2 (160)", "Grade 3 (200)", "Grade 4 (200)", "Grade 5 (185)", "Grade 6 (181)"], clear: "Clear", check: "Check", next: "Next", read: "Kanji" },
        zh: { title: "汉字练习", grades: ["一年级 (80)", "二年级 (160)", "三年级 (200)", "四年级 (200)", "五年级 (185)", "六年级 (181)"], clear: "清除", check: "完成！", next: "下一个", read: "汉字" },
        ko: { title: "한자 연습", grades: ["1학년 (80)", "2학년 (160)", "3학년 (200)", "4학년 (200)", "5학년 (185)", "6학년 (181)"], clear: "지우기", check: "확인!", next: "다음", read: "한자" },
        fr: { title: "Pratique Kanji", grades: ["CP (80)", "CE1 (160)", "CE2 (200)", "CM1 (200)", "CM2 (185)", "6ème (181)"], clear: "Effacer", check: "Vérifier", next: "Suivant", read: "Kanji" },
        es: { title: "Práctica Kanji", grades: ["1º Grado (80)", "2º Grado (160)", "3º Grado (200)", "4º Grado (200)", "5º Grado (185)", "6º Grado (181)"], clear: "Borrar", check: "Comprobar", next: "Siguiente", read: "Kanji" }
    };

    // 学年別漢字配当表 (全1,026字)
    const kanjiData = {
        0: "一右雨円王音下火花貝九休玉金空月犬見五口校左三子四糸字耳七山手十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文名目六林力立木本".split(""),
        1: "引羽雲園遠何科夏家歌画回会海絵外角楽活間丸岩顔汽記帰弓牛魚京強教近兄形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙寺自時7場色食心新親図数西声星晴切多太体台地池知茶昼長鳥朝直通弟店点電刀冬当東答頭同道読南半番父風分聞米歩母方北毎妹万鳴毛門夜野用友曜来里理話".replace("7","社弱首秋週春書少").split(""),
        2: "悪安暗医委意育員院飲運泳駅央横屋温化荷界開階寒感館漢岸起期客究急級宮球去橋業曲局銀区苦具君係軽血決研県庫湖向幸港号根祭皿仕死使始指歯詩次事持式実写者主守取酒受州拾終習集住重宿所暑助昭消商章勝乗植申身神真深進世整昔全相送想息速族他打対待代第題炭短談着注柱丁帳調追定庭笛鉄転都島投豆登等湯動童農波配倍箱畑発反坂板皮悲美鼻筆病品表秒負部服福物平返勉放味命面油喩有遊予羊洋葉陽様落流旅両緑礼列練路和".replace("喩","問役薬由").split(""),
        3: "愛案以衣位囲胃印英栄塩億加果貨課芽改械害街各覚完官管関観願希季紀喜旗器機議求泣救救挙漁共協鏡競極訓軍郡径型景芸欠結建健験固功好候康告差菜最材昨札刷殺察参産散残司史士氏試置事滋児辞失借種周祝順初松笑唱焼照賞臣信成省清静席積折節説浅戦選然争倉巣束側足続卒孫帯隊単短男典伝的飛費必票標不夫付府副粉兵別辺変便包法鉢牧末満未脈民無命面問夜野薬由油有遊予羊洋葉陽様落流旅両緑礼列練路和".replace("置事滋","治辞").replace("短男","単達").replace("鉢","報").replace("命面問夜野薬由油有遊予羊洋葉陽様落流旅両緑礼列練路和","要約勇要養浴利陸良料量輪類令冷例歴連老労録").split(""),
        4: "圧移因永営衛易益液演応往仮価河過賀快解格確額刊幹慣眼基経規技義逆久旧居許境均禁句群経潔件券険検限現減故個護効厚耕鉱構興講混査災採際在罪雑酸賛支志枝師資飼示似識質舎謝授修述術准序承招証条状常情職織制性政勢精製税責績接設舌絶銭祖素総造像増則測属率損退貸態団断築張提程低敵統導徳銅独任然能破犯判版比肥非備俵評貧布婦富複仏払編弁保墓報防貿暴務霧迷模訳郵預容予用留領".replace("然","燃").replace("払","豊").replace("霧","夢").replace("予用","余").split(""),
        5: "異遺域宇映延沿我灰拡革閣割株干巻看簡危機揮貴疑吸供胸郷勤筋系敬警劇激穴絹権憲源厳己呼誤后好孝皇紅鋼刻穀骨困砂座裁策冊蚕至私姿視詞誌磁射捨尺若樹収宗就衆従縦縮熟純処署諸除将傷障城蒸針仁垂推寸盛聖誠宣専泉洗染善奏窓創装層操蔵臓存尊宅担探誕段暖値宙忠著庁潮頂賃痛展討党糖届難乳認納脳派拝背肺俳班晩否批秘腹奮並陛閉片補暮宝訪亡忘棒枚幕密盟模訳郵優幼欲翌乱卵覧裏律臨朗論".replace("好","刻").split("")
    };

    let currentLang = 'ja';
    let currentGrade = 0;
    let currentKanjiIndex = 0;
    let isDrawing = false;
    let hasDrawn = false;

    const langSelect = document.getElementById('lang-select');
    const gradeSelect = document.getElementById('grade-select');
    const kanjiSelect = document.getElementById('kanji-select');
    const titleText = document.getElementById('title-text');
    const kanjiInfo = document.getElementById('kanji-info');
    
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d', { alpha: false });
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');

    const btnClear = document.getElementById('btn-clear');
    const btnCheck = document.getElementById('btn-check');
    const btnNext = document.getElementById('btn-next');
    const overlay = document.getElementById('overlay');

    let audioCtx = null;

    function getAudioContext() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playSuccessSound() {
        const ctx = getAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'sine';

        osc1.frequency.setValueAtTime(659.25, now);
        osc2.frequency.setValueAtTime(830.61, now + 0.15);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc1.stop(now + 0.15);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.8);
    }

    function updateLanguage() {
        const texts = i18n[currentLang];
        titleText.textContent = texts.title;
        btnClear.textContent = texts.clear;
        btnCheck.textContent = texts.check;
        btnNext.textContent = texts.next;

        const prevGrade = gradeSelect.value;
        gradeSelect.innerHTML = '';
        texts.grades.forEach((g, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = g;
            gradeSelect.appendChild(opt);
        });
        gradeSelect.value = prevGrade !== "" ? prevGrade : 0;

        updateKanjiInfo();
    }

    function updateKanjiList() {
        currentGrade = parseInt(gradeSelect.value, 10) || 0;
        const list = kanjiData[currentGrade] || [];
        
        kanjiSelect.innerHTML = '';
        list.forEach((char, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `${idx + 1}. ${char}`;
            kanjiSelect.appendChild(opt);
        });

        currentKanjiIndex = 0;
        kanjiSelect.value = 0;
        loadCurrentKanji();
    }

    function loadCurrentKanji() {
        clearCanvas();
        hideOverlay();
        updateKanjiInfo();
        drawBackgroundKanji();
    }

    function updateKanjiInfo() {
        const list = kanjiData[currentGrade] || [];
        const char = list[currentKanjiIndex];
        const label = i18n[currentLang].read;
        if (char) {
            kanjiInfo.textContent = `${label}: ${char} (${currentKanjiIndex + 1} / ${list.length})`;
        } else {
            kanjiInfo.textContent = '';
        }
    }

    function drawBackgroundKanji() {
        const list = kanjiData[currentGrade] || [];
        const char = list[currentKanjiIndex];
        if (!char) return;

        bgCtx.fillStyle = '#ffffff';
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

        bgCtx.font = '200px "MS Mincho", "MS 明朝", "Yu Mincho", "游明朝", serif';
        bgCtx.textAlign = 'center';
        bgCtx.textBaseline = 'middle';
        bgCtx.fillStyle = '#e0e0e0';
        bgCtx.fillText(char, bgCanvas.width / 2, bgCanvas.height / 2 + 15);
    }

    function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (drawCanvas.width / rect.width),
            y: (clientY - rect.top) * (drawCanvas.height / rect.height)
        };
    }

    function startDrawing(e) {
        e.preventDefault();
        getAudioContext();
        isDrawing = true;
        hasDrawn = true;
        const pos = getPos(e);
        drawCtx.beginPath();
        drawCtx.moveTo(pos.x, pos.y);
        drawCtx.strokeStyle = '#2c3e50';
        drawCtx.lineWidth = 14;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        drawCtx.lineTo(pos.x, pos.y);
        drawCtx.stroke();
    }

    function stopDrawing(e) {
        if (!isDrawing) return;
        isDrawing = false;
        drawCtx.closePath();
    }

    function clearCanvas() {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        hasDrawn = false;
        hideOverlay();
    }

    function checkDrawing() {
        if (!hasDrawn) return;
        showOverlay();
        playSuccessSound();
    }

    function showOverlay() {
        overlay.classList.add('show');
    }

    function hideOverlay() {
        overlay.classList.remove('show');
    }

    function nextKanji() {
        const list = kanjiData[currentGrade] || [];
        if (list.length === 0) return;
        currentKanjiIndex = (currentKanjiIndex + 1) % list.length;
        kanjiSelect.value = currentKanjiIndex;
        loadCurrentKanji();
    }

    function initEvents() {
        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            updateLanguage();
        });

        gradeSelect.addEventListener('change', () => {
            updateKanjiList();
        });

        kanjiSelect.addEventListener('change', (e) => {
            currentKanjiIndex = parseInt(e.target.value, 10) || 0;
            loadCurrentKanji();
        });

        btnClear.addEventListener('click', clearCanvas);
        btnCheck.addEventListener('click', checkDrawing);
        btnNext.addEventListener('click', nextKanji);

        drawCanvas.addEventListener('mousedown', startDrawing);
        drawCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
        drawCanvas.addEventListener('touchmove', draw, { passive: false });
        drawCanvas.addEventListener('touchend', stopDrawing);
    }

    function init() {
        initEvents();
        updateLanguage();
        updateKanjiList();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
