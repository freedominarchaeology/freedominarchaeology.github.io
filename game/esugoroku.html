<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Sugoroku / オフライン絵双六</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "MS Mincho", "MS 明朝", "Yu Mincho", serif;
    }
    body {
      background-color: #2b2622;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
    }
    header {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: #3d352e;
      border: 1px solid #5c5045;
      border-radius: 6px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    label { font-size: 13px; }
    select, button {
      font-family: inherit;
      padding: 4px 8px;
      font-size: 13px;
      border: 1px solid #736456;
      border-radius: 4px;
      background: #2b2622;
      color: #f0e6d2;
      cursor: pointer;
    }
    select:focus, button:focus { outline: 2px solid #c2a680; }
    button:hover { background: #4a4037; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .player-config {
      width: 100%;
      max-width: 700px;
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      justify-content: space-between;
      background: #352d26;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #5c5045;
      flex-wrap: wrap;
    }
    .p-box {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
    .p-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-panel {
      width: 100%;
      max-width: 700px;
      margin-bottom: 10px;
      padding: 8px 16px;
      background: #3d352e;
      border-radius: 6px;
      border: 1px solid #5c5045;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-message {
      font-size: 14px;
      font-weight: bold;
      color: #c2a680;
    }
    .dice-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dice-box {
      width: 36px;
      height: 36px;
      background: #f0e6d2;
      color: #2b2622;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.4);
    }

    .board-container {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1 / 1;
      position: relative;
      background: #dcb35c;
      border: 8px solid #8f6d28;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    svg.board-svg {
      width: 100%;
      height: 100%;
    }
    .tile-rect {
      stroke: #5c4118;
      stroke-width: 2;
    }
    .tile-start { fill: #d1e7dd; }
    .tile-goal { fill: #f8d7da; }
    .tile-normal { fill: #fef5e7; }
    .tile-forward { fill: #d0e1fd; }
    .tile-back { fill: #fff3cd; }
    .tile-skip { fill: #e2e3e5; }
    .tile-reset { fill: #f5c2c7; }

    .tile-text {
      font-size: 10px;
      fill: #2b2622;
      text-anchor: middle;
      dominant-baseline: middle;
      font-weight: bold;
    }
    .tile-num {
      font-size: 9px;
      fill: #8f6d28;
      text-anchor: start;
    }
  </style>
</head>
<body>

<header>
  <div class="control-group">
    <label id="lbl-players" for="select-count">人数:</label>
    <select id="select-count">
      <option value="2" selected>2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
    </select>

    <label id="lbl-level" for="select-level">CPU難易度:</label>
    <select id="select-level">
      <option value="1">初級</option>
      <option value="2">低級</option>
      <option value="3">中級</option>
      <option value="4" selected>上級</option>
      <option value="5">特級</option>
      <option value="6">異常</option>
    </select>
  </div>

  <div class="control-group">
    <label id="lbl-lang" for="select-lang">言語:</label>
    <select id="select-lang">
      <option value="ja" selected>日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
    <button id="btn-restart">リセット</button>
  </div>
</header>

<div class="player-config" id="player-config">
  <!-- 動的プレイヤー設定 -->
</div>

<div class="status-panel">
  <div class="status-message" id="status-text">ゲーム開始</div>
  <div class="dice-area">
    <div class="dice-box" id="dice-val">?</div>
    <button id="btn-roll">サイコロを振る</button>
  </div>
</div>

<div class="board-container">
  <svg class="board-svg" viewBox="0 0 500 500" id="board-svg">
    <!-- SVG動的生成 -->
  </svg>
</div>

<script>
(function() {
  'use strict';

  const PLAYER_COLORS = ['#e63946', '#1d3557', '#2a9d8f', '#f4a261'];
  const PLAYER_NAMES = ['P1', 'P2', 'P3', 'P4'];

  const I18N = {
    ja: {
      players: "人数:", level: "CPU難易度:", lang: "言語:", restart: "リセット",
      roll: "振る", human: "人間", cpu: "CPU",
      startMsg: "サイコロを振ってください",
      turn: "の番です",
      rolled: "の出目: ",
      skip: "1回休み！",
      fwd: "マス進む！",
      back: "マス戻る！",
      reset: "振り出しに戻る！",
      goal: "がゴールしました！勝利！",
      skipped: "は1回休みです",
      levels: ["初級", "低級", "中級", "上級", "特級", "異常"],
      tiles: { start: "振り出し", goal: "上がり", norm: "", fwd1: "+1進む", fwd2: "+2進む", back1: "-1戻る", back2: "-2戻る", skip: "休み", reset: "振り出し" }
    },
    en: {
      players: "Count:", level: "CPU Level:", lang: "Lang:", restart: "Reset",
      roll: "Roll", human: "Human", cpu: "CPU",
      startMsg: "Roll the dice to start",
      turn: "'s Turn",
      rolled: " rolled ",
      skip: " Skip a turn!",
      fwd: " spaces forward!",
      back: " spaces back!",
      reset: " Back to Start!",
      goal: " reached the Goal! Winner!",
      skipped: " skips a turn.",
      levels: ["Beginner", "Easy", "Medium", "Hard", "Expert", "Insane"],
      tiles: { start: "Start", goal: "Goal", norm: "", fwd1: "+1 Forward", fwd2: "+2 Forward", back1: "-1 Back", back2: "-2 Back", skip: "Skip", reset: "Reset" }
    },
    zh: {
      players: "人数:", level: "CPU难度:", lang: "语言:", restart: "重置",
      roll: "掷骰子", human: "玩家", cpu: "CPU",
      startMsg: "请掷骰子开始游戏",
      turn: "的回合",
      rolled: " 掷出了 ",
      skip: " 暂停一次！",
      fwd: " 格前进！",
      back: " 格后退！",
      reset: " 返回起点！",
      goal: " 终点到达！胜利！",
      skipped: " 暂停一回合",
      levels: ["初级", "低级", "中级", "高级", "特级", "噩梦"],
      tiles: { start: "起点", goal: "终点", norm: "", fwd1: "+1前进", fwd2: "+2前进", back1: "-1后退", back2: "-2后退", skip: "暂停", reset: "重置" }
    },
    ko: {
      players: "인원:", level: "CPU난이도:", lang: "언어:", restart: "리셋",
      roll: "굴리기", human: "인간", cpu: "CPU",
      startMsg: "주사위를 굴려주세요",
      turn: "의 차례",
      rolled: "의 주사위: ",
      skip: " 1회 쉬기!",
      fwd: " 칸 전진!",
      back: " 칸 후진!",
      reset: " 출발점으로!",
      goal: " 골인! 승리!",
      skipped: "님은 1회 쉅니다",
      levels: ["초급", "하급", "중급", "상급", "특급", "이상의"],
      tiles: { start: "출발", goal: "골인", norm: "", fwd1: "+1전진", fwd2: "+2전진", back1: "-1후진", back2: "-2후진", skip: "쉬기", reset: "리셋" }
    },
    fr: {
      players: "Joueurs:", level: "Niveau CPU:", lang: "Langue:", restart: "Réinit.",
      roll: "Lancer", human: "Humain", cpu: "CPU",
      startMsg: "Lancez le dé pour commencer",
      turn: " Tour de ",
      rolled: " a obtenu ",
      skip: " Passez un tour !",
      fwd: " cases en avant !",
      back: " cases en arrière !",
      reset: " Retour au départ !",
      goal: " a atteint le But ! Victoire !",
      skipped: " passe son tour.",
      levels: ["Débutant", "Facile", "Moyen", "Difficile", "Expert", "Insensé"],
      tiles: { start: "Départ", goal: "Arrivée", norm: "", fwd1: "+1 Avancer", fwd2: "+2 Avancer", back1: "-1 Reculer", back2: "-2 Reculer", skip: "Passe", reset: "Départ" }
    },
    es: {
      players: "Jugadores:", level: "Nivel CPU:", lang: "Idioma:", restart: "Reiniciar",
      roll: "Lanzar", human: "Humano", cpu: "CPU",
      startMsg: "Lanza el dado para empezar",
      turn: "Turno de ",
      rolled: " sacó ",
      skip: " ¡Pierde un turno!",
      fwd: " ¡Casillas adelante!",
      back: " ¡Casillas atrás!",
      reset: " ¡Vuelve al Inicio!",
      goal: " ¡Llegó a la Meta! ¡Victoria!",
      skipped: " pierde un turno.",
      levels: ["Principiante", "Fácil", "Medio", "Difícil", "Experto", "Demencial"],
      tiles: { start: "Inicio", goal: "Meta", norm: "", fwd1: "+1 Avanza", fwd2: "+2 Avanza", back1: "-1 Retrocede", back2: "-2 Retrocede", skip: "Pierde", reset: "Inicio" }
    }
  };

  // 25マスの盤面データ型定義 (タイプ: start, goal, norm, fwd1, fwd2, back1, back2, skip, reset)
  const TILE_TYPES = [
    'start', 'norm', 'fwd1', 'norm', 'skip',
    'norm', 'back1', 'norm', 'fwd2', 'norm',
    'reset', 'norm', 'skip', 'fwd1', 'norm',
    'back2', 'norm', 'fwd1', 'norm', 'skip',
    'norm', 'back1', 'norm', 'fwd2', 'goal'
  ];

  // 5x5 スネーク（蛇行）グリッド配置マップ
  const GRID_POS = [
    [0,0],[1,0],[2,0],[3,0],[4,0],
    [4,1],[3,1],[2,1],[1,1],[0,1],
    [0,2],[1,2],[2,2],[3,2],[4,2],
    [4,3],[3,3],[2,3],[1,3],[0,3],
    [0,4],[1,4],[2,4],[3,4],[4,4]
  ];

  // 状態変数
  let playerCount = 2;
  let cpuLevel = 4;
  let lang = 'ja';
  let playerTypes = ['human', 'cpu', 'cpu', 'cpu'];
  let positions = [0, 0, 0, 0];
  let skipTurn = [false, false, false, false];
  let currentTurn = 0;
  let isAnimating = false;
  let isGameOver = false;

  const domSvg = document.getElementById('board-svg');
  const domStatus = document.getElementById('status-text');
  const domDiceVal = document.getElementById('dice-val');
  const domBtnRoll = document.getElementById('btn-roll');
  const domBtnRestart = document.getElementById('btn-restart');
  const domSelectCount = document.getElementById('select-count');
  const domSelectLevel = document.getElementById('select-level');
  const domSelectLang = document.getElementById('select-lang');
  const domPlayerConfig = document.getElementById('player-config');

  function initGame() {
    positions.fill(0);
    skipTurn.fill(false);
    currentTurn = 0;
    isAnimating = false;
    isGameOver = false;
    domDiceVal.textContent = '?';

    renderPlayerConfigUI();
    drawStaticBoard();
    renderAll();
    checkTurnAutoPlay();
  }

  function renderPlayerConfigUI() {
    domPlayerConfig.textContent = '';
    const dict = I18N[lang];

    for (let i = 0; i < playerCount; i++) {
      const box = document.createElement('div');
      box.className = 'p-box';

      const dot = document.createElement('span');
      dot.className = 'p-color-dot';
      dot.style.backgroundColor = PLAYER_COLORS[i];

      const lbl = document.createElement('span');
      lbl.textContent = PLAYER_NAMES[i] + ":";

      const sel = document.createElement('select');
      const optH = document.createElement('option');
      optH.value = 'human'; optH.textContent = dict.human;
      const optC = document.createElement('option');
      optC.value = 'cpu'; optC.textContent = dict.cpu;

      sel.appendChild(optH);
      sel.appendChild(optC);
      sel.value = playerTypes[i];

      const pIdx = i;
      sel.addEventListener('change', (e) => {
        playerTypes[pIdx] = e.target.value;
        checkTurnAutoPlay();
      });

      box.appendChild(dot);
      box.appendChild(lbl);
      box.appendChild(sel);
      domPlayerConfig.appendChild(box);
    }
  }

  function drawStaticBoard() {
    domSvg.textContent = '';

    const tileSize = 84;
    const margin = 40;

    // トラック接続線
    for (let i = 0; i < TILE_TYPES.length - 1; i++) {
      const p1 = GRID_POS[i];
      const p2 = GRID_POS[i+1];
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', margin + p1[0] * tileSize + tileSize/2);
      line.setAttribute('y1', margin + p1[1] * tileSize + tileSize/2);
      line.setAttribute('x2', margin + p2[0] * tileSize + tileSize/2);
      line.setAttribute('y2', margin + p2[1] * tileSize + tileSize/2);
      line.setAttribute('stroke', '#8f6d28');
      line.setAttribute('stroke-width', '6');
      line.setAttribute('stroke-linecap', 'round');
      domSvg.appendChild(line);
    }

    // マス目
    const dict = I18N[lang];
    TILE_TYPES.forEach((type, idx) => {
      const pos = GRID_POS[idx];
      const x = margin + pos[0] * tileSize;
      const y = margin + pos[1] * tileSize;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x + 4);
      rect.setAttribute('y', y + 4);
      rect.setAttribute('width', tileSize - 8);
      rect.setAttribute('height', tileSize - 8);
      rect.setAttribute('rx', 8);
      rect.setAttribute('class', 'tile-rect tile-' + type);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', x + tileSize/2);
      text.setAttribute('y', y + tileSize/2);
      text.setAttribute('class', 'tile-text');
      text.textContent = dict.tiles[type] || '';

      const num = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      num.setAttribute('x', x + 8);
      num.setAttribute('y', y + 16);
      num.setAttribute('class', 'tile-num');
      num.textContent = idx === 0 ? 'Start' : (idx === 24 ? 'Goal' : idx);

      g.appendChild(rect);
      g.appendChild(text);
      g.appendChild(num);
      domSvg.appendChild(g);
    });

    // プレイヤーのコマグループ
    const pieceGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    pieceGroup.setAttribute('id', 'layer-pieces');
    domSvg.appendChild(pieceGroup);
  }

  function updateUI() {
    const dict = I18N[lang];
    document.getElementById('lbl-players').textContent = dict.players;
    document.getElementById('lbl-level').textContent = dict.level;
    document.getElementById('lbl-lang').textContent = dict.lang;
    domBtnRoll.textContent = dict.roll;
    domBtnRestart.textContent = dict.restart;

    const opts = domSelectLevel.options;
    for (let i = 0; i < opts.length; i++) opts[i].textContent = dict.levels[i];

    if (!isGameOver) {
      domStatus.textContent = PLAYER_NAMES[currentTurn] + dict.turn;
      domBtnRoll.disabled = isAnimating || playerTypes[currentTurn] === 'cpu';
    }
  }

  function renderAll() {
    updateUI();

    const layerPieces = domSvg.getElementById('layer-pieces');
    layerPieces.textContent = '';

    const tileSize = 84;
    const margin = 40;

    // 各プレイヤーのコマ描画
    for (let i = 0; i < playerCount; i++) {
      const posIdx = positions[i];
      const grid = GRID_POS[posIdx];
      const baseX = margin + grid[0] * tileSize + tileSize/2;
      const baseY = margin + grid[1] * tileSize + tileSize/2;

      // 重なり防止のオフセット
      const offsetX = (i % 2 === 0 ? -12 : 12);
      const offsetY = (i < 2 ? -12 : 12);

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', baseX + offsetX);
      circle.setAttribute('cy', baseY + offsetY);
      circle.setAttribute('r', 10);
      circle.setAttribute('fill', PLAYER_COLORS[i]);
      circle.setAttribute('stroke', '#ffffff');
      circle.setAttribute('stroke-width', '2');

      layerPieces.appendChild(circle);
    }
  }

  function handleRoll() {
    if (isAnimating || isGameOver) return;
    executeTurn();
  }

  function executeTurn() {
    const dict = I18N[lang];

    if (skipTurn[currentTurn]) {
      skipTurn[currentTurn] = false;
      domStatus.textContent = PLAYER_NAMES[currentTurn] + dict.skipped;
      setTimeout(nextTurn, 1000);
      return;
    }

    isAnimating = true;
    domBtnRoll.disabled = true;

    // サイコロ演出
    let rolls = 0;
    const interval = setInterval(() => {
      const tempVal = Math.floor(Math.random() * 6) + 1;
      domDiceVal.textContent = tempVal;
      rolls++;

      if (rolls > 8) {
        clearInterval(interval);
        const diceVal = getAdjustedDiceRoll();
        domDiceVal.textContent = diceVal;
        processMove(diceVal);
      }
    }, 60);
  }

  // CPU難易度に応じたサイコロ目調整
  function getAdjustedDiceRoll() {
    const raw = Math.floor(Math.random() * 6) + 1;
    if (playerTypes[currentTurn] !== 'cpu' || cpuLevel <= 3) return raw;

    // 上級〜異常: 残りマス数やピッタリゴールを微計算
    const target = 24 - positions[currentTurn];
    if (target <= 6 && Math.random() < (cpuLevel * 0.12)) {
      return target; // ピッタリ目を出しやすくする
    }
    return raw;
  }

  function processMove(steps) {
    const dict = I18N[lang];
    let currPos = positions[currentTurn];
    let targetPos = currPos + steps;

    // ピッタリ上がりのオーバー調整
    if (targetPos > 24) {
      const over = targetPos - 24;
      targetPos = 24 - over;
    }

    // 駒を進めるステップアニメーション
    let stepCount = 0;
    const moveInterval = setInterval(() => {
      if (currPos < targetPos) currPos++;
      else if (currPos > targetPos) currPos--;

      positions[currentTurn] = currPos;
      renderAll();
      stepCount++;

      if (currPos === targetPos) {
        clearInterval(moveInterval);
        setTimeout(() => handleTileEffect(targetPos), 300);
      }
    }, 180);
  }

  // マス目イベント処理
  function handleTileEffect(posIdx) {
    const dict = I18N[lang];
    const type = TILE_TYPES[posIdx];
    let msg = PLAYER_NAMES[currentTurn] + dict.rolled + domDiceVal.textContent;

    if (posIdx === 24) {
      domStatus.textContent = PLAYER_NAMES[currentTurn] + dict.goal;
      isGameOver = true;
      isAnimating = false;
      renderAll();
      return;
    }

    let extraDelay = 800;

    switch (type) {
      case 'skip':
        skipTurn[currentTurn] = true;
        msg += dict.skip;
        break;
      case 'fwd1':
        positions[currentTurn] = Math.min(24, positions[currentTurn] + 1);
        msg += " +1" + dict.fwd;
        break;
      case 'fwd2':
        positions[currentTurn] = Math.min(24, positions[currentTurn] + 2);
        msg += " +2" + dict.fwd;
        break;
      case 'back1':
        positions[currentTurn] = Math.max(0, positions[currentTurn] - 1);
        msg += " -1" + dict.back;
        break;
      case 'back2':
        positions[currentTurn] = Math.max(0, positions[currentTurn] - 2);
        msg += " -2" + dict.back;
        break;
      case 'reset':
        positions[currentTurn] = 0;
        msg += dict.reset;
        break;
    }

    domStatus.textContent = msg;
    renderAll();

    if (positions[currentTurn] === 24) {
      domStatus.textContent = PLAYER_NAMES[currentTurn] + dict.goal;
      isGameOver = true;
      isAnimating = false;
      return;
    }

    setTimeout(nextTurn, extraDelay);
  }

  function nextTurn() {
    currentTurn = (currentTurn + 1) % playerCount;
    isAnimating = false;
    renderAll();
    checkTurnAutoPlay();
  }

  function checkTurnAutoPlay() {
    if (isGameOver || isAnimating) return;
    if (playerTypes[currentTurn] === 'cpu') {
      domBtnRoll.disabled = true;
      setTimeout(executeTurn, 600);
    } else {
      domBtnRoll.disabled = false;
    }
  }

  // イベントリスナー
  domBtnRoll.addEventListener('click', handleRoll);
  domBtnRestart.addEventListener('click', initGame);
  domSelectLang.addEventListener('change', (e) => { lang = e.target.value; renderPlayerConfigUI(); drawStaticBoard(); renderAll(); });
  domSelectCount.addEventListener('change', (e) => {
    playerCount = parseInt(e.target.value, 10);
    initGame();
  });
  domSelectLevel.addEventListener('change', (e) => { cpuLevel = parseInt(e.target.value, 10); });

  initGame();
})();
</script>
</body>
</html>
