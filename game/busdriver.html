<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>君はバスの運転手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Hiragino Mincho ProN", serif;
            background-color: #1a1a2e;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .btn-press:active {
            transform: scale(0.95);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #16213e;
        }
        ::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 3px;
        }
    </style>
</head>

    <!-- Container keeping game off browser edge -->
    <div class="w-full max-w-4xl bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col h-[94vh] max-h-[900px] relative">

                <h2 id="overlay-title" class="text-3xl sm:text-4xl font-extrabold text-amber-400 mb-4">君はバスの運転手</h2>
                <p id="overlay-desc" class="text-slate-300 text-sm sm:text-base mb-6 max-w-md leading-relaxed">

                </p>

                    運転開始

            </div>

        let currentLang = "ja";

        // --- Audio Synthesizer (Web Audio API) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, delay = 0) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + delay + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + duration);
                } catch (e) {}
            }
            playFanfare() {
                this.init();
                if (!this.ctx) return;
                const notes = [
                    { f: 523.25, d: 0.15, time: 0 },
                    { f: 659.25, d: 0.15, time: 0.15 },
                    { f: 783.99, d: 0.15, time: 0.30 },
                    { f: 1046.50, d: 0.60, time: 0.45 }
                ];
                notes.forEach(n => this.playTone(n.f, 'triangle', n.d, n.time));
            }
            playCrash() {
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                } catch(e) {}
            }
            playChime() {
                this.init();
                this.playTone(880, 'sine', 0.2, 0);
                this.playTone(1760, 'sine', 0.3, 0.15);
            }
        }
        const sfx = new SoundFX();

        // Screen Resizing

            canvas.width = container.clientWidth;

                busY = canvas.height * 0.75;

            currentLang = lang;
            const t = I18N[lang] || I18N.ja;
            
            document.getElementById('txt-title').textContent = t.title;
            document.getElementById('txt-score-label').textContent = t.score;
            document.getElementById('txt-hud-speed').textContent = t.speed;
            document.getElementById('txt-hud-dist').textContent = t.dist;
            document.getElementById('txt-hud-busstop').textContent = t.busstop;
            document.getElementById('txt-hud-missed').textContent = t.missed;
            document.getElementById('overlay-desc').textContent = t.startDesc;
            document.getElementById('btn-start').textContent = gameState === 'START' ? t.startBtn : t.restartBtn;
            document.getElementById('txt-btn-brake').textContent = t.brake;
            document.getElementById('txt-btn-accel').textContent = t.accel;
            document.getElementById('txt-footer-controls').textContent = t.controls;
            
            if (gameState === 'GAMEOVERWrongWay') {
                document.getElementById('overlay-title').textContent = t.gameOverWrongWay;
            } else if (gameState === 'GAMEOVERCrash') {
                document.getElementById('overlay-title').textContent = t.gameOverCrash;
            } else if (gameState === 'GAMEOVERMissed') {
                document.getElementById('overlay-title').textContent = t.gameOverMissed;
            } else if (gameState === 'CLEAR') {
                document.getElementById('overlay-title').textContent = t.clearTitle;
                document.getElementById('overlay-desc').textContent = t.clearDesc;
            }
        }

        document.getElementById('lang-select').addEventListener('change', (e) => {
            updateLanguage(e.target.value);
        });

        // --- Init World ---
        function initWorld() {
            buildings = [];
            npcVehicles = [];
            busStops = [];

            isBoardingActive = false;

            for (let i = 0; i < 16; i++) {

                    height: 80 + Math.random() * 30,
                    color: `hsl(${Math.random() * 40 + 200}, 25%, ${Math.random() * 20 + 25}%)`

            npcVehicles.push({ x: 0.22, y: -400, speed: 40, type: 'car', color: '#ef4444' });

            nextBusStopDist = 0.8;
        }

        // --- Steering Wheel Controls ---
        const wheelElem = document.getElementById('wheel-container');
        const wheelSvg = document.getElementById('wheel-svg');

        function updateWheelCenter() {
            const rect = wheelElem.getBoundingClientRect();
            wheelCenter = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        function calculateAngle(pointerX, pointerY) {
            const dx = pointerX - wheelCenter.x;
            const dy = pointerY - wheelCenter.y;
            let rad = Math.atan2(dy, dx) + Math.PI / 2;
            let deg = rad * (180 / Math.PI);
            if (deg > 180) deg -= 360;
            if (deg < -180) deg += 360;
            return Math.max(-120, Math.min(120, deg));
        }

        function setWheelRotation(deg) {
            wheelAngle = deg;
            wheelSvg.style.transform = `rotate(${deg}deg)`;
        }

        wheelElem.addEventListener('pointerdown', (e) => {
            isDraggingWheel = true;
            updateWheelCenter();
            wheelElem.setPointerCapture(e.pointerId);
            setWheelRotation(calculateAngle(e.clientX, e.clientY));
        });

        wheelElem.addEventListener('pointermove', (e) => {
            if (isDraggingWheel) {
                setWheelRotation(calculateAngle(e.clientX, e.clientY));
            }
        });

        const stopWheelDrag = (e) => {
            if (isDraggingWheel) {
                isDraggingWheel = false;
                try { wheelElem.releasePointerCapture(e.pointerId); } catch(ex){}
            }
        };
        wheelElem.addEventListener('pointerup', stopWheelDrag);
        wheelElem.addEventListener('pointercancel', stopWheelDrag);

        // --- Controls ---
        let isAccelPressed = false;

        const btnAccel = document.getElementById('btn-accel');
        const btnBrake = document.getElementById('btn-brake');

        const bindPress = (elem, setter) => {
            elem.addEventListener('pointerdown', (e) => { e.preventDefault(); setter(true); });
            elem.addEventListener('pointerup', (e) => { e.preventDefault(); setter(false); });
            elem.addEventListener('pointerleave', (e) => { e.preventDefault(); setter(false); });
        };
        bindPress(btnAccel, (v) => isAccelPressed = v);
        bindPress(btnBrake, (v) => isBrakePressed = v);

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        // --- Game Loop Update ---
        function update(dt) {
            if (gameState !== 'PLAYING') return;

            const t = I18N[currentLang] || I18N.ja;

            // 1. Acceleration / Braking
            const accelActive = isAccelPressed || keys.KeyW || keys.ArrowUp;
            const brakeActive = isBrakePressed || keys.KeyS || keys.ArrowDown;

            if (accelActive) {
                busSpeed += ACCEL_RATE * dt;
            } else if (brakeActive) {
                busSpeed -= BRAKE_RATE * dt;
            } else {
                busSpeed -= FRICTION * dt;
            }
            busSpeed = Math.max(0, Math.min(MAX_SPEED, busSpeed));

            // 2. Steering Input
            if (!isDraggingWheel) {
                if (keys.KeyA || keys.ArrowLeft) {
                    wheelAngle = Math.max(-90, wheelAngle - 180 * dt);
                } else if (keys.KeyD || keys.ArrowRight) {
                    wheelAngle = Math.min(90, wheelAngle + 180 * dt);
                } else {
                    if (wheelAngle > 0) wheelAngle = Math.max(0, wheelAngle - 240 * dt);
                    if (wheelAngle < 0) wheelAngle = Math.min(0, wheelAngle + 240 * dt);
                }
                setWheelRotation(wheelAngle);
            }

            const turnFactor = (wheelAngle / 120) * 1.5; 
            busAngle = turnFactor * 0.35;

            const speedRatio = busSpeed / MAX_SPEED;
            busX += turnFactor * speedRatio * 320 * dt;
            busX = Math.max(BUS_WIDTH / 2, Math.min(canvas.width - BUS_WIDTH / 2, busX));

            // Distance Traveled
            const distIncrementKm = (busSpeed / 3600) * dt;
            distanceKm += distIncrementKm;

            // Goal Check (7.00 km)
            if (distanceKm >= TARGET_DISTANCE_KM) {
                distanceKm = TARGET_DISTANCE_KM;
                triggerClear();
                return;
            }

            // 3. Scroll Road & Environment
            const movePixels = busSpeed * 6 * dt;
            roadOffset = (roadOffset + movePixels) % 80;

            buildings.forEach(b => {
                b.y += movePixels;
                if (b.y > canvas.height + 100) {
                    b.y = -120;
                    b.width = 60 + Math.random() * 40;
                }
            });

            // 4. NPC Traffic Logic & Safe Zone
            npcVehicles.forEach(npc => {
                const isOpposing = npc.x < 0.5;
                const relativeSpeed = isOpposing ? (busSpeed + npc.speed) : (busSpeed - npc.speed);
                npc.y += relativeSpeed * 3.5 * dt;

                if (npc.y > canvas.height + 200) {
                    npc.y = -Math.random() * 600 - 300;
                } else if (npc.y < -800) {
                    npc.y = canvas.height + 100;
                }

                // Collision Check (Bypassed during bus stop boarding to prevent accidents)
                if (!isBoardingActive) {
                    const npcRealX = npc.x * canvas.width;
                    if (Math.abs(busX - npcRealX) < (BUS_WIDTH * 0.85) && Math.abs(busY - npc.y) < (BUS_HEIGHT * 0.85)) {
                        triggerGameOver(isOpposing ? 'GAMEOVERWrongWay' : 'GAMEOVERCrash');
                    }
                }
            });

            // 5. Wrong-Way Driving Safety Check
            const roadDividerX = canvas.width * 0.5;
            if (busX < roadDividerX - 10) {
                triggerGameOver('GAMEOVERWrongWay');
                return;
            }

            // 6. Bus Stop Logic (Safe Parking & Passed Stop Check)
            let hudMsg = "";
            const currentStopDistRemaining = nextBusStopDist - distanceKm;

            if (currentStopDistRemaining <= 0.05 && currentStopDistRemaining >= -0.05) {
                if (busSpeed === 0) {
                    isBoardingActive = true; // Protect from accidents while stopped
                    boardingTimer += dt;
                    hudMsg = t.msgBoarding;
                    if (boardingTimer >= 1.8) {
                        score += 1000;
                        hudMsg = t.msgComplete;
                        sfx.playChime();
                        nextBusStopDist += 1.2 + Math.random() * 0.6;
                        boardingTimer = 0;
                        isBoardingActive = false;
                    }
                } else {
                    isBoardingActive = false;
                    hudMsg = t.msgStop;
                }
            } else if (currentStopDistRemaining < -0.05) {
                // Passed bus stop without stopping!
                missedStops++;
                isBoardingActive = false;
                if (missedStops >= MAX_MISSED_STOPS) {
                    triggerGameOver('GAMEOVERMissed');
                    return;
                }
                // Move to next stop target
                nextBusStopDist += 1.2 + Math.random() * 0.6;
                boardingTimer = 0;
            } else {
                isBoardingActive = false;
                boardingTimer = 0;
            }

            // HUD UI Updates
            document.getElementById('hud-speed').textContent = `${Math.round(busSpeed)} km/h`;
            document.getElementById('hud-dist').textContent = `${distanceKm.toFixed(2)} / ${TARGET_DISTANCE_KM.toFixed(2)} km`;
            document.getElementById('hud-busstop').textContent = `${Math.max(0, currentStopDistRemaining).toFixed(2)} km`;
            document.getElementById('hud-missed').textContent = `${missedStops} / ${MAX_MISSED_STOPS}`;
            document.getElementById('score-val').textContent = score;
            document.getElementById('hud-msg').textContent = hudMsg;
        }

        // --- Render Loop ---
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;

            // Background
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, w, h);

            // Buildings
            buildings.forEach(b => {
                const bX = b.side === 'left' ? 10 : w - b.width - 10;
                ctx.fillStyle = b.color;
                ctx.fillRect(bX, b.y, b.width, b.height);
                ctx.fillStyle = '#fef08a';
                for (let wx = bX + 8; wx < bX + b.width - 10; wx += 14) {
                    for (let wy = b.y + 10; wy < b.y + b.height - 10; wy += 20) {
                        ctx.fillRect(wx, wy, 7, 10);
                    }
                }
            });

            // 4-Lane Road
            const roadWidth = w * 0.65;
            const roadLeft = (w - roadWidth) / 2;
            const laneWidth = roadWidth / 4;

            ctx.fillStyle = '#334155';
            ctx.fillRect(roadLeft, 0, roadWidth, h);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(roadLeft + 4, 0, 4, h);
            ctx.fillRect(roadLeft + roadWidth - 8, 0, 4, h);

            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(roadLeft + laneWidth * 2 - 4, 0, 3, h);
            ctx.fillRect(roadLeft + laneWidth * 2 + 1, 0, 3, h);

            ctx.fillStyle = '#cbd5e1';
            for (let y = -80 + roadOffset; y < h; y += 40) {
                ctx.fillRect(roadLeft + laneWidth - 1, y, 3, 20);
                ctx.fillRect(roadLeft + laneWidth * 3 - 1, y, 3, 20);
            }

            // Bus Stop Zone
            const stopDistDiff = nextBusStopDist - distanceKm;
            if (stopDistDiff < 0.3 && stopDistDiff > -0.1) {
                const stopY = busY - (stopDistDiff * 3000);
                const stopX = roadLeft + roadWidth - 25;

                ctx.strokeStyle = isBoardingActive ? '#10b981' : '#f59e0b';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(roadLeft + laneWidth * 3 + 5, stopY - 50, laneWidth - 10, 100);
                ctx.setLineDash([]);

                ctx.fillStyle = '#ec4899';
                ctx.fillRect(stopX, stopY - 20, 18, 40);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('BUS', stopX - 2, stopY - 25);
            }

            // NPC Vehicles
            npcVehicles.forEach(npc => {
                const nx = npc.x * w;
                const ny = npc.y;

                ctx.save();
                ctx.translate(nx, ny);
                if (npc.x < 0.5) ctx.rotate(Math.PI);

                ctx.fillStyle = npc.color;
                ctx.fillRect(-16, -32, 32, 64);
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(-12, -10, 24, 25);
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(-14, -32, 6, 4);
                ctx.fillRect(8, -32, 6, 4);

                ctx.restore();
            });

            // Player Bus
            ctx.save();
            ctx.translate(busX, busY);
            ctx.rotate(busAngle);

            // Safe Zone Aura Indicator when boarding passengers
            if (isBoardingActive) {
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 4;
                ctx.strokeRect(-BUS_WIDTH / 2 - 6, -BUS_HEIGHT / 2 - 6, BUS_WIDTH + 12, BUS_HEIGHT + 12);
            }

            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(-BUS_WIDTH / 2, -BUS_HEIGHT / 2, BUS_WIDTH, BUS_HEIGHT);

            ctx.fillStyle = '#0284c7';
            ctx.fillRect(-BUS_WIDTH / 2, -BUS_HEIGHT / 2 + 15, BUS_WIDTH, 8);

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-BUS_WIDTH / 2 + 3, -BUS_HEIGHT / 2 + 3, BUS_WIDTH - 6, 12);

            ctx.fillRect(-BUS_WIDTH / 2 + 4, BUS_HEIGHT / 2 - 8, BUS_WIDTH - 8, 5);

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-BUS_WIDTH / 2 + 1, -BUS_HEIGHT / 2 + 28, 3, 35);
            ctx.fillRect(BUS_WIDTH / 2 - 4, -BUS_HEIGHT / 2 + 28, 3, 35);

            ctx.fillStyle = '#475569';
            ctx.fillRect(-BUS_WIDTH / 2 - 5, -BUS_HEIGHT / 2 + 5, 5, 8);
            ctx.fillRect(BUS_WIDTH / 2, -BUS_HEIGHT / 2 + 5, 5, 8);

            ctx.fillStyle = '#fef08a';
            ctx.fillRect(-BUS_WIDTH / 2 + 3, -BUS_HEIGHT / 2 - 2, 8, 3);
            ctx.fillRect(BUS_WIDTH / 2 - 11, -BUS_HEIGHT / 2 - 2, 8, 3);

            ctx.restore();
        }

        // --- Main Game Loop ---
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min(0.1, (timestamp - lastTime) / 1000);
            lastTime = timestamp;

            update(dt);
            render();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- State Controllers ---
        function startGame() {
            sfx.init();
            gameState = 'PLAYING';
            score = 0;
            distanceKm = 0;
            busSpeed = 0;
            busAngle = 0;
            wheelAngle = 0;
            setWheelRotation(0);
            
            resizeCanvas();
            initWorld();

            document.getElementById('screen-overlay').classList.add('hidden');
        }

        function triggerGameOver(reasonState) {
            gameState = reasonState;
            sfx.playCrash();
            
            const t = I18N[currentLang] || I18N.ja;
            const overlay = document.getElementById('screen-overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('btn-start');

            if (reasonState === 'GAMEOVERWrongWay') {
                title.textContent = t.gameOverWrongWay;
            } else if (reasonState === 'GAMEOVERMissed') {
                title.textContent = t.gameOverMissed;
            } else {
                title.textContent = t.gameOverCrash;
            }

            title.className = "text-2xl sm:text-3xl font-extrabold text-red-500 mb-4";
            desc.textContent = `${t.score}: ${score} pt | ${t.dist} ${distanceKm.toFixed(2)} km`;
            btn.textContent = t.restartBtn;

            overlay.classList.remove('hidden');
        }

        function triggerClear() {
            gameState = 'CLEAR';
            sfx.playFanfare();

            const t = I18N[currentLang] || I18N.ja;
            const overlay = document.getElementById('screen-overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('btn-start');

            title.textContent = t.clearTitle;
            title.className = "text-3xl sm:text-4xl font-extrabold text-emerald-400 mb-4";
            desc.textContent = `${t.clearDesc}\n${t.score}: ${score} pt`;
            btn.textContent = t.restartBtn;

            overlay.classList.remove('hidden');
        }

        // Event Listener Bindings
        document.getElementById('btn-start').addEventListener('click', startGame);

        // Initial setup
        resizeCanvas();
        updateLanguage('ja');
        animationFrameId = requestAnimationFrame(gameLoop);

        // Cleanup leak preventer
        window.addEventListener('unload', () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        });
    </script>
</body>
</html>
