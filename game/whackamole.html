<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>もぐらたたき / Whack-a-Mole</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "游明朝", serif;
            background-color: #1a252f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
        }

        header {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        select {
            font-family: inherit;
            padding: 6px 12px;
            font-size: 14px;
            background-color: #2c3e50;
            color: #fff;
            border: 1px solid #34495e;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
        }

        .dashboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
        }

        /* Responsive 3D Stage */
        .stage-container {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            perspective: 600px;
            margin: 10px 0;
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            background: #2e7d32;
            padding: 12px;
            border-radius: 15px;
            transform: rotateX(35deg);
            transform-style: preserve-3d;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.4);
        }

        .hole {
            position: relative;
            background: #1b1008;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.9), 0 2px 0 rgba(255,255,255,0.2);
            transform-style: preserve-3d;
        }

        .mole {
            position: absolute;
            width: 70%;
            height: 80%;
            left: 15%;
            bottom: -80%;
            background: linear-gradient(135deg, #795548, #4e342e);
            border-radius: 40% 40% 10% 10%;
            transition: bottom 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            cursor: pointer;
            box-shadow: 0 -4px 8px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
        }

        .mole::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            box-shadow: 18px 0 0 #000;
        }

        .mole::after {
            content: '';
            width: 12px;
            height: 8px;
            background: #e91e63;
            border-radius: 50%;
            margin-top: 6px;
        }

        .mole.up {
            bottom: 5%;
        }

        .mole.hit {
            background: #c62828;
            transition: bottom 0.1s ease-in;
        }

        .btn {
            font-family: inherit;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background: #e67e22;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d35400;
            transition: all 0.1s ease;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d35400;
        }

        .btn:disabled {
            background: #7f8c8d;
            box-shadow: 0 4px 0 #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <select id="langSelect" aria-label="Language Select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </header>

    <div class="container">
        <h1 id="title">もぐらたたき</h1>
        
        <div class="dashboard">
            <div><span id="labelScore">スコア</span>: <span id="score">0</span></div>
            <div><span id="labelTime">残り時間</span>: <span id="time">30</span>s</div>
        </div>

        <div class="stage-container">
            <div class="board" id="board">
                <!-- 9 Holes generated dynamically once -->
            </div>
        </div>

        <button class="btn" id="startBtn">スタート</button>
    </div>

    <script>
        'use strict';

        // i18n Dictionary
        const i18n = {
            ja: { title: "もぐらたたき", score: "スコア", time: "残り時間", start: "スタート", restart: "再挑戦", over: "ゲーム終了！ スコア: " },
            en: { title: "Whack-a-Mole", score: "Score", time: "Time", start: "Start", restart: "Play Again", over: "Game Over! Score: " },
            zh: { title: "打地鼠", score: "得分", time: "剩余时间", start: "开始游戏", restart: "再玩一次", over: "游戏结束！得分: " },
            ko: { title: "두더지 잡기", score: "점수", time: "남은 시간", start: "시작", restart: "다시 하기", over: "게임 오버! 점수: " },
            fr: { title: "Tape-Taupe", score: "Score", time: "Temps", start: "Jouer", restart: "Recommencer", over: "Fin de partie! Score: " },
            es: { title: "Atrapa al Topo", score: "Puntuación", time: "Tiempo", start: "Iniciar", restart: "Reiniciar", over: "¡Juego Terminado! Puntuación: " }
        };

        // DOM Elements
        const langSelect = document.getElementById('langSelect');
        const titleEl = document.getElementById('title');
        const labelScoreEl = document.getElementById('labelScore');
        const labelTimeEl = document.getElementById('labelTime');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const boardEl = document.getElementById('board');

        // State Variables
        let currentLang = 'ja';
        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let moleInterval = null;
        let lastHole = -1;
        let isPlaying = false;

        // Pre-allocated arrays for zero Garbage Collection overhead
        const moles = [];
        const moleTimeouts = new Array(9).fill(null);

        // One-time board initialization
        (function initBoard() {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                
                const mole = document.createElement('div');
                mole.className = 'mole';
                mole.dataset.index = i;
                
                hole.appendChild(mole);
                fragment.appendChild(hole);
                moles[i] = mole;
            }
            boardEl.appendChild(fragment);
        })();

        // Language Update Function
        function setLanguage(lang) {
            currentLang = lang;
            const texts = i18n[lang] || i18n.ja;
            titleEl.textContent = texts.title;
            labelScoreEl.textContent = texts.score;
            labelTimeEl.textContent = texts.time;
            startBtn.textContent = isPlaying ? texts.restart : texts.start;
        }

        // Get index of an available hole that is not currently up
        function getRandomAvailableHoleIndex() {
            let availableCount = 0;
            for (let i = 0; i < 9; i++) {
                if (!moles[i].classList.contains('up') && i !== lastHole) {
                    availableCount++;
                }
            }
            if (availableCount === 0) return -1;

            let idx;
            do {
                idx = Math.floor(Math.random() * 9);
            } while (moles[idx].classList.contains('up') || idx === lastHole);

            lastHole = idx;
            return idx;
        }

        // Safely clear a specific mole's timeout
        function clearMoleTimeout(index) {
            if (moleTimeouts[index] !== null) {
                clearTimeout(moleTimeouts[index]);
                moleTimeouts[index] = null;
            }
        }

        // Pop Mole Logic
        function popMole() {
            if (!isPlaying) return;
            
            const idx = getRandomAvailableHoleIndex();
            if (idx === -1) return;

            const mole = moles[idx];
            clearMoleTimeout(idx);
            
            mole.classList.remove('hit');
            mole.classList.add('up');

            const duration = Math.floor(Math.random() * 500) + 600;
            moleTimeouts[idx] = setTimeout(() => {
                mole.classList.remove('up');
                moleTimeouts[idx] = null;
            }, duration);
        }

        // Start Game
        function startGame() {
            if (isPlaying) stopGame();

            score = 0;
            timeLeft = 30;
            isPlaying = true;
            scoreEl.textContent = '0';
            timeEl.textContent = '30';
            startBtn.disabled = true;

            // Timer Loop
            gameInterval = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    stopGame();
                    alert((i18n[currentLang] || i18n.ja).over + score);
                }
            }, 1000);

            // Mole Spawn Loop
            moleInterval = setInterval(popMole, 750);
            popMole();
        }

        // Stop & Cleanup Game (Prevent Memory Leaks)
        function stopGame() {
            isPlaying = false;
            
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            if (moleInterval) {
                clearInterval(moleInterval);
                moleInterval = null;
            }

            // Clear all mole timers and states
            for (let i = 0; i < 9; i++) {
                clearMoleTimeout(i);
                moles[i].classList.remove('up', 'hit');
            }

            startBtn.disabled = false;
            startBtn.textContent = (i18n[currentLang] || i18n.ja).restart;
        }

        // Whack Event Handling (Delegation with closest)
        boardEl.addEventListener('pointerdown', (e) => {
            if (!isPlaying) return;
            const target = e.target.closest('.mole');
            if (target && target.classList.contains('up') && !target.classList.contains('hit')) {
                const idx = parseInt(target.dataset.index, 10);
                score += 10;
                scoreEl.textContent = score;
                target.classList.add('hit');
                target.classList.remove('up');
                clearMoleTimeout(idx);
            }
        });

        // Event Listeners
        langSelect.addEventListener('change', (e) => setLanguage(e.target.value));
        startBtn.addEventListener('click', startGame);

        // Initial setup
        setLanguage('ja');
    </script>
</body>
</html>
