<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Chess / オフラインチェス</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "MS Mincho", "MS 明朝", "Yu Mincho", serif;
    }
    body {
      background-color: #2c2825;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
    }
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #3a3430;
      border: 1px solid #5a5048;
      border-radius: 6px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    label { font-size: 13px; }
    select, button {
      font-family: inherit;
      padding: 4px 8px;
      font-size: 13px;
      border: 1px solid #6b5d52;
      border-radius: 4px;
      background: #2c2825;
      color: #f0e6d2;
      cursor: pointer;
    }
    select:focus, button:focus { outline: 2px solid #c2a680; }
    button:hover { background: #4a423d; }
    
    .status-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: #3a3430;
      border-radius: 6px;
      border: 1px solid #5a5048;
    }
    .status-message {
      font-size: 15px;
      font-weight: bold;
      color: #c2a680;
    }

    .board-container {
      position: relative;
      padding: 8px;
      background: #1e1b18;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 54px);
      grid-template-rows: repeat(8, 54px);
      border: 2px solid #5a5048;
    }
    @media (max-width: 480px) {
      .board {
        grid-template-columns: repeat(8, 11vw);
        grid-template-rows: repeat(8, 11vw);
      }
    }
    .cell {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      cursor: pointer;
      position: relative;
    }
    .cell.light { background-color: #eadeca; color: #111; }
    .cell.dark { background-color: #8c6d58; color: #111; }
    .cell.selected { background-color: #d4b255 !important; }
    .cell.valid-target::after {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.25);
      position: absolute;
    }
    .piece {
      line-height: 1;
      display: inline-block;
      transform: translateZ(0);
    }
    .piece.white {
      color: #ffffff;
      text-shadow: 0 0 2px #000, 0 0 1px #000;
    }
    .piece.black {
      color: #111111;
      text-shadow: 0 0 1px #fff;
    }
  </style>
</head>
<body>

<header>
  <div class="control-group">
    <label id="lbl-mode" for="select-mode">対戦:</label>
    <select id="select-mode">
      <option value="2p">2 Players</option>
      <option value="cpu" selected>VS CPU</option>
    </select>

    <label id="lbl-level" for="select-level">難易度:</label>
    <select id="select-level">
      <option value="1">初級</option>
      <option value="2">低級</option>
      <option value="3">中級</option>
      <option value="4" selected>上級</option>
      <option value="5">特級</option>
      <option value="6">異常</option>
    </select>
  </div>

  <div class="control-group">
    <label id="lbl-lang" for="select-lang">言語:</label>
    <select id="select-lang">
      <option value="ja" selected>日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
    <button id="btn-restart">リセット</button>
  </div>
</header>

<div class="status-panel">
  <div class="status-message" id="status-text">白の番です</div>
</div>

<div class="board-container">
  <div class="board" id="board"></div>
</div>

<script>
(function() {
  'use strict';

  // 多言語対応辞書
  const I18N = {
    ja: {
      mode: "対戦:", level: "難易度:", lang: "言語:", restart: "リセット",
      turnWhite: "白の番です", turnBlack: "黒の番です",
      winWhite: "白の勝利！", winBlack: "黒の勝利！", draw: "引き分け！",
      levels: ["初級", "低級", "中級", "上級", "特級", "異常"]
    },
    en: {
      mode: "Mode:", level: "Level:", lang: "Lang:", restart: "Reset",
      turnWhite: "White's Turn", turnBlack: "Black's Turn",
      winWhite: "White Wins!", winBlack: "Black Wins!", draw: "Draw!",
      levels: ["Beginner", "Easy", "Medium", "Hard", "Expert", "Insane"]
    },
    zh: {
      mode: "模式:", level: "难度:", lang: "语言:", restart: "重置",
      turnWhite: "白方回合", turnBlack: "黑方回合",
      winWhite: "白方获胜！", winBlack: "黑方获胜！", draw: "平局！",
      levels: ["初级", "低级", "中级", "高级", "特级", "噩梦"]
    },
    ko: {
      mode: "모드:", level: "난이도:", lang: "언어:", restart: "리셋",
      turnWhite: "백의 차례", turnBlack: "흑의 차례",
      winWhite: "백 승리!", winBlack: "흑 승리!", draw: "무승부!",
      levels: ["초급", "하급", "중급", "상급", "특급", "이상의"]
    },
    fr: {
      mode: "Mode:", level: "Niveau:", lang: "Langue:", restart: "Réinit.",
      turnWhite: "Tour aux Blancs", turnBlack: "Tour aux Noirs",
      winWhite: "Blancs Gagnent !", winBlack: "Noirs Gagnent !", draw: "Égalité !",
      levels: ["Débutant", "Facile", "Moyen", "Difficile", "Expert", "Insensé"]
    },
    es: {
      mode: "Modo:", level: "Nivel:", lang: "Idioma:", restart: "Reiniciar",
      turnWhite: "Turno de Blancas", turnBlack: "Turno de Negras",
      winWhite: "¡Ganan Blancas!", winBlack: "¡Ganan Negras!", draw: "¡Empate!",
      levels: ["Principiante", "Fácil", "Medio", "Difícil", "Experto", "Demencial"]
    }
  };

  // Unicode 駒定義
  const SYMBOLS = {
    wP: '♙', wR: '♖', wN: '♘', wB: '♗', wQ: '♕', wK: '♔',
    bP: '♟', bR: '♜', bN: '➞', bB: '♝', bQ: '♛', bK: '♚'
  };

  // 駒の価値定義
  const PIECE_VALUES = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };

  // 初期盤面定義 (w:白, b:黒, P,R,N,B,Q,K)
  const INIT_BOARD = [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR']
  ];

  // 状態変数 (メモリ即時再利用の設計)
  let board = null;
  let turn = 'w'; // 'w' or 'b'
  let lang = 'ja';
  let mode = 'cpu';
  let cpuLevel = 4;
  let isGameOver = false;
  let selectedSquare = null;
  let validMoves = [];

  // DOM キャッシュ
  const domBoard = document.getElementById('board');
  const domStatus = document.getElementById('status-text');
  const domSelectLang = document.getElementById('select-lang');
  const domSelectMode = document.getElementById('select-mode');
  const domSelectLevel = document.getElementById('select-level');
  const domBtnRestart = document.getElementById('btn-restart');

  // ゲーム初期化
  function initGame() {
    board = JSON.parse(JSON.stringify(INIT_BOARD));
    turn = 'w';
    isGameOver = false;
    selectedSquare = null;
    validMoves = [];
    renderAll();
  }

  // 多言語テキスト更新
  function updateTextUI() {
    const dict = I18N[lang];
    document.getElementById('lbl-mode').textContent = dict.mode;
    document.getElementById('lbl-level').textContent = dict.level;
    document.getElementById('lbl-lang').textContent = dict.lang;
    domBtnRestart.textContent = dict.restart;

    const opts = domSelectLevel.options;
    for (let i = 0; i < opts.length; i++) {
      opts[i].textContent = dict.levels[i];
    }

    if (!isGameOver) {
      domStatus.textContent = turn === 'w' ? dict.turnWhite : dict.turnBlack;
    }
  }

  // 盤面描画
  function renderAll() {
    updateTextUI();
    domBoard.textContent = '';

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const cell = document.createElement('div');
        const isLight = (r + c) % 2 === 0;
        cell.className = `cell ${isLight ? 'light' : 'dark'}`;

        if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
          cell.classList.add('selected');
        }

        const isValid = validMoves.some(m => m.r === r && m.c === c);
        if (isValid) {
          cell.classList.add('valid-target');
        }

        const p = board[r][c];
        if (p) {
          const pieceEl = document.createElement('div');
          const color = p[0] === 'w' ? 'white' : 'black';
          pieceEl.className = `piece ${color}`;
          // 代替として標準Unicode駒を表示
          const charKey = p[0] + p[1];
          pieceEl.textContent = SYMBOLS[charKey] || p[1];
          cell.appendChild(pieceEl);
        }

        cell.addEventListener('click', () => handleSquareClick(r, c));
        domBoard.appendChild(cell);
      }
    }
  }

  // セルクリックイベント
  function handleSquareClick(r, c) {
    if (isGameOver) return;
    if (mode === 'cpu' && turn === 'b') return; // CPU処理中

    if (selectedSquare) {
      const move = validMoves.find(m => m.r === r && m.c === c);
      if (move) {
        executeMove(selectedSquare, move);
        selectedSquare = null;
        validMoves = [];
        return;
      }
    }

    const p = board[r][c];
    if (p && p[0] === turn) {
      selectedSquare = { r, c };
      validMoves = getValidMovesForSquare(board, r, c);
    } else {
      selectedSquare = null;
      validMoves = [];
    }
    renderAll();
  }

  // 手を実行
  function executeMove(from, to) {
    const p = board[from.r][from.c];
    const target = board[to.r][to.c];

    // 移動実行
    board[to.r][to.c] = p;
    board[from.r][from.c] = null;

    // ポーンプロモーション（自動クイーン化）
    if (p[1] === 'P') {
      if ((p[0] === 'w' && to.r === 0) || (p[0] === 'b' && to.r === 7)) {
        board[to.r][to.c] = p[0] + 'Q';
      }
    }

    // キング捕獲による勝利チェック
    if (target && target[1] === 'K') {
      endGame(p[0]);
      return;
    }

    turn = turn === 'w' ? 'b' : 'w';
    renderAll();

    // CPU思考開始
    if (!isGameOver && mode === 'cpu' && turn === 'b') {
      setTimeout(makeCpuMove, 300);
    }
  }

  function endGame(winner) {
    isGameOver = true;
    const dict = I18N[lang];
    domStatus.textContent = winner === 'w' ? dict.winWhite : dict.winBlack;
    renderAll();
  }

  // 特定コマの有効移動先取得
  function getValidMovesForSquare(b, r, c) {
    const p = b[r][c];
    if (!p) return [];
    const color = p[0];
    const type = p[1];
    const moves = [];

    const addMove = (tr, tc) => {
      if (tr < 0 || tr > 7 || tc < 0 || tc > 7) return false;
      const target = b[tr][tc];
      if (!target) {
        moves.push({ r: tr, c: tc });
        return true;
      } else if (target[0] !== color) {
        moves.push({ r: tr, c: tc });
        return false;
      }
      return false;
    };

    const addLine = (dr, dc) => {
      let tr = r + dr, tc = c + dc;
      while (tr >= 0 && tr <= 7 && tc >= 0 && tc <= 7) {
        if (!addMove(tr, tc)) break;
        tr += dr; tc += dc;
      }
    };

    if (type === 'P') {
      const dir = color === 'w' ? -1 : 1;
      // 1歩前進
      if (r + dir >= 0 && r + dir <= 7 && !b[r + dir][c]) {
        moves.push({ r: r + dir, c });
        // 2歩前進
        const startRow = color === 'w' ? 6 : 1;
        if (r === startRow && !b[r + dir * 2][c]) {
          moves.push({ r: r + dir * 2, c });
        }
      }
      // 斜め取手
      [-1, 1].forEach(dc => {
        if (c + dc >= 0 && c + dc <= 7) {
          const t = b[r + dir][c + dc];
          if (t && t[0] !== color) moves.push({ r: r + dir, c: c + dc });
        }
      });
    } else if (type === 'N') {
      const offsets = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      offsets.forEach(([dr, dc]) => addMove(r + dr, c + dc));
    } else if (type === 'B') {
      addLine(-1, -1); addLine(-1, 1); addLine(1, -1); addLine(1, 1);
    } else if (type === 'R') {
      addLine(-1, 0); addLine(1, 0); addLine(0, -1); addLine(0, 1);
    } else if (type === 'Q') {
      addLine(-1, -1); addLine(-1, 1); addLine(1, -1); addLine(1, 1);
      addLine(-1, 0); addLine(1, 0); addLine(0, -1); addLine(0, 1);
    } else if (type === 'K') {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr !== 0 || dc !== 0) addMove(r + dr, c + dc);
        }
      }
    }

    return moves;
  }

  // 全有効移動取得
  function getAllMoves(b, color) {
    const all = [];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        if (b[r][c] && b[r][c][0] === color) {
          const targets = getValidMovesForSquare(b, r, c);
          targets.forEach(t => {
            all.push({ from: { r, c }, to: t });
          });
        }
      }
    }
    return all;
  }

  // CPU 思考処理
  function makeCpuMove() {
    if (isGameOver) return;
    const allMoves = getAllMoves(board, 'b');
    if (allMoves.length === 0) return;

    let chosen = null;

    if (cpuLevel === 1) {
      // 初級: 完全ランダム
      chosen = allMoves[Math.floor(Math.random() * allMoves.length)];

    } else if (cpuLevel === 2) {
      // 低級: 取れる駒最優先＋ランダム
      let bestScore = -Infinity;
      for (const m of allMoves) {
        const target = board[m.to.r][m.to.c];
        const score = target ? PIECE_VALUES[target[1]] : 0;
        if (score > bestScore) {
          bestScore = score;
          chosen = m;
        }
      }

    } else if (cpuLevel === 3) {
      // 中級: 駒価値＋位置評価（浅い評価）
      chosen = getBestMoveEval(allMoves);

    } else if (cpuLevel === 4) {
      // 上級: ミニマックス (深さ2)
      chosen = minimaxSearch(2);

    } else if (cpuLevel === 5) {
      // 特級: αβ枝刈り (深さ3)
      chosen = alphaBetaSearch(3);

    } else if (cpuLevel === 6) {
      // 異常: αβ枝刈り (深さ4＋高度評価)
      chosen = alphaBetaSearch(4, true);
    }

    if (chosen) {
      executeMove(chosen.from, chosen.to);
    }
  }

  // 中級用簡易評価
  function getBestMoveEval(moves) {
    let bestMove = moves[0];
    let bestScore = -Infinity;

    for (const m of moves) {
      const nextB = cloneBoard(board);
      applyVirtualMove(nextB, m);
      const score = evaluateBoard(nextB, 'b');
      if (score > bestScore) {
        bestScore = score;
        bestMove = m;
      }
    }
    return bestMove;
  }

  // ミニマックス法
  function minimaxSearch(depth) {
    const moves = getAllMoves(board, 'b');
    let bestMove = moves[0];
    let bestVal = -Infinity;

    for (const m of moves) {
      const nextB = cloneBoard(board);
      applyVirtualMove(nextB, m);
      const val = minimax(nextB, depth - 1, false);
      if (val > bestVal) {
        bestVal = val;
        bestMove = m;
      }
    }
    return bestMove;
  }

  function minimax(b, depth, isMax) {
    if (depth === 0) return evaluateBoard(b, 'b');
    const color = isMax ? 'b' : 'w';
    const moves = getAllMoves(b, color);
    if (moves.length === 0) return evaluateBoard(b, 'b');

    let best = isMax ? -Infinity : Infinity;
    for (const m of moves) {
      const nextB = cloneBoard(b);
      applyVirtualMove(nextB, m);
      const val = minimax(nextB, depth - 1, !isMax);
      best = isMax ? Math.max(best, val) : Math.min(best, val);
    }
    return best;
  }

  // アルファ・ベータ探索
  function alphaBetaSearch(depth, advanced = false) {
    const moves = getAllMoves(board, 'b');
    let bestMove = moves[0];
    let alpha = -Infinity;
    let beta = Infinity;

    for (const m of moves) {
      const nextB = cloneBoard(board);
      applyVirtualMove(nextB, m);
      const val = alphaBeta(nextB, depth - 1, alpha, beta, false, advanced);
      if (val > alpha) {
        alpha = val;
        bestMove = m;
      }
    }
    return bestMove;
  }

  function alphaBeta(b, depth, alpha, beta, isMax, advanced) {
    if (depth === 0) return evaluateBoard(b, 'b', advanced);
    const color = isMax ? 'b' : 'w';
    const moves = getAllMoves(b, color);
    if (moves.length === 0) return evaluateBoard(b, 'b', advanced);

    if (isMax) {
      let v = -Infinity;
      for (const m of moves) {
        const nextB = cloneBoard(b);
        applyVirtualMove(nextB, m);
        v = Math.max(v, alphaBeta(nextB, depth - 1, alpha, beta, false, advanced));
        alpha = Math.max(alpha, v);
        if (beta <= alpha) break; // βカット
      }
      return v;
    } else {
      let v = Infinity;
      for (const m of moves) {
        const nextB = cloneBoard(b);
        applyVirtualMove(nextB, m);
        v = Math.min(v, alphaBeta(nextB, depth - 1, alpha, beta, true, advanced));
        beta = Math.min(beta, v);
        if (beta <= alpha) break; // αカット
      }
      return v;
    }
  }

  // 盤面評価関数
  function evaluateBoard(b, myColor, advanced = false) {
    let score = 0;
    const oppColor = myColor === 'w' ? 'b' : 'w';

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = b[r][c];
        if (p) {
          const val = PIECE_VALUES[p[1]] || 0;
          if (p[0] === myColor) score += val;
          else score -= val;
        }
      }
    }

    if (advanced) {
      // 高度評価（移動可能手の多さを加算）
      const myMoves = getAllMoves(b, myColor).length;
      const oppMoves = getAllMoves(b, oppColor).length;
      score += (myMoves - oppMoves) * 5;
    }

    return score;
  }

  // 盤面の浅いコピー (メモリ節約)
  function cloneBoard(b) {
    const copy = Array(8);
    for (let i = 0; i < 8; i++) copy[i] = b[i].slice();
    return copy;
  }

  function applyVirtualMove(b, m) {
    b[m.to.r][m.to.c] = b[m.from.r][m.from.c];
    b[m.from.r][m.from.c] = null;
  }

  // イベント登録
  domSelectLang.addEventListener('change', (e) => {
    lang = e.target.value;
    renderAll();
  });

  domSelectMode.addEventListener('change', (e) => {
    mode = e.target.value;
    domSelectLevel.style.display = mode === 'cpu' ? 'inline-block' : 'none';
    document.getElementById('lbl-level').style.display = mode === 'cpu' ? 'inline-block' : 'none';
    initGame();
  });

  domSelectLevel.addEventListener('change', (e) => {
    cpuLevel = parseInt(e.target.value, 10);
  });

  domBtnRestart.addEventListener('click', () => {
    initGame();
  });

  // 初期化実行
  initGame();
})();
</script>
</body>
</html>
