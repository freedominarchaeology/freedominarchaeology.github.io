const NOTE_STRINGS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const SOLFEGE_STRINGS = ["ド", "ド#", "レ", "レ#", "ミ", "ファ", "ファ#", "ソ", "ソ#", "ラ", "ラ#", "シ"];

// --- 音声解析・ピッチ検出 ---
let audioCtx = null;
let analyserNode = null;
let micStream = null;
let pitchBuffer = null;

function initAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

async function setupMic() {
  initAudioContext();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const source = audioCtx.createMediaStreamSource(micStream);
    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 2048;
    source.connect(analyserNode);
    pitchBuffer = new Float32Array(analyserNode.fftSize);
    return true;
  } catch (err) {
    console.warn("Microphone access denied or error:", err);
    return false;
  }
}

// 自己相関によるピッチ検出
function detectPitch() {
  if (!analyserNode || !pitchBuffer) return -1;
  analyserNode.getFloatTimeDomainData(pitchBuffer);
  
  let size = pitchBuffer.length;
  let rms = 0;
  for (let i = 0; i < size; i++) {
    rms += pitchBuffer[i] * pitchBuffer[i];
  }
  rms = Math.sqrt(rms / size);
  if (rms < 0.015) return -1; // ノイズフロア閾値

  let r1 = 0, r2 = size - 1, thres = 0.2;
  for (let i = 0; i < size / 2; i++) {
    if (Math.abs(pitchBuffer[i]) < thres) { r1 = i; break; }
  }
  for (let i = 1; i < size / 2; i++) {
    if (Math.abs(pitchBuffer[size - i]) < thres) { r2 = size - i; break; }
  }

  let buf = pitchBuffer.slice(r1, r2);
  let c = new Float32Array(buf.length);
  for (let i = 0; i < buf.length; i++) {
    for (let j = 0; j < buf.length - i; j++) {
      c[i] += buf[j] * buf[j + i];
    }
  }

  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < buf.length; i++) {
    if (c[i] > maxval) {
      maxval = c[i];
      maxpos = i;
    }
  }
  if (maxpos === -1 || maxpos === 0) return -1;
  
  return audioCtx.sampleRate / maxpos;
}

function freqToNoteInfo(freq) {
  if (freq <= 0) return null;
  const noteNum = Math.round(12 * (Math.log2(freq / 440)) + 69);
  const noteIndex = (noteNum % 12 + 12) % 12;
  const octave = Math.floor(noteNum / 12) - 1;
  return {
    midi: noteNum,
    name: NOTE_STRINGS[noteIndex] + octave,
    solfege: SOLFEGE_STRINGS[noteIndex] + octave,
    pureName: NOTE_STRINGS[noteIndex],
    octave: octave
  };
}

// --- テクノBGM生成エンジン (Web Audio API) ---
let bgmTimerId = null;
let bgmStep = 0;
let currentBpm = 120;

function playSynthTone(freq, type, duration, gainVal, delayTime = 0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delayTime);

  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2000, audioCtx.currentTime + delayTime);

  gain.gain.setValueAtTime(gainVal, audioCtx.currentTime + delayTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delayTime + duration);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(audioCtx.currentTime + delayTime);
  osc.stop(audioCtx.currentTime + delayTime + duration + 0.05);

  // 即時ノード解放
  osc.onended = () => {
    osc.disconnect();
    filter.disconnect();
    gain.disconnect();
  };
}

function playNoiseDrum(duration, gainVal) {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 5000;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  noise.start();
  noise.stop(audioCtx.currentTime + duration + 0.05);

  noise.onended = () => {
    noise.disconnect();
    filter.disconnect();
    gain.disconnect();
  };
}

function startBGM() {
  stopBGM();
  bgmStep = 0;
  const interval = (60 / currentBpm / 4) * 1000; // 16分音符
  
  const bassSeq = [130.81, 0, 130.81, 0, 155.56, 0, 174.61, 0]; // C3, Eb3, F3 ベースライン
  const synthSeq = [261.63, 0, 311.13, 349.23, 0, 392.00, 0, 311.13];

  bgmTimerId = setInterval(() => {
    if (!audioCtx) return;
    
    // Kick (バスドラム)
    if (bgmStep % 4 === 0) {
      playSynthTone(120, 'sine', 0.15, 0.3);
    }
    // Hi-Hat
    if (bgmStep % 2 === 0) {
      playNoiseDrum(0.04, 0.08);
    }
    // Synth Bass
    const bassFreq = bassSeq[bgmStep % 8];
    if (bassFreq > 0) {
      playSynthTone(bassFreq, 'sawtooth', 0.12, 0.1);
    }
    // Lead Synth
    const leadFreq = synthSeq[bgmStep % 8];
    if (leadFreq > 0 && bgmStep % 4 === 2) {
      playSynthTone(leadFreq, 'square', 0.1, 0.04);
    }

    bgmStep++;
  }, interval);
}

function stopBGM() {
  if (bgmTimerId) {
    clearInterval(bgmTimerId);
    bgmTimerId = null;
  }
}

// --- ゲーム本体ロジック ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const flashOverlay = document.getElementById('flash-overlay');

let gameState = 'START'; // START, PLAYING, RESULT
let animFrameId = null;
let score = 0;
let highScore = parseInt(localStorage.getItem('pitch_runner_highscore') || '0', 10);
let totalObstacles = 0;
let avoidedObstacles = 0;

// キャラクター
const player = {
  x: 100,
  y: 280,
  width: 32,
  height: 40,
  baseY: 280,
  targetY: 280,
  vy: 0,
  isJumping: false,
  jumpHeightType: 0, // 0: None, 1: Low, 2: Mid, 3: High
  currentPitchInfo: null
};

// 障害物
let obstacles = [];
let obstacleSpawnTimer = 0;

// 効果音・明滅制御
function triggerJumpFlash(pitchInfo) {
  player.currentPitchInfo = pitchInfo;
  
  // 低刺激な明滅演出（Opacity 0.15程度の薄いグラデーション発光）
  flashOverlay.style.backgroundColor = 'rgba(0, 229, 255, 0.15)';
  setTimeout(() => {
    flashOverlay.style.backgroundColor = 'rgba(0, 229, 255, 0)';
  }, 100);
}

// ジャンプ実行
function executeJump(type, pitchInfo) {
  if (gameState !== 'PLAYING') return;
  
  player.jumpHeightType = type;
  let targetJumpHeight = 0;
  if (type === 1) targetJumpHeight = 70;      // 低ジャンプ
  else if (type === 2) targetJumpHeight = 130; // 中ジャンプ
  else if (type === 3) targetJumpHeight = 200; // 高ジャンプ

  if (targetJumpHeight > 0) {
    player.vy = -Math.sqrt(2 * 0.6 * targetJumpHeight);
    player.isJumping = true;
    triggerJumpFlash(pitchInfo);
  }
}

// 音高によるジャンプ高度判定
function handlePitchInput(freq) {
  if (freq < 100 || freq > 1000) return;
  const info = freqToNoteInfo(freq);
  if (!info) return;

  // 五線譜・音階UI表示更新
  document.getElementById('val-freq').textContent = freq.toFixed(1);
  document.getElementById('val-note-alpha').textContent = info.name;
  document.getElementById('val-note-solfege').textContent = info.solfege;

  if (player.isJumping) return; // 空中での二段ジャンプ防止

  // 低音(C3-E3 / MIDI 48-52): 低ジャンプ
  // 中音(F3-B3 / MIDI 53-59): 中ジャンプ
  // 高音(C4以上 / MIDI 60+): 高ジャンプ
  if (info.midi >= 48 && info.midi <= 52) {
    executeJump(1, info);
  } else if (info.midi >= 53 && info.midi <= 59) {
    executeJump(2, info);
  } else if (info.midi >= 60) {
    executeJump(3, info);
  }
}

// 障害物生成
function spawnObstacle() {
  // 要求ジャンプタイプ: 1(低), 2(中), 3(高)
  const requiredType = Math.floor(Math.random() * 3) + 1;
  let obsHeight = 40;
  if (requiredType === 2) obsHeight = 90;
  if (requiredType === 3) obsHeight = 150;

  obstacles.push({
    x: canvas.width + 50,
    y: player.baseY + player.height - obsHeight,
    width: 30,
    height: obsHeight,
    requiredType: requiredType,
    passed: false,
    judged: false
  });
  totalObstacles++;
}

// 五線譜描画関数
function drawStaff(ctx, x, y, pitchInfo) {
  ctx.save();
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;

  // 5本線を描画
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(x, y + i * 6);
    ctx.lineTo(x + 60, y + i * 6);
    ctx.stroke();
  }

  // 音符の描画 (ピッチ情報がある場合)
  if (pitchInfo) {
    ctx.fillStyle = '#00ffcc';
    ctx.strokeStyle = '#00ffcc';
    
    // 簡易オクターブ・音高に基づくY位置計算
    const noteOffset = (pitchInfo.midi - 60) * 3; // C4基準
    const noteY = y + 24 - noteOffset;

    ctx.beginPath();
    ctx.ellipse(x + 30, noteY, 4, 3, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + 34, noteY);
    ctx.lineTo(x + 34, noteY - 14);
    ctx.stroke();
  }

  ctx.restore();
}

// ポップアップ評価文字
let floatingTexts = [];
function addFloatingText(text, x, y, color) {
  floatingTexts.push({ text, x, y, color, opacity: 1.0, life: 30 });
}

// メイン更新・描画ループ
function gameLoop() {
  if (gameState !== 'PLAYING') return;

  // クリア処理
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // マイクからのピッチ更新
  const detectedFreq = detectPitch();
  if (detectedFreq > 0) {
    handlePitchInput(detectedFreq);
  }

  // 背景格子描画
  ctx.strokeStyle = '#181822';
  ctx.lineWidth = 1;
  for (let i = 0; i < canvas.width; i += 40) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  }

  // 地面描画
  ctx.fillStyle = '#222230';
  ctx.fillRect(0, player.baseY + player.height, canvas.width, canvas.height - (player.baseY + player.height));
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, player.baseY + player.height);
  ctx.lineTo(canvas.width, player.baseY + player.height);
  ctx.stroke();

  // プレイヤー物理計算
  if (player.isJumping) {
    player.y += player.vy;
    player.vy += 0.6; // 重力

    if (player.y >= player.baseY) {
      player.y = player.baseY;
      player.vy = 0;
      player.isJumping = false;
      player.jumpHeightType = 0;
    }
  }

  // プレイヤー描画
  ctx.fillStyle = '#00e5ff';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 10;
  ctx.fillRect(player.x, player.y, player.width, player.height);
  ctx.shadowBlur = 0;

  // 五線譜 ＆ リアルタイム音階情報の頭上表示
  drawStaff(ctx, player.x - 14, player.y - 45, player.currentPitchInfo);

  // 障害物スポーン管理
  obstacleSpawnTimer++;
  if (obstacleSpawnTimer > (180 - (currentBpm - 90))) { // テンポに応じたインターバル
    spawnObstacle();
    obstacleSpawnTimer = 0;
  }

  // 障害物更新・描画
  const scrollSpeed = 3 + (currentBpm / 30);
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= scrollSpeed;

    // 障害物描画
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 8;
    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    ctx.shadowBlur = 0;

    // AABB 衝突判定
    const isColliding = (
      player.x < obs.x + obs.width &&
      player.x + player.width > obs.x &&
      player.y < obs.y + obs.height &&
      player.y + player.height > obs.y
    );

    // 回避・通過・判定
    if (!obs.judged && obs.x + obs.width < player.x) {
      obs.judged = true;
      if (!isColliding) {
        avoidedObstacles++;
        // ジャンプ高度が最適であったか判定
        const t = I18N[currentLang].judgements;
        if (player.jumpHeightType === obs.requiredType) {
          score += 100;
          addFloatingText(t.perfect, player.x, player.y - 10, '#00ffcc');
        } else {
          score += 50;
          addFloatingText(t.good, player.x, player.y - 10, '#ffff00');
        }
      } else {
        const t = I18N[currentLang].judgements;
        addFloatingText(t.miss, player.x, player.y - 10, '#ff0055');
      }
      document.getElementById('val-score').textContent = score;
    }

    // 画面外削除
    if (obs.x + obs.width < 0) {
      obstacles.splice(i, 1);
    }
  }

  // フローティングテキスト描画・更新
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ctx.save();
    ctx.globalAlpha = ft.opacity;
    ctx.fillStyle = ft.color;
    ctx.font = "bold 16px 'MS Mincho', serif";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();

    ft.y -= 1;
    ft.life--;
    ft.opacity = ft.life / 30;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // 規定数（20個）クリアでゲーム終了判定
  if (totalObstacles >= 20 && obstacles.length === 0) {
    endGame();
    return;
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// ゲーム開始
function startGame() {
  gameState = 'PLAYING';
  score = 0;
  totalObstacles = 0;
  avoidedObstacles = 0;
  obstacles = [];
  floatingTexts = [];
  document.getElementById('val-score').textContent = score;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  startBGM();
  if (animFrameId) cancelAnimationFrame(animFrameId);
  animFrameId = requestAnimationFrame(gameLoop);
}

// ゲーム終了・リザルト演出
function endGame() {
  gameState = 'RESULT';
  stopBGM();
  if (animFrameId) cancelAnimationFrame(animFrameId);

  // ハイスコア更新
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('pitch_runner_highscore', highScore.toString());
    document.getElementById('val-highscore').textContent = highScore;
  }

  const clearRate = totalObstacles > 0 ? Math.round((avoidedObstacles / totalObstacles) * 100) : 0;
  const t = I18N[currentLang];

  let stars = "★☆☆";
  let evalText = t.eval1;
  let starColor = "#ff5555";

  if (clearRate >= 85) {
    stars = "★★★";
    evalText = t.eval3;
    starColor = "#ffd700";
  } else if (clearRate >= 60) {
    stars = "★★☆";
    evalText = t.eval2;
    starColor = "#00e5ff";
  }

  const starsEl = document.getElementById('result-stars');
  starsEl.textContent = stars;
  starsEl.style.color = starColor;

  document.getElementById('result-details').innerHTML = `
    <div>${t.lblScore}: <strong>${score}</strong></div>
    <div>${t.clearRate}: <strong>${clearRate}%</strong> (${avoidedObstacles}/${totalObstacles})</div>
    <div style="margin-top:15px; color:${starColor}; font-weight:bold;">${evalText}</div>
  `;

  document.getElementById('result-screen').classList.remove('hidden');
}

// --- イベントリスナー・初期化 ---
document.getElementById('lang-select').addEventListener('change', (e) => {
  currentLang = e.target.value;
  updateI18nUI();
});

document.getElementById('tempo-select').addEventListener('change', (e) => {
  currentBpm = parseInt(e.target.value, 10);
  if (gameState === 'PLAYING') {
    startBGM(); // テンポ動的更新
  }
});

document.getElementById('btn-mic-init').addEventListener('click', async () => {
  await setupMic();
  startGame();
});

document.getElementById('btn-restart').addEventListener('click', () => {
  startGame();
});

// フォールバックテスト発声ボタン
document.getElementById('btn-test-low').addEventListener('click', () => {
  initAudioContext();
  playSynthTone(130.81, 'sine', 0.3, 0.2); // C3
  handlePitchInput(130.81);
});

document.getElementById('btn-test-mid').addEventListener('click', () => {
  initAudioContext();
  playSynthTone(196.00, 'sine', 0.3, 0.2); // G3
  handlePitchInput(196.00);
});

document.getElementById('btn-test-high').addEventListener('click', () => {
  initAudioContext();
  playSynthTone(329.63, 'sine', 0.3, 0.2); // E4
  handlePitchInput(329.63);
});

// キーボード操作対応 (フォールバック)
window.addEventListener('keydown', (e) => {
  if (gameState !== 'PLAYING') return;
  if (e.key === '1') handlePitchInput(130.81); // C3
  if (e.key === '2') handlePitchInput(196.00); // G3
  if (e.key === '3') handlePitchInput(329.63); // E4
});

// 初期ロード時処理
document.getElementById('val-highscore').textContent = highScore;
updateI18nUI();

</script>
</body>
</html>
