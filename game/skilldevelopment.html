<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:;">
  <title>Human Capability Training Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "YuMincho", serif;
    }
    body {
      background-color: #f4f5f7;
      color: #222;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    h1 { font-size: 1.2rem; font-weight: bold; }
    select {
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
    }
    main {
      flex: 1;
      display: flex;
      padding: 15px;
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    #sidebar {
      width: 280px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: calc(100vh - 90px);
    }
    .category-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: #475569;
      margin-top: 10px;
      border-bottom: 2px solid #cbd5e1;
      padding-bottom: 3px;
    }
    .game-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 8px;
      text-align: left;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .game-btn:hover { background: #e2e8f0; }
    .game-btn.active { background: #2563eb; color: #fff; border-color: #1d4ed8; }
    #content-area {
      flex: 1;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-height: 500px;
    }
    .game-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      border: 1px solid #94a3b8;
      background: #0f172a;
      border-radius: 4px;
      max-width: 100%;
    }
    .control-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .ui-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .ui-btn:hover { background: #1d4ed8; }
    .ui-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .ui-btn-reset { background: #dc2626; }
    .ui-btn-reset:hover { background: #b91c1c; }
    .ui-input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      margin: 5px;
    }
    .info-text {
      margin-bottom: 15px;
      font-size: 1rem;
      text-align: center;
      line-height: 1.5;
    }
    .score-board {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 15px;
      color: #0f172a;
    }
    @media(max-width: 768px) {
      main { flex-direction: column; }
      #sidebar { width: 100%; max-height: none; }
    }
  </style>
</head>
<body>

<header>
  <h1 id="app-title">能力開発プラットフォーム</h1>
  <div>
    <select id="lang-select" onchange="changeLanguage(this.value)">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
  </div>
</header>

<main>
  <nav id="sidebar">
    <div class="category-title" id="cat-1">1. 音声・聴覚系</div>
    <button class="game-btn" onclick="switchGame('pitch_sense')" id="btn-pitch_sense">① 音感トレーナー</button>
    <button class="game-btn" onclick="switchGame('vocal_control')" id="btn-vocal_control">② 発声・ピッチ制御</button>
    <button class="game-btn" onclick="switchGame('rhythm')" id="btn-rhythm">③ リズム感保持力</button>

    <div class="category-title" id="cat-2">2. 認知・脳トレ系</div>
    <button class="game-btn" onclick="switchGame('nback')" id="btn-nback">① ワーキングメモリ(2-Back)</button>
    <button class="game-btn" onclick="switchGame('stroop')" id="btn-stroop">② 処理速度(ストループ)</button>
    <button class="game-btn" onclick="switchGame('mental_rot')" id="btn-mental_rot">③ 空間認知(3D回転)</button>

    <div class="category-title" id="cat-3">3. 反射・目と手</div>
    <button class="game-btn" onclick="switchGame('aim')" id="btn-aim">① エイム精度</button>
    <button class="game-btn" onclick="switchGame('peripheral')" id="btn-peripheral">② 周辺視野トレーニング</button>

    <div class="category-title" id="cat-4">4. 心理・言語系</div>
    <button class="game-btn" onclick="switchGame('cbt')" id="btn-cbt">① 認知バイアス修正</button>
    <button class="game-btn" onclick="switchGame('verbal')" id="btn-verbal">② 瞬発語彙力</button>
  </nav>

  <section id="content-area">
    <div id="game-node" class="game-container"></div>
  </section>
</main>

<script>
/** 辞書・多言語リソース */
const i18n = {
  ja: {
    title: "能力開発プラットフォーム",
    cat1: "1. 音声・聴覚系", cat2: "2. 認知・脳トレ系", cat3: "3. 反射・目と手", cat4: "4. 心理・言語系",
    btn_pitch_sense: "① 音感トレーナー", btn_vocal_control: "② 発声・ピッチ制御", btn_rhythm: "③ リズム感保持力",
    btn_nback: "① ワーキングメモリ(2-Back)", btn_stroop: "② 処理速度(ストループ)", btn_mental_rot: "③ 空間認知(3D回転)",
    btn_aim: "① エイム精度", btn_peripheral: "② 周辺視野トレーニング",
    btn_cbt: "① 認知バイアス修正", btn_verbal: "② 瞬発語彙力",
    start: "スタート", reset: "リセット", submit: "送信", match: "一致", not_match: "不一致",
    score: "スコア: ", accuracy: "精度: ", correct: "正解！", wrong: "不正解…", ready: "「スタート」ボタンを押してください",
    pitch_desc: "基準音を聞いた後、ターゲット音を当ててください。",
    play_ref: "基準音(ド)を聞く", play_target: "問題音を聞く",
    vocal_desc: "声を出し、円の上下移動で緑色の領域（指定音程）を維持してください。",
    rhythm_desc: "「タップ！」ボタンをリズムに合わせて押してください。途中から消音します。",
    tap: "タップ！",
    nback_desc: "表示される位置が「2つ前」と同じか判定してください。",
    stroop_desc: "文字の意味ではなく「表示されている色」を選択してください。",
    rot_desc: "元の立体（左）を回転させた図形（右）を選んでください。",
    aim_desc: "現れるターゲットを素早く正確にタップしてください。",
    peripheral_desc: "中央の＋を見つめながら、外周に一瞬現れる数字を入力してください。",
    cbt_desc: "ネガティブな状況に対して、最も論理的で柔軟な再解釈を選んでください。",
    verbal_desc: "お題に該当する言葉を入力してください（「あ」から始まる言葉）。"
  },
  en: {
    title: "Capability Training Platform",
    cat1: "1. Audio & Pitch", cat2: "2. Cognitive", cat3: "3. Reflex & Focus", cat4: "4. Psych & Verbal",
    btn_pitch_sense: "1. Pitch Sense", btn_vocal_control: "2. Pitch Control", btn_rhythm: "3. Rhythm Sense",
    btn_nback: "1. Working Memory", btn_stroop: "2. Stroop Speed", btn_mental_rot: "3. 3D Spatial",
    btn_aim: "1. Aim Precision", btn_peripheral: "2. Peripheral Vision",
    btn_cbt: "1. Cognitive Bias", btn_verbal: "2. Verbal Speed",
    start: "Start", reset: "Reset", submit: "Submit", match: "Match", not_match: "No Match",
    score: "Score: ", accuracy: "Accuracy: ", correct: "Correct!", wrong: "Wrong!", ready: "Press 'Start' to begin.",
    pitch_desc: "Listen to the reference note, then guess the target note name.",
    play_ref: "Play Ref (C4)", play_target: "Play Target",
    vocal_desc: "Control the ball with your vocal pitch to match the target zone.",
    rhythm_desc: "Tap 'TAP!' in tempo. Sound will mute halfway—keep the beat!",
    tap: "TAP!",
    nback_desc: "Does current position match 2 steps back?",
    stroop_desc: "Select the DISPLAY COLOR, not the word's meaning.",
    rot_desc: "Identify which right shape is a rotated version of the left.",
    aim_desc: "Click targets as fast and accurately as possible.",
    peripheral_desc: "Focus on '+' and type the digit that flashes on the edge.",
    cbt_desc: "Choose the most constructive re-framing for the situation.",
    verbal_desc: "Enter a valid word matching the prompt."
  }
};

let currentLang = 'ja';
let currentGame = null;

/** 共通オーディオ＆リソース管理者（メモリリーク完全防止） */
const ResourceManager = {
  audioCtx: null,
  mediaStream: null,
  animId: null,
  timerId: null,

  getAudioContext() {
    if (!this.audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.audioCtx = new AudioContext();
    }
    if (this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }
    return this.audioCtx;
  },

  playTone(freq, duration = 0.5, type = 'sine') {
    const ctx = this.getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  },

  clearAll() {
    if (this.animId) { cancelAnimationFrame(this.animId); this.animId = null; }
    if (this.timerId) { clearInterval(this.timerId); clearTimeout(this.timerId); this.timerId = null; }
    if (this.mediaStream) {
      this.mediaStream.getTracks().forEach(track => track.stop());
      this.mediaStream = null;
    }
    if (this.audioCtx) {
      this.audioCtx.close().catch(() => {});
      this.audioCtx = null;
    }
  }
};

function getText(key) {
  return (i18n[currentLang] && i18n[currentLang][key]) || i18n['ja'][key] || key;
}

function changeLanguage(lang) {
  currentLang = lang;
  document.getElementById('app-title').innerText = getText('title');
  ['cat1','cat2','cat3','cat4'].forEach(c => document.getElementById(c).innerText = getText(c));
  const btns = ['pitch_sense','vocal_control','rhythm','nback','stroop','mental_rot','aim','peripheral','cbt','verbal'];
  btns.forEach(b => document.getElementById('btn-' + b).innerText = getText('btn_' + b));
  if (currentGame && currentGame.init) currentGame.init();
}

function switchGame(gameKey) {
  ResourceManager.clearAll();
  document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + gameKey);
  if(btn) btn.classList.add('active');

  const container = document.getElementById('game-node');
  container.innerHTML = '';

  if (Games[gameKey]) {
    currentGame = Games[gameKey];
    currentGame.init();
  }
}

/** 全9種ゲーム定義（スタート・リセット拡張） */
const Games = {};

/* 1-① 音感 */
Games.pitch_sense = {
  isRunning: false,
  notes: [{n:'C',f:261.63},{n:'D',f:293.66},{n:'E',f:329.63},{n:'F',f:349.23},{n:'G',f:392.00},{n:'A',f:440.00},{n:'B',f:493.88}],
  targetNote: null,
  init() {
    this.isRunning = false;
    const node = document.getElementById('game-node');
    node.innerHTML = `
      <div class="info-text">${getText('pitch_desc')}</div>
      <div class="control-panel">
        <button class="ui-btn" id="ps-start" onclick="Games.pitch_sense.start()">${getText('start')}</button>
        <button class="ui-btn ui-btn-reset" onclick="Games.pitch_sense.reset()">${getText('reset')}</button>
      </div>
      <div id="ps-action" style="display:none;">
        <button class="ui-btn" onclick="Games.pitch_sense.playRef()">${getText('play_ref')}</button>
        <button class="ui-btn" onclick="Games.pitch_sense.playTarget()">${getText('play_target')}</button>
      </div>
      <div style="margin-top:20px;" id="pitch-options"></div>
      <div id="pitch-res" class="score-board">${getText('ready')}</div>
    `;
  },
  start() {
    this.isRunning = true;
    document.getElementById('ps-start').disabled = true;
    document.getElementById('ps-action').style.display = 'block';
    document.getElementById('pitch-res').innerText = '';
    this.next();
  },
  reset() {
    ResourceManager.clearAll();
    this.init();
  },
  next() {
    if(!this.isRunning) return;
    const idx = Math.floor(Math.random() * this.notes.length);
    this.targetNote = this.notes[idx];
    const opts = document.getElementById('pitch-options');
    opts.innerHTML = '';
    this.notes.forEach(note => {
      const b = document.createElement('button');
      b.className = 'ui-btn';
      b.innerText = note.n;
      b.onclick = () => {
        if(!this.isRunning) return;
        const res = document.getElementById('pitch-res');
        res.innerText = (note.n === this.targetNote.n) ? getText('correct') : `${getText('wrong')} (${this.targetNote.n})`;
        setTimeout(() => this.next(), 1200);
      };
      opts.appendChild(b);
    });
  },
  playRef() { if(this.isRunning) ResourceManager.playTone(261.63, 0.8); },
  playTarget() { if(this.isRunning && this.targetNote) ResourceManager.playTone(this.targetNote.f, 0.8); }
};

/* 1-② ピッチ制御 */
Games.vocal_control = {
  isRunning: false, pitchY: 150, targetY: 150, score: 0,
  init() {
    this.isRunning = false;
    const node = document.getElementById('game-node');
    node.innerHTML = `
      <div class="info-text">${getText('vocal_desc')}</div>
      <div class="control-panel">
        <button class="ui-btn" id="vc-start" onclick="Games.vocal_control.start()">${getText('start')}</button>
        <button class="ui-btn ui-btn-reset" onclick="Games.vocal_control.reset()">${getText('reset')}</button>
      </div>
      <canvas id="cv-vocal" width="500" height="300"></canvas>
      <div id="vocal-score" class="score-board">${getText('ready')}</div>
    `;
    const cv = document.getElementById('cv-vocal');
    const c = cv.getContext('2d');
    c.fillStyle = '#0f172a'; c.fillRect(0,0,500,300);
  },
  async start() {
    if(this.isRunning) return;
    this.isRunning = true;
    document.getElementById('vc-start').disabled = true;
    document.getElementById('vocal-score').innerText = getText('score') + '0';

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      ResourceManager.mediaStream = stream;
      const ctx = ResourceManager.getAudioContext();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      src.connect(analyser);
      const buf = new Float32Array(analyser.fftSize);

      const cv = document.getElementById('cv-vocal');
      const c = cv.getContext('2d');
      this.score = 0;
      let frame = 0;

      const loop = () => {
        if(!this.isRunning) return;
        analyser.getFloatTimeDomainData(buf);
        let pitch = this.autoCorrelate(buf, ctx.sampleRate);
        if (pitch !== -1) {
          let targetY = 300 - Math.min(Math.max((pitch - 100) * 0.8, 0), 300);
          this.pitchY += (targetY - this.pitchY) * 0.1;
        }

        frame++;
        if (frame % 120 === 0) this.targetY = 50 + Math.random() * 200;

        c.fillStyle = '#0f172a';
        c.fillRect(0, 0, 500, 300);

        c.fillStyle = 'rgba(34, 197, 94, 0.3)';
        c.fillRect(0, this.targetY - 25, 500, 50);

        c.fillStyle = '#ef4444';
        c.beginPath();
        c.arc(250, this.pitchY, 12, 0, Math.PI * 2);
        c.fill();

        if (Math.abs(this.pitchY - this.targetY) < 25) {
          this.score++;
          document.getElementById('vocal-score').innerText = getText('score') + Math.floor(this.score / 10);
        }

        ResourceManager.animId = requestAnimationFrame(loop);
      };
      loop();
    } catch(e) {
      document.getElementById('vocal-score').innerText = "Microphone access required.";
    }
  },
  reset() {
    ResourceManager.clearAll();
    this.init();
  },
  autoCorrelate(buf, sr) {
    let SIZE = buf.length, rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    if (Math.sqrt(rms / SIZE) < 0.01) return -1;
    let r1 = 0, r2 = SIZE - 1, th = 0.2;
    for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < th) { r1 = i; break; }
    for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < th) { r2 = SIZE - i; break; }
    buf = buf.slice(r1, r2); SIZE = buf.length;
    let c = new Array(SIZE).fill(0);
    for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE - i; j++) c[i] = c[i] + buf[j] * buf[j + i];
    let d = 0; while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
    return sr / maxpos;
  }
};

/* 1-③ リズム感 */
Games.rhythm = {
  isRunning: false, taps: [], startTime: 0,
  init() {
    this.isRunning = false;
    const node = document.getElementById('game-node');
    node.innerHTML = `
      <div class="info-text">${getText('rhythm_desc')}</div>
      <div class="control-panel">
        <button class="ui-btn" id="rh-start" onclick="Games.rhythm.start()">${getText('start')}</button>
        <button class="ui-btn ui-btn-reset" onclick="Games.rhythm.reset()">${getText('reset')}</button>
      </div>
      <button class="ui-btn" style="padding:20px 40px; font-size:1.2rem;" onclick="Games.rhythm.tap()">${getText('tap')}</button>
      <div id="rhythm-res" class="score-board">${getText('ready')}</div>
    `;
  },
  start() {
    if(this.isRunning) return;
    this.isRunning = true;
    document.getElementById('rh-start').disabled = true;
    document.getElementById('rhythm-res').innerText = '';
    this.taps = [];
    this.startTime = performance.now();
    let count = 0;
    ResourceManager.timerId = setInterval(() => {
      count++;
      if (count <= 4) ResourceManager.playTone(880, 0.05);
    }, 1000);
  },
  reset() {
    ResourceManager.clearAll();
    this.init();
  },
  tap() {
    if(!this.isRunning) return;
    const t = performance.now() - this.startTime;
    this.taps.push(t);
    if (this.taps.length >= 8) {
      let err = 0;
      for(let i=0; i<8; i++) err += Math.abs(this.taps[i] - (i + 1) * 1000);
      document.getElementById('rhythm-res').innerText = `${getText('accuracy')}${Math.max(0, Math.floor(1000 - err / 8))} pts`;
      this.isRunning = false;
    }
  }
};

/* 2-① Nバック */
Games.nback = {
  isRunning: false, seq: [], pos: 0, score: 0,
  init() {
    this.isRunning = false;
    const node = document.getElementById('game-node');
    node.innerHTML = `
      <div class="info-text">${getText('nback_desc')}</div>
      <div class="control-panel">
        <button class="ui-btn" id="nb-start" onclick="Games.nback.start()">${getText('start')}</button>
        <button class="ui-btn ui-btn-reset" onclick="Games.nback.reset()">${getText('reset')}</button>
      </div>
      <canvas id="cv-nback" width="300" height="300"></canvas>
      <div style="margin-top:10px;">
        <button class="ui-btn" onclick="Games.nback.answer(true)">${getText('match')}</button>
        <button class="ui-btn" onclick="Games.nback.answer(false)">${getText('not_match')}</button>
      </div>
      <div id="nb-res" class="score-board">${getText('ready')}</div>
    `;
    this.drawBoard();
  },
  drawBoard() {
    const cv = document.getElementById('cv-nback');
    const c = cv.getContext('2d');
    c.fillStyle = '#0f172a'; c.fillRect(0,0,300,300);
    c.strokeStyle = '#334155';
    for(let i=1; i<3; i++){
      c.beginPath(); c.moveTo(i*100,0); c.lineTo(i*100,300); c.stroke();
      c.beginPath(); c.moveTo(0,i*100); c.lineTo(300,i*100); c.stroke();
    }
  },
  start() {
    this.isRunning = true;
    document.getElementById('nb-start').disabled = true;
    this.seq = []; this.score = 0;
    document.getElementById('nb-res').innerText = getText('score') + '0';
    this.next();
  },
  reset() {
    ResourceManager.clearAll();
    this.init();
  },
  next() {
    if(!this.isRunning) return;
    this.pos = Math.floor(Math.random() * 9);
    this.seq.push(this.pos);
    this.drawBoard();
    const cv = document.getElementById('cv-nback');
    const c = cv.getContext('2d');
    const x = (this.pos % 3) * 100 + 10;
    const y = Math.floor(this.pos / 3) * 100 + 10;
    c.fillStyle = '#3b82f6';
    c.fillRect(x, y, 80, 80);
  },
  answer(userSaysMatch) {
    if(!this.isRunning) return;
    if (this.seq.length > 2) {
      const actualMatch = this.seq[this.seq.length - 1] === this.seq[this.seq.length - 3];
      if (userSaysMatch === actualMatch) this.score += 10;
      document.getElementById('nb-res').innerText = getText('score') + this.score;
    }
    this.next();
  }
};

/* 2-③ 空間認知 (3Dブロック・メンタルローテーション) */
Games.mental_rot = {
  isRunning: false,
  correctIdx: -1,
  angleX: 0.4,
  angleY: 0.6,
  isDragging: false,
  lastMouseX: 0,
  lastMouseY: 0,
  currentProblem: null,

  // 立体ブロックの基本形状データ（3Dグリッド座標）
  shapes: [
    // L字型ブロック
    [{x:0,y:0,z:0}, {x:1,y:0,z:0}, {x:2,y:0,z:0}, {x:0,y:1,z:0}, {x:0,y:2,z:0}],
    // Z字型ブロック
    [{x:0,y:0,z:0}, {x:1,y:0,z:0}, {x:1,y:1,z:0}, {x:2,y:1,z:0}, {x:1,y:1,z:1}],
    // T字・立体分岐型
    [{x:0,y:0,z:0}, {x:1,y:0,z:0}, {x:2,y:0,z:0}, {x:1,y:1,z:0}, {x:1,y:0,z:1}],
    // 3Dクランク型
    [{x:0,y:0,z:0}, {x:1,y:0,z:0}, {x:1,y:1,z:0}, {x:1,y:1,z:1}, {x:2,y:1,z:1}]
  ],

  init() {
    this.isRunning = false;
    const node = document.getElementById('game-node');
    node.innerHTML = `
      <div class="info-text">${getText('rot_desc')}<br><small style="color:#2563eb; font-weight:bold;">※「スタート」後、左端のターゲット枠内をドラッグすると3D回転できます</small></div>
      <div class="control-panel">
        <button class="ui-btn" id="mr-start" onclick="Games.mental_rot.start()">${getText('start')}</button>
        <button class="ui-btn ui-btn-reset" onclick="Games.mental_rot.reset()">${getText('reset')}</button>
      </div>
      <canvas id="cv-rot" width="700" height="240" style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:6px; max-width:100%; touch-action:none;"></canvas>
      <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
        <button class="ui-btn" onclick="Games.mental_rot.check(0)">選択 A</button>
        <button class="ui-btn" onclick="Games.mental_rot.check(1)">選択 B</button>
        <button class="ui-btn" onclick="Games.mental_rot.check(2)">選択 C</button>
        <button class="ui-btn" onclick="Games.mental_rot.check(3)">選択 D</button>
      </div>
      <div id="rot-res" class="score-board">${getText('ready')}</div>
      <div id="rot-explanation" style="margin-top:10px; padding:12px; background:#e2e8f0; border-radius:6px; font-size:0.9rem; max-width:680px; text-align:left; display:none; color:#1e293b; line-height:1.5;"></div>
    `;

    const cv = document.getElementById('cv-rot');
    this.setupEvents(cv);
    this.drawInitialCanvas();
  },

  setupEvents(cv) {
    if (!cv) return;

    // キャンバス内でのマウス座標計算ヘルパー
    const getPos = (e) => {
      const rect = cv.getBoundingClientRect();
      const scaleX = cv.width / rect.width;
      const scaleY = cv.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    };

    // マウスダウン（ドラッグ開始）
    cv.onmousedown = (e) => {
      const pos = getPos(e);
      // 左端のターゲット領域（X: 0〜140px）の中をクリックした場合のみドラッグ有効化
      if (pos.x <= 140) {
        this.isDragging = true;
        this.lastMouseX = e.clientX;
        this.lastMouseY = e.clientY;
        cv.style.cursor = 'grabbing';
      }
    };

    // マウス移動（ドラッグ回転処理）
    const onMove = (e) => {
      if (!this.isDragging || !this.isRunning) return;
      const dx = e.clientX - this.lastMouseX;
      const dy = e.clientY - this.lastMouseY;
      
      this.angleY += dx * 0.015;
      this.angleX += dy * 0.015;
      
      this.lastMouseX = e.clientX;
      this.lastMouseY = e.clientY;
      this.renderAll();
    };

    // ドラッグ解除
    const onUp = () => {
      if (this.isDragging) {
        this.isDragging = false;
        if (cv) cv.style.cursor = 'default';
      }
    };

    // カーソルホバー時のアイコン変更（ターゲットエリア上では grabbed / pointer 風に表示）
    cv.onmousemove = (e) => {
      const pos = getPos(e);
      if (!this.isDragging) {
        cv.style.cursor = (pos.x <= 140 && this.isRunning) ? 'grab' : 'default';
      }
      onMove(e);
    };

    window.addEventListener('mouseup', onUp);
  },

  drawInitialCanvas() {
    const cv = document.getElementById('cv-rot');
    if (!cv) return;
    const c = cv.getContext('2d');
    c.fillStyle = '#f8fafc';
    c.fillRect(0, 0, cv.width, cv.height);
  },

  start() {
    this.isRunning = true;
    document.getElementById('mr-start').disabled = true;
    document.getElementById('rot-res').innerText = '';
    document.getElementById('rot-explanation').style.display = 'none';
    this.generateProblem();
    this.renderAll();
  },

  reset() {
    ResourceManager.clearAll();
    this.init();
  },

  rotate3D(point, rotX, rotY, rotZ = 0) {
    let { x, y, z } = point;

    let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    let y1 = y * cosX - z * sinX;
    let z1 = y * sinX + z * cosX;

    let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    let x2 = x * cosY + z1 * sinY;
    let z2 = -x * sinY + z1 * cosY;

    let cosZ = Math.cos(rotZ), sinZ = Math.sin(rotZ);
    let x3 = x2 * cosZ - y1 * sinZ;
    let y3 = x2 * sinZ + y1 * cosZ;

    return { x: x3, y: y3, z: z2 };
  },

  generateProblem() {
    const shapeIdx = Math.floor(Math.random() * this.shapes.length);
    const baseShape = this.shapes[shapeIdx];
    
    let cx = 0, cy = 0, cz = 0;
    baseShape.forEach(p => { cx += p.x; cy += p.y; cz += p.z; });
    cx /= baseShape.length; cy /= baseShape.length; cz /= baseShape.length;
    
    const centeredShape = baseShape.map(p => ({ x: p.x - cx, y: p.y - cy, z: p.z - cz }));

    this.correctIdx = Math.floor(Math.random() * 4);
    
    const correctRot = {
      rx: (Math.floor(Math.random() * 3) + 1) * (Math.PI / 2),
      ry: (Math.floor(Math.random() * 3) + 1) * (Math.PI / 2),
      rz: Math.random() < 0.5 ? Math.PI / 2 : 0
    };

    const options = [];
    for (let i = 0; i < 4; i++) {
      if (i === this.correctIdx) {
        options.push({
          shape: centeredShape,
          rot: correctRot,
          isMirrored: false
        });
      } else {
        options.push({
          shape: centeredShape.map(p => ({ x: -p.x, y: p.y, z: p.z })),
          rot: {
            rx: Math.floor(Math.random() * 4) * (Math.PI / 2),
            ry: Math.floor(Math.random() * 4) * (Math.PI / 2),
            rz: 0
          },
          isMirrored: true
        });
      }
    }

    this.currentProblem = {
      target: centeredShape,
      options: options,
      correctRot: correctRot
    };
  },

  renderAll() {
    if (!this.isRunning || !this.currentProblem) return;
    const cv = document.getElementById('cv-rot');
    const c = cv.getContext('2d');
    c.fillStyle = '#f8fafc';
    c.fillRect(0, 0, cv.width, cv.height);

    // ターゲット枠の背景表示（操作領域を分かりやすく明示）
    c.fillStyle = '#eff6ff';
    c.fillRect(5, 5, 130, 230);
    c.strokeStyle = '#93c5fd';
    c.lineWidth = 1;
    c.strokeRect(5, 5, 130, 230);

    // 1. ターゲット形状の描画 (左端, ドラッグ操作可能)
    this.renderBlockGroup(c, this.currentProblem.target, 70, 120, { rx: this.angleX, ry: this.angleY, rz: 0 }, '#2563eb', 'ターゲット');

    // 2. 選択肢 A〜D の描画
    const labels = ['A', 'B', 'C', 'D'];
    const posXs = [210, 330, 450, 570];
    for (let i = 0; i < 4; i++) {
      const opt = this.currentProblem.options[i];
      this.renderBlockGroup(c, opt.shape, posXs[i], 120, opt.rot, '#d97706', labels[i]);
    }
  },

  renderBlockGroup(c, shape, centerX, centerY, rot, color, label) {
    const cubeSize = 18;
    const transformedCubes = shape.map(p => {
      const rotated = this.rotate3D(p, rot.rx, rot.ry, rot.rz);
      return {
        x: centerX + rotated.x * cubeSize,
        y: centerY + rotated.y * cubeSize,
        z: rotated.z * cubeSize
      };
    });

    transformedCubes.sort((a, b) => a.z - b.z);

    transformedCubes.forEach(cb => {
      this.drawCube(c, cb.x, cb.y, cubeSize, color);
    });

    c.fillStyle = '#334155';
    c.font = 'bold 14px sans-serif';
    c.textAlign = 'center';
    c.fillText(label, centerX, 215);
  },

  drawCube(c, x, y, size, color) {
    const h = size / 2;
    c.save();
    c.translate(x, y);

    // 上面
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(0, -h);
    c.lineTo(h, -h / 2);
    c.lineTo(0, 0);
    c.lineTo(-h, -h / 2);
    c.closePath();
    c.fill();
    c.strokeStyle = '#0f172a';
    c.lineWidth = 1.5;
    c.stroke();

    // 左側面
    c.fillStyle = 'rgba(0, 0, 0, 0.15)';
    c.beginPath();
    c.moveTo(-h, -h / 2);
    c.lineTo(0, 0);
    c.lineTo(0, h);
    c.lineTo(-h, h / 2);
    c.closePath();
    c.fill();
    c.stroke();

    // 右側面
    c.fillStyle = 'rgba(0, 0, 0, 0.35)';
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(h, -h / 2);
    c.lineTo(h, h / 2);
    c.lineTo(0, h);
    c.closePath();
    c.fill();
    c.stroke();

    c.restore();
  },

  check(idx) {
    if (!this.isRunning) return;
    const res = document.getElementById('rot-res');
    const exp = document.getElementById('rot-explanation');
    const labels = ['A', 'B', 'C', 'D'];
    const correctLabel = labels[this.correctIdx];

    if (idx === this.correctIdx) {
      res.innerText = getText('correct');
      res.style.color = '#16a34a';
    } else {
      res.innerText = `${getText('wrong')}（正解は ${correctLabel} ）`;
      res.style.color = '#dc2626';
    }

    const rot = this.currentProblem.correctRot;
    const degX = Math.round((rot.rx * 180) / Math.PI) % 360;
    const degY = Math.round((rot.ry * 180) / Math.PI) % 360;
    const degZ = Math.round((rot.rz * 180) / Math.PI) % 360;

    exp.style.display = 'block';
    exp.innerHTML = `
      <strong>【解説・正解の理由】</strong><br>
      ・正解は <strong>選択肢 ${correctLabel}</strong> です。<br>
      ・ターゲットの立体を <strong>X軸方向に ${degX}°、Y軸方向に ${degY}°${degZ > 0 ? `、Z軸方向に ${degZ}°` : ''}</strong> 回転させると、選択肢 ${correctLabel} と完全に一致します。<br>
      ・その他の選択肢は、立体を裏返した「鏡像（左右反転）」または一部の組み合わせが異なる立体であるため、脳内でどのように回転させても一致しません。
    `;

    setTimeout(() => {
      if (this.isRunning) {
        this.generateProblem();
        this.renderAll();
      }
    }, 4000);
  }
};

    c.fillStyle = '#0f172a'; c.fillRect(0,0,500,300);
    cv.onclick = (e) => this.onClick(e, cv);
  },

    this.isRunning = true;

    this.score = 0;

    this.init();

    const cv = document.getElementById('cv-aim');
    if(!cv) return;
    const c = cv.getContext('2d');
    c.fillStyle = '#0f172a'; c.fillRect(0,0,500,300);

    this.x = 30 + Math.random() * 440;
    this.y = 30 + Math.random() * 240;

    c.fillStyle = '#ef4444';
    c.beginPath(); c.arc(this.x, this.y, 15, 0, Math.PI * 2); c.fill();

    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const dist = Math.hypot(mx - this.x, my - this.y);
    if (dist < 20) {
      this.score += 10;
      document.getElementById('aim-res').innerText = getText('score') + this.score;
      this.spawn();
    }
  }
