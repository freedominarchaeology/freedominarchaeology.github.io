<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift War - The Social Dynamics of Giving</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #d4af37;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            font-family: inherit;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        select:hover, button:hover {
            background: #3a3a3a;
            border-color: #d4af37;
        }
        main {
            flex: 1;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 55px);
        }
        .status-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .stat-box {
            background: #121212;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            border-left: 3px solid #d4af37;
        }
        .stat-title {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }
        .stat-bar {
            height: 4px;
            background: #333;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: #d4af37;
            width: 0%;
            transition: width 0.3s ease;
        }
        .game-field {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            min-height: 0;
        }
        .log-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .log-entry {
            padding: 4px 8px;
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
        }
        .log-entry.event { border-left: 2px solid #e74c3c; }
        .log-entry.action { border-left: 2px solid #2ecc71; }
        .ai-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hand-area {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            overflow-x: auto;
            padding: 5px 0;
        }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            width: 140px;
            height: 180px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
            background: #333;
        }
        .card-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
        }
        .card-desc {
            font-size: 0.7rem;
            color: #bbb;
            line-height: 1.2;
            text-align: center;
        }
        .card-cost {
            font-size: 0.7rem;
            color: #888;
            text-align: right;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-title {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 12px;
        }
        .modal-body {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #d4af37;
            color: #000;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 8px;
        }
        @media (max-width: 768px) {
            .status-panel { grid-template-columns: repeat(2, 1fr); }
            .game-field { grid-template-columns: 1fr; }
            .ai-panel { display: none; }
            .card { width: 110px; height: 150px; padding: 6px; }
            .card-title { font-size: 0.75rem; }
            .card-desc { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

            <div class="stat-box">
                <div class="stat-title" id="lbl-complexity">社会的複雑度</div>

            <div class="stat-box">

        <section class="game-field">

            <div class="ai-panel">

                    AI行動分析中...
                </div>
                <button id="btn-next" style="width: 100%; margin-top: 10px;">次へ経過</button>
            </div>
        </section>

        <section class="hand-area">
            <div class="panel-title" id="lbl-hand">実行可能な戦略カード</div>
            <div class="cards-container" id="cards-box"></div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">理論解説</div>
            <div class="modal-body" id="modal-body"></div>
            <button class="close-btn" id="modal-close">閉じる</button>

    </div>

        let state = {
            lang: 'ja',
            turn: 1,
            complexity: 10,
            inequality: 10,
            cohesion: 100,
            isGameOver: false
        };

        const DOM = {
            langSelect: document.getElementById('lang-select'),
            appTitle: document.getElementById('app-title'),
            btnHelp: document.getElementById('btn-help'),
            lblTurn: document.getElementById('lbl-turn'),
            valTurn: document.getElementById('val-turn'),
            lblComplexity: document.getElementById('lbl-complexity'),
            valComplexity: document.getElementById('val-complexity'),
            barComplexity: document.getElementById('bar-complexity'),
            lblInequality: document.getElementById('lbl-inequality'),
            valInequality: document.getElementById('val-inequality'),
            barInequality: document.getElementById('bar-inequality'),
            lblCohesion: document.getElementById('lbl-cohesion'),
            valCohesion: document.getElementById('val-cohesion'),
            barCohesion: document.getElementById('bar-cohesion'),

            modalBody: document.getElementById('modal-body'),
            modalClose: document.getElementById('modal-close')

        function init() {
            DOM.langSelect.addEventListener('change', (e) => {
                state.lang = e.target.value;
                updateI18N();
            });
            DOM.btnHelp.addEventListener('click', showHelp);
            DOM.modalClose.addEventListener('click', hideModal);
            DOM.btnNext.addEventListener('click', () => processTurn(null));

            updateI18N();
            renderHand();
            updateUI();
        }

        function updateI18N() {
            const t = I18N[state.lang];
            DOM.appTitle.textContent = t.title;
            DOM.btnHelp.textContent = t.help;
            DOM.lblTurn.textContent = t.turn;
            DOM.lblComplexity.textContent = t.complexity;
            DOM.lblInequality.textContent = t.inequality;
            DOM.lblCohesion.textContent = t.cohesion;
            DOM.lblLog.textContent = t.log;
            DOM.lblAi.textContent = t.ai;
            DOM.aiStatus.textContent = t.aiText;
            DOM.btnNext.textContent = t.next;
            DOM.lblHand.textContent = t.hand;
            DOM.modalClose.textContent = t.close;
            renderHand();
        }

        function renderHand() {
            while (DOM.cardsBox.firstChild) {
                DOM.cardsBox.removeChild(DOM.cardsBox.firstChild);
            }

            if (state.isGameOver) return;

            const t = I18N[state.lang].cards;
            const cardKeys = ['accumulate', 'directGift', 'obligatory', 'potlatch', 'freeGift'];

            cardKeys.forEach(key => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                
                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = t[key].name;

                const desc = document.createElement('div');
                desc.className = 'card-desc';
                desc.textContent = t[key].desc;

                cardEl.appendChild(title);
                cardEl.appendChild(desc);

                cardEl.addEventListener('click', () => processTurn(key));
                DOM.cardsBox.appendChild(cardEl);
            });
        }

        function processTurn(actionKey) {
            if (state.isGameOver) return;

            const t = I18N[state.lang];
            
            if (actionKey) {
                applyCardEffect(actionKey);
                addLog(`[Turn ${state.turn}] ${t.cards[actionKey].name}`, 'action');
            } else {
                state.complexity += 2;
                state.inequality += 5;
                addLog(`[Turn ${state.turn}] ${t.next}`, 'action');
            }

            state.inequality += Math.floor(state.complexity * 0.3);
            if (state.inequality > 50) {
                state.cohesion -= Math.floor((state.inequality - 50) * 0.5);
            }

            state.complexity = Math.max(10, Math.min(100, state.complexity));
            state.inequality = Math.max(0, Math.min(100, state.inequality));
            state.cohesion = Math.max(0, Math.min(100, state.cohesion));

            if (state.cohesion <= 0) {
                state.isGameOver = true;
                addLog(`[CRASH] ${t.gameOver}`, 'event');
                showModal(t.gameOver, `${t.gameOver} (Turn: ${state.turn})`);
            } else {
                state.turn++;
            }

            updateUI();
        }

        function applyCardEffect(key) {
            switch(key) {
                case 'accumulate':
                    state.complexity += 8;
                    state.inequality += 12;
                    break;
                case 'directGift':
                    state.inequality = Math.max(0, state.inequality - 10);
                    state.cohesion += 5;
                    break;
                case 'obligatory':
                    state.cohesion += 8;
                    state.inequality += 2;
                    break;
                case 'potlatch':
                    state.inequality = Math.max(0, state.inequality - 25);
                    state.complexity = Math.max(10, state.complexity - 5);
                    state.cohesion += 10;
                    break;
                case 'freeGift':
                    state.inequality = Math.max(0, state.inequality - 18);
                    state.cohesion += 15;
                    state.complexity += 3;
                    break;
            }
        }

        function updateUI() {
            DOM.valTurn.textContent = state.turn;
            DOM.valComplexity.textContent = state.complexity;
            DOM.barComplexity.style.width = `${state.complexity}%`;
            
            DOM.valInequality.textContent = `${state.inequality}%`;
            DOM.barInequality.style.width = `${state.inequality}%`;

            DOM.valCohesion.textContent = state.cohesion;
            DOM.barCohesion.style.width = `${state.cohesion}%`;
        }

        function addLog(msg, type) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = msg;
            DOM.logBox.appendChild(entry);
            DOM.logBox.scrollTop = DOM.logBox.scrollHeight;
        }

        function showHelp() {
            const t = I18N[state.lang];
            showModal(t.help, t.helpContent);
        }

        function showModal(title, text) {
            DOM.modalTitle.textContent = title;
            DOM.modalBody.textContent = text;
            DOM.modal.style.display = 'flex';
        }

        function hideModal() {
            DOM.modal.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
