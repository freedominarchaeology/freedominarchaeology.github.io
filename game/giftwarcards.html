<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift War - The Social Dynamics of Giving</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #d4af37;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            font-family: inherit;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        select:hover, button:hover {
            background: #3a3a3a;
            border-color: #d4af37;
        }
        button:disabled {
            background: #1a1a1a;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
        }
        main {
            flex: 1;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 55px);
        }
        .status-panel {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .stat-box {
            background: #121212;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            border-left: 3px solid #d4af37;
        }
        .stat-title {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }
        .stat-bar {
            height: 4px;
            background: #333;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: #d4af37;
            width: 0%;
            transition: width 0.3s ease;
        }
        .game-field {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            min-height: 0;
        }
        .log-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .panel-title {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .log-content {
            flex: 1;
            overflow-y: scroll;
            max-height: 100%;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
        }
        .log-content::-webkit-scrollbar {
            width: 6px;
        }
        .log-content::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 3px;
        }
        .log-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .log-content::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }
        .log-entry {
            padding: 4px 8px;
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
            word-break: break-all;
        }
        .log-entry.event { border-left: 2px solid #e74c3c; }
        .log-entry.action { border-left: 2px solid #2ecc71; }
        .log-entry.info { border-left: 2px solid #3498db; }
        .ai-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hand-area {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            overflow-x: auto;
            padding: 5px 0;
        }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            width: 150px;
            height: 190px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .card:hover:not(.disabled) {
            transform: translateY(-5px);
            border-color: #d4af37;
            background: #333;
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #222;
        }
        .card-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
        }
        .card-desc {
            font-size: 0.7rem;
            color: #bbb;
            line-height: 1.2;
            text-align: center;
        }
        .card-req {
            font-size: 0.65rem;
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-title {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 12px;
        }
        .modal-body {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #d4af37;
            color: #000;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 8px;
        }
        @media (max-width: 768px) {
            .status-panel { grid-template-columns: repeat(3, 1fr); }
            .game-field { grid-template-columns: 1fr; }
            .ai-panel { display: none; }
            .card { width: 115px; height: 160px; padding: 6px; }
            .card-title { font-size: 0.75rem; }
            .card-desc { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="app-title">GIFT WAR</h1>

            <div class="stat-box">

                <div class="stat-value" id="val-score">0</div>

            </div>

        </section>

        <section class="game-field">

                <div class="panel-title" id="lbl-log">社会履歴ログ</div>
                <div class="log-content" id="log-box"></div>
            </div>
            <div class="ai-panel">
                <div class="panel-title" id="lbl-ai">対話社会 (AI)</div>
                <div id="ai-status" style="font-size:0.85rem; color:#aaa; line-height:1.4;">

                </div>
                <button id="btn-next" style="width: 100%; margin-top: 10px;">何もせず静観</button>
            </div>
        </section>

        <section class="hand-area">
            <div class="panel-title" id="lbl-hand">実行可能な戦略カード</div>
            <div class="cards-container" id="cards-box"></div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">理論解説</div>
            <div class="modal-body" id="modal-body"></div>
            <button class="close-btn" id="modal-close">閉じる</button>
        </div>
    </div>

            lblAi: document.getElementById('lbl-ai'),
            aiStatus: document.getElementById('ai-status'),
            btnNext: document.getElementById('btn-next'),
            lblHand: document.getElementById('lbl-hand'),
            cardsBox: document.getElementById('cards-box'),
            modal: document.getElementById('modal'),
            modalTitle: document.getElementById('modal-title'),
            modalBody: document.getElementById('modal-body'),
            modalClose: document.getElementById('modal-close')
        };

        function init() {
            DOM.langSelect.addEventListener('change', (e) => {
                state.lang = e.target.value;
                updateI18N();
            });
            DOM.btnHelp.addEventListener('click', showHelp);
            DOM.modalClose.addEventListener('click', hideModal);
            DOM.btnNext.addEventListener('click', () => processTurn(null));

            updateI18N();
            renderHand();
            updateUI();
        }

        function updateI18N() {
            const t = I18N[state.lang];
            DOM.appTitle.textContent = t.title;
            DOM.btnHelp.textContent = t.help;
            DOM.lblTurn.textContent = t.turn;
            DOM.lblScore.textContent = t.score;
            DOM.lblComplexity.textContent = t.complexity;
            DOM.lblInequality.textContent = t.inequality;
            DOM.lblCohesion.textContent = t.cohesion;
            DOM.lblLog.textContent = t.log;
            DOM.lblAi.textContent = t.ai;
            DOM.aiStatus.textContent = t.aiText;
            DOM.btnNext.textContent = t.next;
            DOM.lblHand.textContent = t.hand;
            DOM.modalClose.textContent = t.close;
            renderHand();
        }

        function renderHand() {
            while (DOM.cardsBox.firstChild) {
                DOM.cardsBox.removeChild(DOM.cardsBox.firstChild);
            }

            if (state.isGameOver) return;

            const t = I18N[state.lang];
            const cardKeys = ['accumulate', 'directGift', 'obligatory', 'potlatch', 'freeGift'];

            cardKeys.forEach(key => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                
                let isExecutable = true;
                let reqMsg = "";

                if (key === 'potlatch') {
                    if (state.complexity < 30 || state.inequality < 40) {
                        isExecutable = false;
                        reqMsg = t.reqPotlatch;
                    }
                }

                if (!isExecutable) {
                    cardEl.classList.add('disabled');
                }

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = t.cards[key].name;

                const desc = document.createElement('div');
                desc.className = 'card-desc';
                desc.textContent = t.cards[key].desc;

                cardEl.appendChild(title);
                cardEl.appendChild(desc);

                if (reqMsg) {
                    const req = document.createElement('div');
                    req.className = 'card-req';
                    req.textContent = reqMsg;
                    cardEl.appendChild(req);
                }

                if (isExecutable) {
                    cardEl.addEventListener('click', () => processTurn(key));
                }
                DOM.cardsBox.appendChild(cardEl);
            });
        }

        function processTurn(actionKey) {
            if (state.isGameOver) return;

            const t = I18N[state.lang];
            
            if (actionKey) {
                applyCardEffect(actionKey);
                addLog(`[Turn ${state.turn}] ${t.cards[actionKey].name}`, 'action');
            } else {
                state.complexity += 2;
                state.inequality += 5;
                addLog(`[Turn ${state.turn}] ${t.next}`, 'action');
            }

            // 複雑度に基づくスコア算定（複雑度が高いほど文明獲得ポイントが跳ね上がる）
            const turnScore = Math.floor(state.complexity * (1 + state.complexity / 50));
            state.score += turnScore;
            addLog(`+${turnScore} ${t.score}`, 'info');

            // 格差の自動増加と結束度へのダメージ計算
            state.inequality += Math.floor(state.complexity * 0.25);
            if (state.inequality > 50) {
                const penalty = Math.floor((state.inequality - 50) * 0.6);
                state.cohesion -= penalty;
            }

            // ステータス範囲制限
            state.complexity = Math.max(10, Math.min(100, state.complexity));
            state.inequality = Math.max(0, Math.min(100, state.inequality));
            state.cohesion = Math.max(0, Math.min(100, state.cohesion));

            if (state.cohesion <= 0) {
                state.isGameOver = true;
                addLog(`[CRASH] ${t.gameOver}`, 'event');
                showModal(t.gameOver, `${t.gameOver}\n${t.turn}: ${state.turn}\n${t.score}: ${state.score}`);
            } else {
                state.turn++;
            }

            renderHand();
            updateUI();
        }

        function applyCardEffect(key) {
            switch(key) {
                case 'accumulate':
                    state.complexity += 12;
                    state.inequality += 15;
                    break;
                case 'directGift':
                    state.inequality = Math.max(0, state.inequality - 10);
                    state.cohesion += 5;
                    state.complexity = Math.max(10, state.complexity - 2);
                    break;
                case 'obligatory':
                    state.cohesion += 8;
                    state.inequality += 3;
                    break;
                case 'potlatch':
                    state.inequality = Math.max(0, state.inequality - 30);
                    state.cohesion += 15;
                    state.complexity = Math.max(10, state.complexity - 15); // デメリット：破壊により高度な社会的複雑度を喪失
                    break;
                case 'freeGift':
                    state.inequality = Math.max(0, state.inequality - 15);
                    state.cohesion += 10;
                    // デメリット：純粋贈与のみでは技術・複雑度の進化が停止する
                    break;
            }
        }

        function updateUI() {
            DOM.valTurn.textContent = state.turn;
            DOM.valScore.textContent = state.score;
            DOM.barScore.style.width = `${Math.min(100, state.score / 50)}%`;

            DOM.valComplexity.textContent = state.complexity;
            DOM.barComplexity.style.width = `${state.complexity}%`;
            
            DOM.valInequality.textContent = `${state.inequality}%`;
            DOM.barInequality.style.width = `${state.inequality}%`;

            DOM.valCohesion.textContent = state.cohesion;
            DOM.barCohesion.style.width = `${state.cohesion}%`;
        }

        function addLog(msg, type) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = msg;
            DOM.logBox.appendChild(entry);
            
            // ログの自動スクロール調整（最新行へスクロール）
            DOM.logBox.scrollTop = DOM.logBox.scrollHeight;
        }

        function showHelp() {
            const t = I18N[state.lang];
            showModal(t.help, t.helpContent);
        }

        function showModal(title, text) {
            DOM.modalTitle.textContent = title;
            DOM.modalBody.textContent = text;
            DOM.modal.style.display = 'flex';
        }

        function hideModal() {
            DOM.modal.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
