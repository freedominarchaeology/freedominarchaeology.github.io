<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Gift War - The Social Dynamics of Giving & Evolution</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #d4af37;
        }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, button {
            font-family: inherit;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
            touch-action: manipulation;
        }
        select:hover, button:hover {
            background: #3a3a3a;
            border-color: #d4af37;
        }
        button:disabled {
            background: #1a1a1a;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .status-panel {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .stat-box {
            background: #121212;
            padding: 6px 4px;
            border-radius: 4px;
            text-align: center;
            border-left: 3px solid #d4af37;
        }
        .stat-box.stage-box {
            border-left-color: #9b59b6;
        }
        .stat-title {
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .stat-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }
        .stat-bar {
            height: 4px;
            background: #333;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: #d4af37;
            width: 0%;
            transition: width 0.3s ease;
        }
        .game-field {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            min-height: 180px;
        }
        .log-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 150px;
            max-height: 250px;
        }
        .panel-title {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 6px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
            touch-action: pan-y;
        }
        .log-content::-webkit-scrollbar {
            width: 5px;
        }
        .log-content::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 3px;
        }
        .log-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .log-entry {
            padding: 4px 8px;
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
            word-break: break-all;
        }
        .log-entry.event { border-left: 2px solid #e74c3c; }
        .log-entry.evolution { border-left: 2px solid #9b59b6; }
        .log-entry.action { border-left: 2px solid #2ecc71; }
        .log-entry.info { border-left: 2px solid #3498db; }
        .log-entry.warn { border-left: 2px solid #f39c12; }
        .ai-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
        }
        .hand-area {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            overflow-x: auto;
            padding: 5px 0 10px 0;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
        }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            width: 150px;
            height: 185px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .card:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: #d4af37;
            background: #333;
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #222;
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
            pointer-events: none;
        }
        .card-desc {
            font-size: 0.68rem;
            color: #bbb;
            line-height: 1.25;
            text-align: center;
            pointer-events: none;
        }
        .card-req {
            font-size: 0.6rem;
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 10px;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .modal-title {
            font-size: 1.1rem;
            color: #d4af37;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }
        .modal-body {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        .close-btn {
            background: #d4af37;
            color: #000;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
        }

        /* 紫色の追加項目エリア */
        .purple-section {
            color: #be90d4;
            border-left: 2px solid #9b59b6;
            padding-left: 8px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            body { height: auto; }
            header { padding: 8px 10px; }
            h1 { font-size: 1.0rem; }
            .status-panel { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 6px;
                padding: 8px;
            }
            .stat-box { padding: 4px 2px; }
            .stat-title { font-size: 0.65rem; }
            .stat-value { font-size: 0.85rem; }
            .game-field { grid-template-columns: 1fr; gap: 8px; }
            .log-panel { max-height: 180px; }
            .ai-panel { min-height: auto; gap: 8px; }
            .cards-container { justify-content: flex-start; }
            .card { width: 130px; height: 165px; padding: 6px; }
            .card-title { font-size: 0.75rem; }
            .card-desc { font-size: 0.62rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="app-title">GIFT WAR</h1>
        <div class="controls">
            <select id="mode-select">
                <option value="forager">狩猟採集社会</option>
                <option value="agrarian" selected>農耕社会</option>
            </select>
            <button id="btn-soc">参照 (Societies)</button>
            <button id="btn-help">HELP</button>
            <select id="lang-select">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="ko">한국語</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
    </header>

    <main>
        <section class="status-panel">
            <div class="stat-box stage-box">
                <div class="stat-title" id="lbl-stage">社会形態</div>
                <div class="stat-value" id="val-stage">バンド</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-stage" style="width: 25%; background:#9b59b6;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-turn">生存年数 (Turn)</div>
                <div class="stat-value" id="val-turn">1</div>
                <div class="stat-bar"><div class="stat-fill" style="width: 100%;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-giftcount">贈与累積回数</div>
                <div class="stat-value" id="val-giftcount">0</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-giftcount" style="width: 0%;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-complexity">社会的複雑度</div>
                <div class="stat-value" id="val-complexity">10</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-complexity"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-inequality">格差インデックス</div>
                <div class="stat-value" id="val-inequality">10%</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-inequality"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-cohesion">社会的結束度</div>
                <div class="stat-value" id="val-cohesion">100</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-cohesion"></div></div>
            </div>
            <!-- 新規追加パラメータ -->
            <div class="stat-box">
                <div class="stat-title" id="lbl-pop">人口</div>
                <div class="stat-value" id="val-pop">30</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-pop"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-food">食料獲得量</div>
                <div class="stat-value" id="val-food">50</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-food"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-tools">道具生産量</div>
                <div class="stat-value" id="val-tools">10</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-tools"></div></div>
            </div>
        </section>

        <section class="game-field">
            <div class="log-panel">
                <div class="panel-title" id="lbl-log">社会履歴ログ</div>
                <div class="log-content" id="log-box"></div>
            </div>
            <div class="ai-panel">
                <div class="panel-title" id="lbl-ai">外部・他者勢力 (AI)</div>
                <div id="ai-status" style="font-size:0.8rem; color:#aaa; line-height:1.4;">
                    AI行動分析中...
                </div>
                <button id="btn-next" style="width: 100%; margin-top: 6px;">何もせず静観</button>
            </div>
        </section>

        <section class="hand-area">
            <div class="panel-title" id="lbl-hand">実行可能な戦略カード</div>
            <div class="cards-container" id="cards-box"></div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">理論解説</div>
            <div class="modal-body" id="modal-body"></div>
            <button class="close-btn" id="modal-close">閉じる</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const SOC_DATABASE = {
            forager: {
                10: {
                    ja: { system: "極小遊動バンド", diff: "血縁を中心とした15〜30人の完全平等集団。資源の所有概念はなく即時消費。", ex: "カラハリ・サン族（旧来の伝統的移動生活期）、ハザ族" },
                    en: { system: "Micro Mobile Band", diff: "Fully egalitarian group of 15–30 kin. No concept of resource ownership; immediate consumption.", ex: "Kalahari San (traditional mobile era), Hadza" },

                    ko: { system: "극소 유목 밴드", diff: "혈연 중심 15~30인의 완전 평등 집단. 자원 소유 개념 없이 즉시 소비.", ex: "칼라하리 산족(전통 이동기), 하다자족" },

                },
                15: {
                    ja: { system: "遊動バンド連合", diff: "複数家族の季節的集積。個人的所有はないが贈与を通じた広域相互扶助が成立。", ex: "イヌイットの冬季集落、オーストラリア先住民の移動バンド" },
                    en: { system: "Mobile Band Coalition", diff: "Seasonal gathering of families. Wide-area mutual aid through gifts without personal property.", ex: "Inuit winter camps, Australian Aboriginal bands" },
                    zh: { system: "游动游群联盟", diff: "多家庭的季节性聚集。无个人财产，但通过馈赠实现广域互助。", ex: "因纽特人冬季营地、澳大利亚原住民游群" },
                    ko: { system: "유목 밴드 연합", diff: "다수 가족의 계절적 집적. 개인 소유 없이 증여를 통한 광역 상호부조.", ex: "이누이트 겨울 집락, 호주 원주민 이동 밴드" },

                },
                20: {
                    ja: { system: "半定住型部族（初期）", diff: "特定の豊かな漁場や採取地に定住を開始。道具や装身具の個人的所有の萌芽。", ex: "縄文時代早期・前期の集落、北米カリフォルニア先住民" },
                    en: { system: "Semi-sedentary Tribe (Early)", diff: "Settlement near rich fishing/gathering spots. Emergence of personal tools and ornaments.", ex: "Early Jomon villages, California Native Americans" },

                25: {
                    ja: { system: "定住型狩猟採集部族", diff: "特定の資源（鮭・どんぐり等）の大規模貯蔵。長老や呪術師による儀礼的調整の発生。", ex: "縄文時代中期（三内丸山遺跡など）、パプアニューギニア高地狩猟採集民" },

                    fr: { system: "Tribu complexe à stockage avancé", diff: "Monopole des ressources et des stocks. Début de stratification et réseaux marchands.", ex: "Peuples du Nord-Ouest pacifique (Tlingit, début Kwakiutl)" },
                    es: { system: "Tribu compleja de almacenamiento avanzado", diff: "Monopolio de recursos y almacenes. Inicio de estratificación y redes comerciales.", ex: "Pueblos del Noroeste del Pacífico (Tlingit, Kwakiutl temprano)" }
                },
                35: {
                    ja: { system: "複合狩猟採集首長制", diff: "世襲首長と平民・奴隷の層化。富の誇示と再分配のための大規模儀礼（ポトラッチ）の成立。", ex: "19世紀北米クワキウトル族・ハイダ族（ポトラッチ全盛期）" },
                    en: { system: "Complex Forager Chiefdom", diff: "Hereditary chiefs, commoners, slaves. Large-scale redistributive rituals (Potlatch).", ex: "19th c. Kwakiutl, Haida (Potlatch peak era)" },
                    zh: { system: "复合采集酋邦", diff: "世袭酋长、平民与奴隶分化。设立用于炫耀财富与再分配的大型仪式（夸富宴）。", ex: "19世纪克瓦基特尔人、海达人（夸富宴鼎盛期）" },
                    ko: { system: "복합 수렵채집 군장국", diff: "세습 군장, 평민, 노예 계층화. 부의 과시와 재분배를 위한 대규모 의례(포트래치) 성립.", ex: "19세기 크와키우틀족, 하이다족 (포트래치 전성기)" },
                    fr: { system: "Chefferie complexe de chasseurs-cueilleurs", diff: "Chefs héréditaires, roturiers, esclaves. Rituel de redistribution massif (Potlatch).", ex: "Kwakiutl du XIXe siècle, Haida (apogée du Potlatch)" },
                    es: { system: "Jefatura compleja cazadora-recolectora", diff: "Jefes hereditarios, plebleyos, esclavos. Rituales masivos de redistribución (Potlatch).", ex: "Kwakiutl del siglo XIX, Haida (apogeo del Potlatch)" }
                },
                40: {
                    ja: { system: "特化型定住首長制", diff: "巨大な構造物や巨石遺構の建造。広域な地域間贈与体系の組織化と領有権の主張。", ex: "縄文時代後期・晩期（巨大木柱列遺構等）、ギョベクリ・テペ建造社会" },
                    en: { system: "Specialized Sedentary Chiefdom", diff: "Construction of megaliths and massive structures. Organized regional gift exchanges.", ex: "Late Jomon (wooden pillar circles), Göbekli Tepe builders" },
                    zh: { system: "专业化定居酋邦", diff: "建造大型建筑物或巨石遗迹。组织广域区域间赠与体系与领土主张。", ex: "绳文时代后期/晚期（巨型木柱遗迹等）、哥贝克力石阵建造社会" },
                    ko: { system: "특화형 정주 군장국", diff: "거대 구조물 및 거석 유적 건조. 광역 지역 간 증여 체계 조직화.", ex: "조몬 시대 후/만기(거대 목주열 유적 등), 괴베클리 테페 건조 사회" },
                    fr: { system: "Chefferie sédentaire spécialisée", diff: "Mégalithes et structures massives. Réseaux de dons régionaux organisés.", ex: "Jomon tardif (cercle de poteaux), bâtisseurs de Göbekli Tepe" },
                    es: { system: "Jefatura sedentaria especializada", diff: "Construcción de megalitos y grandes estructuras. Redes organizadas de intercambio.", ex: "Jomon tardío (círculos de madera), constructores de Göbekli Tepe" }
                },
                45: {
                    ja: { system: "狩猟採集複雑性の極致", diff: "非農耕でありながら高度な階層化と広域同盟を維持。これ以上の複雑化は農耕化を要する限界点。", ex: "カリフォルニア・チュマシュ族（貝貨通貨経済と世襲首長）" },
                    en: { system: "Peak Forager Complexity", diff: "High stratification without agriculture. Maximum complexity possible before farming.", ex: "Chumash of California (shell-money economy, hereditary chiefs)" },
                    zh: { system: "采集社会复杂性极致", diff: "非农耕却维持着高度阶层化与广域同盟。进一步复杂化需向农耕转型的极限。", ex: "加州丘马什人（贝币货币经济与世袭酋长）" },
                    ko: { system: "수렵채집 복잡성의 극치", diff: "비농경임에도 고도 계층화 및 광역 동맹 유지. 농경화 없이 도달 가능한 정점.", ex: "캘리포니아 추마시족(패화 화폐 경제 및 세습 군장)" },
                    fr: { system: "Sommet de la complexité de cueillette", diff: "Stratification élevée sans agriculture. Limite maximale avant l'agriculture.", ex: "Chumash de Californie (monnaie de coquillage, chefs héréditaires)" },
                    es: { system: "Cúspide de complejidad recolectora", diff: "Alta estratificación sin agricultura. Límite máximo alcanzable sin cultivar.", ex: "Chumash de California (moneda de conchas, jefes hereditarios)" }
                }
            },
            agrarian: {
                10: {
                    ja: { system: "初期農耕集落（バンド・部族）", diff: "小規模な刀耕火種農耕。土地の私有はなく共同体全体での共同耕作と再分配。", ex: "新石器時代初期ヤンシャオ文化（仰韶文化）、初期新石器ヨーロッパ" },
                    en: { system: "Early Agrarian Village", diff: "Small-scale slash-and-burn. No land ownership; collective farming and sharing.", ex: "Early Neolithic Yangshao culture, Early Neolithic Europe" },
                    zh: { system: "早期农耕聚落（游群/部落）", diff: "小规模刀耕火种。无土地私有，全共同体共同耕作与再分配。", ex: "新石器时代早期仰韶文化、早期新石器欧洲" },
                    ko: { system: "초기 농경 집락 (밴드/부족)", diff: "소규모 화전 농경. 토지 사유 없이 공동체 전체의 공동 경작 및 재분배.", ex: "신석기 시대 초기 앙소 문화, 초기 신석기 유럽" },
                    fr: { system: "Village agricole primitif", diff: "Culture sur brûlis à petite échelle. Pas de propriété foncière ; partage communautaire.", ex: "Culture Yangshao néolithique, Europe néolithique initiale" },
                    es: { system: "Aldea agrícola incipiente", diff: "Cultivo de roza y quema a pequeña escala. Sin propiedad de la tierra; trabajo comunitario.", ex: "Cultura Yangshao del Neolítico temprano, Europa neolítica temprana" }
                },
                15: {
                    ja: { system: "定住農耕村落複合", diff: "村落間のゆるやかな同盟。長老会による土地利用の調整と互恵的贈与体系。", ex: "縄文晩期〜初期弥生集落（板付遺跡等）、新石器時代バンチェン文化" },
                    en: { system: "Sedentary Village Complex", diff: "Loose alliances between villages. Elder councils coordinate land use and gift exchanges.", ex: "Late Jomon to Early Yayoi (Itazuke site), Ban Chiang culture" },
                    zh: { system: "定居农耕村落复合体", diff: "村落间松散同盟。长老会对土地利用进行协调与互惠赠与。", ex: "绳文晚期至弥生初期聚落（板付遗址等）、班清文化" },
                    ko: { system: "정주 농경 마을 복합체", diff: "마을 간 느슨한 동맹. 장로회에 의한 토지 이용 조정 및 호혜적 증여.", ex: "조몬 만기~초기 야요이 집락(이타즈케 유적), 반창 문화" },
                    fr: { system: "Complexe de villages sédentaires", diff: "Alliances lâches inter-villages. Conseil des aînés pour réguler les terres et les dons.", ex: "Fin Jomon à Yayoi (site d'Itazuke), Culture de Ban Chiang" },
                    es: { system: "Complejo de aldeas sedentarias", diff: "Alianzas lazas entre aldeas. El consejo de ancianos gestiona tierras y dones.", ex: "Jomon final a Yayoi temprano (sitio Itazuke), Cultura Ban Chiang" }
                },
                20: {
                    ja: { system: "部族制農耕社会", diff: "祖先崇拝と儀礼的再分配。特定の家系が再分配の中心的役割を担い始める。", ex: "弥生時代中期（環濠集落）、ニュージーランド・マオリ族の伝統社会" },
                    en: { system: "Tribal Agrarian Society", diff: "Ancestor worship and ceremonial redistribution. Specific lineages emerge as central nodes.", ex: "Middle Yayoi (moated settlements), Traditional Maori society" },
                    zh: { system: "部落制农耕社会", diff: "祖先崇拜与仪式性再分配。特定家族开始承担再分配的核心角色。", ex: "弥生时代中期（环濠聚落）、新西兰毛利人传统社会" },
                    ko: { system: "부족제 농경 사회", diff: "조상 숭배와 의례적 재분배. 특정 가계가 재분배의 중심 역할 담당.", ex: "야요이 시대 중기(환호 집락), 뉴질랜드 마오리족 전통 사회" },
                    fr: { system: "Société tribale agricole", diff: "Culte des ancêtres et redistribution rituelle. Émergence de lignées centrales.", ex: "Yayoi moyen (villages entourés de fossés), Société maorie" },
                    es: { system: "Sociedad tribal agrícola", diff: "Culto a los antepasados y redistribución ritual. Linajes principales organizan recursos.", ex: "Yayoi Medio (asentamientos con foso), sociedad tradicional maorí" }
                },
                25: {
                    ja: { system: "初期首長制（統合部族）", diff: "農産物・金属器の集積と長による再分配。地域間の小規模な対立と交易の拡大。", ex: "弥生時代後期（吉野ヶ里遺跡等）、青銅器時代初期ヨーロッパ" },
                    en: { system: "Early Chiefdom (Integrated Tribe)", diff: "Accumulation of crops/bronze; chiefs redistribute. Regional rivalries and expanding trade.", ex: "Late Yayoi (Yoshinogari site), Early Bronze Age Europe" },
                    zh: { system: "初期酋邦（整合部落）", diff: "农产品与金属器集聚，由首领再分配。区域间小规模冲突与贸易扩张。", ex: "弥生时代后期（吉野里遗址等）、青铜时代早期欧洲" },
                    ko: { system: "초기 군장국 (통합 부족)", diff: "농산물/금속기 집적 및 군장에 의한 재분배. 소규모 지역 대립과 교역 확대.", ex: "야요이 시대 후기(요시노가리 유적), 청동기 시대 초기 유럽" },
                    fr: { system: "Chefferie précoce", diff: "Accumulation de cultures/bronze rédistribués par le chef. Rivalités et commerce.", ex: "Yayoi tardif (Yoshinogari), Âge du bronze européen" },
                    es: { system: "Jefatura temprana", diff: "Acumulación de cosechas y metales redistribuidos por el jefe. Rivalidades regionales.", ex: "Yayoi tardío (sitio Yoshinogari), Edad del Bronce temprana en Europa" }
                },
                30: {
                    ja: { system: "首長制社会", diff: "首長の権力確立と身分差の定着。貢納制度と大規模墳墓（墳丘墓）の建造。", ex: "古墳時代出現期（箸墓古墳等）、ハワイ諸島伝統首長制社会" },
                    en: { system: "Chiefdom Society", diff: "Established chief authority and social ranks. Tribute systems and monumental tombs.", ex: "Emergent Kofun period (Hashihaka Kofun), Hawaiian Chiefdoms" },
                    zh: { system: "酋邦社会", diff: "首长权力确立与等级制度定型。纳贡制度与大规模坟墓（土丘墓）建造。", ex: "古坟时代出现期（箸墓古坟等）、夏威夷群岛传统酋邦" },
                    ko: { system: "군장국 사회", diff: "군장의 권력 확립 및 신분 차이 정착. 공납 제도와 대규모 분묘 건조.", ex: "고분 시대 출현기(하시하카 고분), 하와이 제도 전통 군장국" },
                    fr: { system: "Société de chefferie", diff: "Autorité du chef et classes sociales fixées. Tributs et tombes monumentales.", ex: "Période Kofun émergente (Hashihaka), Chefferies d'Hawaï" },
                    es: { system: "Sociedad de jefatura", diff: "Consolidación del poder del jefe y rangos. Sistemas de tributo y túmulos gigantes.", ex: "Periodo Kofun incipiente (túmulo Hashihaka), Jefaturas de Hawái" }
                },
                35: {
                    ja: { system: "高度首長制（連合首長制）", diff: "複数の首長域の統合。広域な交易路の支配と軍事指導者の台頭。", ex: "古墳時代中期（巨大前方後円墳造営期）、ケルト人首長国" },
                    en: { system: "Paramount Chiefdom", diff: "Integration of multiple chiefdoms. Control of key trade routes; rise of military leaders.", ex: "Middle Kofun period (keyhole tombs), Celtic Chiefdoms" },
                    zh: { system: "高度酋邦（联合酋邦）", diff: "多个酋长领地整合。支配广域贸易路线与军事领袖崛起。", ex: "古坟时代中期（前方后圆坟造营期）、凯尔特人酋长国" },
                    ko: { system: "고도 군장국 (연합 군장국)", diff: "복수 군장 영역의 통합. 광역 교역로 지배 및 군사 지도자 대두.", ex: "고분 시대 중기(거대 전방후원분 조영기), 켈트족 군장국" },
                    fr: { system: "Chefferie suprême", diff: "Union de plusieurs chefferies. Contrôle des routes marchandes et chefs militaires.", ex: "Kofun moyen (grands tumulus), Chefferies celtes" },
                    es: { system: "Jefatura suprema", diff: "Unión de varias jefaturas. Control de rutas comerciales y líderes militares.", ex: "Kofun Medio (grandes túmulos), jefaturas celtas" }
                },
                40: {
                    ja: { system: "初期都市国家（王国萌芽）", diff: "灌漑農業と神殿・王宮による中央集権的備蓄。文字や記号による管理の開始。", ex: "初期メソポタミア都市国家（ウルク期）、夏王朝（二里頭文化）" },
                    en: { system: "Early City-State (Nascent Kingdom)", diff: "Irrigation agriculture, centralized storage via temples/palaces. Early writing/record-keeping.", ex: "Early Mesopotamian city-states (Uruk), Erlitou culture (Xia)" },
                    zh: { system: "早期城市国家（王国萌芽）", diff: "灌溉农业与神殿/王宫中央集权备荒。开始采用文字与符号管理。", ex: "早期美索不达米亚城邦（乌鲁克期）、夏朝（二里头文化）" },
                    ko: { system: "초기 도시 국가 (왕국 싹트기)", diff: "관개 농업과 신전/왕궁에 의한 중앙집권적 비축. 문자 및 기호 관리 시작.", ex: "초기 메소포타미아 도시 국가(우루크기), 하나라(이리두 문화)" },
                    fr: { system: "Cité-État primitive", diff: "Agriculture d'irrigation, stockage centralisé (temples/palais). Début de l'écriture.", ex: "Cités sumériennes (Uruk), Culture d'Erlitou (Dynastie Xia)" },
                    es: { system: "Ciudad-Estado temprana", diff: "Agricultura de regadío y almacenes centrales (templos/palacios). Primeros escritos.", ex: "Ciudades mesopotámicas (Uruk), Cultura Erlitou (Dinastía Xia)" }
                },
                45: {
                    ja: { system: "都市国家連合・初期王国", diff: "官僚制の萌芽と税制の導入。専門職人・兵士・農民の明確な分業構造。", ex: "メソポタミア初期王朝時代（ウル第1王朝）、シュメール都市国家" },
                    en: { system: "City-State League / Early Kingdom", diff: "Emerging bureaucracy and taxation. Clear division of labor (craftsmen, soldiers, farmers).", ex: "Mesopotamian Early Dynastic (First Dynasty of Ur), Sumerian states" },
                    zh: { system: "城邦联盟/早期王国", diff: "官僚制萌芽与税制引入。手工业者、士兵、农民的明确分工。", ex: "美索不达米亚早期王朝时代（乌尔第一王朝）、苏美尔城邦" },
                    ko: { system: "도시 국가 연합 / 초기 왕국", diff: "관료제 싹트기 및 조세 제도 도입. 장인, 군인, 농민의 명확한 분업.", ex: "메소포타미아 초기 왕조 시대(우르 제1왕조), 슈메르 도시 국가" },
                    fr: { system: "Ligue de cités-États / Royaume primitif", diff: "Bureaucratie et taxes naissantes. Division claire du travail (artisans, soldats, paysans).", ex: "Dynastique archaïque sumérien (Ur I), Cités de Sumer" },
                    es: { system: "Liga de Ciudades-Estado / Reino temprano", diff: "Inicio de burocracia e impuestos. División del trabajo (artesanos, soldados, agricultores).", ex: "Dinástico Temprano sumerio (Primera Dinastía de Ur)" }
                },
                50: {
                    ja: { system: "中央集権的王国", diff: "成文法や単位の統一。広大な領域の支配と身分制社会の全盛。", ex: "エジプト古王国（ピラミッド造営期）、商（殷）王朝" },
                    en: { system: "Centralized Kingdom", diff: "Written laws and standardized units. Broad territorial rule and strict legal social strata.", ex: "Old Kingdom Egypt (Pyramid age), Shang Dynasty" },
                    zh: { system: "中央集权王国", diff: "成文法与度量衡统一。统治广袤领土，等级制社会鼎盛。", ex: "埃及古王国（金字塔建造期）、商朝" },
                    ko: { system: "중앙집권적 왕국", diff: "성문법 및 단위 통일. 광대한 영역 지배와 신분제 사회의 전성.", ex: "이집트 고왕국(피라미드 조영기), 상(은) 왕조" },
                    fr: { system: "Royaume centralisé", diff: "Lois écrites, unités standardisées. Règne territorial étendu et classes strictes.", ex: "Ancien Empire égyptien (Pyramides), Dynastie Shang" },
                    es: { system: "Reino centralizado", diff: "Leyes escritas y estandarización de medidas. Imperio territorial y estamentos fijos.", ex: "Imperio Antiguo de Egipto (Era de las Pirámides), Dinastía Shang" }
                },
                55: {
                    ja: { system: "領域国家・軍事帝国", diff: "常備軍の形成と積極的な外征。莫大な戦利品と奴隷労働による富の集中。", ex: "アッシリア帝国、周王朝（西周時代）" },
                    en: { system: "Territorial State / Military Empire", diff: "Standing armies and expansionist campaigns. Concentration of wealth via conquest and slaves.", ex: "Assyrian Empire, Western Zhou Dynasty" },
                    zh: { system: "领土国家/军事帝国", diff: "常备军建设与积极外征。依靠大量战利品与奴隶劳动实现财富集中。", ex: "亚述帝国、周朝（西周）" },
                    ko: { system: "영역 국가 / 군사 제국", diff: "상비군 형성 및 적극적 외정. 막대한 전리품과 노예 노동을 통한 부의 집중.", ex: "아시리아 제국, 주 왕조(서주 시대)" },
                    fr: { system: "État territorial / Empire militaire", diff: "Armées permanentes et guerres d'expansion. Richesse via conquêtes et esclavage.", ex: "Empire assyrien, Dynastie Zhou occidentale" },
                    es: { system: "Estado territorial / Imperio militar", diff: "Ejércitos permanentes y expansión. Concentración de riqueza mediante conquistas y esclavos.", ex: "Imperio Asirio, Dinastía Zhou Occidental" }
                },
                60: {
                    ja: { system: "複合領域帝国", diff: "大規模なインフラ（道路・用水路）の整備。貨幣経済の浸透と格差の激化。", ex: "アケメネス朝ペルシア、秦・前漢帝国" },
                    en: { system: "Composite Territorial Empire", diff: "Massive infrastructure (roads, canals). Spread of monetary economy and widening inequality.", ex: "Achaemenid Persian Empire, Qin & Western Han Dynasties" },
                    zh: { system: "复合领土帝国", diff: "大规模基础设施（道路、水渠）建设。货币经济渗透与贫富差距加剧。", ex: "阿契美尼德王朝波斯、秦朝/西汉帝国" },
                    ko: { system: "복합 영역 제국", diff: "대규모 인프라(도로, 수로) 정비. 화폐 경제 침투와 양극화 심화.", ex: "아케메네스 왕조 페르시아, 진/전한 제국" },
                    fr: { system: "Empire composite", diff: "Infrastructures colossales (routes, canaux). Économie monétaire et inégalités accrues.", ex: "Empire perse achéménide, Dynasties Qin et Han occidentaux" },

                    state.food = Math.max(0, state.food - 100);
                    state.tools = Math.max(0, state.tools - 40);
                    state.dissatisfaction = Math.max(0, (state.dissatisfaction || 0) - 25);
                    state.cohesion = Math.min(100, state.cohesion + 40);
                    return "巨大な古墳の造営を通じて集団の結集力が誇示され、共同体の結束が劇的に強化されました！";
                }
            },
            { id: "freeGift" }
        ];

        let state = {
            lang: 'ja',
            mode: 'agrarian',
            turn: 1,
            score: 0,
            complexity: 10,
            inequality: 10,
            cohesion: 100,
            giftCount: 0,
            stage: 'band',
            // 新規拡張パラメータ
            population: 30,
            food: 50,
            tools: 10,
            freeGiftStreak: 0,
            isGameOver: false,
            dissatisfaction: 0,
            prestige: 0,
            externalTension: 50
        };

        const DOM = {
            langSelect: document.getElementById('lang-select'),
            modeSelect: document.getElementById('mode-select'),
            appTitle: document.getElementById('app-title'),
            btnHelp: document.getElementById('btn-help'),
            btnSoc: document.getElementById('btn-soc'),
            lblStage: document.getElementById('lbl-stage'),
            valStage: document.getElementById('val-stage'),
            barStage: document.getElementById('bar-stage'),
            lblTurn: document.getElementById('lbl-turn'),
            valTurn: document.getElementById('val-turn'),
            lblGiftCount: document.getElementById('lbl-giftcount'),
            valGiftCount: document.getElementById('val-giftcount'),
            barGiftCount: document.getElementById('bar-giftcount'),
            lblComplexity: document.getElementById('lbl-complexity'),
            valComplexity: document.getElementById('val-complexity'),
            barComplexity: document.getElementById('bar-complexity'),
            lblInequality: document.getElementById('lbl-inequality'),
            valInequality: document.getElementById('val-inequality'),
            barInequality: document.getElementById('bar-inequality'),
            lblCohesion: document.getElementById('lbl-cohesion'),
            valCohesion: document.getElementById('val-cohesion'),
            barCohesion: document.getElementById('bar-cohesion'),
            lblPop: document.getElementById('lbl-pop'),
            valPop: document.getElementById('val-pop'),
            barPop: document.getElementById('bar-pop'),
            lblFood: document.getElementById('lbl-food'),
            valFood: document.getElementById('val-food'),
            barFood: document.getElementById('bar-food'),
            lblTools: document.getElementById('lbl-tools'),
            valTools: document.getElementById('val-tools'),
            barTools: document.getElementById('bar-tools'),
            lblLog: document.getElementById('lbl-log'),
            logBox: document.getElementById('log-box'),
            lblAi: document.getElementById('lbl-ai'),
            aiStatus: document.getElementById('ai-status'),
            btnNext: document.getElementById('btn-next'),
            lblHand: document.getElementById('lbl-hand'),
            cardsBox: document.getElementById('cards-box'),
            modal: document.getElementById('modal'),
            modalTitle: document.getElementById('modal-title'),
            modalBody: document.getElementById('modal-body'),
            modalClose: document.getElementById('modal-close')
        };

        function init() {
            DOM.langSelect.addEventListener('change', (e) => {
                state.lang = e.target.value;
                updateI18N();
            });
            DOM.modeSelect.addEventListener('change', (e) => {
                state.mode = e.target.value;
                resetGame();
            });
            DOM.btnHelp.addEventListener('click', showHelp);
            DOM.btnSoc.addEventListener('click', showCurrentSocietyInfo);
            DOM.modalClose.addEventListener('click', hideModal);
            DOM.btnNext.addEventListener('click', () => processTurn(null));

            updateI18N();
            renderHand();
            updateUI();
        }

        function resetGame() {
            state.turn = 1;
            state.score = 0;
            state.complexity = 10;
            state.inequality = 10;
            state.cohesion = 100;
            state.giftCount = 0;
            state.stage = 'band';
            state.population = state.mode === 'agrarian' ? 30 : 20;
            state.food = state.mode === 'agrarian' ? 50 : 30;
            state.tools = state.mode === 'agrarian' ? 10 : 5;
            state.freeGiftStreak = 0;
            state.isGameOver = false;
            state.dissatisfaction = 0;
            state.prestige = 0;
            state.externalTension = 50;
            DOM.logBox.innerHTML = '';
            renderHand();
            updateUI();
        }

        function updateI18N() {
            const t = I18N[state.lang];
            DOM.appTitle.textContent = t.title;
            DOM.btnHelp.textContent = t.help;
            DOM.btnSoc.textContent = t.socBtn;
            DOM.lblStage.textContent = t.stage;
            DOM.lblTurn.textContent = t.turn;
            DOM.lblGiftCount.textContent = t.giftCount;
            DOM.lblComplexity.textContent = t.complexity;
            DOM.lblInequality.textContent = t.inequality;
            DOM.lblCohesion.textContent = t.cohesion;
            DOM.lblPop.textContent = t.pop;
            DOM.lblFood.textContent = t.food;
            DOM.lblTools.textContent = t.tools;
            DOM.lblLog.textContent = t.log;
            DOM.lblAi.textContent = t.ai;
            DOM.aiStatus.textContent = t.aiText;
            DOM.btnNext.textContent = t.next;
            DOM.lblHand.textContent = t.hand;
            DOM.modalClose.textContent = t.close;
            renderHand();
            updateUI();
        }

        /* 論文（Itao & Kaneko 2020）に基づく親族構造および社会構造の動的計算 */
        function computeKinshipAndSocialStructure() {
            const pop = state.population;
            const comp = state.complexity;
            const ineq = state.inequality;
            const mode = state.mode;

            let kinship = "";
            let socStruct = "";

            if (state.lang === 'ja') {
                // 親族構造の判定
                if (pop < 50 && comp < 20) {
                    kinship = "内婚的バンド構造（近親婚禁忌未未分離・小規模血縁集団）";
                } else if (comp >= 20 && comp < 45) {
                    if (mode === 'agrarian' && ineq > 30) {
                        kinship = "限定交換（Restricted Exchange / 二分組織・直接の婚姻交換サイクル Cm=2, Cd≥2）";
                    } else {
                        kinship = "二分組織（Dual Organization / 2氏族間での直接の女性交換 Cm=2, Cd=1）";
                    }
                } else if (comp >= 45 && comp < 70) {
                    kinship = "一般交換（Generalized Exchange / 多氏族間の間接的循環婚姻 Cm≥3, Cd=1）";
                } else {
                    kinship = "複合的階層化親族体系（単系・双系継承の混在および階級内婚の定着）";
                }

                // 社会構造の判定
                if (comp < 20) {
                    socStruct = "平等主義的血縁共同体（即時消費・所有概念なし）";
                } else if (comp < 40) {
                    socStruct = "互恵的環濠・村落複合体（長老会による土地・資源調整）";
                } else if (comp < 65) {
                    socStruct = "階層化首長制社会（世襲首長・貢納制・大規模モニュメント造営）";
                } else {
                    socStruct = "中央集権的領域国家・官僚制（成文法・税制・専門分業構造）";
                }
            } else if (state.lang === 'en') {
                if (pop < 50 && comp < 20) {
                    kinship = "Endogamous Band Structure (Small kin group, early incest norm)";
                } else if (comp >= 20 && comp < 45) {
                    kinship = (mode === 'agrarian' && ineq > 30) ? 
                        "Restricted Exchange (Direct bride exchange with multi-generation cycles Cm=2, Cd≥2)" :
                        "Dual Organization (Direct bride exchange between two clans Cm=2, Cd=1)";
                } else if (comp >= 45 && comp < 70) {
                    kinship = "Generalized Exchange (Indirect marital cycle across multiple clans Cm≥3, Cd=1)";
                } else {
                    kinship = "Complex Stratified Kinship System (Endogamous class structure)";
                }

                if (comp < 20) socStruct = "Egalitarian Kinship Community";
                else if (comp < 40) socStruct = "Reciprocal Village Alliance";
                else if (comp < 65) socStruct = "Stratified Chiefdom Society";
                else socStruct = "Centralized Territorial State";
            } else {
                // その他言語向けフォールバック（英語表記ベース）
                if (pop < 50 && comp < 20) kinship = "Endogamous Band Structure";
                else if (comp < 45) kinship = "Restricted / Dual Exchange System";
                else if (comp < 70) kinship = "Generalized Exchange System";
                else kinship = "Complex Stratified Kinship";

                if (comp < 20) socStruct = "Egalitarian Kin Community";
                else if (comp < 40) socStruct = "Reciprocal Village Alliance";
                else if (comp < 65) socStruct = "Stratified Chiefdom";
                else socStruct = "Centralized State";
            }

            return { kinship, socStruct };
        }

        function renderHand() {
            while (DOM.cardsBox.firstChild) {
                DOM.cardsBox.removeChild(DOM.cardsBox.firstChild);
            }

            if (state.isGameOver) return;

            const t = I18N[state.lang];
            
            cards.forEach(cardObj => {
                const key = cardObj.id;
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                
                let isExecutable = true;
                let reqMsg = "";

                if (key === 'potlatch') {
                    if (state.complexity < 30 || state.inequality < 40) {
                        isExecutable = false;
                        reqMsg = t.reqPotlatch;
                    }
                } else if (key === 'panhellenic_games') {
                    if (state.complexity < 20) {
                        isExecutable = false;
                        reqMsg = t.reqPanhellenic;
                    }
                } else if (key === 'megalith_construction') {
                    // 古墳造営の発動条件改修：一定の人口(100)、食料(150)、道具(50)が必要
                    if (state.population < 100 || state.food < 150 || state.tools < 50) {
                        isExecutable = false;
                        reqMsg = t.reqMegalith;
                    }
                } else if (key === 'ritual') {
                    if (state.food < 20) {
                        isExecutable = false;
                        reqMsg = t.reqRitual;
                    }
                }

                if (!isExecutable) {
                    cardEl.classList.add('disabled');
                }

                const cardData = t.cards[key] || { name: cardObj.name || key, desc: cardObj.description || "" };

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = cardData.name;

                const desc = document.createElement('div');
                desc.className = 'card-desc';
                desc.textContent = cardData.desc;

                cardEl.appendChild(title);
                cardEl.appendChild(desc);

                if (reqMsg) {
                    const req = document.createElement('div');
                    req.className = 'card-req';
                    req.textContent = reqMsg;
                    cardEl.appendChild(req);
                }

                if (isExecutable) {
                    cardEl.addEventListener('click', () => processTurn(key));
                }
                DOM.cardsBox.appendChild(cardEl);
            });
        }

        function processTurn(actionKey) {
            if (state.isGameOver) return;

            const t = I18N[state.lang];
            
            if (actionKey) {
                applyCardEffect(actionKey);
                const cardName = t.cards[actionKey] ? t.cards[actionKey].name : actionKey;
                addLog(`[Turn ${state.turn}] ${cardName}`, 'action');
            } else {
                state.freeGiftStreak = 0;
                const baseCompGrowth = state.mode === 'agrarian' ? 3 : 1;
                const baseIneqGrowth = state.mode === 'agrarian' ? 6 : 2;
                state.complexity += baseCompGrowth;
                state.inequality += baseIneqGrowth;
                state.population += Math.floor(state.population * 0.05);
                state.food += Math.floor(state.population * 0.8);
                state.tools += Math.floor(state.population * 0.2);
                addLog(`[Turn ${state.turn}] ${t.next}`, 'action');
            }

            checkEvolution();

            const stageMultiplier = state.stage === 'state' ? 3 : (state.stage === 'chiefdom' ? 2 : (state.stage === 'tribe' ? 1.5 : 1));
            const turnScore = Math.floor(state.complexity * stageMultiplier * (1 + state.complexity / 50));
            state.score += turnScore;

            const ineqCoeff = state.mode === 'agrarian' ? 0.3 : 0.15;
            state.inequality += Math.floor(state.complexity * ineqCoeff);
            
            if (state.inequality > 50) {
                const penalty = Math.floor((state.inequality - 50) * 0.6);
                state.cohesion -= penalty;
            }

            const maxComp = state.mode === 'forager' ? 45 : 100;
            state.complexity = Math.max(10, Math.min(maxComp, state.complexity));
            state.inequality = Math.max(0, Math.min(100, state.inequality));
            state.cohesion = Math.max(0, Math.min(100, state.cohesion));

            if (state.cohesion <= 0) {
                state.isGameOver = true;
                addLog(`[CRASH] ${t.gameOver}`, 'event');
                showGameOverResult();
            } else {
                state.turn++;
            }

            renderHand();
            updateUI();
        }

        function applyCardEffect(key) {
            const t = I18N[state.lang];
            
            if (key !== 'freeGift') {
                state.freeGiftStreak = 0;
            }

            if (key === 'directGift' || key === 'obligatory' || key === 'potlatch' || key === 'freeGift' || key === 'panhellenic_games' || key === 'megalith_construction' || key === 'ritual') {
                state.giftCount++;
            }

            const customCard = cards.find(c => c.id === key);
            if (customCard && typeof customCard.effect === 'function') {
                const logMsg = customCard.effect(state);
                if (logMsg && state.lang === 'ja') {
                    addLog(logMsg, 'info');
                }
            }

            switch(key) {
                case 'accumulate':
                    if (state.mode === 'agrarian') {
                        state.complexity += 14;
                        state.inequality += 18;
                        state.population += 15;
                        state.food += 60;
                        state.tools += 25;
                    } else {
                        state.complexity += 6;
                        state.inequality += 8;
                        state.population += 5;
                        state.food += 25;
                        state.tools += 10;
                    }
                    break;
                case 'directGift':
                    state.inequality = Math.max(0, state.inequality - 12);
                    state.cohesion = Math.min(100, state.cohesion + (state.mode === 'forager' ? 8 : 5));
                    state.complexity += 3;
                    state.food = Math.max(0, state.food - 15);
                    state.tools = Math.max(0, state.tools - 5);
                    break;
                case 'obligatory':
                    state.cohesion = Math.min(100, state.cohesion + 10);
                    state.inequality += 2;
                    state.complexity += 4;
                    state.food = Math.max(0, state.food - 10);
                    break;
                case 'potlatch':
                    state.inequality = Math.max(0, state.inequality - 35);
                    state.cohesion = Math.min(100, state.cohesion + 18);
                    const compCost = state.mode === 'agrarian' ? 10 : 5;
                    state.complexity = Math.max(10, state.complexity - compCost);
                    break;
                case 'panhellenic_games':
                    state.inequality = Math.max(0, state.inequality - 20);
                    state.cohesion = Math.min(100, state.cohesion + 25);
                    state.complexity += 5;
                    break;
                case 'freeGift':
                    state.freeGiftStreak++;
                    if (state.freeGiftStreak >= 2) {
                        const penalty = state.freeGiftStreak * 10;
                        state.cohesion -= penalty;
                        state.inequality = Math.max(0, state.inequality - 5);
                        addLog(t.warnFreeGift, 'warn');
                    } else {
                        state.inequality = Math.max(0, state.inequality - 15);
                        state.cohesion = Math.min(100, state.cohesion + 8);
                    }
                    break;
            }
        }

        function checkEvolution() {
            const t = I18N[state.lang];
            let nextStage = state.stage;

            if (state.stage === 'band' && state.complexity >= 25 && state.giftCount >= 3) {
                nextStage = 'tribe';
            } 
            else if (state.stage === 'tribe' && state.complexity >= 50 && state.giftCount >= 8) {
                nextStage = 'chiefdom';
            } 
            else if (state.stage === 'chiefdom' && state.complexity >= 80 && state.giftCount >= 15) {
                nextStage = 'state';
            }

            if (nextStage !== state.stage) {
                state.stage = nextStage;
                const stageName = t.stages[nextStage];
                const msg = t.evolutionMsg.replace('{0}', stageName);
                addLog(msg, 'evolution');
            }
        }

        function getSocietyDetails(mode, complexity) {
            const roundedComp = Math.max(10, Math.min(mode === 'forager' ? 45 : 100, Math.round(complexity / 5) * 5));
            const entry = SOC_DATABASE[mode] && SOC_DATABASE[mode][roundedComp];
            const lang = state.lang;
            const t = I18N[lang];
            const data = (entry && (entry[lang] || entry.ja)) || t.unknownSoc;
            return {
                compKey: roundedComp,
                data: data
            };
        }

        function showCurrentSocietyInfo() {
            const t = I18N[state.lang];
            const modeText = t.modes[state.mode];
            const { compKey, data } = getSocietyDetails(state.mode, state.complexity);
            const infoT = t.infoModal;
            const { kinship, socStruct } = computeKinshipAndSocialStructure();

            const title = infoT.title.replace('{0}', modeText);
            const body = `${infoT.statusHeader}
・${infoT.lblStage}: ${t.stages[state.stage]}
・${infoT.lblComp}: ${state.complexity} (${infoT.lblIndex}: ${compKey})
・${infoT.lblIneq}: ${state.inequality}%
・${infoT.lblCoh}: ${state.cohesion}
・${t.pop}: ${state.population} | ${t.food}: ${state.food} | ${t.tools}: ${state.tools}

<div class="purple-section">
${infoT.secKinship}
${kinship}

${infoT.secSocStruct}
${socStruct}
</div>

----------------------------------------
${infoT.secSystem}
${data.system}

${infoT.secDiff}
${data.diff}

${infoT.secEx}
■ ${data.ex}`;

            showModal(title, body);
        }

        function showGameOverResult() {
            const t = I18N[state.lang];
            const modeText = t.modes[state.mode];
            const { compKey, data } = getSocietyDetails(state.mode, state.complexity);
            const resT = t.resultModal;
            const { kinship, socStruct } = computeKinshipAndSocialStructure();

            const resultText = `${t.gameOver}\n\n` +
                `・${resT.lblMode}: ${modeText}\n` +
                `・${resT.lblStage}: ${t.stages[state.stage]}\n` +
                `・${resT.lblTurn}: ${state.turn}\n` +
                `・${resT.lblGift}: ${state.giftCount}\n` +
                `・${resT.lblScore}: ${state.score}\n` +
                `・${resT.lblComp}: ${state.complexity} (${resT.lblIndex}: ${compKey})\n\n` +
                `<div class="purple-section">` +
                `■ ${resT.lblKinship}: ${kinship}\n` +
                `■ ${resT.lblSocStruct}: ${socStruct}\n` +
                `</div>\n` +
                `${t.similarHeader}\n` +
                `■ ${resT.lblSystem}: ${data.system}\n` +
                `■ ${resT.lblDiff}:\n${data.diff}\n` +
                `■ ${resT.lblEx}:\n${data.ex}`;

            showModal(t.gameOver, resultText);
        }

        function updateUI() {
            const t = I18N[state.lang];
            DOM.valStage.textContent = t.stages[state.stage];
            
            let stageWidth = 25;
            if (state.stage === 'tribe') stageWidth = 50;
            if (state.stage === 'chiefdom') stageWidth = 75;
            if (state.stage === 'state') stageWidth = 100;
            DOM.barStage.style.width = `${stageWidth}%`;

            DOM.valTurn.textContent = state.turn;
            DOM.valGiftCount.textContent = state.giftCount;
            DOM.barGiftCount.style.width = `${Math.min(100, state.giftCount * 5)}%`;

            DOM.valComplexity.textContent = state.complexity;
            DOM.barComplexity.style.width = `${state.complexity}%`;
            
            DOM.valInequality.textContent = `${state.inequality}%`;
            DOM.barInequality.style.width = `${state.inequality}%`;

            DOM.valCohesion.textContent = state.cohesion;
            DOM.barCohesion.style.width = `${state.cohesion}%`;

            DOM.valPop.textContent = state.population;
            DOM.barPop.style.width = `${Math.min(100, state.population / 2)}%`;

            DOM.valFood.textContent = state.food;
            DOM.barFood.style.width = `${Math.min(100, state.food / 3)}%`;

            DOM.valTools.textContent = state.tools;
            DOM.barTools.style.width = `${Math.min(100, state.tools)}%`;
        }

        function addLog(msg, type) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = msg;
            DOM.logBox.appendChild(entry);
            DOM.logBox.scrollTop = DOM.logBox.scrollHeight;
        }

        function showHelp() {
            const t = I18N[state.lang];
            showModal(t.help, t.helpContent);
        }

        function showModal(title, text) {
            DOM.modalTitle.textContent = title;
            DOM.modalBody.innerHTML = text;
            DOM.modal.style.display = 'flex';
        }

        function hideModal() {
            DOM.modal.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
