<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Gift War - The Social Dynamics of Giving & Evolution</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto; /* スマホ等で画面全体を上下スクロール可能に */
            overflow-x: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #d4af37;
        }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, button {
            font-family: inherit;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
            touch-action: manipulation;
        }
        select:hover, button:hover {
            background: #3a3a3a;
            border-color: #d4af37;
        }
        button:disabled {
            background: #1a1a1a;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .status-panel {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .stat-box {
            background: #121212;
            padding: 6px 4px;
            border-radius: 4px;
            text-align: center;
            border-left: 3px solid #d4af37;
        }
        .stat-box.stage-box {
            border-left-color: #9b59b6;
        }
        .stat-title {
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .stat-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }
        .stat-bar {
            height: 4px;
            background: #333;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: #d4af37;
            width: 0%;
            transition: width 0.3s ease;
        }
        .game-field {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            min-height: 180px;
        }
        .log-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 150px;
            max-height: 250px;
        }
        .panel-title {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 6px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
            touch-action: pan-y;
        }
        .log-content::-webkit-scrollbar {
            width: 5px;
        }
        .log-content::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 3px;
        }
        .log-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .log-entry {
            padding: 4px 8px;
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
            word-break: break-all;
        }
        .log-entry.event { border-left: 2px solid #e74c3c; }
        .log-entry.evolution { border-left: 2px solid #9b59b6; }
        .log-entry.action { border-left: 2px solid #2ecc71; }
        .log-entry.info { border-left: 2px solid #3498db; }
        .log-entry.warn { border-left: 2px solid #f39c12; }
        .ai-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
        }
        .hand-area {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            overflow-x: auto;
            padding: 5px 0 10px 0;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
        }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            width: 140px;
            height: 175px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .card:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: #d4af37;
            background: #333;
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #222;
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
            pointer-events: none;
        }
        .card-desc {
            font-size: 0.68rem;
            color: #bbb;
            line-height: 1.25;
            text-align: center;
            pointer-events: none;
        }
        .card-req {
            font-size: 0.6rem;
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 10px;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .modal-title {
            font-size: 1.1rem;
            color: #d4af37;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }
        .modal-body {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        .close-btn {
            background: #d4af37;
            color: #000;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
        }

        /* スマホ向けレスポンシブ最適化 */
        @media (max-width: 768px) {
            body {
                height: auto;
            }
            header {
                padding: 8px 10px;
            }
            h1 {
                font-size: 1.0rem;
            }
            .status-panel { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 6px;
                padding: 8px;
            }
            .stat-box {
                padding: 4px 2px;
            }
            .stat-title {
                font-size: 0.65rem;
            }
            .stat-value {
                font-size: 0.85rem;
            }
            .game-field { 
                grid-template-columns: 1fr; 
                gap: 8px;
            }
            .log-panel {
                max-height: 180px;
            }
            .ai-panel { 
                min-height: auto;
                gap: 8px;
            }
            .cards-container {
                justify-content: flex-start;
            }
            .card { 
                width: 120px; 
                height: 155px; 
                padding: 6px; 
            }
            .card-title { font-size: 0.75rem; }
            .card-desc { font-size: 0.62rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="app-title">GIFT WAR</h1>
        <div class="controls">
            <select id="mode-select">
                <option value="forager">狩猟採集社会</option>
                <option value="agrarian" selected>農耕社会</option>
            </select>
            <button id="btn-soc">参照 (Societies)</button>
            <button id="btn-help">HELP</button>
            <select id="lang-select">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="ko">한국語</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
    </header>

    <main>
        <section class="status-panel">
            <div class="stat-box stage-box">
                <div class="stat-title" id="lbl-stage">社会形態</div>
                <div class="stat-value" id="val-stage">バンド</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-stage" style="width: 25%; background:#9b59b6;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-turn">生存年数 (Turn)</div>
                <div class="stat-value" id="val-turn">1</div>
                <div class="stat-bar"><div class="stat-fill" style="width: 100%;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-giftcount">贈与累積回数</div>
                <div class="stat-value" id="val-giftcount">0</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-giftcount" style="width: 0%;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-complexity">社会的複雑度</div>
                <div class="stat-value" id="val-complexity">10</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-complexity"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-inequality">格差インデックス</div>
                <div class="stat-value" id="val-inequality">10%</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-inequality"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-cohesion">社会的結束度</div>
                <div class="stat-value" id="val-cohesion">100</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-cohesion"></div></div>
            </div>
        </section>

        <section class="game-field">
            <div class="log-panel">
                <div class="panel-title" id="lbl-log">社会履歴ログ</div>
                <div class="log-content" id="log-box"></div>
            </div>
            <div class="ai-panel">
                <div class="panel-title" id="lbl-ai">外部・他者勢力 (AI)</div>
                <div id="ai-status" style="font-size:0.8rem; color:#aaa; line-height:1.4;">
                    AI行動分析中...
                </div>
                <button id="btn-next" style="width: 100%; margin-top: 6px;">何もせず静観</button>
            </div>
        </section>

        <section class="hand-area">
            <div class="panel-title" id="lbl-hand">実行可能な戦略カード</div>
            <div class="cards-container" id="cards-box"></div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">理論解説</div>
            <div class="modal-body" id="modal-body"></div>
            <button class="close-btn" id="modal-close">閉じる</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // 5刻みの詳細データベース（狩猟採集 / 農耕）
        const SOC_DATABASE = {
            forager: {
                10: { system: "極小遊動バンド", diff: "血縁を中心とした15〜30人の完全平等集団。資源の所有概念はなく即時消費。", ex: "カラハリ・サン族（旧来の伝統的移動生活期）、ハザ族" },
                15: { system: "遊動バンド連合", diff: "複数家族の季節的集積。個人的所有はないが贈与を通じた広域相互扶助が成立。", ex: "イヌイットの冬季集落、オーストラリア先住民の移動バンド" },
                20: { system: "半定住型部族（初期）", diff: "特定の豊かな漁場や採取地に定住を開始。道具や装身具の個人的所有の萌芽。", ex: "縄文時代早期・前期の集落、北米カリフォルニア先住民" },
                25: { system: "定住型狩猟採集部族", diff: "特定の資源（鮭・どんぐり等）の大規模貯蔵。長老や呪術師による儀礼的調整の発生。", ex: "縄文時代中期（三内丸山遺跡など）、パプアニューギニア高地狩猟採集民" },
                30: { system: "高度貯蔵・複合部族", diff: "特定資源の独占と貯蔵施設の管理。身分階層の萌芽と交易ネットワークの拡大。", ex: "北米太平洋北西海岸先住民（トリンギット族・初期クワキウトル族）" },
                35: { system: "複合狩猟採集首長制", diff: "世襲首長と平民・奴隷の層化。富の誇示と再分配のための大規模儀礼（ポトラッチ）の成立。", ex: "19世紀北米クワキウトル族・ハイダ族（ポトラッチ全盛期）" },
                40: { system: "特化型定住首長制", diff: "巨大な構造物や巨石遺構の建造。広域な地域間贈与体系の組織化と領有権の主張。", ex: "縄文時代後期・晩期（巨大木柱列遺構等）、ギョベクリ・テペ建造社会" },
                45: { system: "狩猟採集複雑性の極致", diff: "非農耕でありながら高度な階層化と広域同盟を維持。これ以上の複雑化は農耕化を要する限界点。", ex: "カリフォルニア・チュマシュ族（貝貨通貨経済と世襲首長）" }
            },
            agrarian: {
                10: { system: "初期農耕集落（バンド・部族）", diff: "小規模な刀耕火種農耕。土地の私有はなく共同体全体での共同耕作と再分配。", ex: "新石器時代初期ヤンシャオ文化（仰韶文化）、初期新石器ヨーロッパ" },
                15: { system: "定住農耕村落複合", diff: "村落間のゆるやかな同盟。長老会による土地利用の調整と互恵的贈与体系。", ex: "縄文晩期〜初期弥生集落（板付遺跡等）、新石器時代バンチェン文化" },
                20: { system: "部族制農耕社会", diff: "祖先崇拝と儀礼的再分配。特定の家系が再分配の中心的役割を担い始める。", ex: "弥生時代中期（環濠集落）、ニュージーランド・マオリ族の伝統社会" },
                25: { system: "初期首長制（統合部族）", diff: "農産物・金属器の集積と長による再分配。地域間の小規模な対立と交易の拡大。", ex: "弥生時代後期（吉野ヶ里遺跡等）、青銅器時代初期ヨーロッパ" },
                30: { system: "首長制社会", diff: "首長の権力確立と身分差の定着。貢納制度と大規模墳墓（墳丘墓）の建造。", ex: "古墳時代出現期（箸墓古墳等）、ハワイ諸島伝統首長制社会" },
                35: { system: "高度首長制（連合首長制）", diff: "複数の首長域の統合。広域な交易路の支配と軍事指導者の台頭。", ex: "古墳時代中期（巨大前方後円墳造営期）、ケルト人首長国" },
                40: { system: "初期都市国家（王国萌芽）", diff: "灌漑農業と神殿・王宮による中央集権的備蓄。文字や記号による管理の開始。", ex: "初期メソポタミア都市国家（ウルク期）、夏王朝（二里頭文化）" },
                45: { system: "都市国家連合・初期王国", diff: "官僚制の萌芽と税制の導入。専門職人・兵士・農民の明確な分業構造。", ex: "メソポタミア初期王朝時代（ウル第1王朝）、シュメール都市国家" },
                50: { system: "中央集権的王国", diff: "成文法や単位の統一。広大な領域の支配と身分制社会の全盛。", ex: "エジプト古王国（ピラミッド造営期）、商（殷）王朝" },

                80: { system: "再分配型高度巨大帝国", diff: "貨幣を持たず、国家による完全な労働・物資の再分配ネットワークで統合された超高度国家。", ex: "インカ帝国（タワティンスウユ）" },
                85: { system: "晩期専制帝国", diff: "構造的格差と官僚の腐敗。税収不足と特権階級への偏重による社会的結束の崩壊期。", ex: "清王朝（19世紀末）、末期ローマ帝国" },
                90: { system: "過度肥大化帝国", diff: "維持コストが限界に達した超巨大国家。内部動乱と外圧への脆弱性。", ex: "西ローマ帝国末期、ビザンツ帝国末期" },
                95: { system: "システム不全寸前文明", diff: "資源の枯渇、極度な格差、信頼の失墜により社会基盤が完全に目詰まりした状態。", ex: "マヤ文明末期（古典期崩壊直前）" },
                100: { system: "社会的複雑性の飽和極限", diff: "複雑性を維持するためのコストが限界を突破。極小のショックで全崩壊する状態。", ex: "崩壊直前の超巨大古代帝国" }
            }
        };

        const I18N = {
            ja: {
                title: "GIFT WAR: 贈与ダイナミクスと社会進化",

                reqFreeGift: "条件: 結束度消費",
                similarHeader: "【該当する現実世界・歴史上の社会モデル】",
                warnFreeGift: "一方的な無償贈与の連投により依存と過度の負い目が発生！結束度が急激に低下しています。",
                evolutionMsg: "【社会進化】贈与のネットワーク強化と成長により社会構造が「{0}」へと移行しました！",

        let state = {
            lang: 'ja',
            mode: 'agrarian',
            turn: 1,
            score: 0,

        const DOM = {
            langSelect: document.getElementById('lang-select'),

        };

        function init() {
            DOM.langSelect.addEventListener('change', (e) => {
                state.lang = e.target.value;
                updateI18N();
            });
            DOM.modeSelect.addEventListener('change', (e) => {
                state.mode = e.target.value;
                resetGame();
            });
            DOM.btnHelp.addEventListener('click', showHelp);
            DOM.btnSoc.addEventListener('click', showCurrentSocietyInfo);
            DOM.modalClose.addEventListener('click', hideModal);
            DOM.btnNext.addEventListener('click', () => processTurn(null));

            updateI18N();
            renderHand();
            updateUI();
        }

        function resetGame() {
            state.turn = 1;
            state.score = 0;
            state.complexity = 10;
            state.inequality = 10;
            state.cohesion = 100;
            state.giftCount = 0;
            state.stage = 'band';
            state.freeGiftStreak = 0;
            state.isGameOver = false;
            DOM.logBox.innerHTML = '';
            renderHand();
            updateUI();
        }

        function updateI18N() {
            const t = I18N[state.lang];
            DOM.appTitle.textContent = t.title;
            DOM.btnHelp.textContent = t.help;
            DOM.btnSoc.textContent = t.socBtn;
            DOM.lblStage.textContent = t.stage;
            DOM.lblTurn.textContent = t.turn;
            DOM.lblGiftCount.textContent = t.giftCount;
            DOM.lblComplexity.textContent = t.complexity;
            DOM.lblInequality.textContent = t.inequality;
            DOM.lblCohesion.textContent = t.cohesion;
            DOM.lblLog.textContent = t.log;
            DOM.lblAi.textContent = t.ai;
            DOM.aiStatus.textContent = t.aiText;
            DOM.btnNext.textContent = t.next;
            DOM.lblHand.textContent = t.hand;
            DOM.modalClose.textContent = t.close;
            renderHand();
            updateUI();
        }

        function renderHand() {
            while (DOM.cardsBox.firstChild) {
                DOM.cardsBox.removeChild(DOM.cardsBox.firstChild);
            }

            if (state.isGameOver) return;

            const t = I18N[state.lang];
            const cardKeys = ['accumulate', 'directGift', 'obligatory', 'potlatch', 'freeGift'];

            cardKeys.forEach(key => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                
                let isExecutable = true;
                let reqMsg = "";

                if (key === 'potlatch') {
                    if (state.complexity < 30 || state.inequality < 40) {
                        isExecutable = false;
                        reqMsg = t.reqPotlatch;
                    }
                }

                if (!isExecutable) {
                    cardEl.classList.add('disabled');
                }

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = t.cards[key].name;

                const desc = document.createElement('div');
                desc.className = 'card-desc';
                desc.textContent = t.cards[key].desc;

                cardEl.appendChild(title);
                cardEl.appendChild(desc);

                if (reqMsg) {
                    const req = document.createElement('div');
                    req.className = 'card-req';
                    req.textContent = reqMsg;
                    cardEl.appendChild(req);
                }

                if (isExecutable) {
                    cardEl.addEventListener('click', () => processTurn(key));
                }
                DOM.cardsBox.appendChild(cardEl);
            });
        }

        function processTurn(actionKey) {
            if (state.isGameOver) return;

            const t = I18N[state.lang];
            
            if (actionKey) {
                applyCardEffect(actionKey);
                addLog(`[Turn ${state.turn}] ${t.cards[actionKey].name}`, 'action');
            } else {
                state.freeGiftStreak = 0;
                const baseCompGrowth = state.mode === 'agrarian' ? 3 : 1;
                const baseIneqGrowth = state.mode === 'agrarian' ? 6 : 2;
                state.complexity += baseCompGrowth;
                state.inequality += baseIneqGrowth;
                addLog(`[Turn ${state.turn}] ${t.next}`, 'action');
            }

            checkEvolution();

            const stageMultiplier = state.stage === 'state' ? 3 : (state.stage === 'chiefdom' ? 2 : (state.stage === 'tribe' ? 1.5 : 1));
            const turnScore = Math.floor(state.complexity * stageMultiplier * (1 + state.complexity / 50));
            state.score += turnScore;

            const ineqCoeff = state.mode === 'agrarian' ? 0.3 : 0.15;
            state.inequality += Math.floor(state.complexity * ineqCoeff);
            
            if (state.inequality > 50) {
                const penalty = Math.floor((state.inequality - 50) * 0.6);
                state.cohesion -= penalty;
            }

            const maxComp = state.mode === 'forager' ? 45 : 100;
            state.complexity = Math.max(10, Math.min(maxComp, state.complexity));
            state.inequality = Math.max(0, Math.min(100, state.inequality));
            state.cohesion = Math.max(0, Math.min(100, state.cohesion));

            if (state.cohesion <= 0) {
                state.isGameOver = true;
                addLog(`[CRASH] ${t.gameOver}`, 'event');
                showGameOverResult();
            } else {
                state.turn++;
            }

            renderHand();
            updateUI();
        }

        function applyCardEffect(key) {
            const t = I18N[state.lang];
            
            if (key !== 'freeGift') {
                state.freeGiftStreak = 0;
            }

            if (key === 'directGift' || key === 'obligatory' || key === 'potlatch' || key === 'freeGift') {
                state.giftCount++;
            }

            switch(key) {
                case 'accumulate':
                    if (state.mode === 'agrarian') {
                        state.complexity += 14;
                        state.inequality += 18;
                    } else {
                        state.complexity += 6;
                        state.inequality += 8;
                    }
                    break;
                case 'directGift':
                    state.inequality = Math.max(0, state.inequality - 12);
                    state.cohesion += (state.mode === 'forager' ? 8 : 5);
                    state.complexity += 3;
                    break;
                case 'obligatory':
                    state.cohesion += 10;
                    state.inequality += 2;
                    state.complexity += 4;
                    break;
                case 'potlatch':
                    state.inequality = Math.max(0, state.inequality - 35);
                    state.cohesion += 18;
                    const compCost = state.mode === 'agrarian' ? 10 : 5;
                    state.complexity = Math.max(10, state.complexity - compCost);
                    break;
                case 'freeGift':
                    state.freeGiftStreak++;
                    if (state.freeGiftStreak >= 2) {
                        const penalty = state.freeGiftStreak * 10;
                        state.cohesion -= penalty;
                        state.inequality = Math.max(0, state.inequality - 5);
                        addLog(t.warnFreeGift, 'warn');
                    } else {
                        state.inequality = Math.max(0, state.inequality - 15);
                        state.cohesion += 8;
                    }
                    break;
            }
        }

        function checkEvolution() {
            const t = I18N[state.lang];
            let nextStage = state.stage;

            if (state.stage === 'band' && state.complexity >= 25 && state.giftCount >= 3) {
                nextStage = 'tribe';
            } 
            else if (state.stage === 'tribe' && state.complexity >= 50 && state.giftCount >= 8) {
                nextStage = 'chiefdom';
            } 
            else if (state.stage === 'chiefdom' && state.complexity >= 80 && state.giftCount >= 15) {
                nextStage = 'state';
            }

            if (nextStage !== state.stage) {
                state.stage = nextStage;
                const stageName = t.stages[nextStage];
                const msg = t.evolutionMsg.replace('{0}', stageName);
                addLog(msg, 'evolution');
            }
        }

        function getSocietyDetails(mode, complexity) {
            const roundedComp = Math.max(10, Math.min(mode === 'forager' ? 45 : 100, Math.round(complexity / 5) * 5));
            const data = SOC_DATABASE[mode] && SOC_DATABASE[mode][roundedComp];
            return {
                compKey: roundedComp,
                data: data || { system: "不明な社会形態", diff: "データが存在しません。", ex: "該当なし" }
            };
        }

        function showCurrentSocietyInfo() {
            const t = I18N[state.lang];
            const modeText = state.mode === 'forager' ? '狩猟採集社会' : '農耕社会';
            const { compKey, data } = getSocietyDetails(state.mode, state.complexity);

            const title = `現在の該当社会モデル (${modeText})`;
            const body = `【現在の社会ステータス】
・形態: ${t.stages[state.stage]}
・社会的複雑度: ${state.complexity} (対応インデックス: ${compKey})
・格差インデックス: ${state.inequality}%
・社会的結束度: ${state.cohesion}

----------------------------------------
【社会制度】
${data.system}

【社会構造と特徴（現実世界での変化）】
${data.diff}

【具体的歴史・人類学の例】
■ ${data.ex}`;

            showModal(title, body);
        }

        function showGameOverResult() {
            const t = I18N[state.lang];
            const modeText = state.mode === 'forager' ? '狩猟採集社会' : '農耕社会';
            const { compKey, data } = getSocietyDetails(state.mode, state.complexity);

            const resultText = `${t.gameOver}\n\n` +
                `・生産形態: ${modeText}\n` +
                `・最終到達段階: ${t.stages[state.stage]}\n` +
                `・生存年数: ${state.turn}\n` +
                `・贈与累積回数: ${state.giftCount}\n` +
                `・文明スコア: ${state.score}\n` +
                `・最終社会的複雑度: ${state.complexity} (インデックス: ${compKey})\n\n` +
                `${t.similarHeader}\n` +
                `■ 制度形態: ${data.system}\n` +
                `■ 社会構造の特質:\n${data.diff}\n` +
                `■ 該当する歴史的社会・文明例:\n${data.ex}`;

            showModal(t.gameOver, resultText);
        }

        function updateUI() {
            const t = I18N[state.lang];
            DOM.valStage.textContent = t.stages[state.stage];
            
            let stageWidth = 25;
            if (state.stage === 'tribe') stageWidth = 50;
            if (state.stage === 'chiefdom') stageWidth = 75;
            if (state.stage === 'state') stageWidth = 100;
            DOM.barStage.style.width = `${stageWidth}%`;

            DOM.valTurn.textContent = state.turn;
            DOM.valGiftCount.textContent = state.giftCount;
            DOM.barGiftCount.style.width = `${Math.min(100, state.giftCount * 5)}%`;

            DOM.valComplexity.textContent = state.complexity;
            DOM.barComplexity.style.width = `${state.complexity}%`;
            
            DOM.valInequality.textContent = `${state.inequality}%`;
            DOM.barInequality.style.width = `${state.inequality}%`;

            DOM.valCohesion.textContent = state.cohesion;
            DOM.barCohesion.style.width = `${state.cohesion}%`;
        }

        function addLog(msg, type) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = msg;
            DOM.logBox.appendChild(entry);
            DOM.logBox.scrollTop = DOM.logBox.scrollHeight;
        }

        function showHelp() {
            const t = I18N[state.lang];
            showModal(t.help, t.helpContent);
        }

        function showModal(title, text) {
            DOM.modalTitle.textContent = title;
            DOM.modalBody.textContent = text;
            DOM.modal.style.display = 'flex';
        }

        function hideModal() {
            DOM.modal.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
