<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Gift War - The Social Dynamics of Giving & Evolution</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #d4af37;
        }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, button {
            font-family: inherit;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
            touch-action: manipulation;
        }
        select:hover, button:hover {
            background: #3a3a3a;
            border-color: #d4af37;
        }
        button:disabled {
            background: #1a1a1a;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .status-panel {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .stat-box {
            background: #121212;
            padding: 6px 4px;
            border-radius: 4px;
            text-align: center;
            border-left: 3px solid #d4af37;
        }
        .stat-box.stage-box {
            border-left-color: #9b59b6;
        }
        .stat-box.dom-box {
            border-left-color: #e74c3c;
        }
        .stat-title {
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .stat-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }
        .stat-bar {
            height: 4px;
            background: #333;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: #d4af37;
            width: 0%;
            transition: width 0.3s ease;
        }
        .game-field {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            min-height: 180px;
        }
        .log-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 150px;
            max-height: 250px;
        }
        .panel-title {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 6px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
            touch-action: pan-y;
        }
        .log-content::-webkit-scrollbar {
            width: 5px;
        }
        .log-content::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 3px;
        }
        .log-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .log-entry {
            padding: 4px 8px;
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
            word-break: break-all;
        }
        .log-entry.event { border-left: 2px solid #e74c3c; }
        .log-entry.evolution { border-left: 2px solid #9b59b6; }
        .log-entry.action { border-left: 2px solid #2ecc71; }
        .log-entry.info { border-left: 2px solid #3498db; }
        .log-entry.warn { border-left: 2px solid #f39c12; }
        .ai-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
        }
        .hand-area {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            overflow-x: auto;
            padding: 5px 0 10px 0;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
        }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            width: 150px;
            height: 195px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .card:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: #d4af37;
            background: #333;
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #222;
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
            pointer-events: none;
        }
        .card-desc {
            font-size: 0.68rem;
            color: #bbb;
            line-height: 1.25;
            text-align: center;
            pointer-events: none;
        }
        .card-req {
            font-size: 0.6rem;
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 10px;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .modal-title {
            font-size: 1.1rem;
            color: #d4af37;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }
        .modal-body {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        .close-btn {
            background: #d4af37;
            color: #000;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
        }

        .purple-section {
            color: #be90d4;
            border-left: 2px solid #9b59b6;
            padding-left: 8px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            body { height: auto; }
            header { padding: 8px 10px; }
            h1 { font-size: 1.0rem; }
            .status-panel { 
                grid-template-columns: repeat(4, 1fr); 
                gap: 6px;
                padding: 8px;
            }
            .stat-box { padding: 4px 2px; }
            .stat-title { font-size: 0.65rem; }
            .stat-value { font-size: 0.85rem; }
            .game-field { grid-template-columns: 1fr; gap: 8px; }
            .log-panel { max-height: 180px; }
            .ai-panel { min-height: auto; gap: 8px; }
            .cards-container { justify-content: flex-start; }
            .card { width: 130px; height: 175px; padding: 6px; }
            .card-title { font-size: 0.75rem; }
            .card-desc { font-size: 0.62rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="app-title">GIFT WAR</h1>
        <div class="controls">
            <select id="mode-select">
                <option value="forager">狩猟採集社会</option>
                <option value="agrarian" selected>農耕社会</option>
            </select>
            <button id="btn-soc">参照 (Societies)</button>
            <button id="btn-help">HELP</button>
            <select id="lang-select">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="ko">한국語</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
    </header>

    <main>
        <section class="status-panel">
            <div class="stat-box stage-box">
                <div class="stat-title" id="lbl-stage">社会形態</div>
                <div class="stat-value" id="val-stage">バンド</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-stage" style="width: 25%; background:#9b59b6;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-turn">生存年数 (Turn)</div>
                <div class="stat-value" id="val-turn">1</div>
                <div class="stat-bar"><div class="stat-fill" style="width: 100%;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-giftcount">贈与累積回数</div>
                <div class="stat-value" id="val-giftcount">0</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-giftcount" style="width: 0%;"></div></div>
            </div>
            <div class="stat-box dom-box">
                <div class="stat-title" id="lbl-dominance">支配力</div>
                <div class="stat-value" id="val-dominance">0</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-dominance" style="background:#e74c3c;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-complexity">社会的複雑度</div>
                <div class="stat-value" id="val-complexity">10</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-complexity"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-inequality">格差インデックス</div>
                <div class="stat-value" id="val-inequality">10%</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-inequality"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-cohesion">社会的結束度</div>
                <div class="stat-value" id="val-cohesion">100</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-cohesion"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-pop">人口</div>
                <div class="stat-value" id="val-pop">30</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-pop"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-food">食料獲得量</div>
                <div class="stat-value" id="val-food">80</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-food"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-tools">道具生産量</div>
                <div class="stat-value" id="val-tools">10</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-tools"></div></div>
            </div>
        </section>

        <section class="game-field">
            <div class="log-panel">
                <div class="panel-title" id="lbl-log">社会履歴ログ</div>
                <div class="log-content" id="log-box"></div>
            </div>
            <div class="ai-panel">
                <div class="panel-title" id="lbl-ai">外部・他者勢力 (AI)</div>
                <div id="ai-status" style="font-size:0.8rem; color:#aaa; line-height:1.4;">
                    AI行動分析中...
                </div>
                <button id="btn-next" style="width: 100%; margin-top: 6px;">何もせず静観</button>
            </div>
        </section>

        <section class="hand-area">
            <div class="panel-title" id="lbl-hand">実行可能な戦略カード</div>
            <div class="cards-container" id="cards-box"></div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">理論解説</div>
            <div class="modal-body" id="modal-body"></div>
            <button class="close-btn" id="modal-close">閉じる</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const STAGE_MIN_COMPLEXITY = {
            band: 10,
            tribe: 20,
            chiefdom: 30,
            state: 40
        };

        const STAGE_REQ_GIFTS = {
            band: 0,
            tribe: 3,
            chiefdom: 8,
            state: 15
        };

        const SOC_DATABASE = {
            forager: {
                10: {
                    ja: { system: "極小遊動バンド", diff: "血縁を中心とした15〜30人の完全平等集団。資源の所有概念はなく即時消費。", ex: "カラハリ・サン族（旧来の伝統的移動生活期）、ハザ族" },
                    en: { system: "Micro Mobile Band", diff: "Fully egalitarian group of 15–30 kin. No concept of resource ownership; immediate consumption.", ex: "Kalahari San (traditional mobile era), Hadza" },

                    ko: { system: "극소 유목 밴드", diff: "혈연 중심 15~30인의 완전 평등 집단. 자원 소유 개념 없이 즉시 소비.", ex: "칼라하리 산족(전통 이동기), 하다자족" },
                    fr: { system: "Micro-bande mobile", diff: "Groupe égalitaire de 15-30 proches. Pas de propriété ; consommation immédiate.", ex: "San du Kalahari (ère mobile), Hadza" },
                    es: { system: "Microbanda móvil", diff: "Grupo igualitario de 15-30 parientes. Sin propiedad; consumo inmediato.", ex: "San del Kalahari (era móvil), Hadza" }
                },
                15: {
                    ja: { system: "遊動バンド連合", diff: "複数家族の季節的集積。個人的所有はないが贈与を通じた広域相互扶助が成立。", ex: "イヌイットの冬季集落、オーストラリア先住民の移動バンド" },
                    en: { system: "Mobile Band Coalition", diff: "Seasonal gathering of families. Wide-area mutual aid through gifts without personal property.", ex: "Inuit winter camps, Australian Aboriginal bands" },
                    zh: { system: "游动游群联盟", diff: "多家庭的季节性聚集。无个人财产，但通过馈赠实现广域互助。", ex: "因纽特人冬季营地、澳大利亚原住民游群" },
                    ko: { system: "유목 밴드 연합", diff: "다수 가족의 계절적 집적. 개인 소유 없이 증여를 통한 광역 상호부조.", ex: "이누이트 겨울 집락, 호주 원주민 이동 밴드" },
                    fr: { system: "Coalition de bandes mobiles", diff: "Rassemblement saisonnier. Entraide via le don sans propriété privée.", ex: "Camps d'hiver inuits, bandes aborigènes" },
                    es: { system: "Coalición de bandas móviles", diff: "Reunión estacional de familias. Ayuda mutua mediante dones sin propiedad privada.", ex: "Campamentos invernales inuit, bandas aborígenes" }
                },
                20: {
                    ja: { system: "半定住型部族（初期）", diff: "特定の豊かな漁場や採取地に定住を開始。道具や装身具の個人的所有の萌芽。", ex: "縄文時代早期・前期の集落、北米カリフォルニア先住民" },
                    en: { system: "Semi-sedentary Tribe (Early)", diff: "Settlement near rich fishing/gathering spots. Emergence of personal tools and ornaments.", ex: "Early Jomon villages, California Native Americans" },

                    ko: { system: "반정주 부족 (초기)", diff: "풍부한 어장/채집지 정주 시작. 도구 및 장신구의 개인 소유 싹트기.", ex: "조몬 시대 조/전기 집락, 캘리포니아 원주민" },
                    fr: { system: "Tribu semi-sédentaire (Début)", diff: "Sédentarisation près de zones riches. Début de la propriété personnelle d'outils.", ex: "Villages Jomon anciens, Amérindiens de Californie" },
                    es: { system: "Tribu semisedentaria (Incipiente)", diff: "Asentamiento en zonas ricas. Aparición de propiedad personal de herramientas.", ex: "Aldeas Jomon tempranas, nativos de California" }
                },
                25: {
                    ja: { system: "定住型狩猟採集部族", diff: "特定の資源（鮭・どんぐり等）の大規模貯蔵。長老や呪術師による儀礼的調整の発生。", ex: "縄文時代中期（三内丸山遺跡など）、パプアニューギニア高地狩猟採集民" },
                    en: { system: "Sedentary Forager Tribe", diff: "Massive storage of key resources (salmon, acorns). Ritual mediation by elders/shamans.", ex: "Middle Jomon (Sannai-Maruyama), PNG Highland foragers" },

                    fr: { system: "Tribu de chasseurs-cueilleurs sédentaires", diff: "Stockage massif (saumon, glands). Régulation rituelle par les aînés/chamans.", ex: "Jomon moyen (Sannai-Maruyama), Chasseurs de PNG" },
                    es: { system: "Tribu cazadora-recolectora sedentaria", diff: "Almacenamiento masivo (salmón, bellotas). Mediación ritual de ancianos o chamanes.", ex: "Jomon Medio (Sannai-Maruyama), recolectores de Nueva Guinea" }
                },
                30: {
                    ja: { system: "高度貯蔵・複合部族", diff: "特定資源の独占と貯蔵施設の管理。身分階層の萌芽と交易ネットワークの拡大。", ex: "北米太平洋北西海岸先住民（トリンギット族・初期クワキウトル族）" },
                    en: { system: "Advanced Storage Complex Tribe", diff: "Monopolization of key resources and storage facilities. Early stratification and trade networks.", ex: "Pacific NW Coast peoples (Tlingit, early Kwakiutl)" },
                    zh: { system: "高度储存复合部落", diff: "垄断特定资源与储存设施。社会阶层萌芽与贸易网络扩张。", ex: "北美太平洋西北海岸原住民（特林吉特人、早期克瓦基特尔人）" },
                    ko: { system: "고도 저장 복합 부족", diff: "특정 자원 독점 및 저장 시설 관리. 신분 계층 싹트기 및 교역망 확대.", ex: "북미 태평양 북서해안 원주민(틀링깃족, 초기 크와키우틀족)" },
                    fr: { system: "Tribu complexe à stockage avancé", diff: "Monopole des ressources et des stocks. Début de stratification et réseaux marchands.", ex: "Peuples du Nord-Ouest pacifique (Tlingit, début Kwakiutl)" },
                    es: { system: "Tribu compleja de almacenamiento avanzado", diff: "Monopolio de recursos y almacenes. Inicio de estratificación y redes comerciales.", ex: "Pueblos del Noroeste del Pacífico (Tlingit, Kwakiutl temprano)" }
                },
                35: {

        function resetGame() {
            state.turn = 1;
            state.complexity = 10;
            state.inequality = 10;
            state.cohesion = 100;
            state.dominance = 0;
            state.giftCount = 0;
            state.stage = 'band';
            state.population = state.mode === 'agrarian' ? 30 : 20;
            state.food = state.mode === 'agrarian' ? 80 : 50;
            state.tools = state.mode === 'agrarian' ? 10 : 5;
            state.freeGiftStreak = 0;
            state.isGameOver = false;
            state.dissatisfaction = 0;
            state.externalTension = 50;
            DOM.logBox.innerHTML = '';
            renderHand();
            updateUI();
        }

            const t = I18N[state.lang] || I18N.ja;

            if (DOM.lblDominance) DOM.lblDominance.textContent = t.dominance;
            DOM.lblComplexity.textContent = t.complexity;
            DOM.lblInequality.textContent = t.inequality;

        function computeKinshipAndSocialStructure() {
            const comp = state.complexity;
            const ineq = state.inequality;
            const mode = state.mode;
            const stage = computeCurrentStageKey();

            let kinship = "";
            let socStruct = "";

            if (state.lang === 'ja') {
                if (stage === 'band') {
                    kinship = "内婚的バンド構造（血縁を中心とした小規模集団）";
                    socStruct = "平等主義的共同体（所有概念なし・即時消費）";
                } else if (stage === 'tribe') {
                    kinship = "二分組織・限定交換（血縁・互恵的婚姻関係）";
                    socStruct = "環濠・村落複合体（長老会による土地・資源調整）";
                } else if (stage === 'chiefdom') {
                    kinship = "一般交換・首長系譜による婚姻同盟";
                    socStruct = "階層化首長制社会（世襲首長・貢納・大型造営）";
                } else {
                    kinship = "複合的階層化親族体系（身分内婚の定着）";
                    socStruct = "中央集権的領域国家・官僚制（成文法・税制）";
                }
            } else {
                if (stage === 'band') {
                    kinship = "Endogamous Band Structure";
                    socStruct = "Egalitarian Kin Community";
                } else if (stage === 'tribe') {
                    kinship = "Dual / Restricted Exchange System";
                    socStruct = "Reciprocal Village Alliance";
                } else if (stage === 'chiefdom') {
                    kinship = "Generalized Exchange System";
                    socStruct = "Stratified Chiefdom";
                } else {
                    kinship = "Complex Stratified Kinship";
                    socStruct = "Centralized State";
                }
            }

            return { kinship, socStruct };
        }

        function computeCurrentStageKey() {
            const comp = state.complexity;
            const gifts = state.giftCount;

            if (comp >= 40 && gifts >= STAGE_REQ_GIFTS.state) return 'state';
            if (comp >= 30 && gifts >= STAGE_REQ_GIFTS.chiefdom) return 'chiefdom';
            if (comp >= 20 && gifts >= STAGE_REQ_GIFTS.tribe) return 'tribe';
            return 'band';
        }

        function enforceMinComplexity() {
            const currentStage = computeCurrentStageKey();
            const minComp = STAGE_MIN_COMPLEXITY[currentStage] || 10;
            if (state.complexity < minComp) {
                state.complexity = minComp;
            }
        }

        function renderHand() {
            while (DOM.cardsBox.firstChild) {
                DOM.cardsBox.removeChild(DOM.cardsBox.firstChild);
            }

            if (state.isGameOver) return;

            const t = I18N[state.lang] || I18N.ja;
            
            cards.forEach(cardObj => {
                const key = cardObj.id;
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                
                let isExecutable = true;
                let reqMsg = "";

                if (key === 'potlatch') {
                    if (state.complexity < 30 || state.inequality < 40 || state.food < 50 || state.tools < 20) {
                        isExecutable = false;
                        reqMsg = t.reqPotlatch;
                    }
                } else if (key === 'panhellenic_games') {
                    if (state.complexity < 20 || state.food < 80 || state.tools < 30) {
                        isExecutable = false;
                        reqMsg = t.reqPanhellenic;
                    }
                } else if (key === 'megalith_small') {
                    if (state.population < 30 || state.food < 40 || state.tools < 15) {
                        isExecutable = false;
                        reqMsg = t.reqMegalithSmall;
                    }
                } else if (key === 'megalith_construction') {
                    if (state.population < 100 || state.food < 150 || state.tools < 50) {
                        isExecutable = false;
                        reqMsg = t.reqMegalith;
                    }
                } else if (key === 'ritual') {
                    if (state.food < 20) {
                        isExecutable = false;
                        reqMsg = t.reqRitual;
                    }
                } else if (key === 'universalServices') {
                    if (state.food < 30 || state.tools < 15) {
                        isExecutable = false;
                        reqMsg = "食料30, 道具15が必要";
                    }
                } else if (key === 'commons') {
                    if (state.food < 15 || state.tools < 15) {
                        isExecutable = false;
                        reqMsg = "食料15, 道具15が必要";
                    }
                }

                if (!isExecutable) {
                    cardEl.classList.add('disabled');
                }

                let cardName = (t.cards[key] && t.cards[key].name) || key;
                let cardDesc = (t.cards[key] && t.cards[key].desc) || "";

                cardEl.innerHTML = `
                    <div class="card-title">${cardName}</div>
                    <div class="card-desc">${cardDesc}</div>
                    ${reqMsg ? `<div class="card-req">${reqMsg}</div>` : ''}
                `;

                if (isExecutable) {
                    cardEl.addEventListener('click', () => playCard(key));
                }

                DOM.cardsBox.appendChild(cardEl);
            });
        }

        function playCard(cardId) {
            if (state.isGameOver) return;

            let logText = "";
            const t = I18N[state.lang] || I18N.ja;

            if (cardId === 'accumulate') {
                state.freeGiftStreak = 0;
                state.population += 2;
                state.food += state.mode === 'agrarian' ? 40 : 30;
                state.tools += 5;
                state.complexity += 1;
                state.inequality = Math.min(100, state.inequality + 4);
                logText = state.lang === 'ja' ? "資源蓄積を行いました。人口・食料・道具・複雑度と格差が上昇しました。" : "Accumulated resources.";
            } else if (cardId === 'directGift') {
                state.freeGiftStreak = 0;
                state.giftCount += 1;
                state.inequality = Math.max(0, state.inequality - 5);
                state.cohesion = Math.min(100, state.cohesion + 8);
                state.dominance += 5;
                state.food = Math.max(0, state.food - 10);
                logText = state.lang === 'ja' ? "直接贈与を実施。食料を分配し格差低下・結束力強化・支配力+5。" : "Executed direct gift (+5 Dominance).";

                state.freeGiftStreak = 0;
                state.giftCount += 1;
                state.cohesion = Math.min(100, state.cohesion + 5);

                state.complexity += 1;
                logText = state.lang === 'ja' ? "義務的返礼のネットワークを強化。安定した相互関係と確実な統合が維持されています。" : "Maintained obligatory reciprocity.";

                state.inequality = Math.max(0, state.inequality - 10);

                state.cohesion = Math.min(100, state.cohesion + 15);

                logText = state.lang === 'ja' ? "聖なる祭祀の執り行いにより、人々の社会的結束度が向上しました。" : "Performed ritual worship.";
            } else if (cardId === 'potlatch') {
                state.freeGiftStreak = 0;
                state.giftCount += 1;
                state.food = Math.max(0, state.food - 50);
                state.tools = Math.max(0, state.tools - 20);
                state.inequality = Math.max(0, state.inequality - 25);
                state.dominance += 25;
                state.cohesion = Math.min(100, state.cohesion + 10);
                logText = state.lang === 'ja' ? "過剰贈与（ポトラッチ）を開催！格差が大幅リセットされ、威信と支配力が急上昇（支配力+25）！" : "Executed Potlatch (+25 Dominance)!";
            } else if (cardId === 'panhellenic_games') {

            } else if (cardId === 'megalith_small') {

            enforceMinComplexity();

        function triggerRandomEvent() {
            if (state.isGameOver) return;
            
            const roll = Math.random();
            if (roll < 0.12) {
                const foodLoss = Math.floor(state.food * 0.3) + 10;
                state.food = Math.max(0, state.food - foodLoss);
                state.cohesion = Math.max(0, state.cohesion - 10);
                addLog(`【自然災害】干ばつと飢饉が発生！ 食料-${foodLoss}、結束度-10`, 'event');
            } else if (roll < 0.22) {
                const popLoss = Math.floor(state.population * 0.15) + 5;
                const toolLoss = Math.floor(state.tools * 0.2) + 5;
                state.population = Math.max(0, state.population - popLoss);
                state.tools = Math.max(0, state.tools - toolLoss);
                state.cohesion = Math.max(0, state.cohesion - 15);
                addLog(`【外部侵略】他勢力からの襲撃！ 人口-${popLoss}、道具-${toolLoss}、結束度-15`, 'event');
            } else if (roll < 0.30) {
                const toolGain = Math.floor(state.tools * 0.5) + 15;
                const foodGain = Math.floor(state.food * 0.3) + 20;
                state.tools += toolGain;
                state.food += foodGain;
                state.complexity += 2;
                addLog(`【渡来人到来】高度な技術を持つ渡来人が流入！ 道具+${toolGain}、食料+${foodGain}、複雑度+2`, 'event');
            } else if (roll < 0.36) {
                const giftFood = 60;
                const giftTools = 30;
                state.food += giftFood;
                state.tools += giftTools;
                state.dominance += 10;
                addLog(`【近隣帝国からの贈与】突発的な富が流入！ 食料+${giftFood}、道具+${giftTools}、支配力+10`, 'event');
            }
        }

        function processTurn(playedCardId) {
            if (state.isGameOver) return;

            state.turn += 1;

            triggerRandomEvent();

            const foodNeeded = Math.floor(state.population * 0.8);
            if (state.food >= foodNeeded) {
                state.food -= foodNeeded;
                state.population += Math.floor(state.population * 0.05) + 1;
            } else {
                const starvation = Math.floor((foodNeeded - state.food) / 2) + 1;
                state.food = 0;
                state.population = Math.max(0, state.population - starvation);
                state.cohesion = Math.max(0, state.cohesion - 12);
                addLog(`【食料不足】餓死者が発生！ 人口-${starvation}、結束度-12`, 'warn');
            }

            if (state.inequality > 50) {
                state.cohesion = Math.max(0, state.cohesion - 3);
            }

            if (state.cohesion <= 0 && state.population > 0) {
                const baseLossRate = 0.6;
                const reduction = Math.min(0.5, state.dominance * 0.005); 
                const actualLossRate = Math.max(0.1, baseLossRate - reduction);
                
                const popLoss = Math.floor(state.population * actualLossRate) + 5;
                state.population = Math.max(0, state.population - popLoss);
                state.cohesion = 20; 
                
                addLog(`【反乱 / 革命】社会的結束の不全により大規模反乱が発生！ 支配力(${state.dominance})により損害緩和。 人口-${popLoss}、結束が20まで一時回復。`, 'event');
            }

            enforceMinComplexity();

            const prevStage = state.stage;
            const newStageKey = computeCurrentStageKey();
            state.stage = newStageKey;

            const t = I18N[state.lang] || I18N.ja;

            if (prevStage !== newStageKey) {
                const stageName = t.stages[newStageKey] || newStageKey;
                addLog(t.evolutionMsg.replace('{0}', stageName).replace('{1}', state.giftCount), 'evolution');
            }

            if (state.population <= 0) {
                state.isGameOver = true;
                addLog(t.gameOver, 'event');
                showResultModal();
            }

            updateUI();
            renderHand();
        }

        function updateUI() {
            const t = I18N[state.lang] || I18N.ja;
            DOM.valTurn.textContent = state.turn;
            DOM.valGiftCount.textContent = state.giftCount;
            if (DOM.valDominance) DOM.valDominance.textContent = state.dominance;
            DOM.valComplexity.textContent = state.complexity;
            DOM.valInequality.textContent = state.inequality + '%';
            DOM.valCohesion.textContent = state.cohesion;
            DOM.valPop.textContent = state.population;
            DOM.valFood.textContent = state.food;
            DOM.valTools.textContent = state.tools;

            const currentStageKey = computeCurrentStageKey();
            DOM.valStage.textContent = t.stages[currentStageKey] || currentStageKey;

            if (DOM.barDominance) DOM.barDominance.style.width = Math.min(100, state.dominance) + '%';
            DOM.barComplexity.style.width = Math.min(100, state.complexity) + '%';
            DOM.barInequality.style.width = Math.min(100, state.inequality) + '%';
            DOM.barCohesion.style.width = Math.min(100, state.cohesion) + '%';
            DOM.barPop.style.width = Math.min(100, state.population / 2) + '%';
            DOM.barFood.style.width = Math.min(100, state.food / 2) + '%';
            DOM.barTools.style.width = Math.min(100, state.tools / 2) + '%';
        }

        function addLog(text, type = 'info') {
            if (!text) return;
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[Turn ${state.turn}] ${text}`;
            DOM.logBox.appendChild(entry);
            DOM.logBox.scrollTop = DOM.logBox.scrollHeight;
        }

        function showHelp() {
            const t = I18N[state.lang] || I18N.ja;
            DOM.modalTitle.textContent = t.help;
            DOM.modalBody.textContent = t.helpContent;
            DOM.modal.style.display = 'flex';
        }

        function showCurrentSocietyInfo() {
            const t = I18N[state.lang] || I18N.ja;
            const comp = state.complexity;
            
            const socDict = SOC_DATABASE[state.mode] || {};
            const keys = Object.keys(socDict).map(Number).sort((a,b) => a - b);
            let matchedKey = keys[0];
            for (let k of keys) {
                if (comp >= k) matchedKey = k;
            }

            const socData = (socDict[matchedKey] && socDict[matchedKey][state.lang]) || t.unknownSoc;
            const { kinship, socStruct } = computeKinshipAndSocialStructure();

            DOM.modalTitle.textContent = t.infoModal.title.replace('{0}', t.modes[state.mode]);
            
            DOM.modalBody.innerHTML = `
                <div><strong>${t.infoModal.statusHeader}</strong></div>
                <div>${t.infoModal.lblStage}: ${t.stages[computeCurrentStageKey()]}</div>
                <div>${t.infoModal.lblComp}: ${state.complexity}</div>
                <div>${t.infoModal.lblDom}: ${state.dominance}</div>
                <div>${t.infoModal.lblIneq}: ${state.inequality}%</div>
                <div>${t.infoModal.lblCoh}: ${state.cohesion}</div>
                <br>
                <div><strong>${t.infoModal.secSystem}</strong> ${socData.system}</div>
                <div><strong>${t.infoModal.secDiff}</strong> ${socData.diff}</div>
                <div><strong>${t.infoModal.secEx}</strong> ${socData.ex}</div>
                <br>
                <div class="purple-section">
                    <div><strong>${t.infoModal.secKinship}</strong></div>
                    <div>${kinship}</div>
                    <br>
                    <div><strong>${t.infoModal.secSocStruct}</strong></div>
                    <div>${socStruct}</div>
                </div>
            `;
            
            DOM.modal.style.display = 'flex';
        }

        function showResultModal() {
            const t = I18N[state.lang] || I18N.ja;
            const { kinship, socStruct } = computeKinshipAndSocialStructure();

            DOM.modalTitle.textContent = t.gameOver;
            DOM.modalBody.innerHTML = `
                <div><strong>${t.resultModal.lblMode}:</strong> ${t.modes[state.mode]}</div>
                <div><strong>${t.resultModal.lblStage}:</strong> ${t.stages[computeCurrentStageKey()]}</div>
                <div><strong>${t.resultModal.lblTurn}:</strong> ${state.turn}</div>
                <div><strong>${t.resultModal.lblGift}:</strong> ${state.giftCount}</div>
                <div><strong>${t.resultModal.lblDom}:</strong> ${state.dominance}</div>
                <div><strong>${t.resultModal.lblComp}:</strong> ${state.complexity}</div>
                <br>
                <div class="purple-section">
                    <div><strong>${t.resultModal.lblKinship}:</strong> ${kinship}</div>
                    <div><strong>${t.resultModal.lblSocStruct}:</strong> ${socStruct}</div>
                </div>
            `;
            DOM.modal.style.display = 'flex';
        }

        function hideModal() {
            DOM.modal.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
