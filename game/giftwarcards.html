<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Gift War - The Social Dynamics of Giving & Evolution</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #d4af37;
        }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, button {
            font-family: inherit;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
            touch-action: manipulation;
        }
        select:hover, button:hover {
            background: #3a3a3a;
            border-color: #d4af37;
        }
        button:disabled {
            background: #1a1a1a;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .status-panel {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .stat-box {
            background: #121212;
            padding: 6px 4px;
            border-radius: 4px;
            text-align: center;
            border-left: 3px solid #d4af37;
        }
        .stat-box.stage-box {
            border-left-color: #9b59b6;
        }
        .stat-box.dom-box {
            border-left-color: #e74c3c;
        }
        .stat-title {
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .stat-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }
        .stat-bar {
            height: 4px;
            background: #333;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: #d4af37;
            width: 0%;
            transition: width 0.3s ease;
        }
        .game-field {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            min-height: 180px;
        }
        .log-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 150px;
            max-height: 250px;
        }
        .panel-title {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 6px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
            touch-action: pan-y;
        }
        .log-content::-webkit-scrollbar {
            width: 5px;
        }
        .log-content::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 3px;
        }
        .log-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .log-entry {
            padding: 4px 8px;
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
            word-break: break-all;
        }
        .log-entry.event { border-left: 2px solid #e74c3c; }
        .log-entry.evolution { border-left: 2px solid #9b59b6; }
        .log-entry.devolution { border-left: 2px solid #e67e22; }
        .log-entry.action { border-left: 2px solid #2ecc71; }
        .log-entry.info { border-left: 2px solid #3498db; }
        .log-entry.warn { border-left: 2px solid #f39c12; }
        .ai-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
        }
        .hand-area {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            overflow-x: auto;
            padding: 5px 0 10px 0;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
        }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            width: 150px;
            height: 195px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .card:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: #d4af37;
            background: #333;
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #222;
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
            pointer-events: none;
        }
        .card-desc {
            font-size: 0.68rem;
            color: #bbb;
            line-height: 1.25;
            text-align: center;
            pointer-events: none;
        }
        .card-req {
            font-size: 0.6rem;
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 10px;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .modal-title {
            font-size: 1.1rem;
            color: #d4af37;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }
        .modal-body {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        .close-btn {
            background: #d4af37;
            color: #000;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
        }

        .purple-section {
            color: #be90d4;
            border-left: 2px solid #9b59b6;
            padding-left: 8px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            body { height: auto; }
            header { padding: 8px 10px; }
            h1 { font-size: 1.0rem; }
            .status-panel { 
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
                padding: 8px;
            }
            .stat-box { padding: 4px 2px; }
            .stat-title { font-size: 0.65rem; }
            .stat-value { font-size: 0.85rem; }
            .game-field { grid-template-columns: 1fr; gap: 8px; }
            .log-panel { max-height: 180px; }
            .ai-panel { min-height: auto; gap: 8px; }
            .cards-container { justify-content: flex-start; }
            .card { width: 130px; height: 175px; padding: 6px; }
            .card-title { font-size: 0.75rem; }
            .card-desc { font-size: 0.62rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="app-title">GIFT WAR</h1>
        <div class="controls">
            <select id="mode-select">
                <option value="forager">狩猟採集社会</option>
                <option value="agrarian" selected>農耕社会</option>
            </select>
            <button id="btn-soc">参照 (Societies)</button>
            <button id="btn-help">HELP</button>
            <select id="lang-select">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="ko">한국語</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
    </header>

    <main>
        <section class="status-panel">
            <div class="stat-box stage-box">
                <div class="stat-title" id="lbl-stage">社会形態</div>
                <div class="stat-value" id="val-stage">バンド</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-stage" style="width: 25%; background:#9b59b6;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-turn">生存年数 (Turn)</div>
                <div class="stat-value" id="val-turn">1</div>
                <div class="stat-bar"><div class="stat-fill" style="width: 100%;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-giftcount">贈与累積回数</div>
                <div class="stat-value" id="val-giftcount">0</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-giftcount" style="width: 0%;"></div></div>
            </div>
            <div class="stat-box dom-box">
                <div class="stat-title" id="lbl-dominance">支配力</div>
                <div class="stat-value" id="val-dominance">0</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-dominance" style="background:#e74c3c;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-complexity">社会的複雑度</div>
                <div class="stat-value" id="val-complexity">10</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-complexity"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-inequality">格差インデックス</div>
                <div class="stat-value" id="val-inequality">10%</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-inequality"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-cohesion">社会的結束度</div>
                <div class="stat-value" id="val-cohesion">100</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-cohesion"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-pop">人口</div>
                <div class="stat-value" id="val-pop">30</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-pop"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-food">食料獲得量</div>
                <div class="stat-value" id="val-food">80</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-food"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-tools">道具生産量</div>
                <div class="stat-value" id="val-tools">10</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-tools"></div></div>
            </div>
        </section>

        <section class="game-field">
            <div class="log-panel">
                <div class="panel-title" id="lbl-log">社会履歴ログ</div>
                <div class="log-content" id="log-box"></div>
            </div>
            <div class="ai-panel">
                <div class="panel-title" id="lbl-ai">外部・他者勢力 (AI)</div>
                <div id="ai-status" style="font-size:0.8rem; color:#aaa; line-height:1.4;">
                    AI行動分析中...
                </div>
                <button id="btn-next" style="width: 100%; margin-top: 6px;">何もせず静観</button>
            </div>
        </section>

        <section class="hand-area">
            <div class="panel-title" id="lbl-hand">実行可能な戦略カード</div>
            <div class="cards-container" id="cards-box"></div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">理論解説</div>
            <div class="modal-body" id="modal-body"></div>
            <button class="close-btn" id="modal-close">閉じる</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const STAGE_MIN_COMPLEXITY = {
            band: 10,
            tribe: 20,
            chiefdom: 30,
            state: 40
        };

        const STAGE_REQ_GIFTS = {
            band: 0,
            tribe: 3,
            chiefdom: 8,
            state: 15
        };

        const STAGE_REQ_POP = {
            band: 10,
            tribe: 50,
            chiefdom: 200,
            state: 500
        };

        const SOC_DATABASE = {
            forager: {
                10: {
                    ja: { system: "極小遊動バンド", diff: "血縁を中心とした15〜30人の完全平等集団。資源の所有概念はなく即時消費。", ex: "カラハリ・サン族（旧来の伝統的移動生活期）、ハザ族" },

                    ko: { system: "극소 유목 밴드", diff: "혈연 중심 15~30인의 완전 평등 집단. 자원 소유 개념 없이 즉시 소비.", ex: "칼라하리 산족(전통 이동기), 하다자족" },
                    fr: { system: "Micro-bande mobile", diff: "Groupe égalitaire de 15-30 proches. Pas de propriété ; consommation immédiate.", ex: "San du Kalahari (ère mobile), Hadza" },
                    es: { system: "Microbanda móvil", diff: "Grupo igualitario de 15-30 parientes. Sin propiedad; consumo inmediato.", ex: "San del Kalahari (era móvil), Hadza" }
                },
                15: {
                    ja: { system: "遊動バンド連合", diff: "複数家族の季節的集積。個人的所有はないが贈与を通じた広域相互扶助が成立。", ex: "イヌイットの冬季集落、オーストラリア先住民の移動バンド" },
                    en: { system: "Mobile Band Coalition", diff: "Seasonal gathering of families. Wide-area mutual aid through gifts without personal property.", ex: "Inuit winter camps, Australian Aboriginal bands" },
                    zh: { system: "游动游群联盟", diff: "多家庭的季节性聚集。无个人财产，但通过馈赠实现广域互助。", ex: "因纽特人冬季营地、澳大利亚原住民游群" },

                20: {

                    fr: { system: "Tribu semi-sédentaire (Début)", diff: "Sédentarisation près de zones riches. Début de la propriété personnelle d'outils.", ex: "Villages Jomon anciens, Amérindiens de Californie" },

                25: {
                    ja: { system: "定住型狩猟採集部族", diff: "特定の資源（鮭・どんぐり等）の大規模貯蔵。長老や呪術師による儀礼的調整の発生。", ex: "縄文時代中期（三内丸山遺跡など）、パプアニューギニア高地狩猟採集民" },

                    ko: { system: "고도 저장 복합 부족", diff: "특정 자원 독점 및 저장 시설 관리. 신분 계층 싹트기 및 교역망 확대.", ex: "북미 태평양 북서해안 원주민(틀링깃족, 초기 크와키우틀족)" },
                    fr: { system: "Tribu complexe à stockage avancé", diff: "Monopole des ressources et des stocks. Début de stratification et réseaux marchands.", ex: "Peuples du Nord-Ouest pacifique (Tlingit, début Kwakiutl)" },
                    es: { system: "Tribu compleja de almacenamiento avanzado", diff: "Monopolio de recursos y almacenes. Inicio de estratificación y redes comerciales.", ex: "Pueblos del Noroeste del Pacífico (Tlingit, Kwakiutl temprano)" }
                },

        function computeCurrentStageKey() {
            if (state.complexity >= STAGE_MIN_COMPLEXITY.state && state.giftCount >= STAGE_REQ_GIFTS.state && state.pop >= STAGE_REQ_POP.state) {
                return 'state';
            }
            if (state.complexity >= STAGE_MIN_COMPLEXITY.chiefdom && state.giftCount >= STAGE_REQ_GIFTS.chiefdom && state.pop >= STAGE_REQ_POP.chiefdom) {
                return 'chiefdom';
            }
            if (state.complexity >= STAGE_MIN_COMPLEXITY.tribe && state.giftCount >= STAGE_REQ_GIFTS.tribe && state.pop >= STAGE_REQ_POP.tribe) {
                return 'tribe';
            }
            return 'band';
        }

        function updateUI() {
            const t = I18N[state.lang] || I18N.ja;
            state.stage = computeCurrentStageKey();

            DOM.valStage.textContent = t.stages[state.stage];
            DOM.valTurn.textContent = state.turn;
            DOM.valGiftcount.textContent = state.giftCount;
            DOM.valDominance.textContent = Math.round(state.dominance);
            DOM.valComplexity.textContent = Math.round(state.complexity);
            DOM.valInequality.textContent = Math.round(state.inequality) + '%';
            DOM.valCohesion.textContent = Math.round(state.cohesion);
            DOM.valPop.textContent = Math.round(state.pop);
            DOM.valFood.textContent = Math.round(state.food);
            DOM.valTools.textContent = Math.round(state.tools);

            const stageProg = state.stage === 'band' ? 25 : state.stage === 'tribe' ? 50 : state.stage === 'chiefdom' ? 75 : 100;
            DOM.barStage.style.width = stageProg + '%';
            DOM.barGiftcount.style.width = Math.min(100, (state.giftCount / 20) * 100) + '%';
            DOM.barDominance.style.width = Math.min(100, state.dominance) + '%';
            DOM.barComplexity.style.width = Math.min(100, (state.complexity / 50) * 100) + '%';
            DOM.barInequality.style.width = Math.min(100, state.inequality) + '%';
            DOM.barCohesion.style.width = Math.min(100, state.cohesion) + '%';
            DOM.barPop.style.width = Math.min(100, (state.pop / 600) * 100) + '%';
            DOM.barFood.style.width = Math.min(100, (state.food / 200) * 100) + '%';
            DOM.barTools.style.width = Math.min(100, (state.tools / 100) * 100) + '%';
        }

        function renderCards() {
            DOM.cardsBox.innerHTML = '';
            if (state.gameEnded) return;

            CARDS_MASTER.forEach(card => {
                const title = card.title[state.lang] || card.title.ja;
                const desc = card.desc[state.lang] || card.desc.ja;

                let canUse = true;
                let reqText = [];

                if (card.req.food && state.food < card.req.food) {
                    canUse = false;
                    reqText.push(`Food:${card.req.food}`);
                }
                if (card.req.tools && state.tools < card.req.tools) {
                    canUse = false;
                    reqText.push(`Tools:${card.req.tools}`);
                }
                if (card.req.minStage) {
                    const stageRanks = { band: 1, tribe: 2, chiefdom: 3, state: 4 };
                    if (stageRanks[state.stage] < stageRanks[card.req.minStage]) {
                        canUse = false;
                        const t = I18N[state.lang] || I18N.ja;
                        reqText.push(`Req:${t.stages[card.req.minStage]}`);
                    }
                }

                const cardEl = document.createElement('div');
                cardEl.className = `card ${canUse ? '' : 'disabled'}`;
                cardEl.innerHTML = `
                    <div class="card-title">${title}</div>
                    <div class="card-desc">${desc}</div>
                    <div class="card-req">${reqText.join(' ')}</div>
                `;

                if (canUse) {
                    cardEl.addEventListener('click', () => playTurn(card));
                }

                DOM.cardsBox.appendChild(cardEl);
            });
        }

        function addLog(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = msg;
            DOM.logBox.appendChild(entry);
            DOM.logBox.scrollTop = DOM.logBox.scrollHeight;
        }

        function playTurn(selectedCard) {
            if (state.gameEnded) return;

            addLog(getSystemMsg('turnHeader'), 'info');

            if (selectedCard) {
                const title = selectedCard.title[state.lang] || selectedCard.title.ja;
                addLog(`▶ 戦略実行: 【${title}】`, 'action');

                const eff = selectedCard.effect;
                if (eff.food) state.food += eff.food;
                if (eff.tools) state.tools += eff.tools;
                if (eff.giftCount) state.giftCount += eff.giftCount;
                if (eff.dominance) state.dominance = Math.max(0, state.dominance + eff.dominance);
                if (eff.inequality) state.inequality = Math.max(0, Math.min(100, state.inequality + eff.inequality));
                if (eff.cohesion) state.cohesion = Math.max(0, Math.min(100, state.cohesion + eff.cohesion));
                if (eff.complexity) state.complexity += eff.complexity;
                if (eff.foodGen) state.foodGenBonus += eff.foodGen;
                if (eff.toolsGen) state.toolsGenBonus += eff.toolsGen;
            } else {
                addLog("▶ 静観を選択しました。", "info");
            }

            processTurnEndPhase();
        }

        function processTurnEndPhase() {
            // Food & Resource Generation
            const isAgrarian = state.mode === 'agrarian';
            const baseFoodMult = isAgrarian ? 1.5 : 1.0;
            const generatedFood = Math.round((state.foodGenBase + state.foodGenBonus) * baseFoodMult * (1 + state.complexity * 0.02));
            const generatedTools = Math.round((state.toolsGenBase + state.toolsGenBonus) * (1 + state.complexity * 0.015));

            state.food += generatedFood;
            state.tools += generatedTools;

            // Food Consumption
            const foodNeeded = Math.round(state.pop * 1.2);
            if (state.food >= foodNeeded) {
                state.food -= foodNeeded;
                state.pop += Math.round(state.pop * 0.05); // Natural pop growth
            } else {
                const deficit = foodNeeded - state.food;
                state.food = 0;
                const dead = Math.round(deficit * 0.5);
                state.pop = Math.max(5, state.pop - dead);
                state.cohesion = Math.max(0, state.cohesion - 15);
                addLog(getSystemMsg('starvation'), 'event');
            }

            // Automatic Complexity and Inequality Dynamics
            const newStageKey = computeCurrentStageKey();
            if (newStageKey !== state.stage) {
                const t = I18N[state.lang] || I18N.ja;
                const stageRanks = { band: 1, tribe: 2, chiefdom: 3, state: 4 };
                if (stageRanks[newStageKey] > stageRanks[state.stage]) {
                    addLog(`★ 社会形態が【${t.stages[newStageKey]}】へ進化した！`, 'evolution');
                } else {
                    addLog(`⚠ 社会構造が【${t.stages[newStageKey]}】へ衰退した...`, 'devolution');
                }
                state.stage = newStageKey;
            }

            // Natural Complexity growth from population and gifts
            state.complexity += (state.pop * 0.01) + (state.giftCount * 0.1);

            // Dominance & Inequality drift
            if (state.dominance > 0) {
                state.inequality = Math.min(100, state.inequality + state.dominance * 0.1);
            }

            // Rebellion Event
            if (state.inequality > 60 && Math.random() < 0.4) {
                let baseCohesionDmg = 25;
                let baseCompDmg = 5;

                let damageCut = 0;
                if (state.dominance > 0) {
                    damageCut = Math.min(baseCohesionDmg, state.dominance);
                }

                let actualCohesionDmg = baseCohesionDmg - damageCut;

                state.cohesion = Math.max(0, state.cohesion - actualCohesionDmg);
                state.complexity = Math.max(10, state.complexity - baseCompDmg);

                if (damageCut > 0) {
                    state.dominance = Math.max(0, state.dominance - damageCut);
                    addLog(getSystemMsg('rebellionMitigated'), 'warn');
                } else {
                    addLog(getSystemMsg('rebellion'), 'event');
                }
            }

            // AI Status Update
            updateAIStatus();

            state.turn++;
            updateUI();
            checkGameStatus();
            renderCards();
        }

        function updateAIStatus() {
            const aiMsgs = {
                ja: [
                    "隣接バンド：交易の申し入れを検討中...",
                    "競合首長国：威信財の蓄積を注視している。",
                    "周縁部族：こちらの贈与余力を警戒中。"
                ],
                en: [
                    "Neighboring Band: Considering trade proposal...",
                    "Rival Chiefdom: Monitoring prestige goods accumulated.",
                    "Peripheral Tribe: Wary of your gift capacity."
                ],
                zh: [
                    "相邻游群：正在考虑交易提议...",
                    "竞争酋邦：正在密切关注威信财的积聚。",
                    "周边部落：对本方的赠与余力保持警惕。"
                ],
                ko: [
                    "인접 밴드: 교역 제안 검토 중...",
                    "경쟁 군장국: 위신재의 축적을 주시하고 있음.",
                    "주변 부족: 이쪽의 증여 여력을 경계 중."
                ],
                fr: [
                    "Bande voisine : Envisage une proposition commerciale...",
                    "Chefferie rivale : Surveille l'accumulation de biens de prestige.",
                    "Tribu périphérique : Méfiante de votre capacité de don."
                ],
                es: [
                    "Banda vecina: Considerando propuesta comercial...",
                    "Jefatura rival: Monitoreando bienes de prestigio acumulados.",
                    "Tribu periférica: Cautelosa ante su capacidad de dar regalos."
                ]
            };
            const list = aiMsgs[state.lang] || aiMsgs.ja;
            DOM.aiStatus.textContent = list[Math.floor(Math.random() * list.length)];
        }

        function checkGameStatus() {
            if (state.pop <= 5 || state.cohesion <= 0) {
                state.gameEnded = true;
                addLog("💀 社会が崩壊しました。ゲームオーバー。", 'event');
                showResultModal();
            } else if (state.stage === 'state' && state.complexity >= 45) {
                state.gameEnded = true;
                addLog(getSystemMsg('clearMsg'), 'evolution');
                showResultModal();
            }
        }

        function computeKinshipAndSocialStructure() {
            let kinship = "";
            let socStruct = "";

            if (state.stage === 'band') {
                kinship = "一系・双系血縁グループ（単元的・非重層的親族網）";
                socStruct = "平等的バンド社会（極小規模・即時消費型）";
            } else if (state.stage === 'tribe') {
                kinship = "単系氏族（Clans）・リネージ（Lineages）構造";
                socStruct = "分節的部族社会（Segmentary Lineage Society）";
            } else if (state.stage === 'chiefdom') {
                kinship = "世襲的階層化親族（Ranked Lineages）・首長家系";
                socStruct = "首長制社会（Chiefdom / Redistribution Network）";
            } else {
                kinship = "親族結合の解体と階層・官僚制的社会関係への再編";
                socStruct = "初期国家・都市国家体系（State / Stratified Society）";
            }

            return { kinship, socStruct };
        }

        function showSocModal() {
            const t = I18N[state.lang] || I18N.ja;
            const db = SOC_DATABASE[state.mode] || SOC_DATABASE.agrarian;

            DOM.modalTitle.textContent = t.modalTitleSoc;
            let html = `<p style="margin-bottom:10px; font-size:0.8rem; color:#aaa;">モード: ${t.modes[state.mode]}</p>`;

            Object.keys(db).sort((a,b)=>a-b).forEach(compKey => {
                const item = db[compKey][state.lang] || db[compKey].ja;
                html += `
                    <div style="margin-bottom:12px; border-bottom:1px solid #333; padding-bottom:6px;">
                        <div style="color:#d4af37; font-weight:bold;">Complexity ${compKey}+ : ${item.system}</div>
                        <div style="font-size:0.8rem; color:#ccc; margin-top:2px;">${item.diff}</div>
                        <div style="font-size:0.75rem; color:#888; margin-top:2px;"><em>例: ${item.ex}</em></div>
                    </div>
                `;
            });

            DOM.modalBody.innerHTML = html;
            DOM.modal.style.display = 'flex';
        }

        function showHelpModal() {
            const t = I18N[state.lang] || I18N.ja;
            const { kinship, socStruct } = computeKinshipAndSocialStructure();

            DOM.modalTitle.textContent = t.modalTitleHelp;
            DOM.modalBody.innerHTML = `
                <div><strong>【贈与と支配の理論（モース/サーリンズ/モリス）】</strong></div>
                <div style="margin-top:4px; font-size:0.8rem; color:#ccc;">
                    ・<strong>贈与 (Gift):</strong> 単なる善意ではなく、相手に返礼義務（債務）を負わせる社会的行為です。過剰な贈与（ポトラッチ）は相手を屈服させ、支配力を生み出します。<br>
                    ・<strong>支配力 (Dominance):</strong> 社会的威信や強制力を表します。高すぎると格差が広がり反乱の原因になります。<br>
                    ・<strong>社会的複雑度 (Complexity):</strong> 人口、生産力、贈与蓄積によって上昇し、社会形態（バンド→部族→首長制→国家）を進化させます。
                </div>
                <div class="purple-section">
                    <div style="font-weight:bold;">現在の推測社会構造形態：</div>
                    <div>${kinship}</div>
                    <div>${socStruct}</div>
                </div>
            `;
            
            DOM.modal.style.display = 'flex';
        }

        function showResultModal() {
            const t = I18N[state.lang] || I18N.ja;
            const { kinship, socStruct } = computeKinshipAndSocialStructure();

            DOM.modalTitle.textContent = t.gameOver;
            DOM.modalBody.innerHTML = `
                <div><strong>${t.resultModal.lblMode}:</strong> ${t.modes[state.mode]}</div>
                <div><strong>${t.resultModal.lblStage}:</strong> ${t.stages[computeCurrentStageKey()]}</div>
                <div><strong>${t.resultModal.lblTurn}:</strong> ${state.turn}</div>
                <div><strong>${t.resultModal.lblGift}:</strong> ${state.giftCount}</div>
                <div><strong>${t.resultModal.lblDom}:</strong> ${Math.round(state.dominance)}</div>
                <div><strong>${t.resultModal.lblComp}:</strong> ${Math.round(state.complexity)}</div>
                <br>
                <div class="purple-section">
                    <div><strong>${t.resultModal.lblKinship}:</strong> ${kinship}</div>
                    <div><strong>${t.resultModal.lblSocStruct}:</strong> ${socStruct}</div>
                </div>
            `;
            DOM.modal.style.display = 'flex';
        }

        function hideModal() {
            DOM.modal.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
