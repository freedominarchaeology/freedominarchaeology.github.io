<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Gift War - The Social Dynamics of Giving & Evolution</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "MS Mincho", "ＭＳ 明朝", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #d4af37;
        }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, button {
            font-family: inherit;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
            touch-action: manipulation;
        }
        select:hover, button:hover {
            background: #3a3a3a;
            border-color: #d4af37;
        }
        button:disabled {
            background: #1a1a1a;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .status-panel {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .stat-box {
            background: #121212;
            padding: 6px 4px;
            border-radius: 4px;
            text-align: center;
            border-left: 3px solid #d4af37;
        }
        .stat-box.stage-box {
            border-left-color: #9b59b6;
        }
        .stat-title {
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .stat-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }
        .stat-bar {
            height: 4px;
            background: #333;
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: #d4af37;
            width: 0%;
            transition: width 0.3s ease;
        }
        .game-field {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            min-height: 180px;
        }
        .log-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 150px;
            max-height: 250px;
        }
        .panel-title {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 6px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
            touch-action: pan-y;
        }
        .log-content::-webkit-scrollbar {
            width: 5px;
        }
        .log-content::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 3px;
        }
        .log-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .log-entry {
            padding: 4px 8px;
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
            word-break: break-all;
        }
        .log-entry.event { border-left: 2px solid #e74c3c; }
        .log-entry.evolution { border-left: 2px solid #9b59b6; }
        .log-entry.action { border-left: 2px solid #2ecc71; }
        .log-entry.info { border-left: 2px solid #3498db; }
        .log-entry.warn { border-left: 2px solid #f39c12; }
        .ai-panel {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
        }
        .hand-area {
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            overflow-x: auto;
            padding: 5px 0 10px 0;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
        }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            width: 140px;
            height: 185px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .card:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: #d4af37;
            background: #333;
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #222;
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
            pointer-events: none;
        }
        .card-desc {
            font-size: 0.68rem;
            color: #bbb;
            line-height: 1.25;
            text-align: center;
            pointer-events: none;
        }
        .card-req {
            font-size: 0.6rem;
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 10px;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .modal-title {
            font-size: 1.1rem;
            color: #d4af37;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }
        .modal-body {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        .close-btn {
            background: #d4af37;
            color: #000;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            body {
                height: auto;
            }
            header {
                padding: 8px 10px;
            }
            h1 {
                font-size: 1.0rem;
            }
            .status-panel { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 6px;
                padding: 8px;
            }
            .stat-box {
                padding: 4px 2px;
            }
            .stat-title {
                font-size: 0.65rem;
            }
            .stat-value {
                font-size: 0.85rem;
            }
            .game-field { 
                grid-template-columns: 1fr; 
                gap: 8px;
            }
            .log-panel {
                max-height: 180px;
            }
            .ai-panel { 
                min-height: auto;
                gap: 8px;
            }
            .cards-container {
                justify-content: flex-start;
            }
            .card { 
                width: 120px; 
                height: 165px; 
                padding: 6px; 
            }
            .card-title { font-size: 0.75rem; }
            .card-desc { font-size: 0.62rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="app-title">GIFT WAR</h1>
        <div class="controls">
            <select id="mode-select">
                <option value="forager">狩猟採集社会</option>
                <option value="agrarian" selected>農耕社会</option>
            </select>
            <button id="btn-soc">参照 (Societies)</button>
            <button id="btn-help">HELP</button>
            <select id="lang-select">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="ko">한국語</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
    </header>

    <main>
        <section class="status-panel">
            <div class="stat-box stage-box">
                <div class="stat-title" id="lbl-stage">社会形態</div>
                <div class="stat-value" id="val-stage">バンド</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-stage" style="width: 25%; background:#9b59b6;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-turn">生存年数 (Turn)</div>
                <div class="stat-value" id="val-turn">1</div>
                <div class="stat-bar"><div class="stat-fill" style="width: 100%;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-giftcount">贈与累積回数</div>
                <div class="stat-value" id="val-giftcount">0</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-giftcount" style="width: 0%;"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-complexity">社会的複雑度</div>
                <div class="stat-value" id="val-complexity">10</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-complexity"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-inequality">格差インデックス</div>
                <div class="stat-value" id="val-inequality">10%</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-inequality"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-title" id="lbl-cohesion">社会的結束度</div>
                <div class="stat-value" id="val-cohesion">100</div>
                <div class="stat-bar"><div class="stat-fill" id="bar-cohesion"></div></div>
            </div>
        </section>

        <section class="game-field">
            <div class="log-panel">
                <div class="panel-title" id="lbl-log">社会履歴ログ</div>
                <div class="log-content" id="log-box"></div>
            </div>
            <div class="ai-panel">
                <div class="panel-title" id="lbl-ai">外部・他者勢力 (AI)</div>
                <div id="ai-status" style="font-size:0.8rem; color:#aaa; line-height:1.4;">
                    AI行動分析中...
                </div>
                <button id="btn-next" style="width: 100%; margin-top: 6px;">何もせず静観</button>
            </div>
        </section>

        <section class="hand-area">
            <div class="panel-title" id="lbl-hand">実行可能な戦略カード</div>
            <div class="cards-container" id="cards-box"></div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">理論解説</div>
            <div class="modal-body" id="modal-body"></div>
            <button class="close-btn" id="modal-close">閉じる</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const SOC_DATABASE = {
            forager: {
                10: {
                    ja: { system: "極小遊動バンド", diff: "血縁を中心とした15〜30人の完全平等集団。資源の所有概念はなく即時消費。", ex: "カラハリ・サン族（旧来の伝統的移動生活期）、ハザ族" },
                    en: { system: "Micro Mobile Band", diff: "Fully egalitarian group of 15–30 kin. No concept of resource ownership; immediate consumption.", ex: "Kalahari San (traditional mobile era), Hadza" },

                20: {

                    en: { system: "Semi-sedentary Tribe (Early)", diff: "Settlement near rich fishing/gathering spots. Emergence of personal tools and ornaments.", ex: "Early Jomon villages, California Native Americans" },

                25: {

                    ko: { system: "복합 수렵채집 군장국", diff: "세습 군장, 평민, 노예 계층화. 부의 과시와 재분배를 위한 대규모 의례(포트래치) 성립.", ex: "19세기 크와키우틀족, 하이다족 (포트래치 전성기)" },
                    fr: { system: "Chefferie complexe de chasseurs-cueilleurs", diff: "Chefs héréditaires, roturiers, esclaves. Rituel de redistribution massif (Potlatch).", ex: "Kwakiutl du XIXe siècle, Haida (apogée du Potlatch)" },
                    es: { system: "Jefatura compleja cazadora-recolectora", diff: "Jefes hereditarios, plebeyos, esclavos. Rituales masivos de redistribución (Potlatch).", ex: "Kwakiutl del siglo XIX, Haida (apogeo del Potlatch)" }

                40: {
