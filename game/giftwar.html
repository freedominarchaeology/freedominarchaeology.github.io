<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIFT WAR - Action & Economy</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a24;
            color: #e0e0e0;
            font-family: 'MS Mincho', 'ＭＳ 明朝', 'Sawarabi Mincho', serif;
            image-rendering: pixelated;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 4px double #8a785d;
            background-color: #2a2a38;
            padding: 10px 15px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: #f0c040;
            text-shadow: 2px 2px #000;
        }

        .lang-select, select, button {
            background: #1a1a24;
            color: #f0c040;
            border: 2px solid #8a785d;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: #2a2a38;
            border: 4px ridge #8a785d;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .panel-title {
            font-size: 1rem;
            color: #f0c040;
            border-bottom: 2px dashed #8a785d;
            padding-bottom: 4px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .stat-value {
            color: #ffffff;
            font-weight: bold;
        }

        .btn {
            background-color: #4a3b5c;
            color: #f0c040;
            border: 2px outset #8a785d;
            padding: 6px 10px;
            font-size: 0.85rem;
            text-align: center;
            user-select: none;
        }

        .btn:hover:not(:disabled) {
            background-color: #5c4a73;
        }

        .btn:active:not(:disabled) {
            border-style: inset;
            background-color: #382c47;
        }

        .btn:disabled {
            background-color: #2a2a30;
            color: #666666;
            border-color: #444444;
            cursor: not-allowed;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .log-box {
            height: 100px;
            background-color: #101018;
            border: 2px solid #5a4b3d;
            padding: 6px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .log-entry {
            margin-bottom: 2px;
            border-bottom: 1px dotted #333;
            min-height: 1.1em;
            word-break: break-all;
        }

        /* Action Combat Panel */
        #combatCanvas {
            width: 100%;
            height: 140px;
            background-color: #050508;
            border: 2px solid #8a785d;
            touch-action: none;
            cursor: crosshair;
        }

        .hp-bar-container {
            width: 100%;
            background-color: #333;
            height: 12px;
            border: 1px solid #666;
            margin-bottom: 4px;
        }

        .hp-bar {
            height: 100%;
            background-color: #a83232;
            width: 100%;
            transition: width 0.1s linear;
        }

        .hero-badge {
            color: #55ffff;
            font-weight: bold;
        }

        .status-boost {
            color: #55ff55;
        }
    </style>
</head>
<body>

    <header>
        <h1>GIFT WAR</h1>
        <select id="langSelect" class="lang-select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </header>

    <div class="main-container">
        <!-- Status & Equipment -->
        <div class="panel">
            <div class="panel-title" id="t-status">ステータス・装備</div>
            <div class="stat-row"><span id="t-class">階級:</span> <span id="valClass" class="stat-value">平民</span></div>
            <div class="stat-row"><span id="t-hero">称号:</span> <span id="valHero" class="stat-value">なし</span></div>
            <div class="stat-row"><span id="t-prestige">威信:</span> <span id="valPrestige" class="stat-value">0</span></div>
            <div class="stat-row"><span id="t-fame">名声:</span> <span id="valFame" class="stat-value">0</span></div>
            <div class="stat-row"><span id="t-valour">武勇:</span> <span id="valValour" class="stat-value">0</span></div>
            <div class="stat-row"><span id="t-gift-count">贈与実績:</span> <span id="valGiftCount" class="stat-value">0</span></div>
            <div class="stat-row"><span id="t-weapon">装備武具:</span> <span id="valWeapon" class="stat-value">素手 (ATK: 5)</span></div>
        </div>

        <!-- Potlatch & Strategy -->
        <div class="panel">
            <div class="panel-title" id="t-potlatch">贈与と対戦相手</div>
            <div class="stat-row">
                <span id="t-target">贈与対象:</span>
                <select id="targetSelect">
                    <option value="rivalA">ライバルA (威信:0)</option>
                    <option value="rivalB">ライバルB (威信:0)</option>
                </select>
            </div>
            <div class="stat-row">
                <span id="t-gift-type">贈与品ランク:</span>
                <select id="giftRankSelect">
                    <option value="0">初級品 (所有:0)</option>
                    <option value="1">中級品 (所有:0)</option>
                    <option value="2">高級品 (所有:0)</option>
                    <option value="3">特級品 (所有:0)</option>
                </select>
            </div>
            <button id="btnGiveGift" class="btn">選択相手に贈与を行う</button>
            <button id="btnReceiveGift" class="btn">返礼を受け取る (+バフ)</button>
            <div class="stat-row"><span id="t-decay">減少まで:</span> <span id="valTimer" class="stat-value">10s</span></div>
        </div>

        <!-- Action Combat Panel -->
        <div class="panel full-width">
            <div class="panel-title" id="t-combat">討伐 (タップ/スワイプで攻撃)</div>
            <div class="stat-row">
                <span id="valMonsterName" class="stat-value">道祖神の穢れモンスター</span>
                <span id="valMonsterHpText" class="stat-value">HP: 100/100</span>
            </div>
            <div class="hp-bar-container"><div id="valMonsterHpBar" class="hp-bar"></div></div>
            <canvas id="combatCanvas" width="800" height="200"></canvas>
        </div>

        <!-- Crafting & Taxes -->
        <div class="panel full-width">
            <div class="panel-title" id="t-craft">生産と税収</div>
            <div class="stat-row">
                <span id="valMaterials">素材: 皮革[0] 鉱石[0] 霊木[0] | 税収: 宝珠[0]</span>
            </div>
            <div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;">
                <button id="btnCollectTax" class="btn" style="flex: 1;">拠点から税を徴収</button>
                <button id="btnCraftGift" class="btn" style="flex: 1;">贈与品をクラフト</button>
            </div>
        </div>

        <!-- Class & Domain Expansion -->
        <div class="panel full-width">
            <div class="panel-title" id="t-governance">統治と階級</div>
            <div class="stat-row">
                <span id="t-domain">支配拠点:</span> <span id="valDomain" class="stat-value">なし</span>
            </div>
            <button id="btnClassUp" class="btn" style="margin-top: 4px;">階級昇格申請 (要:贈与数&威信)</button>
        </div>

        <!-- Log Panel -->
        <div class="panel full-width">
            <div class="panel-title" id="t-log">記録</div>
            <div id="logBox" class="log-box"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const MAX_LOGS = 12;

            const I18N = {
                ja: {
                    status: "ステータス・装備", class: "階級:", hero: "称号:", prestige: "威信:", fame: "名声:",
                    valour: "武勇:", giftCount: "贈与実績:", weapon: "装備武具:", potlatch: "贈与と対戦相手",
                    target: "贈与対象:", giftType: "贈与品ランク:", btnGive: "選択相手に贈与を行う",
                    btnReceive: "返礼を受け取る (+バフ)", decay: "減少まで:", combat: "討伐 (タップ/スワイプで攻撃)",
                    craft: "生産と税収", governance: "統治と階級", domain: "支配拠点:", btnClassUp: "階級昇格申請",
                    btnCollectTax: "拠点から税を徴収", btnCraftGift: "贈与品をクラフト", logTitle: "記録", none: "なし",
                    heroTitle: "伝説の英雄", classes: ["平民", "長", "公", "王", "大君", "皇帝"],
                    domains: ["なし", "村", "町", "国", "大国", "帝国"],
                    giftRanks: ["初級品", "中級品", "高級品", "特級品"],
                    msgHit: "攻撃ヒット! ダメージ: ",
                    msgKill: "モンスターを撃破! 素材を獲得。",
                    msgBossKill: "ボス撃破! 伝説の武具を獲得した！",
                    msgGiftSuccess: "へ贈与を行った。威信・名声が上昇！",
                    msgNoGift: "指定したランクの贈与品を持っていません。",
                    msgTaxCollected: "拠点から税（宝珠）を徴収しました。",
                    msgNoTaxDomain: "税を徴収するには「長」以上の階級と拠点が必要です。",
                    msgCraftSuccess: "素材を組み合わせて贈与品を作成しました。",
                    msgCraftFail: "クラフトに必要な素材が不足しています。",
                    msgDecay: "贈与を怠ったため、威信と名声が衰退した...",
                    msgClassUp: "階級が昇格しました: ",
                    msgClassFail: "昇格要件（威信・名声・贈与実績）を満たしていません。"
                },
                en: {
                    status: "Status & Equipment", class: "Class:", hero: "Title:", prestige: "Prestige:", fame: "Fame:",
                    valour: "Valour:", giftCount: "Gifts Sent:", weapon: "Weapon:", potlatch: "Gifting & Rivals",
                    target: "Target:", giftType: "Gift Rank:", btnGive: "Send Gift to Target",
                    btnReceive: "Receive Return Gift", decay: "Decay In:", combat: "Combat (Tap/Swipe to Attack)",
                    craft: "Crafting & Taxes", governance: "Governance", domain: "Territory:", btnClassUp: "Apply for Promotion",
                    btnCollectTax: "Collect Taxes", btnCraftGift: "Craft Gift Goods", logTitle: "Log", none: "None",
                    heroTitle: "Legendary Hero", classes: ["Commoner", "Chief", "Duke", "King", "Overlord", "Emperor"],
                    domains: ["None", "Village", "Town", "Kingdom", "Great Nation", "Empire"],
                    giftRanks: ["Basic", "Medium", "High", "Special"],
                    msgHit: "Hit! Damage: ",
                    msgKill: "Monster defeated! Materials dropped.",
                    msgBossKill: "BOSS Defeated! Legendary weapon acquired!",
                    msgGiftSuccess: "Sent gift. Prestige & Fame increased!",
                    msgNoGift: "You do not have a gift of the selected rank.",
                    msgTaxCollected: "Collected tax gems from your domain.",
                    msgNoTaxDomain: "Requires 'Chief' rank or higher to collect taxes.",
                    msgCraftSuccess: "Crafted a new gift from materials.",
                    msgCraftFail: "Insufficient materials for crafting.",
                    msgDecay: "Failure to give gifts caused prestige to decay...",
                    msgClassUp: "Class Promoted: ",
                    msgClassFail: "Promotion requirements not met."
                }
            };

            let currentLang = 'ja';
            let timerId = null;

            // Weapons Definition
            const WEAPONS = [
                { name: "素手", atk: 5 },
                { name: "鉄の剣", atk: 15 },
                { name: "名工の刀", atk: 35 },
                { name: "神殺しの槍 (伝説)", atk: 80 }
            ];

            // Game State
            const state = {
                prestige: 0,
                fame: 0,
                valour: 0,
                giftCount: 0,
                classLevel: 0,
                weaponIdx: 0,
                isHero: false,
                boostTimer: 0,
                decayTimer: 10,
                // Materials
                leather: 0,
                ore: 0,
                wood: 0,
                gems: 0,
                // Inventory of gifts [Basic, Medium, High, Special]
                gifts: [2, 0, 0, 0],
                // Rivals
                rivals: {
                    rivalA: { name: "ライバルA", prestige: 5 },
                    rivalB: { name: "ライバルB", prestige: 10 }
                },
                // Current Monster
                monster: {
                    name: "穢れ鬼",
                    hp: 50,
                    maxHp: 50,
                    isBoss: false
                }
            };

            // Memory-Optimized Log Buffer
            const logBuffer = new Array(MAX_LOGS).fill("");
            const logNodes = [];

            // DOM Cache
            const el = {
                langSelect: document.getElementById('langSelect'),
                targetSelect: document.getElementById('targetSelect'),
                giftRankSelect: document.getElementById('giftRankSelect'),
                logBox: document.getElementById('logBox'),
                canvas: document.getElementById('combatCanvas'),
                valClass: document.getElementById('valClass'),
                valHero: document.getElementById('valHero'),
                valPrestige: document.getElementById('valPrestige'),
                valFame: document.getElementById('valFame'),
                valValour: document.getElementById('valValour'),
                valGiftCount: document.getElementById('valGiftCount'),
                valWeapon: document.getElementById('valWeapon'),
                valTimer: document.getElementById('valTimer'),
                valMonsterName: document.getElementById('valMonsterName'),
                valMonsterHpText: document.getElementById('valMonsterHpText'),
                valMonsterHpBar: document.getElementById('valMonsterHpBar'),
                valMaterials: document.getElementById('valMaterials'),
                valDomain: document.getElementById('valDomain'),
                btnGiveGift: document.getElementById('btnGiveGift'),
                btnReceiveGift: document.getElementById('btnReceiveGift'),
                btnCollectTax: document.getElementById('btnCollectTax'),
                btnCraftGift: document.getElementById('btnCraftGift'),
                btnClassUp: document.getElementById('btnClassUp')
            };

            const ctx = el.canvas.getContext('2d');

            function setupLogDOM() {
                el.logBox.textContent = '';
                for (let i = 0; i < MAX_LOGS; i++) {
                    const node = document.createElement('div');
                    node.className = 'log-entry';
                    el.logBox.appendChild(node);
                    logNodes.push(node);
                }
            }

            function addLog(msgKey, extra = '') {
                const dict = I18N[currentLang] || I18N.ja;
                const msg = (dict[msgKey] || msgKey) + extra;
                logBuffer.pop();
                logBuffer.unshift(msg);
                for (let i = 0; i < MAX_LOGS; i++) {
                    logNodes[i].textContent = logBuffer[i] ? `> ${logBuffer[i]}` : '';
                }
            }

            function updateUI() {
                const dict = I18N[currentLang] || I18N.ja;

                el.valClass.textContent = dict.classes[state.classLevel];
                el.valHero.textContent = state.isHero ? dict.heroTitle : dict.none;
                el.valPrestige.textContent = state.prestige;
                el.valFame.textContent = state.fame;
                el.valValour.textContent = state.valour;
                el.valGiftCount.textContent = state.giftCount;
                
                const w = WEAPONS[state.weaponIdx];
                el.valWeapon.textContent = `${w.name} (ATK:${w.atk})`;
                
                el.valTimer.textContent = `${state.decayTimer}s`;
                el.valDomain.textContent = dict.domains[state.classLevel];

                // Materials
                el.valMaterials.textContent = `皮革[${state.leather}] 鉱石[${state.ore}] 霊木[${state.wood}] | 税収: 宝珠[${state.gems}]`;

                // Select options
                el.targetSelect.options[0].text = `${state.rivals.rivalA.name} (威信:${state.rivals.rivalA.prestige})`;
                el.targetSelect.options[1].text = `${state.rivals.rivalB.name} (威信:${state.rivals.rivalB.prestige})`;

                for (let i = 0; i < 4; i++) {
                    el.giftRankSelect.options[i].text = `${dict.giftRanks[i]} (所有:${state.gifts[i]})`;
                }

                // Monster HP
                el.valMonsterName.textContent = state.monster.isBoss ? `【BOSS】${state.monster.name}` : state.monster.name;
                el.valMonsterHpText.textContent = `HP: ${state.monster.hp}/${state.monster.maxHp}`;
                const pct = Math.max(0, (state.monster.hp / state.monster.maxHp) * 100);
                el.valMonsterHpBar.style.width = `${pct}%`;

                renderCanvas();
            }

            // Canvas Render for Action Combat
            function renderCanvas() {
                ctx.clearRect(0, 0, el.canvas.width, el.canvas.height);
                
                // Background Grid
                ctx.strokeStyle = "#2a2a38";
                ctx.lineWidth = 2;
                for (let x = 0; x < el.canvas.width; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, el.canvas.height); ctx.stroke();
                }

                // Draw Monster (Retro Pixel Square)
                const cx = el.canvas.width / 2;
                const cy = el.canvas.height / 2;
                const size = state.monster.isBoss ? 70 : 40;

                ctx.fillStyle = state.monster.isBoss ? "#ff3333" : "#44bb55";
                ctx.fillRect(cx - size/2, cy - size/2, size, size);
                ctx.strokeStyle = "#ffffff";
                ctx.strokeRect(cx - size/2, cy - size/2, size, size);

                // Monster Eyes
                ctx.fillStyle = "#000000";
                ctx.fillRect(cx - size/4, cy - size/4, size/5, size/5);
                ctx.fillRect(cx + size/8, cy - size/4, size/5, size/5);
            }

            // Action Input (Tap / Swipe Detection)
            let touchStartX = 0, touchStartY = 0;

            function handleAttack(isSwipe = false) {
                const w = WEAPONS[state.weaponIdx];
                let dmg = w.atk * (state.boostTimer > 0 ? 2 : 1);
                if (isSwipe) dmg = Math.floor(dmg * 1.5); // Swipe Bonus

                state.monster.hp -= dmg;
                addLog('msgHit', `${dmg} ${isSwipe ? '(スワイプ波及!)' : ''}`);

                if (state.monster.hp <= 0) {
                    // Defeated
                    state.valour += state.monster.isBoss ? 50 : 10;
                    state.fame += state.monster.isBoss ? 30 : 5;

                    if (state.monster.isBoss) {
                        if (state.weaponIdx < WEAPONS.length - 1) {
                            state.weaponIdx = WEAPONS.length - 1; // Drop Legendary Weapon
                            addLog('msgBossKill');
                        }
                    } else {
                        // Drop Materials
                        state.leather += Math.floor(Math.random() * 2) + 1;
                        state.ore += Math.floor(Math.random() * 2);
                        state.wood += Math.floor(Math.random() * 2);
                        addLog('msgKill');
                    }

                    // Respawn Monster
                    const spawnBoss = Math.random() < 0.2 || state.valour > 80 && state.weaponIdx < 3;
                    state.monster.isBoss = spawnBoss;
                    state.monster.name = spawnBoss ? "大陰摩羅鬼 (BOSS)" : "穢れ妖怪";
                    state.monster.maxHp = spawnBoss ? 250 : 60;
                    state.monster.hp = state.monster.maxHp;
                }
                updateUI();
            }

            el.canvas.addEventListener('pointerdown', (e) => {
                touchStartX = e.clientX;
                touchStartY = e.clientY;
            });

            el.canvas.addEventListener('pointerup', (e) => {
                const dx = e.clientX - touchStartX;
                const dy = e.clientY - touchStartY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 30) {
                    handleAttack(true); // Swipe
                } else {
                    handleAttack(false); // Tap
                }
            });

            // Gifting System (PLOS Complex Systems Paper Reference)
            function giveGift() {
                const rank = parseInt(el.giftRankSelect.value, 10);
                if (state.gifts[rank] <= 0) {
                    addLog('msgNoGift');
                    return;
                }

                state.gifts[rank]--;
                state.giftCount++;
                state.decayTimer = 10;

                const targetKey = el.targetSelect.value;
                const target = state.rivals[targetKey];

                // Rank Multipliers for Prestige
                const prestigeGain = (rank + 1) * 15;
                const fameGain = (rank + 1) * 10;

                state.prestige += prestigeGain;
                state.fame += fameGain;

                // Competitive dynamics: Target receives gift & gains slight prestige, but donor's relative gain is higher
                target.prestige += Math.floor(prestigeGain * 0.3);

                addLog('msgGiftSuccess', ` [${target.name}]`);
                updateUI();
            }

            function craftGift() {
                // Costs based on Materials
                if (state.leather >= 2 && state.wood >= 1) {
                    state.leather -= 2;
                    state.wood -= 1;
                    state.gifts[0]++; // Basic
                    addLog('msgCraftSuccess');
                } else if (state.gems >= 1 && state.ore >= 2) {
                    state.gems -= 1;
                    state.ore -= 2;
                    state.gifts[1]++; // Medium
                    addLog('msgCraftSuccess');
                } else {
                    addLog('msgCraftFail');
                }
                updateUI();
            }

            function collectTax() {
                if (state.classLevel < 1) {
                    addLog('msgNoTaxDomain');
                    return;
                }
                const amount = state.classLevel * 2;
                state.gems += amount;
                addLog('msgTaxCollected', ` (+${amount})`);
                updateUI();
            }

            function applyClassUp() {
                const dict = I18N[currentLang] || I18N.ja;
                if (state.classLevel >= 5) return;

                // Exponentially scaling requirements based on paper
                const reqGifts = (state.classLevel + 1) * 5;
                const reqPrestige = Math.pow(state.classLevel + 1, 2) * 25;

                if (state.giftCount >= reqGifts && state.prestige >= reqPrestige) {
                    state.classLevel++;
                    addLog('msgClassUp', dict.classes[state.classLevel]);
                } else {
                    addLog('msgClassFail');
                }
                updateUI();
            }

            // Timer Loop
            function tick() {
                if (state.boostTimer > 0) state.boostTimer--;

                state.decayTimer--;
                if (state.decayTimer <= 0) {
                    state.prestige = Math.max(0, state.prestige - 8);
                    state.fame = Math.max(0, state.fame - 4);
                    state.decayTimer = 10;
                    addLog('msgDecay');
                }

                updateUI();
            }

            function init() {
                setupLogDOM();

                el.langSelect.addEventListener('change', (e) => {
                    currentLang = e.target.value;
                    updateUI();
                });

                el.btnGiveGift.addEventListener('click', giveGift);
                el.btnReceiveGift.addEventListener('click', () => {
                    state.boostTimer = 15;
                    updateUI();
                });
                el.btnCollectTax.addEventListener('click', collectTax);
                el.btnCraftGift.addEventListener('click', craftGift);
                el.btnClassUp.addEventListener('click', applyClassUp);

                if (timerId) clearInterval(timerId);
                timerId = setInterval(tick, 1000);

                window.addEventListener('beforeunload', () => {
                    if (timerId) clearInterval(timerId);
                });

                updateUI();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
