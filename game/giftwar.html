<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GIFT WAR - Stickman Action & Strategy</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0d11;
            color: #e0e0e0;
            font-family: 'MS Mincho', 'ＭＳ 明朝', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 3px double #8a785d;
            background-color: #1f1f28;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.1rem;
            color: #f0c040;
            text-shadow: 2px 2px #000;
        }

        select, button {
            background: #141419;
            color: #f0c040;
            border: 2px solid #8a785d;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: #1f1f28;
            border: 3px ridge #8a785d;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .panel-title {
            font-size: 0.9rem;
            color: #f0c040;
            border-bottom: 2px dashed #8a785d;
            padding-bottom: 3px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .stat-value {
            color: #ffffff;
            font-weight: bold;
        }

        .btn {
            background-color: #3b2d4a;
            color: #f0c040;
            border: 2px outset #8a785d;
            padding: 5px 8px;
            font-size: 0.8rem;
            text-align: center;
        }

        .btn:hover:not(:disabled) {
            background-color: #4c3a5e;
        }

        .btn:active:not(:disabled) {
            border-style: inset;
            background-color: #281e33;
        }

        .btn:disabled {
            background-color: #22222a;
            color: #555555;
            border-color: #444444;
            cursor: not-allowed;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .log-box {
            height: 80px;
            background-color: #08080c;
            border: 2px solid #5a4b3d;
            padding: 4px;
            overflow-y: auto;
            font-size: 0.75rem;
            line-height: 1.3;
        }

        .log-entry {
            margin-bottom: 2px;
            border-bottom: 1px dotted #222;
            min-height: 1.1em;
            word-break: break-all;
        }

        /* Action Combat Canvas Area */
        #canvasContainer {
            position: relative;
            width: 100%;
            height: 200px;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: #141419;
            border: 2px solid #8a785d;
            touch-action: none;
        }

        /* Virtual Controller Overlay */
        .controls-overlay {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            gap: 8px;
        }

        .control-group {
            display: flex;
            gap: 6px;
        }

        .ctrl-btn {
            background: #2a2a35;
            border: 2px solid #8a785d;
            color: #fff;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: #4a4a5e;
        }

        .attack-btn {
            background: #8b0000;
            border-color: #e74c3c;
            color: #ffcccc;
        }

        .attack-btn:active {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <header>
        <h1>GIFT WAR - Stickman Action</h1>
        <select id="langSelect">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </header>

    <div class="main-container">
        <!-- Status & Equipment -->
        <div class="panel">
            <div class="panel-title">ステータス・装備</div>
            <div class="stat-row"><span>階級:</span> <span id="valClass" class="stat-value">平民</span></div>
            <div class="stat-row"><span>称号:</span> <span id="valHero" class="stat-value">なし</span></div>
            <div class="stat-row"><span>威信:</span> <span id="valPrestige" class="stat-value">0</span></div>
            <div class="stat-row"><span>名声:</span> <span id="valFame" class="stat-value">0</span></div>
            <div class="stat-row"><span>武勇:</span> <span id="valValour" class="stat-value">0</span></div>
            <div class="stat-row"><span>累計贈与数:</span> <span id="valGiftCount" class="stat-value">0</span></div>
            <div class="stat-row"><span>装備:</span> <span id="valWeapon" class="stat-value">木刀 (ATK:8)</span></div>
        </div>

        <!-- Strategy & Potlatch -->
        <div class="panel">
            <div class="panel-title">贈与と外交対戦</div>
            <div class="stat-row">
                <span>贈与相手:</span>
                <select id="targetSelect">
                    <option value="rivalA">ライバルA</option>
                    <option value="rivalB">ライバルB</option>
                </select>
            </div>
            <div class="stat-row">
                <span>贈与品:</span>
                <select id="giftRankSelect">
                    <option value="0">初級品</option>
                    <option value="1">中級品</option>
                    <option value="2">高級品</option>
                    <option value="3">特級品</option>
                </select>
            </div>
            <button id="btnGiveGift" class="btn">選択相手に贈与を行う</button>
            <div class="stat-row"><span>威信減衰まで:</span> <span id="valTimer" class="stat-value">10s</span></div>
        </div>

        <!-- Action Combat Panel -->
        <div class="panel full-width">
            <div class="panel-title">棒人間アクション（間合いを詰めて斬撃）</div>
            <div class="stat-row">
                <span id="valMonsterName" class="stat-value">モンスター</span>
                <span id="valMonsterHpText" class="stat-value">HP: 100/100</span>
            </div>
            <div id="canvasContainer">
                <canvas id="gameCanvas"></canvas>
            </div>
            <!-- Controller for Mobile & Quick Access -->
            <div class="controls-overlay">
                <div class="control-group">
                    <button class="ctrl-btn" id="btnLeft">◀ 左</button>
                    <button class="ctrl-btn" id="btnRight">右 ▶</button>
                    <button class="ctrl-btn" id="btnJump">▲ 飛</button>
                </div>
                <div class="control-group">
                    <button class="ctrl-btn attack-btn" id="btnAttack">⚔️ 斬撃</button>
                </div>
            </div>
        </div>

        <!-- Tasks, Crafting & Taxes -->
        <div class="panel full-width">
            <div class="panel-title">タスク・クラフト・税収</div>
            <div class="stat-row">
                <span id="valMaterials">素材: 皮革[0] 鉱石[0] 霊木[0] | 税収: 宝珠[0]</span>
            </div>
            <div class="stat-row" style="margin-top: 3px;">
                <span id="valTaskStatus">外交タスク: 依頼未達成</span>
            </div>
            <div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;">
                <button id="btnCompleteTask" class="btn" style="flex: 1;">外交タスク達成</button>
                <button id="btnCraftGift" class="btn" style="flex: 1;">贈与品クラフト</button>
                <button id="btnCollectTax" class="btn" style="flex: 1;">税を徴収する</button>
            </div>
        </div>

        <!-- Class Upgrade -->
        <div class="panel full-width">
            <div class="panel-title">統治と階級昇格</div>
            <div class="stat-row">
                <span>支配領域:</span> <span id="valDomain" class="stat-value">なし</span>
            </div>
            <div class="stat-row">
                <span id="valReqs">昇格要件: ---</span>
            </div>
            <button id="btnClassUp" class="btn" style="margin-top: 4px;">階級昇格申請</button>
        </div>

        <!-- Log Panel -->
        <div class="panel full-width">
            <div class="panel-title">記録</div>
            <div id="logBox" class="log-box"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const MAX_LOGS = 8;
            const I18N = {
                ja: {
                    classes: ["平民", "長", "公", "王", "大君", "皇帝"],
                    domains: ["なし", "村", "町", "国", "大国", "帝国"],
                    heroTitle: "伝説の英雄", none: "なし",
                    giftRanks: ["初級品", "中級品", "高級品", "特級品"],
                    msgHit: "斬撃ヒット! ダメージ: ",
                    msgKill: "モンスター討伐! 素材を入手。",
                    msgBossKill: "BOSS撃伐! 伝説の神槍「神殺しの槍」を獲得！",
                    msgGiftSuccess: "へ贈与完了。威信と名声上昇！",
                    msgNoGift: "贈与品が不足しています。",
                    msgNoTask: "先に外交タスク（素材供給）を達成してください。",
                    msgTaskComplete: "外交タスク完了。贈与が承認されました。",
                    msgCraftSuccess: "素材を組み合わせて贈与品を作成しました。",
                    msgCraftFail: "クラフト素材が足されません。",
                    msgTaxCollected: "拠点から税（宝珠）を徴収しました。",
                    msgNoTaxDomain: "税収には「長」以上の階級が必要です。",
                    msgDecay: "贈与猶予切れにより威信と名声が減衰...",
                    msgClassUp: "階級昇格: ",
                    msgClassFail: "昇格要件を満たしていません。"
                },
                en: {
                    classes: ["Commoner", "Chief", "Duke", "King", "Overlord", "Emperor"],
                    domains: ["None", "Village", "Town", "Kingdom", "Great Empire", "Holy Empire"],
                    heroTitle: "Legendary Hero", none: "None",
                    giftRanks: ["Basic", "Medium", "High", "Special"],
                    msgHit: "Slash Hit! Damage: ",
                    msgKill: "Monster defeated! Materials gained.",
                    msgBossKill: "BOSS Defeated! Unlocked Legendary Spear!",
                    msgGiftSuccess: "Gift delivered. Prestige & Fame raised!",
                    msgNoGift: "Insufficient gifts.",
                    msgNoTask: "Diplomatic task required first.",
                    msgTaskComplete: "Diplomatic task done. Gifting authorized.",
                    msgCraftSuccess: "Crafted gift items.",
                    msgCraftFail: "Missing craft materials.",
                    msgTaxCollected: "Collected tax gems.",
                    msgNoTaxDomain: "Requires Chief rank to collect tax.",
                    msgDecay: "Delay caused prestige decay...",
                    msgClassUp: "Class Promoted: ",
                    msgClassFail: "Requirements not met."
                }
            };

            let currentLang = 'ja';
            let timerId = null;

            const WEAPONS = [
                { name: "木刀", atk: 12, range: 45, color: "#2ecc71" },
                { name: "鉄の剣", atk: 25, range: 55, color: "#f1c40f" },
                { name: "名工の刀", atk: 50, range: 65, color: "#3498db" },
                { name: "神殺しの槍", atk: 120, range: 120, color: "#9b59b6" }
            ];

            const state = {
                prestige: 0, fame: 0, valour: 0, giftCount: 0, classLevel: 0,
                weaponIdx: 0, isHero: false, decayTimer: 10, taskCompleted: false,
                leather: 0, ore: 0, wood: 0, gems: 0, gifts: [1, 0, 0, 0],
                rivals: {
                    rivalA: { name: "ライバルA", prestige: 10 },
                    rivalB: { name: "ライバルB", prestige: 25 }
                },
                monster: { name: "穢れ鬼", hp: 80, maxHp: 80, isBoss: false }
            };

            // Player Physics State
            const player = {
                x: 60, y: 0, vx: 0, vy: 0,
                isGrounded: false, isAttacking: 0,
                facing: 1
            };

            // Monster State
            const monster = {
                x: 240, y: 0, vx: 0,
                dir: -1, hitTimer: 0
            };

            // Slash Effects
            const slashes = [];

            // Memory-Optimized Log System
            const logBuffer = new Array(MAX_LOGS).fill("");
            const logNodes = [];

            let canvas, ctx;
            const keys = { left: false, right: false, jump: false, attack: false };

            function setupLogDOM() {
                const box = document.getElementById('logBox');
                box.textContent = '';
                for (let i = 0; i < MAX_LOGS; i++) {
                    const node = document.createElement('div');
                    node.className = 'log-entry';
                    box.appendChild(node);
                    logNodes.push(node);
                }
            }

            function addLog(msgKey, extra = '') {
                const dict = I18N[currentLang] || I18N.ja;
                const msg = (dict[msgKey] || msgKey) + extra;
                logBuffer.pop();
                logBuffer.unshift(msg);
                for (let i = 0; i < MAX_LOGS; i++) {
                    logNodes[i].textContent = logBuffer[i] ? `> ${logBuffer[i]}` : '';
                }
            }

            function updateUI() {
                const dict = I18N[currentLang] || I18N.ja;
                if (state.classLevel >= 3 || state.valour >= 200) state.isHero = true;

                document.getElementById('valClass').textContent = dict.classes[state.classLevel];
                document.getElementById('valHero').textContent = state.isHero ? dict.heroTitle : dict.none;
                document.getElementById('valPrestige').textContent = state.prestige;
                document.getElementById('valFame').textContent = state.fame;
                document.getElementById('valValour').textContent = state.valour;
                document.getElementById('valGiftCount').textContent = state.giftCount;

                const w = WEAPONS[state.weaponIdx];
                const wEl = document.getElementById('valWeapon');
                wEl.textContent = `${w.name} (ATK:${w.atk})`;
                wEl.style.color = w.color;

                document.getElementById('valTimer').textContent = `${state.decayTimer}s`;
                document.getElementById('valDomain').textContent = dict.domains[state.classLevel];

                document.getElementById('valMaterials').textContent = `皮革[${state.leather}] 鉱石[${state.ore}] 霊木[${state.wood}] | 税収: 宝珠[${state.gems}]`;
                document.getElementById('valTaskStatus').textContent = state.taskCompleted ? "外交タスク: 達成済 (贈与可能)" : "外交タスク: 依頼未達成 (要:素材供給)";

                const reqGifts = Math.pow(state.classLevel + 1, 2) * 4; 
                const reqPrestige = Math.pow(state.classLevel + 1, 3) * 25;
                document.getElementById('valReqs').textContent = `必要贈与数:${reqGifts} (現在:${state.giftCount}) / 必要威信:${reqPrestige} (現在:${state.prestige})`;

                const targetSel = document.getElementById('targetSelect');
                targetSel.options[0].text = `${state.rivals.rivalA.name} (威信:${state.rivals.rivalA.prestige})`;
                targetSel.options[1].text = `${state.rivals.rivalB.name} (威信:${state.rivals.rivalB.prestige})`;

                const rankSel = document.getElementById('giftRankSelect');
                for (let i = 0; i < 4; i++) {
                    rankSel.options[i].text = `${dict.giftRanks[i]} (所持:${state.gifts[i]})`;
                }

                document.getElementById('valMonsterName').textContent = state.monster.isBoss ? `【BOSS】${state.monster.name}` : state.monster.name;
                document.getElementById('valMonsterHpText').textContent = `HP: ${Math.max(0, state.monster.hp)}/${state.monster.maxHp}`;
            }

            function attack() {
                if (player.isAttacking > 0) return;
                player.isAttacking = 12; // Attack duration frames

                const w = WEAPONS[state.weaponIdx];
                const attackX = player.x + player.facing * (w.range / 2);
                
                // Add Slash Graphic
                slashes.push({
                    x: attackX,
                    y: player.y - 20,
                    radius: w.range / 1.5,
                    color: w.color,
                    life: 8
                });

                // Check Hit Box
                const dist = Math.abs((player.x + player.facing * 30) - monster.x);
                if (dist < w.range && Math.abs(player.y - monster.y) < 40) {
                    const dmg = w.atk + Math.floor(Math.random() * 5);
                    state.monster.hp -= dmg;
                    monster.hitTimer = 6;
                    monster.vx = player.facing * 6; // Knockback
                    addLog('msgHit', `${dmg}`);

                    if (state.monster.hp <= 0) {
                        state.valour += state.monster.isBoss ? 100 : 15;
                        state.fame += state.monster.isBoss ? 60 : 8;

                        if (state.monster.isBoss) {
                            if (state.weaponIdx < WEAPONS.length - 1) {
                                state.weaponIdx = WEAPONS.length - 1;
                                addLog('msgBossKill');
                            }
                        } else {
                            state.leather += Math.floor(Math.random() * 2) + 1;
                            state.ore += Math.floor(Math.random() * 2) + 1;
                            state.wood += Math.floor(Math.random() * 2);
                            addLog('msgKill');
                        }

                        // Respawn Monster
                        const spawnBoss = Math.random() < 0.25 || (state.valour > 100 && state.weaponIdx < 3);
                        state.monster.isBoss = spawnBoss;
                        state.monster.name = spawnBoss ? "大陰摩羅鬼 (BOSS)" : "穢れ鬼";
                        state.monster.maxHp = spawnBoss ? 250 : 80;
                        state.monster.hp = state.monster.maxHp;
                        monster.x = canvas.width - 60;
                    }
                    updateUI();
                }
            }

            function updatePhysics() {
                const groundY = canvas.height - 25;

                // Player Movement
                if (keys.left) { player.vx = -4; player.facing = -1; }
                else if (keys.right) { player.vx = 4; player.facing = 1; }
                else { player.vx *= 0.7; }

                if (keys.jump && player.isGrounded) {
                    player.vy = -9;
                    player.isGrounded = false;
                }

                if (keys.attack) {
                    attack();
                    keys.attack = false;
                }

                player.vy += 0.5; // Gravity
                player.x += player.vx;
                player.y += player.vy;

                if (player.y >= groundY) {
                    player.y = groundY;
                    player.vy = 0;
                    player.isGrounded = true;
                }

                // Screen Bounds
                if (player.x < 20) player.x = 20;
                if (player.x > canvas.width - 20) player.x = canvas.width - 20;

                if (player.isAttacking > 0) player.isAttacking--;

                // Monster AI & Physics
                monster.x += monster.vx;
                monster.vx *= 0.8;
                monster.y = groundY;

                // Simple Patrol / Face player
                if (Math.abs(monster.vx) < 0.5) {
                    monster.dir = player.x < monster.x ? -1 : 1;
                    monster.x += monster.dir * (state.monster.isBoss ? 0.8 : 0.5);
                }

                if (monster.hitTimer > 0) monster.hitTimer--;
            }

            function render() {
                ctx.fillStyle = '#141419';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const groundY = canvas.height - 25;

                // Ground Line
                ctx.strokeStyle = '#8a785d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(canvas.width, groundY);
                ctx.stroke();

                // Draw Stickman Hero
                drawStickman(player.x, player.y, WEAPONS[state.weaponIdx].color, player.facing, player.isAttacking > 0);

                // Draw Original Monster (Round + Eyes/Mouth)
                drawMonster(monster.x, monster.y, state.monster.isBoss);

                // Draw Slashes
                for (let i = slashes.length - 1; i >= 0; i--) {
                    const s = slashes[i];
                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, -Math.PI / 3, Math.PI / 3);
                    ctx.stroke();
                    s.life--;
                    if (s.life <= 0) slashes.splice(i, 1);
                }
            }

            function drawStickman(x, y, color, facing, isAttacking) {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 2.5;

                // Head
                ctx.beginPath();
                ctx.arc(x, y - 35, 7, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.beginPath();
                ctx.moveTo(x, y - 28);
                ctx.lineTo(x, y - 12);

                // Legs
                ctx.lineTo(x - 8 * facing, y);
                ctx.moveTo(x, y - 12);
                ctx.lineTo(x + 8 * facing, y);

                // Arms & Weapon Attack Motion
                ctx.moveTo(x, y - 22);
                if (isAttacking) {
                    ctx.lineTo(x + 18 * facing, y - 25);
                    ctx.stroke();
                    // Weapon Blade
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x + 10 * facing, y - 25);
                    ctx.lineTo(x + 35 * facing, y - 20);
                } else {
                    ctx.lineTo(x + 10 * facing, y - 15);
                    ctx.stroke();
                    // Guard / Idle Weapon
                    ctx.strokeStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(x + 8 * facing, y - 15);
                    ctx.lineTo(x + 18 * facing, y - 30);
                }
                ctx.stroke();
            }

            // Restore Previous Monster Appearance (Classic Sphere/Face Design)
            function drawMonster(x, y, isBoss) {
                const radius = isBoss ? 26 : 18;
                const mY = y - radius;

                if (monster.hitTimer > 0) {
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = isBoss ? '#c0392b' : '#27ae60';
                }

                // Body (Sphere)
                ctx.beginPath();
                ctx.arc(x, mY, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(x - radius * 0.3, mY - 3, isBoss ? 4 : 2.5, 0, Math.PI * 2);
                ctx.arc(x + radius * 0.3, mY - 3, isBoss ? 4 : 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Mouth / Fangs
                ctx.strokeStyle = '#000';
                ctx.beginPath();
                if (isBoss) {
                    ctx.moveTo(x - 10, mY + 10);
                    ctx.lineTo(x, mY + 4);
                    ctx.lineTo(x + 10, mY + 10);
                } else {
                    ctx.arc(x, mY + 5, 6, 0, Math.PI);
                }
                ctx.stroke();
            }

            function gameLoop() {
                updatePhysics();
                render();
                requestAnimationFrame(gameLoop);
            }

            // Tasks & Potlatch Gifting Systems
            function completeTask() {
                if (state.leather >= 2 && state.ore >= 2) {
                    state.leather -= 2;
                    state.ore -= 2;
                    state.taskCompleted = true;
                    addLog('msgTaskComplete');
                } else {
                    addLog('msgCraftFail');
                }
                updateUI();
            }

            function giveGift() {
                if (!state.taskCompleted) {
                    addLog('msgNoTask');
                    return;
                }
                const rank = parseInt(document.getElementById('giftRankSelect').value, 10);
                if (state.gifts[rank] <= 0) {
                    addLog('msgNoGift');
                    return;
                }

                state.gifts[rank]--;
                state.giftCount++;
                state.decayTimer = 10;
                state.taskCompleted = false;

                const targetKey = document.getElementById('targetSelect').value;
                const target = state.rivals[targetKey];

                const prestigeGain = (rank + 1) * 20;
                const fameGain = (rank + 1) * 10;

                state.prestige += prestigeGain;
                state.fame += fameGain;
                target.prestige += Math.floor(prestigeGain * 0.4);

                addLog('msgGiftSuccess', ` [${target.name}]`);
                updateUI();
            }

            function craftGift() {
                if (state.leather >= 3 && state.wood >= 2) {
                    state.leather -= 3;
                    state.wood -= 2;
                    state.gifts[0]++;
                    addLog('msgCraftSuccess');
                } else if (state.gems >= 2 && state.ore >= 3) {
                    state.gems -= 2;
                    state.ore -= 3;
                    state.gifts[1]++;
                    addLog('msgCraftSuccess');
                } else {
                    addLog('msgCraftFail');
                }
                updateUI();
            }

            function collectTax() {
                if (state.classLevel < 1) {
                    addLog('msgNoTaxDomain');
                    return;
                }
                const amount = state.classLevel * 3;
                state.gems += amount;
                addLog('msgTaxCollected', ` (+${amount})`);
                updateUI();
            }

            function applyClassUp() {
                const dict = I18N[currentLang] || I18N.ja;
                if (state.classLevel >= 5) return;

                const reqGifts = Math.pow(state.classLevel + 1, 2) * 4;
                const reqPrestige = Math.pow(state.classLevel + 1, 3) * 25;

                if (state.giftCount >= reqGifts && state.prestige >= reqPrestige) {
                    state.classLevel++;
                    addLog('msgClassUp', dict.classes[state.classLevel]);
                } else {
                    addLog('msgClassFail');
                }
                updateUI();
            }

            function tickDecay() {
                state.decayTimer--;
                if (state.decayTimer <= 0) {
                    state.prestige = Math.max(0, state.prestige - 8);
                    state.fame = Math.max(0, state.fame - 4);
                    state.decayTimer = 10;
                    addLog('msgDecay');
                }
                updateUI();
            }

            function resizeCanvas() {
                const container = document.getElementById('canvasContainer');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                player.y = canvas.height - 25;
                monster.x = canvas.width - 60;
            }

            function initController() {
                const bindBtn = (id, keyName) => {
                    const btn = document.getElementById(id);
                    btn.addEventListener('touchstart', (e) => { keys[keyName] = true; e.preventDefault(); });
                    btn.addEventListener('touchend', (e) => { keys[keyName] = false; e.preventDefault(); });
                    btn.addEventListener('mousedown', () => { keys[keyName] = true; });
                    btn.addEventListener('mouseup', () => { keys[keyName] = false; });
                };

                bindBtn('btnLeft', 'left');
                bindBtn('btnRight', 'right');
                bindBtn('btnJump', 'jump');
                bindBtn('btnAttack', 'attack');

                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
                    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
                    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = true;
                    if (e.key === 'z' || e.key === 'j') keys.attack = true;
                });

                window.addEventListener('keyup', (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
                    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
                    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
                });
            }

            function init() {
                canvas = document.getElementById('gameCanvas');
                ctx = canvas.getContext('2d');

                setupLogDOM();
                resizeCanvas();
                initController();

                window.addEventListener('resize', resizeCanvas);

                document.getElementById('langSelect').addEventListener('change', (e) => {
                    currentLang = e.target.value;
                    updateUI();
                });

                document.getElementById('btnGiveGift').addEventListener('click', giveGift);
                document.getElementById('btnCompleteTask').addEventListener('click', completeTask);
                document.getElementById('btnCraftGift').addEventListener('click', craftGift);
                document.getElementById('btnCollectTax').addEventListener('click', collectTax);
                document.getElementById('btnClassUp').addEventListener('click', applyClassUp);

                if (timerId) clearInterval(timerId);
                timerId = setInterval(tickDecay, 1000);

                updateUI();
                requestAnimationFrame(gameLoop);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
