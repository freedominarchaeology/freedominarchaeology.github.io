<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIFT WAR</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a24;
            color: #e0e0e0;
            font-family: 'MS Mincho', 'ＭＳ 明朝', 'Sawarabi Mincho', serif;
            image-rendering: pixelated;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 4px double #8a785d;
            background-color: #2a2a38;
            padding: 10px 15px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            color: #f0c040;
            text-shadow: 2px 2px #000;
            letter-spacing: 2px;
        }

        .lang-select {
            background: #1a1a24;
            color: #f0c040;
            border: 2px solid #8a785d;
            padding: 5px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: #2a2a38;
            border: 4px ridge #8a785d;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-title {
            font-size: 1.1rem;
            color: #f0c040;
            border-bottom: 2px dashed #8a785d;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .stat-value {
            color: #ffffff;
            font-weight: bold;
        }

        .btn {
            background-color: #4a3b5c;
            color: #f0c040;
            border: 2px outset #8a785d;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }

        .btn:hover:not(:disabled) {
            background-color: #5c4a73;
        }

        .btn:active:not(:disabled) {
            border-style: inset;
            background-color: #382c47;
        }

        .btn:disabled {
            background-color: #2a2a30;
            color: #666666;
            border-color: #444444;
            cursor: not-allowed;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .log-box {
            height: 120px;
            background-color: #101018;
            border: 2px solid #5a4b3d;
            padding: 8px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px dotted #333;
            min-height: 1.2em;
            word-break: break-all;
        }

        .grid-dosojin {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .dosojin-card {
            background: #1a1a24;
            border: 2px solid #5a4b3d;
            padding: 6px;
            text-align: center;
            font-size: 0.85rem;
        }

        .purity-bar-container {
            width: 100%;
            background-color: #333;
            height: 10px;
            margin-top: 4px;
            border: 1px solid #666;
        }

        .purity-bar {
            height: 100%;
            background-color: #a83232;
            width: 0%;
            transition: width 0.3s ease;
        }

        .hero-badge {
            color: #55ffff;
            font-weight: bold;
            text-shadow: 0 0 4px #00ffff;
        }

        .status-boost {
            color: #55ff55;
            font-size: 0.8rem;
        }
    </style>
</head>

            <div class="stat-row"><span id="t-valour">武勇値:</span> <span id="valValour" class="stat-value">0</span></div>
            <div class="stat-row"><span id="t-decision">決定権pt:</span> <span id="valDecision" class="stat-value">0</span></div>
            <div class="stat-row"><span id="t-boost">能力強化:</span> <span id="valBoost" class="stat-value status-boost">なし</span></div>
        </div>

        <!-- Potlatch Mechanics -->
        <div class="panel">
            <div class="panel-title" id="t-gift-system">ポトラッチ (贈与の儀)</div>
            <div class="stat-row"><span id="t-gift-goods">所持贈与品:</span> <span id="valGoods" class="stat-value">5</span></div>
            <div class="stat-row"><span id="t-decay-timer">減少カウントダウン:</span> <span id="valTimer" class="stat-value">10s</span></div>
            <button id="btnGiveGift" class="btn">贈り物を贈る (+威信/名声)</button>
            <button id="btnReceiveGift" class="btn">贈り物を受け取る (+強化)</button>
            <button id="btnProduceGoods" class="btn">贈与品を生産する</button>
        </div>

        <!-- Dosojin & Combat -->
        <div class="panel full-width">
            <div class="panel-title" id="t-dosojin-title">四隅の道祖神と穢れ</div>
            <div class="grid-dosojin">
                <div class="dosojin-card">
                    <div id="t-dosojin-1">東の道祖神</div>
                    <div class="purity-bar-container"><div id="defileBar0" class="purity-bar"></div></div>
                    <button id="btnPurify0" class="btn" style="margin-top: 4px; padding: 4px; width: 100%;">浄化/討伐</button>
                </div>
                <div class="dosojin-card">
                    <div id="t-dosojin-2">西の道祖神</div>
                    <div class="purity-bar-container"><div id="defileBar1" class="purity-bar"></div></div>
                    <button id="btnPurify1" class="btn" style="margin-top: 4px; padding: 4px; width: 100%;">浄化/討伐</button>
                </div>
                <div class="dosojin-card">
                    <div id="t-dosojin-3">南の道祖神</div>
                    <div class="purity-bar-container"><div id="defileBar2" class="purity-bar"></div></div>
                    <button id="btnPurify3" class="btn" style="margin-top: 4px; padding: 4px; width: 100%;">浄化/討伐</button>
                </div>
                <div class="dosojin-card">
                    <div id="t-dosojin-4">北の道祖神</div>
                    <div class="purity-bar-container"><div id="defileBar3" class="purity-bar"></div></div>
                    <button id="btnPurify2" class="btn" style="margin-top: 4px; padding: 4px; width: 100%;">浄化/討伐</button>
                </div>
            </div>
        </div>

        <!-- Governance -->
        <div class="panel full-width">
            <div class="panel-title" id="t-governance">統治と領域拡張</div>
            <div class="stat-row">

            <div style="display: flex; gap: 8px; margin-top: 4px;">
                <button id="btnClassUp" class="btn" style="flex: 1;">階級昇格</button>
                <button id="btnCouncil" class="btn" style="flex: 1;">領域決定会議に参加</button>
            </div>
        </div>

        <div class="panel full-width">
            <div class="panel-title" id="t-log">記録 (Log)</div>
            <div id="logBox" class="log-box"></div>
        </div>

                classLevel: 0,
                isHero: false,
                boostTimer: 0,
                decayCountdown: 10,
                dosojinDefile: [10, 20, 15, 5]
            };

            // Circular Log Buffer Memory Pool (Allocated once, zero garbage collection)
            const logBuffer = new Array(MAX_LOGS).fill("");
            const logElements = [];

            // UI Elements
            const elements = {
                langSelect: document.getElementById('langSelect'),
                logBox: document.getElementById('logBox'),
                tStatus: document.getElementById('t-status'),
                tClass: document.getElementById('t-class'),
                tHero: document.getElementById('t-hero'),
                tPrestige: document.getElementById('t-prestige'),
                tFame: document.getElementById('t-fame'),
                tValour: document.getElementById('t-valour'),
                tDecision: document.getElementById('t-decision'),
                tBoost: document.getElementById('t-boost'),
                tGiftSystem: document.getElementById('t-gift-system'),
                tGiftGoods: document.getElementById('t-gift-goods'),
                tDecayTimer: document.getElementById('t-decay-timer'),
                tDosojinTitle: document.getElementById('t-dosojin-title'),
                tDosojin: [
                    document.getElementById('t-dosojin-1'),
                    document.getElementById('t-dosojin-2'),
                    document.getElementById('t-dosojin-3'),
                    document.getElementById('t-dosojin-4')
                ],
                tGovernance: document.getElementById('t-governance'),
                tDomain: document.getElementById('t-domain'),
                tLog: document.getElementById('t-log'),
                valClass: document.getElementById('valClass'),
                valHero: document.getElementById('valHero'),
                valPrestige: document.getElementById('valPrestige'),
                valFame: document.getElementById('valFame'),
                valValour: document.getElementById('valValour'),
                valDecision: document.getElementById('valDecision'),
                valBoost: document.getElementById('valBoost'),
                valGoods: document.getElementById('valGoods'),
                valTimer: document.getElementById('valTimer'),
                valDomain: document.getElementById('valDomain'),
                btnGiveGift: document.getElementById('btnGiveGift'),
                btnReceiveGift: document.getElementById('btnReceiveGift'),
                btnProduceGoods: document.getElementById('btnProduceGoods'),
                btnClassUp: document.getElementById('btnClassUp'),
                btnCouncil: document.getElementById('btnCouncil'),
                btnPurify: [
                    document.getElementById('btnPurify0'),
                    document.getElementById('btnPurify1'),
                    document.getElementById('btnPurify2'),
                    document.getElementById('btnPurify3')
                ],
                defileBar: [
                    document.getElementById('defileBar0'),
                    document.getElementById('defileBar1'),
                    document.getElementById('defileBar2'),
                    document.getElementById('defileBar3')
                ]
            };

            // Pre-allocate Log DOM Node Slots
            function setupLogDOM() {
                elements.logBox.textContent = '';
                for (let i = 0; i < MAX_LOGS; i++) {
                    const el = document.createElement('div');
                    el.className = 'log-entry';
                    elements.logBox.appendChild(el);
                    logElements.push(el);
                }
            }

            function addLog(msgKey, extraText = '') {
                const dict = I18N[currentLang];
                const text = (dict[msgKey] || msgKey) + extraText;
                
                // Shift array in-place
                logBuffer.pop();
                logBuffer.unshift(text);

                // Update text without dynamic DOM creation
                for (let i = 0; i < MAX_LOGS; i++) {
                    logElements[i].textContent = logBuffer[i] ? `> ${logBuffer[i]}` : '';
                }
            }

            function updateUI() {
                const dict = I18N[currentLang];

                // Dynamic Labels
                elements.tStatus.textContent = dict.status;
                elements.tClass.textContent = dict.class;
                elements.tHero.textContent = dict.hero;
                elements.tPrestige.textContent = dict.prestige;
                elements.tFame.textContent = dict.fame;
                elements.tValour.textContent = dict.valour;
                elements.tDecision.textContent = dict.decision;
                elements.tBoost.textContent = dict.boost;
                elements.tGiftSystem.textContent = dict.giftSystem;
                elements.tGiftGoods.textContent = dict.giftGoods;
                elements.tDecayTimer.textContent = dict.decayTimer;
                elements.tDosojinTitle.textContent = dict.dosojinTitle;
                elements.tDosojin[0].textContent = dict.dosojin1;
                elements.tDosojin[1].textContent = dict.dosojin2;
                elements.tDosojin[2].textContent = dict.dosojin3;
                elements.tDosojin[3].textContent = dict.dosojin4;
                elements.tGovernance.textContent = dict.governance;
                elements.tDomain.textContent = dict.domain;
                elements.tLog.textContent = dict.logTitle;

                elements.btnGiveGift.textContent = dict.btnGive;
                elements.btnReceiveGift.textContent = dict.btnReceive;
                elements.btnProduceGoods.textContent = dict.btnProduce;
                elements.btnClassUp.textContent = dict.btnClassUp;
                elements.btnCouncil.textContent = dict.btnCouncil;

                for (let i = 0; i < 4; i++) {
                    elements.btnPurify[i].textContent = dict.btnPurify;
                }

                // Dynamic Values
                elements.valClass.textContent = dict.classes[state.classLevel];
                
                if (state.isHero) {
                    elements.valHero.textContent = dict.heroTitle;
                    elements.valHero.className = 'stat-value hero-badge';
                } else {
                    elements.valHero.textContent = dict.none;
                    elements.valHero.className = 'stat-value';
                }

                elements.valPrestige.textContent = state.prestige;
                elements.valFame.textContent = state.fame;
                elements.valValour.textContent = state.valour;
                elements.valDecision.textContent = state.decisionPoints;
                
                if (state.boostTimer > 0) {
                    elements.valBoost.textContent = `${dict.boostActive} (${state.boostTimer}s)`;
                } else {
                    elements.valBoost.textContent = dict.none;
                }

                elements.valGoods.textContent = state.goods;
                elements.valTimer.textContent = `${state.decayCountdown}s`;
                elements.valDomain.textContent = dict.domains[state.classLevel];

                // Progress Bars
                for (let i = 0; i < 4; i++) {
                    elements.defileBar[i].style.width = `${state.dosojinDefile[i]}%`;
                }
            }

            function giveGift() {
                if (state.goods <= 0) {
                    addLog('msgNoGoods');
                    return;
                }
                state.goods--;
                const mult = state.boostTimer > 0 ? 2 : 1;
                state.prestige += 10 * mult;
                state.fame += 5 * mult;
                state.decayCountdown = 10;
                state.decisionPoints += Math.floor(state.prestige / 10);
                addLog('msgGive');
                updateUI();
            }

            function receiveGift() {
                state.boostTimer = 15;
                addLog('msgReceive');
                updateUI();
            }

            function produceGoods() {
                state.goods++;
                addLog('msgProduce');
                updateUI();
            }

            function purifyShrine(idx) {
                const defile = state.dosojinDefile[idx];
                if (defile <= 0) return;

                const power = (state.isHero ? 3 : 1) * (state.boostTimer > 0 ? 2 : 1);
                
                if (defile >= 100) {
                    state.dosojinDefile[idx] = 0;
                    state.valour += 30 * power;
                    state.fame += 20 * power;
                    addLog('msgBoss');
                } else {
                    state.dosojinDefile[idx] = Math.max(0, defile - (25 * power));
                    state.valour += 5 * power;
                    state.fame += 3 * power;
                    addLog('msgPurify');
                }

                if (!state.isHero && state.valour >= 100 && state.fame >= 100) {
                    state.isHero = true;
                    addLog('msgHero');
                }
                updateUI();
            }

            function classUp() {
                if (state.classLevel >= 5) return;
                const reqP = (state.classLevel + 1) * 30;
                const reqF = (state.classLevel + 1) * 20;

                if (state.prestige >= reqP && state.fame >= reqF) {
                    state.classLevel++;
                    addLog('msgClassUp', I18N[currentLang].classes[state.classLevel]);
                } else {
                    addLog('msgClassFail');
                }
                updateUI();
            }

            function attendCouncil() {
                if (state.prestige < 10) {
                    addLog('msgNoCouncilAuth');
                    return;
                }
                if (state.decisionPoints >= 20) {
                    state.decisionPoints -= 20;
                    addLog('msgCouncilSuccess', I18N[currentLang].domains[state.classLevel]);
                } else {
                    addLog('msgCouncilFail');
                }
                updateUI();
            }

            function tick() {
                if (state.boostTimer > 0) state.boostTimer--;

                state.decayCountdown--;
                if (state.decayCountdown <= 0) {
                    state.prestige = Math.max(0, state.prestige - 5);
                    state.fame = Math.max(0, state.fame - 3);
                    state.decayCountdown = 10;
                    addLog('msgDecay');
                }

                for (let i = 0; i < 4; i++) {
                    if (Math.random() < 0.35) {
                        state.dosojinDefile[i] = Math.min(100, state.dosojinDefile[i] + 5);
                    }
                }
                updateUI();
            }

            function init() {
                setupLogDOM();

                elements.langSelect.addEventListener('change', (e) => {
                    currentLang = e.target.value;
                    updateUI();
                });

                elements.btnGiveGift.addEventListener('click', giveGift);
                elements.btnReceiveGift.addEventListener('click', receiveGift);
                elements.btnProduceGoods.addEventListener('click', produceGoods);
                elements.btnClassUp.addEventListener('click', classUp);
                elements.btnCouncil.addEventListener('click', attendCouncil);

                for (let i = 0; i < 4; i++) {
                    elements.btnPurify[i].addEventListener('click', () => purifyShrine(i));
                }

                if (timerId) clearInterval(timerId);
                timerId = setInterval(tick, 1000);

                window.addEventListener('beforeunload', () => {
                    if (timerId) clearInterval(timerId);
                });

                updateUI();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
