<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GIFT WAR - Stickman Action & Strategy</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0d11;
            color: #e0e0e0;
            font-family: 'MS Mincho', 'ＭＳ 明朝', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 3px double #8a785d;
            background-color: #1f1f28;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.1rem;
            color: #f0c040;
            text-shadow: 2px 2px #000;
        }

        select, button {
            background: #141419;
            color: #f0c040;
            border: 2px solid #8a785d;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: #1f1f28;
            border: 3px ridge #8a785d;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .panel-title {
            font-size: 0.9rem;
            color: #f0c040;
            border-bottom: 2px dashed #8a785d;
            padding-bottom: 3px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .stat-value {
            color: #ffffff;
            font-weight: bold;
        }

        .btn {
            background-color: #3b2d4a;
            color: #f0c040;
            border: 2px outset #8a785d;
            padding: 5px 8px;
            font-size: 0.8rem;
            text-align: center;
        }

        .btn:hover:not(:disabled) {
            background-color: #4c3a5e;
        }

        .btn:active:not(:disabled) {
            border-style: inset;
            background-color: #281e33;
        }

        .btn:disabled {
            background-color: #22222a;
            color: #555555;
            border-color: #444444;
            cursor: not-allowed;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .log-box {
            height: 80px;
            background-color: #08080c;
            border: 2px solid #5a4b3d;
            padding: 4px;
            overflow-y: auto;
            font-size: 0.75rem;
            line-height: 1.3;
        }

        .log-entry {
            margin-bottom: 2px;
            border-bottom: 1px dotted #222;
            min-height: 1.1em;
            word-break: break-all;
        }

        #canvasContainer {
            position: relative;
            width: 100%;
            height: 220px;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: #141419;
            border: 2px solid #8a785d;
            touch-action: none;
        }

        .controls-overlay {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            gap: 8px;
        }

        .control-group {
            display: flex;
            gap: 6px;
        }

        .ctrl-btn {
            background: #2a2a35;
            border: 2px solid #8a785d;
            color: #fff;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: #4a4a5e;
        }

        .battle-btn-start {
            background: #1e824c;
            border-color: #2ecc71;
            color: #fff;
            font-weight: bold;
        }

        .battle-btn-retreat {
            background: #96281b;
            border-color: #e74c3c;
            color: #fff;
            font-weight: bold;
        }

        #battleOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        #battleMsg {
            font-size: 1.2rem;
            color: #e74c3c;
            font-weight: bold;
            text-shadow: 0 0 6px #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>GIFT WAR - Stickman Action</h1>
        <select id="langSelect">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </header>

    <div class="main-container">
        <!-- Status & Equipment -->
        <div class="panel">
            <div class="panel-title">ステータス・装備</div>
            <div class="stat-row"><span>階級:</span> <span id="valClass" class="stat-value">平民</span></div>
            <div class="stat-row"><span>称号:</span> <span id="valHero" class="stat-value">なし</span></div>
            <div class="stat-row"><span>威信:</span> <span id="valPrestige" class="stat-value">0</span></div>
            <div class="stat-row"><span>名声:</span> <span id="valFame" class="stat-value">0</span></div>
            <div class="stat-row"><span>武勇:</span> <span id="valValour" class="stat-value">0</span></div>
            <div class="stat-row"><span>累計贈与数:</span> <span id="valGiftCount" class="stat-value">0</span></div>
            <div class="stat-row"><span>装備:</span> <span id="valWeapon" class="stat-value">木刀 (ATK:12)</span></div>
        </div>

        <!-- Strategy & Potlatch -->
        <div class="panel">
            <div class="panel-title">贈与と外交対戦</div>
            <div class="stat-row">
                <span>贈与相手:</span>
                <select id="targetSelect">
                    <option value="rivalA">ライバルA</option>
                    <option value="rivalB">ライバルB</option>
                </select>
            </div>
            <div class="stat-row">
                <span>贈与品:</span>
                <select id="giftRankSelect">
                    <option value="0">初級品</option>
                    <option value="1">中級品</option>
                    <option value="2">高級品</option>
                    <option value="3">特級品</option>
                </select>
            </div>
            <button id="btnGiveGift" class="btn">選択相手に贈与を行う</button>
            <div class="stat-row"><span>威信減衰まで:</span> <span id="valTimer" class="stat-value">10s</span></div>
        </div>

        <!-- Action Combat Panel -->
        <div class="panel full-width">
            <div class="panel-title">棒人間アクション（移動:ボタン/斬撃:画面スワイプ・タップ連打）</div>
            <div class="stat-row">
                <span id="valPlayerHpText" class="stat-value" style="color:#2ecc71;">自HP: 100/100</span>
                <span id="valMonsterHpText" class="stat-value" style="color:#e74c3c;">敵HP: ---</span>
            </div>
            <div id="canvasContainer">
                <canvas id="gameCanvas"></canvas>
                <div id="battleOverlay">
                    <div id="battleMsg">戦闘準備</div>
                    <button id="btnStartBattle" class="btn battle-btn-start" style="padding: 10px 24px; font-size: 1rem;">戦闘開始</button>
                </div>
            </div>
            <div class="controls-overlay">
                <div class="control-group">
                    <button class="ctrl-btn" id="btnLeft">◀ 左</button>
                    <button class="ctrl-btn" id="btnRight">右 ▶</button>
                    <button class="ctrl-btn" id="btnJump">▲ 飛</button>
                </div>
                <div class="control-group">
                    <button class="ctrl-btn battle-btn-retreat" id="btnRetreat">退却</button>
                </div>
            </div>
        </div>

        <!-- Tasks, Crafting & Taxes -->
        <div class="panel full-width">
            <div class="panel-title">タスク・クラフト・税収</div>
            <div class="stat-row">
                <span id="valMaterials">素材: 皮革[0] 鉱石[0] 霊木[0] | 税収: 宝珠[0]</span>
            </div>
            <div class="stat-row" style="margin-top: 3px;">
                <span id="valTaskStatus">外交タスク: 依頼未達成</span>
            </div>
            <div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;">
                <button id="btnCompleteTask" class="btn" style="flex: 1;">外交タスク達成</button>
                <button id="btnCraftGift" class="btn" style="flex: 1;">贈与品クラフト</button>
                <button id="btnCollectTax" class="btn" style="flex: 1;">税を徴収する</button>
            </div>
        </div>

        <!-- Class Upgrade -->
        <div class="panel full-width">
            <div class="panel-title">統治と階級昇格</div>
            <div class="stat-row">
                <span>支配領域:</span> <span id="valDomain" class="stat-value">なし</span>
            </div>
            <div class="stat-row">
                <span id="valReqs">昇格要件: ---</span>
            </div>
            <button id="btnClassUp" class="btn" style="margin-top: 4px;">階級昇格申請</button>
        </div>

        <!-- Log Panel -->
        <div class="panel full-width">
            <div class="panel-title">記録</div>
            <div id="logBox" class="log-box"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const MAX_LOGS = 8;
            const I18N = {
                ja: {
                    classes: ["平民", "長", "公", "王", "大君", "皇帝"],
                    domains: ["なし", "村", "町", "国", "大国", "帝国"],
                    heroTitle: "伝説の英雄", none: "なし",
                    giftRanks: ["初級品", "中級品", "高級品", "特級品"],
                    msgHit: "斬撃ヒット! ダメージ: ",
                    msgDamaged: "痛恨の被弾! 被ダメージ: ",
                    msgKill: "討伐完了! 素材を獲得。",
                    msgBossKill: "大怪異討伐! 伝説の「神殺しの槍」を獲得！",
                    msgDead: "敗北... 威信・名声・武勇が大幅低下しました。",
                    msgRetreat: "戦闘から安全に退却しました。",
                    msgGiftSuccess: "へ贈与完了。威信と名声上昇！",
                    msgNoGift: "贈与品が不足しています。",
                    msgNoTask: "先に外交タスク（素材供給）を達成してください。",
                    msgTaskComplete: "外交タスク完了。贈与許可を獲得。",
                    msgCraftSuccess: "素材を消費して贈与品を作成しました。",
                    msgCraftFail: "クラフト素材が足されません。",
                    msgTaxCollected: "拠点から税（宝珠）を徴収しました。",
                    msgNoTaxDomain: "税収には「長」以上の階級が必要です。",
                    msgDecay: "贈与を怠ったため威信と名声が減衰...",
                    msgClassUp: "階級昇格: ",
                    msgClassFail: "昇格要件を満たしていません。"
                },
                en: {
                    classes: ["Commoner", "Chief", "Duke", "King", "Overlord", "Emperor"],
                    domains: ["None", "Village", "Town", "Kingdom", "Great Empire", "Holy Empire"],
                    heroTitle: "Legendary Hero", none: "None",
                    giftRanks: ["Basic", "Medium", "High", "Special"],
                    msgHit: "Slash Hit! Damage: ",
                    msgDamaged: "Took Damage! -",
                    msgKill: "Monster slain! Materials gained.",
                    msgBossKill: "BOSS Defeated! Unlocked Legendary Spear!",
                    msgDead: "Defeated... Lost Prestige, Fame, and Valour.",
                    msgRetreat: "Retreated safely from battle.",
                    msgGiftSuccess: "Gift delivered. Prestige & Fame raised!",
                    msgNoGift: "Insufficient gifts.",
                    msgNoTask: "Diplomatic task required first.",
                    msgTaskComplete: "Diplomatic task done.",
                    msgCraftSuccess: "Crafted gift items.",
                    msgCraftFail: "Missing craft materials.",
                    msgTaxCollected: "Collected tax gems.",
                    msgNoTaxDomain: "Requires Chief rank to collect tax.",
                    msgDecay: "Delay caused prestige decay...",
                    msgClassUp: "Class Promoted: ",
                    msgClassFail: "Requirements not met."
                }
            };

            let currentLang = 'ja';
            let timerId = null;

            const WEAPONS = [
                { name: "木刀", atk: 15, range: 50, color: "#2ecc71" },
                { name: "鉄の剣", atk: 30, range: 60, color: "#f1c40f" },
                { name: "名工の刀", atk: 60, range: 75, color: "#3498db" },
                { name: "神殺しの槍", atk: 140, range: 130, color: "#9b59b6" }
            ];

            const state = {
                prestige: 0, fame: 0, valour: 0, giftCount: 0, classLevel: 0,
                weaponIdx: 0, isHero: false, decayTimer: 10, taskCompleted: false,
                leather: 0, ore: 0, wood: 0, gems: 0, gifts: [1, 0, 0, 0],
                rivals: {
                    rivalA: { name: "ライバルA", prestige: 10 },
                    rivalB: { name: "ライバルB", prestige: 25 }
                },
                inBattle: false
            };

            // Player State
            const player = {
                x: 60, y: 0, vx: 0, vy: 0,
                hp: 100, maxHp: 100,
                isGrounded: false, isAttacking: 0,
                facing: 1, invulnerable: 0
            };

            // Monster System (Ground & Flying)
            const monster = {
                x: 300, y: 0, vx: 0, vy: 0,
                hp: 80, maxHp: 80,
                name: "赤鬼怪異",
                type: "ground", // "ground", "fly", "boss"
                hitTimer: 0,
                flyAngle: 0
            };

            const slashes = [];
            const logBuffer = new Array(MAX_LOGS).fill("");
            const logNodes = [];

            let canvas, ctx;
            const keys = { left: false, right: false, jump: false };
            let touchStartX = 0, touchStartY = 0;

            function setupLogDOM() {
                const box = document.getElementById('logBox');
                box.textContent = '';
                for (let i = 0; i < MAX_LOGS; i++) {
                    const node = document.createElement('div');
                    node.className = 'log-entry';
                    box.appendChild(node);
                    logNodes.push(node);
                }
            }

            function addLog(msgKey, extra = '') {
                const dict = I18N[currentLang] || I18N.ja;
                const msg = (dict[msgKey] || msgKey) + extra;
                logBuffer.pop();
                logBuffer.unshift(msg);
                for (let i = 0; i < MAX_LOGS; i++) {
                    logNodes[i].textContent = logBuffer[i] ? `> ${logBuffer[i]}` : '';
                }
            }

            function updateUI() {
                const dict = I18N[currentLang] || I18N.ja;
                if (state.classLevel >= 3 || state.valour >= 200) state.isHero = true;

                document.getElementById('valClass').textContent = dict.classes[state.classLevel];
                document.getElementById('valHero').textContent = state.isHero ? dict.heroTitle : dict.none;
                document.getElementById('valPrestige').textContent = state.prestige;
                document.getElementById('valFame').textContent = state.fame;
                document.getElementById('valValour').textContent = state.valour;
                document.getElementById('valGiftCount').textContent = state.giftCount;

                const w = WEAPONS[state.weaponIdx];
                const wEl = document.getElementById('valWeapon');
                wEl.textContent = `${w.name} (ATK:${w.atk})`;
                wEl.style.color = w.color;

                document.getElementById('valTimer').textContent = `${state.decayTimer}s`;
                document.getElementById('valDomain').textContent = dict.domains[state.classLevel];

                document.getElementById('valMaterials').textContent = `皮革[${state.leather}] 鉱石[${state.ore}] 霊木[${state.wood}] | 税収: 宝珠[${state.gems}]`;
                document.getElementById('valTaskStatus').textContent = state.taskCompleted ? "外交タスク: 達成済 (贈与可能)" : "外交タスク: 依頼未達成 (要:素材供給)";

                const reqGifts = Math.pow(state.classLevel + 1, 2) * 4; 
                const reqPrestige = Math.pow(state.classLevel + 1, 3) * 25;
                document.getElementById('valReqs').textContent = `必要贈与数:${reqGifts} (現在:${state.giftCount}) / 必要威信:${reqPrestige} (現在:${state.prestige})`;

                const targetSel = document.getElementById('targetSelect');
                targetSel.options[0].text = `${state.rivals.rivalA.name} (威信:${state.rivals.rivalA.prestige})`;
                targetSel.options[1].text = `${state.rivals.rivalB.name} (威信:${state.rivals.rivalB.prestige})`;

                const rankSel = document.getElementById('giftRankSelect');
                for (let i = 0; i < 4; i++) {
                    rankSel.options[i].text = `${dict.giftRanks[i]} (所持:${state.gifts[i]})`;
                }

                document.getElementById('valPlayerHpText').textContent = `自HP: ${Math.max(0, player.hp)}/${player.maxHp}`;
                document.getElementById('valMonsterHpText').textContent = state.inBattle ? `${monster.name} HP: ${Math.max(0, monster.hp)}/${monster.maxHp}` : `敵HP: ---`;
            }

            function triggerSlashAttack(targetX, targetY) {
                if (!state.inBattle || player.isAttacking > 0) return;
                player.isAttacking = 10;

                const w = WEAPONS[state.weaponIdx];
                const slashX = player.x + player.facing * (w.range * 0.6);
                const slashY = player.y - 25;

                slashes.push({
                    x: slashX,
                    y: slashY,
                    radius: w.range * 0.7,
                    color: w.color,
                    life: 8
                });

                // Hit Detection
                const dist = Math.hypot(monster.x - slashX, (monster.y - 20) - slashY);
                if (dist < w.range) {
                    const dmg = w.atk + Math.floor(Math.random() * 6);
                    monster.hp -= dmg;
                    monster.hitTimer = 6;
                    monster.vx = player.facing * 5;
                    addLog('msgHit', `${dmg}`);

                    if (monster.hp <= 0) {
                        if (monster.type === "boss") {
                            state.valour += 120; state.fame += 80;
                            if (state.weaponIdx < WEAPONS.length - 1) {
                                state.weaponIdx = WEAPONS.length - 1;
                                addLog('msgBossKill');
                            }
                        } else {
                            state.valour += 18; state.fame += 10;
                            state.leather += Math.floor(Math.random() * 2) + 1;
                            state.ore += Math.floor(Math.random() * 2) + 1;
                            state.wood += Math.floor(Math.random() * 2);
                            addLog('msgKill');
                        }
                        spawnMonster();
                    }
                    updateUI();
                }
            }

            function spawnMonster() {
                const rand = Math.random();
                if (rand < 0.25 || (state.valour > 120 && state.weaponIdx < 3)) {
                    monster.type = "boss";
                    monster.name = "【BOSS】大陰摩羅鬼";
                    monster.maxHp = 280;
                } else if (rand < 0.6) {
                    monster.type = "fly";
                    monster.name = "鴉天狗 (飛翔怪異)";
                    monster.maxHp = 60;
                } else {
                    monster.type = "ground";
                    monster.name = "赤鬼怪異";
                    monster.maxHp = 90;
                }
                monster.hp = monster.maxHp;
                monster.x = canvas.width - 60;
                monster.flyAngle = 0;
            }

            function startBattle() {
                state.inBattle = true;
                player.hp = player.maxHp;
                player.x = 60;
                spawnMonster();
                document.getElementById('battleOverlay').style.display = 'none';
                updateUI();
            }

            function retreatBattle() {
                state.inBattle = false;
                document.getElementById('battleOverlay').style.display = 'flex';
                document.getElementById('battleMsg').textContent = "戦闘から離脱中";
                document.getElementById('btnStartBattle').textContent = "戦闘開始";
                addLog('msgRetreat');
                updateUI();
            }

            function playerDeath() {
                state.inBattle = false;
                state.prestige = Math.floor(state.prestige * 0.5);
                state.fame = Math.floor(state.fame * 0.5);
                state.valour = Math.floor(state.valour * 0.5);

                document.getElementById('battleOverlay').style.display = 'flex';
                document.getElementById('battleMsg').textContent = "敗北... 威信・武勇低下";
                document.getElementById('btnStartBattle').textContent = "リスタート";
                addLog('msgDead');
                updateUI();
            }

            function updatePhysics() {
                if (!state.inBattle) return;

                const groundY = canvas.height - 25;

                // Player Move
                if (keys.left) { player.vx = -4; player.facing = -1; }
                else if (keys.right) { player.vx = 4; player.facing = 1; }
                else { player.vx *= 0.7; }

                if (keys.jump && player.isGrounded) {
                    player.vy = -9;
                    player.isGrounded = false;
                }

                player.vy += 0.5;
                player.x += player.vx;
                player.y += player.vy;

                if (player.y >= groundY) {
                    player.y = groundY;
                    player.vy = 0;
                    player.isGrounded = true;
                }

                if (player.x < 20) player.x = 20;
                if (player.x > canvas.width - 20) player.x = canvas.width - 20;

                if (player.isAttacking > 0) player.isAttacking--;
                if (player.invulnerable > 0) player.invulnerable--;

                // Monster Logic
                monster.x += monster.vx;
                monster.vx *= 0.8;

                if (monster.type === "fly") {
                    monster.flyAngle += 0.05;
                    monster.y = groundY - 70 + Math.sin(monster.flyAngle) * 35;
                    monster.x += (player.x < monster.x ? -1 : 1) * 1.2;
                } else if (monster.type === "boss") {
                    monster.y = groundY;
                    monster.x += (player.x < monster.x ? -1 : 1) * 0.8;
                } else {
                    monster.y = groundY;
                    monster.x += (player.x < monster.x ? -1 : 1) * 0.6;
                }

                if (monster.hitTimer > 0) monster.hitTimer--;

                // Collision & Player Damage
                const hitDist = Math.hypot(player.x - monster.x, (player.y - 20) - (monster.y - 20));
                if (hitDist < 30 && player.invulnerable <= 0) {
                    const dmg = monster.type === "boss" ? 25 : 12;
                    player.hp -= dmg;
                    player.invulnerable = 30; // Immunity frames
                    player.vx = player.x < monster.x ? -8 : 8;
                    player.vy = -4;
                    addLog('msgDamaged', `${dmg}`);

                    if (player.hp <= 0) {
                        playerDeath();
                    }
                    updateUI();
                }
            }

            function render() {
                ctx.fillStyle = '#141419';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const groundY = canvas.height - 25;

                // Ground Line
                ctx.strokeStyle = '#8a785d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(canvas.width, groundY);
                ctx.stroke();

                if (state.inBattle) {
                    // Player Stickman
                    if (player.invulnerable % 4 < 2) {
                        drawStickman(player.x, player.y, WEAPONS[state.weaponIdx].color, player.facing, player.isAttacking > 0);
                    }
                    // Monster Rendering
                    drawMonster(monster.x, monster.y, monster.type);
                }

                // Draw Slashes
                for (let i = slashes.length - 1; i >= 0; i--) {
                    const s = slashes[i];
                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, -Math.PI / 3, Math.PI / 3);
                    ctx.stroke();
                    s.life--;
                    if (s.life <= 0) slashes.splice(i, 1);
                }
            }

            function drawStickman(x, y, color, facing, isAttacking) {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.arc(x, y - 35, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x, y - 28); ctx.lineTo(x, y - 12);
                ctx.lineTo(x - 8 * facing, y);
                ctx.moveTo(x, y - 12); ctx.lineTo(x + 8 * facing, y);

                ctx.moveTo(x, y - 22);
                if (isAttacking) {
                    ctx.lineTo(x + 18 * facing, y - 25);
                    ctx.stroke();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x + 10 * facing, y - 25);
                    ctx.lineTo(x + 35 * facing, y - 20);
                } else {
                    ctx.lineTo(x + 10 * facing, y - 15);
                    ctx.stroke();
                    ctx.strokeStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(x + 8 * facing, y - 15);
                    ctx.lineTo(x + 18 * facing, y - 30);
                }
                ctx.stroke();
            }

            // High-Quality Monster Rendering (Ground Oni & Flying Bird Monster)
            function drawMonster(x, y, type) {
                ctx.save();
                if (monster.hitTimer > 0) ctx.fillStyle = '#ffffff';

                if (type === "fly") {
                    // Flying Bird Demon
                    const mY = y - 15;
                    ctx.fillStyle = monster.hitTimer > 0 ? '#fff' : '#8e44ad';
                    ctx.beginPath();
                    ctx.ellipse(x, mY, 18, 12, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Wings
                    ctx.strokeStyle = '#be2edd';
                    ctx.lineWidth = 3;
                    const wingFlap = Math.sin(Date.now() * 0.01) * 12;
                    ctx.beginPath();
                    ctx.moveTo(x - 5, mY); ctx.lineTo(x - 22, mY - 15 + wingFlap);
                    ctx.moveTo(x + 5, mY); ctx.lineTo(x + 22, mY - 15 + wingFlap);
                    ctx.stroke();

                    // Eyes & Beak
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(x - 6, mY - 3, 3, 0, Math.PI * 2); ctx.arc(x + 6, mY - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#e67e22';
                    ctx.beginPath();
                    ctx.moveTo(x - 4, mY + 2); ctx.lineTo(x + 4, mY + 2); ctx.lineTo(x, mY + 10);
                    ctx.fill();

                } else {
                    // Ground Oni / Boss Oni
                    const isBoss = type === "boss";
                    const radius = isBoss ? 28 : 20;
                    const mY = y - radius;

                    if (monster.hitTimer <= 0) {
                        ctx.fillStyle = isBoss ? '#900c3f' : '#c0392b';
                    }

                    // Body
                    ctx.beginPath();
                    ctx.arc(x, mY, radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Horns
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.moveTo(x - radius * 0.5, mY - radius * 0.8);
                    ctx.lineTo(x - radius * 0.8, mY - radius * 1.6);
                    ctx.lineTo(x - radius * 0.2, mY - radius * 0.9);
                    ctx.fill();

                    if (isBoss) {
                        ctx.beginPath();
                        ctx.moveTo(x + radius * 0.5, mY - radius * 0.8);
                        ctx.lineTo(x + radius * 0.8, mY - radius * 1.6);
                        ctx.lineTo(x + radius * 0.2, mY - radius * 0.9);
                        ctx.fill();
                    }

                    // Glowing Red Eyes
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(x - radius * 0.35, mY - 3, isBoss ? 5 : 3.5, 0, Math.PI * 2);
                    ctx.arc(x + radius * 0.35, mY - 3, isBoss ? 5 : 3.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Sharp Fangs & Mouth
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.moveTo(x - 8, mY + 8); ctx.lineTo(x - 5, mY + 16); ctx.lineTo(x - 2, mY + 8);
                    ctx.moveTo(x + 2, mY + 8); ctx.lineTo(x + 5, mY + 16); ctx.lineTo(x + 8, mY + 8);
                    ctx.fill();
                }
                ctx.restore();
            }

            function gameLoop() {
                updatePhysics();
                render();
                requestAnimationFrame(gameLoop);
            }

            // Tasks, Crafting & Strategic Gifting
            function completeTask() {
                if (state.leather >= 2 && state.ore >= 2) {
                    state.leather -= 2; state.ore -= 2;
                    state.taskCompleted = true;
                    addLog('msgTaskComplete');
                } else {
                    addLog('msgCraftFail');
                }
                updateUI();
            }

            function giveGift() {
                if (!state.taskCompleted) {
                    addLog('msgNoTask');
                    return;
                }
                const rank = parseInt(document.getElementById('giftRankSelect').value, 10);
                if (state.gifts[rank] <= 0) {
                    addLog('msgNoGift');
                    return;
                }

                state.gifts[rank]--;
                state.giftCount++;
                state.decayTimer = 10;
                state.taskCompleted = false;

                const targetKey = document.getElementById('targetSelect').value;
                const target = state.rivals[targetKey];

                const prestigeGain = (rank + 1) * 20;
                const fameGain = (rank + 1) * 10;

                state.prestige += prestigeGain;
                state.fame += fameGain;
                target.prestige += Math.floor(prestigeGain * 0.4);

                addLog('msgGiftSuccess', ` [${target.name}]`);
                updateUI();
            }

            function craftGift() {
                if (state.leather >= 3 && state.wood >= 2) {
                    state.leather -= 3; state.wood -= 2;
                    state.gifts[0]++;
                    addLog('msgCraftSuccess');
                } else if (state.gems >= 2 && state.ore >= 3) {
                    state.gems -= 2; state.ore -= 3;
                    state.gifts[1]++;
                    addLog('msgCraftSuccess');
                } else {
                    addLog('msgCraftFail');
                }
                updateUI();
            }

            function collectTax() {
                if (state.classLevel < 1) {
                    addLog('msgNoTaxDomain');
                    return;
                }
                const amount = state.classLevel * 3;
                state.gems += amount;
                addLog('msgTaxCollected', ` (+${amount})`);
                updateUI();
            }

            function applyClassUp() {
                const dict = I18N[currentLang] || I18N.ja;
                if (state.classLevel >= 5) return;

                const reqGifts = Math.pow(state.classLevel + 1, 2) * 4;
                const reqPrestige = Math.pow(state.classLevel + 1, 3) * 25;

                if (state.giftCount >= reqGifts && state.prestige >= reqPrestige) {
                    state.classLevel++;
                    addLog('msgClassUp', dict.classes[state.classLevel]);
                } else {
                    addLog('msgClassFail');
                }
                updateUI();
            }

            function tickDecay() {
                state.decayTimer--;
                if (state.decayTimer <= 0) {
                    state.prestige = Math.max(0, state.prestige - 8);
                    state.fame = Math.max(0, state.fame - 4);
                    state.decayTimer = 10;
                    addLog('msgDecay');
                }
                updateUI();
            }

            function resizeCanvas() {
                const container = document.getElementById('canvasContainer');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                player.y = canvas.height - 25;
            }

            function initController() {
                const bindBtn = (id, keyName) => {
                    const btn = document.getElementById(id);
                    btn.addEventListener('touchstart', (e) => { keys[keyName] = true; e.preventDefault(); });
                    btn.addEventListener('touchend', (e) => { keys[keyName] = false; e.preventDefault(); });
                    btn.addEventListener('mousedown', () => { keys[keyName] = true; });
                    btn.addEventListener('mouseup', () => { keys[keyName] = false; });
                };

                bindBtn('btnLeft', 'left');
                bindBtn('btnRight', 'right');
                bindBtn('btnJump', 'jump');

                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
                    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
                    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = true;
                    if (e.key === 'z' || e.key === 'j') triggerSlashAttack();
                });

                window.addEventListener('keyup', (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
                    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
                    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
                });

                // Canvas Swipe & Tap Attacks
                canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                canvas.addEventListener('touchend', (e) => {
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    triggerSlashAttack(touchEndX, touchEndY);
                }, { passive: true });

                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    triggerSlashAttack(e.clientX - rect.left, e.clientY - rect.top);
                });
            }

            function init() {
                canvas = document.getElementById('gameCanvas');
                ctx = canvas.getContext('2d');

                setupLogDOM();
                resizeCanvas();
                initController();

                window.addEventListener('resize', resizeCanvas);

                document.getElementById('langSelect').addEventListener('change', (e) => {
                    currentLang = e.target.value;
                    updateUI();
                });

                document.getElementById('btnStartBattle').addEventListener('click', startBattle);
                document.getElementById('btnRetreat').addEventListener('click', retreatBattle);

                document.getElementById('btnGiveGift').addEventListener('click', giveGift);
                document.getElementById('btnCompleteTask').addEventListener('click', completeTask);
                document.getElementById('btnCraftGift').addEventListener('click', craftGift);
                document.getElementById('btnCollectTax').addEventListener('click', collectTax);
                document.getElementById('btnClassUp').addEventListener('click', applyClassUp);

                if (timerId) clearInterval(timerId);
                timerId = setInterval(tickDecay, 1000);

                updateUI();
                requestAnimationFrame(gameLoop);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
