<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Action Game - Boss Update</title>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { background: #000; border: 2px solid #fff; display: block; }
        .controls { margin-top: 10px; display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #444; color: #fff; border: 1px solid #888; border-radius: 5px; }
        button:active { background: #666; }
        #download-btn { display: none; background: #28a745; border-color: #28a745; margin-top: 15px; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<!-- 左移動の左側にガードボタンを配置 -->
<div class="controls">
    <button id="btn-guard">ガード (G)</button>
    <button id="btn-left">← 左 (A)</button>
    <button id="btn-right">右 → (D)</button>
    <button id="btn-attack">攻撃 (J)</button>
</div>

<button id="download-btn">成績をダウンロード</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- ゲーム状態管理 ---
let startTime = Date.now();
let clearTimeSeconds = 0;
let isGameOver = false;
let isGameClear = false;

// スコア関連
let scoreData = {
    damageDealt: 0,
    damageTaken: 0,
    bossesDefeated: 0
};

// --- プレイヤー設定 ---
const player = {
    x: 100, y: 350, width: 30, height: 50,
    hp: 100, maxHp: 100, speed: 5,
    isGuarding: false,
    isAttacking: false,
    vx: 0
};

// --- ラスボスデータ ---
const bosses = [
    { name: "バハムート", hp: 150, maxHp: 150, type: "bahamut", color: "#d9534f" },
    { name: "サムエル", hp: 180, maxHp: 180, type: "samuel", color: "#f0ad4e" },
    { name: "ルシファー", hp: 250, maxHp: 250, type: "lucifer", color: "#5bc0de" }
];

let currentBossIndex = 0;
let currentBoss = null;

function initBoss(index) {
    if (index >= bosses.length) {
        // 全ラスボス撃破
        isGameClear = true;
        clearTimeSeconds = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('download-btn').style.display = 'block';
        return;
    }
    const b = bosses[index];
    currentBoss = {
        ...b,
        x: 600, y: 300, width: 60, height: 100,
        timer: 0, state: "idle",
        // 特殊攻撃プロパティ
        chargeVx: 0,
        flames: [],
        beam: { active: false, charging: false, x: 0, y: 0, width: 0, height: 0 },
        screenAttack: false
    };
}
initBoss(0);

// --- 入力判定 ---
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ボタン操作対応
const setupBtn = (id, keyName) => {
    const btn = document.getElementById(id);
    btn.addEventListener('mousedown', () => keys[keyName] = true);
    btn.addEventListener('mouseup', () => keys[keyName] = false);
    btn.addEventListener('mouseleave', () => keys[keyName] = false);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
};
setupBtn('btn-guard', 'g');
setupBtn('btn-left', 'a');
setupBtn('btn-right', 'd');
setupBtn('btn-attack', 'j');

// --- ダメージ処理 (ガード判定付き) ---
function takePlayerDamage(amount) {
    if (player.isGuarding) {
        amount = Math.floor(amount * 0.2); // ガードでダメージ80%軽減
    }
    player.hp -= amount;
    scoreData.damageTaken += amount;
    if (player.hp <= 0) {
        player.hp = 0;
        isGameOver = true;
    }
}

// --- 更新ロジック ---
function update() {
    if (isGameOver || isGameClear) return;

    // 1. プレイヤー移動・アクション
    player.isGuarding = !!keys['g'];
    player.vx = 0;
    if (!player.isGuarding) {
        if (keys['a']) player.vx = -player.speed;
        if (keys['d']) player.vx = player.speed;
    }
    player.x += player.vx;
    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

    // 攻撃処理
    if (keys['j'] && !player.isAttacking) {
        player.isAttacking = true;
        setTimeout(() => player.isAttacking = false, 300);
        
        // 攻撃判定
        if (currentBoss && Math.abs((player.x + player.width/2) - (currentBoss.x + currentBoss.width/2)) < 80) {
            const dmg = 10;
            currentBoss.hp -= dmg;
            scoreData.damageDealt += dmg;
            if (currentBoss.hp <= 0) {
                scoreData.bossesDefeated++;
                currentBossIndex++;
                initBoss(currentBossIndex);
            }
        }
    }

    // 2. ラスボスのAI・攻撃パターン
    if (currentBoss) {
        currentBoss.timer++;

        // --- バハムート：炎吐き ＆ 突進 ---
        if (currentBoss.type === 'bahamut') {
            if (currentBoss.timer % 180 === 0) {
                // 炎を吐く
                currentBoss.flames.push({ x: currentBoss.x, y: currentBoss.y + 30, vx: -6 });
            } else if (currentBoss.timer % 240 === 120) {
                // 突進開始
                currentBoss.chargeVx = -10;
            }

            // 突進処理
            if (currentBoss.chargeVx !== 0) {
                currentBoss.x += currentBoss.chargeVx;
                if (currentBoss.x < 50) currentBoss.chargeVx = 8; // 跳ね返り
                if (currentBoss.x > 600) { currentBoss.x = 600; currentBoss.chargeVx = 0; } // 元の位置へ
                
                // 接触ダメージ
                if (Math.abs(player.x - currentBoss.x) < 30) {
                    takePlayerDamage(1);
                }
            }

            // 炎の移動＆判定
            currentBoss.flames.forEach((f, i) => {
                f.x += f.vx;
                if (Math.abs(f.x - player.x) < 20 && Math.abs(f.y - player.y) < 40) {
                    takePlayerDamage(15);
                    currentBoss.flames.splice(i, 1);
                }
            });
        }

        // --- サムエル：ビーム攻撃 ---
        else if (currentBoss.type === 'samuel') {
            if (currentBoss.timer % 200 === 100) {
                // 溜め動作（予兆）
                currentBoss.beam.charging = true;
            } else if (currentBoss.timer % 200 === 150) {
                // ビーム発射
                currentBoss.beam.charging = false;
                currentBoss.beam.active = true;
                currentBoss.beam.y = currentBoss.y + 20;
                setTimeout(() => { currentBoss.beam.active = false; }, 500);
            }

            if (currentBoss.beam.active) {
                // プレイヤーがビームの高さ（Y軸）にいる場合に命中
                if (player.y + player.height > currentBoss.beam.y && player.y < currentBoss.beam.y + 40) {
                    takePlayerDamage(2); // 持続ダメージ
                }
            }
        }

        // --- ルシファー：全体攻撃 ＆ ワープ ---
        else if (currentBoss.type === 'lucifer') {
            if (currentBoss.timer % 200 === 0) {
                // ランダムワープ
                currentBoss.x = 100 + Math.random() * 550;
            } else if (currentBoss.timer % 300 === 150) {
                // 強力な全体攻撃
                currentBoss.screenAttack = true;
                setTimeout(() => {
                    if (currentBoss) {
                        takePlayerDamage(25);
                        currentBoss.screenAttack = false;
                    }
                }, 600);
            }
        }
    }
}

// --- 描画処理 ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 地面
    ctx.fillStyle = "#555";
    ctx.fillRect(0, 400, canvas.width, 50);

    // 2. プレイヤー描画
    ctx.fillStyle = player.isGuarding ? "#4a90e2" : "#fff"; // ガード中は青っぽく変化
    ctx.fillRect(player.x, player.y, player.width, player.height);

    if (player.isAttacking) {
        ctx.fillStyle = "#ff0";
        ctx.fillRect(player.x + player.width, player.y + 10, 30, 10);
    }

    // UI: プレイヤーHP
    ctx.fillStyle = "#fff";
    ctx.fillText(`Player HP: ${player.hp}/${player.maxHp}`, 20, 30);

    // 3. ラスボス描画
    if (currentBoss) {
        ctx.fillStyle = currentBoss.color;
        ctx.fillRect(currentBoss.x, currentBoss.y, currentBoss.width, currentBoss.height);

        // ボスUI
        ctx.fillStyle = "#fff";
        ctx.fillText(`${currentBoss.name} HP: ${currentBoss.hp}/${currentBoss.maxHp}`, 600, 30);

        // バハムート：炎のエフェクト
        ctx.fillStyle = "#ff4500";
        currentBoss.flames.forEach(f => {
            ctx.beginPath();
            ctx.arc(f.x, f.y, 12, 0, Math.PI * 2);
            ctx.fill();
        });

        // サムエル：ビーム＆予兆エフェクト
        if (currentBoss.beam.charging) {
            ctx.strokeStyle = "rgba(255, 0, 0, 0.5)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, currentBoss.y + 40);
            ctx.lineTo(currentBoss.x, currentBoss.y + 40);
            ctx.stroke();
        }
        if (currentBoss.beam.active) {
            ctx.fillStyle = "rgba(255, 255, 0, 0.8)";
            ctx.fillRect(0, currentBoss.y + 20, currentBoss.x, 40);
        }

        // ルシファー：全体攻撃フラッシュ
        if (currentBoss.screenAttack) {
            ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    // ゲームオーバー／クリア画面
    if (isGameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff4d4d";
        ctx.font = "30px sans-serif";
        ctx.fillText("GAME OVER", 320, 225);
    } else if (isGameClear) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#28a745";
        ctx.font = "30px sans-serif";
        ctx.fillText("ALL BOSSES DEFEATED!", 240, 200);
        ctx.fillStyle = "#fff";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Clear Time: ${clearTimeSeconds}s`, 340, 240);
    }
}

// --- メインループ ---
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();

// --- 戦績テキストのダウンロード機能 ---
document.getElementById('download-btn').addEventListener('click', () => {
    const textContent = 
`=================================
      GAME CLEAR RESULT
=================================
クリア時間    : ${clearTimeSeconds} 秒
撃破ボス数    : ${scoreData.bossesDefeated} / ${bosses.length}
与ダメージ合計: ${scoreData.damageDealt}
被ダメージ合計: ${scoreData.damageTaken}
最終残りHP    : ${player.hp}
=================================`;

    const blob = new Blob([textContent], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'clear_result.txt';
    a.click();
    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
