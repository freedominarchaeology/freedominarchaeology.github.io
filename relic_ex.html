            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1, h2, h3, button, th, label {
            font-family: "MS Gothic", "ＭＳ ゴシック", "MS PGothic", "ＭＳ Pゴシック", sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .lang-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            background-color: #34495e;
            color: #fff;
            padding: 8px 15px;
            border-radius: 4px;
        }
        .lang-bar label {
            font-weight: bold;
            font-size: 13px;
        }
        .lang-bar select {
            font-weight: bold;
            padding: 4px 8px;
        }
        .control-panel {
            background-color: #eef2f5;
            padding: 15px;
            border: 1px solid #b8c4d0;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input[type="file"], input[type="number"], input[type="text"], select, button {
            font-size: 13px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 3px;
        }
        .suggestion-box {
            grid-column: 1 / -1;
            background: #e8f4fd;
            border: 1px solid #b3d7ff;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
        }
        .suggestion-box span { font-weight: bold; color: #0056b3; }
        .suggestion-badge {
            display: inline-block;
            background: #fff;
            border: 1px solid #0056b3;
            color: #0056b3;
            padding: 2px 8px;
            margin: 2px 4px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .suggestion-badge:hover { background: #0056b3; color: #fff; }
        
        .scale-measure-box {
            grid-column: 1 / -1;
            background: #fff9e6;
            border: 1px solid #ffeeba;
            padding: 12px;
            border-radius: 4px;
            display: none;
        }
        .scale-canvas-container {
            margin-top: 10px;
            overflow: auto;
            max-height: 300px;
            border: 1px solid #ccc;
            background: #fff;
            text-align: center;
        }
        #scaleMeasureCanvas { cursor: crosshair; max-width: 100%; }

        .action-area {
            grid-column: 1 / -1;
            margin-top: 10px;
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        button {
            background-color: #2c3e50; color: white; border: none; cursor: pointer;
            padding: 10px 18px; font-weight: bold;
        }
        button:hover { background-color: #34495e; }
        button#sortBtn { background-color: #8e44ad; }
        button#sortBtn:hover { background-color: #732d91; }
        button#downloadZipBtn { background-color: #27ae60; }
        button#downloadZipBtn:hover { background-color: #219150; }
        button.secondary-btn { background-color: #7f8c8d; padding: 6px 12px; font-size: 12px; }
        button.secondary-btn:hover { background-color: #95a5a6; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        #status { margin-top: 10px; font-weight: bold; color: #d35400; }
        
        .results-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 20px; margin-top: 20px;
        }
        .card {
            border: 1px solid #ccc; padding: 12px; background: #fafafa;
            transition: all 0.2s ease;
        }
        .card.selected-card { border: 2px solid #3498db; background: #f4fafe; }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 10px;
            gap: 8px;
        }
        .card-header .title-input {
            flex-grow: 1; font-size: 14px; font-weight: bold; padding: 4px;
            font-family: "MS Gothic", "ＭＳ ゴシック", sans-serif;
        }
        .card-header input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }
        
        .card-images { display: flex; gap: 10px; flex-wrap: wrap; }
        .card-images > div { flex: 1; min-width: 180px; text-align: center; }
        .card-images img, .card-images canvas { max-width: 100%; height: auto; border: 1px solid #ddd; background-color: #fff; }
        
        .trim-canvas-container {
            position: relative;
            display: inline-block;
            cursor: crosshair;
            margin-bottom: 5px;
        }
        .trim-controls {
            background: #fff; border: 1px solid #e0e0e0; padding: 6px; border-radius: 3px;
            font-size: 11px; text-align: left; margin-bottom: 6px; font-family: sans-serif;
        }
        .trim-controls label { font-size: 11px; margin-right: 4px; }
        .trim-controls input[type="number"] { width: 50px; padding: 2px 4px; font-size: 11px; margin-right: 6px; }

        .slider-container, .card-scale-container {
            margin-top: 6px; font-size: 12px; font-family: sans-serif;
            background: #fff; border: 1px solid #eee; padding: 6px; border-radius: 3px;
        }
        .slider-container input[type="range"] { width: 100%; box-sizing: border-box; cursor: pointer; }
        
        .eps-btn { margin-top: 4px; background-color: #34495e; padding: 4px 6px; font-size: 11px; width: 100%; }
        .meta-info {
            font-size: 12px; margin-top: 8px; line-height: 1.5; background: #fff; padding: 8px; border: 1px solid #eee;

</head>
<body>

<div class="container">
    <div class="lang-bar">
        <label for="languageSelect" data-i18n="langLabel">🌐 言語 / Language:</label>
        <select id="languageSelect">
            <option value="ja" selected>日本語 (Japanese)</option>
            <option value="en">English</option>
            <option value="zh">中文 (Chinese)</option>
            <option value="ko">한국어 (Korean)</option>
            <option value="fr">Français (French)</option>
            <option value="es">Español (Spanish)</option>
        </select>
    </div>

    <h1 data-i18n="appTitle">考古学報告書 遺物個別抽出・PDF縮尺出力ツール（図番号連動・編集・トリミング対応版）</h1>

    <div class="control-panel">
        <div class="control-group">
            <label for="fileInput" data-i18n="lblFile">1. ファイル選択 (PDF / 画像):</label>
            <input type="file" id="fileInput" accept="application/pdf,image/*">
        </div>

        <div class="control-group">
            <label for="fileNamePrefix" data-i18n="lblPrefix">2. 出力ファイル名の接頭辞:</label>
            <input type="text" id="fileNamePrefix" value="artifact" placeholder="例: siteA_trench1">
        </div>

        <div class="control-group">
            <label for="pdfOriginalRatio" data-i18n="lblBaseScale">3. 基準掲載縮尺 (一括):</label>
            <select id="pdfOriginalRatio">
                <option value="0.5">1/2</option>
                <option value="0.333333">1/3</option>
                <option value="0.25">1/4</option>
                <option value="0.2">1/5</option>
                <option value="0.166667" selected>1/6</option>
                <option value="0.125">1/8</option>
                <option value="0.1">1/10</option>
                <option value="scale-bar" data-i18n="optScaleBar">📐 図中スケールバーから算出</option>
                <option value="custom" data-i18n="optCustom">任意（カスタム分母を指定）</option>
            </select>
            <div id="customRatioContainer" style="display: none; margin-top: 5px;">
                <input type="number" id="customPdfDenominator" placeholder="分母を入力 (例: 7.5)" min="0.1" step="0.1" style="width: 100%; box-sizing: border-box;">
            </div>
        </div>

        <div class="control-group">
            <label for="targetRatioInput" data-i18n="lblTargetScale">4. 出力希望の縮尺:</label>
            <select id="targetRatioInput">
                <option value="0.1">1/10</option>
                <option value="0.125">1/8</option>
                <option value="0.166667" selected>1/6</option>
                <option value="0.2">1/5</option>
                <option value="0.25">1/4</option>
                <option value="0.333333">1/3</option>
                <option value="0.5">1/2</option>
                <option value="1.0">1/1 (実寸法)</option>
                <option value="custom" data-i18n="optCustom">任意（カスタム分母を指定）</option>
            </select>
            <div id="customTargetContainer" style="display: none; margin-top: 5px;">
                <input type="number" id="customTargetDenominator" placeholder="分母を入力 (例: 7.5)" min="0.1" step="0.1" style="width: 100%; box-sizing: border-box;">
            </div>
        </div>

        <div class="control-group">
            <label for="sensitivityInput" data-i18n="lblSensitivity">5. 遺物分離感度 (px):</label>
            <input type="number" id="sensitivityInput" value="15" min="5" max="50" step="1">
        </div>

        <div class="control-group">
            <label for="captionFilterMode" data-i18n="lblCaptionFilter">6. ノイズ・キャプション除去:</label>
            <select id="captionFilterMode">
                <option value="strong" selected data-i18n="optFilterStrong">強力（下部注記＆横文字カット）</option>
                <option value="normal" data-i18n="optFilterNormal">標準</option>
                <option value="off" data-i18n="optFilterOff">オフ</option>
            </select>
        </div>

        <div class="control-group">
            <label for="renderQuality" data-i18n="lblRenderQuality">7. 処理モード（低性能PC向け軽量化）:</label>
            <select id="renderQuality">
                <option value="normal" selected data-i18n="optQualityNormal">標準 (高品質 8.0)</option>
                <option value="light" data-i18n="optQualityLight">軽量 (低メモリ・高速 4.0)</option>
            </select>
        </div>

        <div id="scaleSuggestionBox" class="suggestion-box">
            <span data-i18n="scaleSuggestionText">💡 PDF内から縮尺表記の候補が見つかりました:</span> <div id="suggestionBadges" style="display:inline; margin-left: 5px;"></div>
        </div>

        <div id="scaleMeasureBox" class="scale-measure-box">
            <strong data-i18n="measureBoxTitle">📐 図中スケールバー測距モード（縦・横対応）</strong>
            <div style="font-size: 12px; margin: 5px 0;">
                <span data-i18n="measureStep1">1. スケールバーの実寸を入力:</span> <input type="number" id="scaleBarCm" value="10" min="1" max="100" style="width: 60px;"> cm<br>
                <span data-i18n="measureStep2">2. 下の画像で、スケールバーの「両端（または起点と終点）」を2回クリックしてください。</span>
            </div>
            <div style="font-size: 12px; color: #856404;" id="measureStatus" data-i18n="measureStatus1">状態: スケールバーの1点目をクリックしてください。</div>
            <div class="scale-canvas-container">
                <canvas id="scaleMeasureCanvas"></canvas>
            </div>
        </div>

        <div class="action-area">
            <button id="processBtn" data-i18n="btnProcess">個別に抽出して解析実行 (図番号自動連動)</button>
            <button id="sortBtn" disabled data-i18n="btnSort">形状類似度で並び替え</button>
            <div style="flex-grow: 1;"></div>
            <button id="selectAllBtn" class="secondary-btn" disabled data-i18n="btnSelectAll">全て選択</button>
            <button id="deselectAllBtn" class="secondary-btn" disabled data-i18n="btnDeselectAll">全て解除</button>
            <button id="downloadZipBtn" disabled data-i18n="btnDownloadZipNone">ZIP一括ダウンロード (選択なし)</button>
        </div>
        <div id="status" style="grid-column: 1 / -1;" data-i18n="statusInitial">ファイルを選択し「解析実行」をクリックしてください（※完全ローカル処理）。</div>
    </div>

    <h2 data-i18n="headingResults">抽出結果（プレビュー・図番号編集・トリミング微調整）</h2>
    <div id="results" class="results-grid"></div>
</div>

let currentLang = 'ja';

function t(key, vars = {}) {
    let text = (translations[currentLang] && translations[currentLang][key]) || translations['ja'][key] || key;
    for (const [k, v] of Object.entries(vars)) {
        text = text.replace(new RegExp(`\\{${k}\\}`, 'g'), v);
    }
    return text;
}

function updateLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang] && translations[currentLang][key]) {
            el.innerHTML = translations[currentLang][key];
        }
    });
    
    document.title = t('appTitle');
    updateDownloadBtnState();
    if (extractedItems.length > 0) {
        renderAllItems();
    }
}

document.getElementById('languageSelect').addEventListener('change', (e) => {
    updateLanguage(e.target.value);
});

console.info("[Security Check] All processing runs locally in browser sandbox.");

if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

let extractedItems = [];
let activeObjectUrls = [];
let measuredPdfRatio = null;

function setStatus(text) {
    document.getElementById('status').innerHTML = text;
}

function releaseMemory() {
    try {
        activeObjectUrls.forEach(url => URL.revokeObjectURL(url));
        activeObjectUrls = [];

        extractedItems.forEach(item => {
            if (item.rawCanvas) { item.rawCanvas.width = 0; item.rawCanvas.height = 0; }
            if (item.silCanvas) { item.silCanvas.width = 0; item.silCanvas.height = 0; }
            if (item.highResRawCanvas) { item.highResRawCanvas.width = 0; item.highResRawCanvas.height = 0; }
            item.fingerprint = null;
            item.epsString = null;
            item.fullLinesEpsString = null;
        });
    } catch(e) {
        console.warn("Memory release warning:", e);
    }
}

function clearPreviousData() {
    releaseMemory();
    extractedItems = [];
    document.getElementById('sortBtn').disabled = true;
    document.getElementById('downloadZipBtn').disabled = true;
    document.getElementById('selectAllBtn').disabled = true;
    document.getElementById('deselectAllBtn').disabled = true;
    const resultsContainer = document.getElementById('results');
    while(resultsContainer.firstChild) resultsContainer.removeChild(resultsContainer.firstChild);
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const suggestionBox = document.getElementById('scaleSuggestionBox');
    const measureBox = document.getElementById('scaleMeasureBox');
    suggestionBox.style.display = 'none';
    measureBox.style.display = 'none';
    document.getElementById('suggestionBadges').innerHTML = '';
    measuredPdfRatio = null;

    if (file && (file.type === 'application/pdf' || file.type.startsWith('image/'))) {
        try {
            setStatus(t('msgLoading'));
            if (file.type === 'application/pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
                const detectedRatios = new Set();

                for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    for (const item of textContent.items) {
                        const matches = item.str.match(/1\s*[/／：:]\s*([0-9]+(?:\.[0-9]+)?)/g);
                        if (matches) {
                            matches.forEach(m => {
                                const numMatch = m.match(/([0-9]+(?:\.[0-9]+)?)$/);
                                if (numMatch) detectedRatios.add(parseFloat(numMatch[1]));
                            });
                        }
                    }
                }

                if (detectedRatios.size > 0) {
                    const badgeContainer = document.getElementById('suggestionBadges');
                    detectedRatios.forEach(denom => {
                        const badge = document.createElement('span');
                        badge.className = 'suggestion-badge';
                        badge.innerText = `1/${denom}`;
                        badge.title = 'Click to apply';
                        badge.addEventListener('click', () => applyCustomScale(denom));
                        badgeContainer.appendChild(badge);
                    });
                    suggestionBox.style.display = 'block';
                    setStatus(t('msgPdfScaleFound'));
                } else {
                    setStatus(t('msgFileLoaded'));
                }
            } else {
                setStatus(t('msgFileLoaded'));
            }
        } catch (err) {
            console.error(err);
            setStatus(t('msgFileLoaded'));
        }
    }
});

function applyCustomScale(denom) {
    const select = document.getElementById('pdfOriginalRatio');
    const customContainer = document.getElementById('customRatioContainer');
    const customInput = document.getElementById('customPdfDenominator');

    select.value = 'custom';
    customContainer.style.display = 'block';
    customInput.value = denom;
    setStatus(`1/${denom}`);
}

document.getElementById('pdfOriginalRatio').addEventListener('change', async (e) => {
    const val = e.target.value;
    document.getElementById('customRatioContainer').style.display = (val === 'custom') ? 'block' : 'none';
    const measureBox = document.getElementById('scaleMeasureBox');
    
    if (val === 'scale-bar') {
        measureBox.style.display = 'block';
        await initScaleMeasureTool();
    } else {
        measureBox.style.display = 'none';
    }
});

let measureStep = 0;
let measureX1 = 0;
let measureY1 = 0;

async function initScaleMeasureTool() {
    const canvas = document.getElementById('scaleMeasureCanvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files.length) {
        alert('Please select a file first.');
        return;
    }
    const file = fileInput.files[0];
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let srcCanvas = document.createElement('canvas');
    if (file.type === 'application/pdf') {
        const arrayBuffer = await file.arrayBuffer(); 
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 2.0 });
        srcCanvas.width = viewport.width; 
        srcCanvas.height = viewport.height;
        await page.render({ canvasContext: srcCanvas.getContext('2d'), viewport: viewport }).promise;
    } else if (file.type.startsWith('image/')) {
        const img = new Image();
        const url = URL.createObjectURL(file);
        activeObjectUrls.push(url);
        img.src = url;
        await img.decode();
        srcCanvas.width = img.width; 
        srcCanvas.height = img.height;
        srcCanvas.getContext('2d').drawImage(img, 0, 0);
    }

    canvas.width = srcCanvas.width;
    canvas.height = srcCanvas.height;
    ctx.drawImage(srcCanvas, 0, 0);

    measureStep = 0;
    document.getElementById('measureStatus').innerText = t('measureStatus1');

    canvas.onclick = (event) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (event.clientX - rect.left) * scaleX;
        const y = (event.clientY - rect.top) * scaleY;

        const mCtx = canvas.getContext('2d');

        if (measureStep === 0) {
            measureX1 = x;
            measureY1 = y;
            measureStep = 1;
            document.getElementById('measureStatus').innerText = t('measureStatus2');
            mCtx.fillStyle = 'red';
            mCtx.beginPath(); mCtx.arc(x, y, 6, 0, Math.PI * 2); mCtx.fill();
        } else if (measureStep === 1) {
            const measureX2 = x;
            const measureY2 = y;
            
            const pxLen = Math.hypot(measureX2 - measureX1, measureY2 - measureY1);
            const scaleCm = parseFloat(document.getElementById('scaleBarCm').value) || 10;

            const ptPerCm = 28.346457;
            const expectedPxPerCmFor1_1 = ptPerCm * 2.0;
            const actualPxPerCm = pxLen / scaleCm;
            
            const calculatedRatio = actualPxPerCm / expectedPxPerCmFor1_1;
            measuredPdfRatio = calculatedRatio;

            document.getElementById('measureStatus').innerHTML = t('measureStatusComplete', {
                px: pxLen.toFixed(1),
                scale: (1/calculatedRatio).toFixed(1)
            });
            
            mCtx.fillStyle = 'blue';
            mCtx.beginPath(); mCtx.arc(x, y, 6, 0, Math.PI * 2); mCtx.fill();
            mCtx.strokeStyle = 'green'; mCtx.lineWidth = 3;
            mCtx.beginPath(); mCtx.moveTo(measureX1, measureY1); mCtx.lineTo(measureX2, measureY2); mCtx.stroke();

            measureStep = 0; 
        }
    };
}

document.getElementById('targetRatioInput').addEventListener('change', (e) => {
    document.getElementById('customTargetContainer').style.display = (e.target.value === 'custom') ? 'block' : 'none';

function getPdfOriginalRatio() {
    const select = document.getElementById('pdfOriginalRatio');
    if (select.value === 'scale-bar') {
        if (measuredPdfRatio) return measuredPdfRatio;
        alert('Scale bar not measured yet.');
        return 0.166667;
    }
    if (select.value === 'custom') {
        const denom = parseFloat(document.getElementById('customPdfDenominator').value);
        if (!denom || denom <= 0) return 0.166667;
        return 1.0 / denom;
    }
    return parseFloat(select.value) || 0.166667;
}

function getTargetRatio() {
    const select = document.getElementById('targetRatioInput');
    if (select.value === 'custom') {
        const denom = parseFloat(document.getElementById('customTargetDenominator').value);
        if (!denom || denom <= 0) return 0.166667;
        return 1.0 / denom;
    }
    return parseFloat(select.value) || 0.166667;
}

    const input = document.getElementById('fileNamePrefix').value.trim();

function getShapeFingerprint(canvas) {
    const small = document.createElement('canvas');
    small.width = 32; small.height = 32;
    const ctx = small.getContext('2d');
    ctx.drawImage(canvas, 0, 0, 32, 32);
    const imgData = ctx.getImageData(0, 0, 32, 32).data;
    small.width = 0; small.height = 0;
    return imgData;
}

function calculateSimilarity(fpA, fpB) {
    let sum = 0;
    for (let i = 0; i < fpA.length; i += 4) { sum += Math.pow(fpA[i] - fpB[i], 2); }
    return sum;
}

document.getElementById('sortBtn').addEventListener('click', () => {
    if (extractedItems.length < 2) return;
    setStatus(t('msgSorting'));
    extractedItems.forEach(item => {
        if (!item.fingerprint) item.fingerprint = getShapeFingerprint(item.silCanvas);
    });
    const anchor = extractedItems[0];
    extractedItems.sort((a, b) => {
        return calculateSimilarity(anchor.fingerprint, a.fingerprint) - calculateSimilarity(anchor.fingerprint, b.fingerprint);
    });
    renderAllItems();
    setStatus(t('msgSorted'));
});

function renderAllItems() {
    const resultsContainer = document.getElementById('results');
    resultsContainer.innerHTML = '';
    extractedItems.forEach(item => {
        resultsContainer.appendChild(createCardElement(item));
    });
}

function generatePdfBuffer(canvas, scaleFactor) {
    const { jsPDF } = window.jspdf;
    const widthPt = canvas.width * scaleFactor;
    const heightPt = canvas.height * scaleFactor;

    const pdf = new jsPDF({
        orientation: widthPt > heightPt ? 'l' : 'p',
        unit: 'pt',
        format: [widthPt, heightPt]
    });

    const imgData = canvas.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 0, 0, widthPt, heightPt);
    return pdf.output('arraybuffer');
}

function generateJpgDataUrl(canvas, quality = 0.95) {
    return canvas.toDataURL('image/jpeg', quality);
}

function dataUrlToBlob(dataUrl) {
    const arr = dataUrl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
    }
    return new Blob([u8arr], { type: mime });
}

function updateItemCropAndRefresh(item, tx, ty, tw, th) {
    const maxW = item.highResRawCanvas.width;
    const maxH = item.highResRawCanvas.height;

    item.trimX = Math.max(0, Math.min(tx, maxW - 10));
    item.trimY = Math.max(0, Math.min(ty, maxH - 10));
    item.trimW = Math.max(10, Math.min(tw, maxW - item.trimX));
    item.trimH = Math.max(10, Math.min(th, maxH - item.trimY));

    const croppedCanvas = document.createElement('canvas');
    croppedCanvas.width = item.trimW;
    croppedCanvas.height = item.trimH;
    const cCtx = croppedCanvas.getContext('2d');
    cCtx.drawImage(item.highResRawCanvas, item.trimX, item.trimY, item.trimW, item.trimH, 0, 0, item.trimW, item.trimH);

    item.rawCanvas = croppedCanvas;
    item.scaleFactor = calculateScaleFactor(item.itemPdfOrigRatio, getTargetRatio());
    item.silCanvas = generateSilhouetteCanvas(item.rawCanvas, item.filterMode, item.threshold);
    item.epsString = generateSolidPolygonEpsString(item.silCanvas, item.scaleFactor);
    item.fullLinesEpsString = generateDetailedLineEpsString(item.rawCanvas, item.scaleFactor);
    item.fingerprint = null;

    const renderScale = document.getElementById('renderQuality').value === 'light' ? 4.0 : 8.0;
    const logicalWidthPt = item.rawCanvas.width / renderScale * (getTargetRatio() / item.itemPdfOrigRatio) * 72;
    const logicalWidthMm = (logicalWidthPt * 0.352778).toFixed(1);
    item.scaleMessage = `${t('outputScaleRatio')} <strong>${(getTargetRatio() / item.itemPdfOrigRatio).toFixed(3)}</strong> | ${t('paperWidth')} <strong>${logicalWidthMm} mm</strong>`;
}

document.getElementById('processBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('fileInput');
    
    if (!window.pdfjsLib) { alert('PDF.js module loading error.'); return; }
    if (!fileInput.files.length) { alert('Please select a file.'); return; }

    const file = fileInput.files[0];
    clearPreviousData();
    setStatus(t('msgProcessing'));

    try {
        if (file.type === 'application/pdf') {
            await processPDF(file);
        } else if (file.type.startsWith('image/')) {
            await processImageFile(file);
        } else {
            throw new Error('Unsupported file format.');
        }
        
        setStatus(t('msgComplete', { count: extractedItems.length }));
        if (extractedItems.length > 0) {
            document.getElementById('sortBtn').disabled = extractedItems.length < 2;
            document.getElementById('selectAllBtn').disabled = false;
            document.getElementById('deselectAllBtn').disabled = false;
            updateDownloadBtnState();
        }
    } catch (err) {
        console.error(err);
        setStatus('Error: ' + err.message);
        releaseMemory();
    }
});

        const folderRawPdf = zip.folder("1_Raw_PDF");
        const folderRawJpg = zip.folder("2_Raw_JPG");

async function processPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
    const renderScale = document.getElementById('renderQuality').value === 'light' ? 4.0 : 8.0;
    
    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        setStatus(t('msgPageProcessing', { page: pageNum, total: pdf.numPages }));
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: renderScale });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        
        const textContent = await page.getTextContent();
        const textNumbers = [];
        for (const item of textContent.items) {
            const str = item.str.trim();
            if (/^[0-9]{1,2}$/.test(str)) {
                const tx = item.transform[4] * renderScale;
                const ty = (page.getViewport({ scale: 1.0 }).height - item.transform[5]) * renderScale;
                textNumbers.push({ num: parseInt(str, 10), x: tx, y: ty });
            }
        }
        
        processSingleCanvas(canvas, `p${pageNum}`, renderScale, textNumbers);
        
        canvas.width = 0; canvas.height = 0;
    }
}

async function processImageFile(file) {
    setStatus(t('msgImageLoading'));
    const img = new Image();
    const url = URL.createObjectURL(file);
    activeObjectUrls.push(url);
    img.src = url;
    await img.decode();
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    processSingleCanvas(canvas, 'img', 1.0, []);
    URL.revokeObjectURL(url);
}

function processSingleCanvas(srcCanvas, pagePrefix, renderScale, textNumbers) {
    const w = srcCanvas.width; const h = srcCanvas.height;
    const ctx = srcCanvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const basePdfOrigRatio = getPdfOriginalRatio();
    const targetRatio = getTargetRatio();
    const filterMode = document.getElementById('captionFilterMode').value;
    const gridSize = parseInt(document.getElementById('sensitivityInput').value, 10);
    const cols = Math.floor(w / gridSize); const rows = Math.floor(h / gridSize);
    const grid = new Uint8Array(cols * rows);

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let darkCount = 0;
            for (let dy = 0; dy < gridSize; dy++) {
                for (let dx = 0; dx < gridSize; dx++) {
                    const x = c * gridSize + dx; const y = r * gridSize + dy;
                    if (x < w && y < h) {
                        const idx = (y * w + x) * 4;
                        const gray = data[idx] * 0.299 + data[idx+1] * 0.587 + data[idx+2] * 0.114;
                        if (gray < 220) darkCount++;
                    }
                }
            }
            grid[r * cols + c] = darkCount > (gridSize * gridSize * 0.05) ? 1 : 0;
        }
    }

    const visited = new Uint8Array(cols * rows);
    let detectedRegions = [];

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (grid[r * cols + c] === 1 && !visited[r * cols + c]) {
                const bounds = { minC: c, maxC: c, minR: r, maxR: r, count: 0 };
                floodFill(c, r, cols, rows, grid, visited, bounds);
                const minCells = Math.floor((w * h * 0.001) / (gridSize * gridSize));
                if (bounds.count > minCells) {
                    const pad = 30;
                    const cropX = Math.max(0, bounds.minC * gridSize - pad);
                    const cropY = Math.max(0, bounds.minR * gridSize - pad);
                    const cropW = Math.min(w - cropX, (bounds.maxC - bounds.minC + 1) * gridSize + pad * 2);
                    const cropH = Math.min(h - cropY, (bounds.maxR - bounds.minR + 1) * gridSize + pad * 2);

                    detectedRegions.push({
                        cropX, cropY, cropW, cropH,
                        centerX: cropX + cropW / 2,
                        centerY: cropY + cropH / 2,
                        bottomY: cropY + cropH
                    });
                }
            }
        }
    }

    detectedRegions.sort((a, b) => {
        const yDiff = a.centerY - b.centerY;
        const rowThreshold = Math.min(a.cropH, b.cropH) * 0.4;
        
        if (Math.abs(yDiff) < rowThreshold) {
            return a.centerX - b.centerX;
        }
        return yDiff;
    });

    detectedRegions.forEach((reg, idx) => {
        reg.defaultNum = idx + 1;
        reg.figNum = null;
    });

    if (textNumbers && textNumbers.length > 0) {
        const matches = [];
        detectedRegions.forEach((reg, rIdx) => {
            textNumbers.forEach((tn, tIdx) => {
                const dx = tn.x - reg.centerX;
                const dy = tn.y - reg.bottomY;
                if (dy >= -20 && dy < 250 && Math.abs(dx) < reg.cropW * 1.5) {
                    const dist = Math.hypot(dx, dy);
                    matches.push({ rIdx, tIdx, dist, num: tn.num });
                }
            });
        });

        matches.sort((a, b) => a.dist - b.dist);

        const usedRegions = new Set();
        const usedTexts = new Set();

        matches.forEach(m => {
            if (!usedRegions.has(m.rIdx) && !usedTexts.has(m.tIdx)) {
                detectedRegions[m.rIdx].figNum = m.num;
                usedRegions.add(m.rIdx);
                usedTexts.add(m.tIdx);
            }
        });
    }

    detectedRegions.forEach((reg) => {
        if (reg.figNum === null) {
            reg.figNum = reg.defaultNum;
        }
    });

    detectedRegions.sort((a, b) => a.figNum - b.figNum);

    const existingTitles = new Set(extractedItems.map(item => item.title));

    detectedRegions.forEach((reg) => {
        let baseTitle = `${pagePrefix}_fig${reg.figNum}`;
        let uniqueTitle = baseTitle;
        let counter = 2;
        while (existingTitles.has(uniqueTitle)) {
            uniqueTitle = `${baseTitle}_${counter}`;
            counter++;
        }
        existingTitles.add(uniqueTitle);
        reg.title = uniqueTitle;
    });

    detectedRegions.forEach((reg) => {
        const subCanvas = document.createElement('canvas');
        subCanvas.width = reg.cropW; subCanvas.height = reg.cropH;
        const subCtx = subCanvas.getContext('2d');
        subCtx.drawImage(srcCanvas, reg.cropX, reg.cropY, reg.cropW, reg.cropH, 0, 0, reg.cropW, reg.cropH);

        const cleanedCanvas = filterMode !== 'off' ? trimBottomCaption(subCanvas, filterMode) : subCanvas;
        renderIndividualPottery(cleanedCanvas, reg.title, basePdfOrigRatio, targetRatio, filterMode);
    });
}

function floodFill(c, r, cols, rows, grid, visited, bounds) {
    const queue = [[c, r]]; visited[r * cols + c] = 1;
    while (queue.length > 0) {
        const [curC, curR] = queue.pop(); bounds.count++;
        if (curC < bounds.minC) bounds.minC = curC; if (curC > bounds.maxC) bounds.maxC = curC;
        if (curR < bounds.minR) bounds.minR = curR; if (curR > bounds.maxR) bounds.maxR = curR;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                const nc = curC + dc; const nr = curR + dr;
                if (nc >= 0 && nc < cols && nr >= 0 && nr < rows) {
                    const idx = nr * cols + nc;
                    if (grid[idx] === 1 && !visited[idx]) { visited[idx] = 1; queue.push([nc, nr]); }
                }
            }
        }
    }
}

function trimBottomCaption(canvas, mode) {
    const w = canvas.width; const h = canvas.height;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const rowDarkCounts = new Int32Array(h);
    for (let y = 0; y < h; y++) {
        let count = 0;
        for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            const gray = data[idx] * 0.299 + data[idx+1] * 0.587 + data[idx+2] * 0.114;
            if (gray < 220) count++;
        }
        rowDarkCounts[y] = count;
    }
    let cutY = h; const blankThreshold = mode === 'strong' ? 10 : 16; let blankCount = 0;
    for (let y = h - 1; y > Math.floor(h * 0.5); y--) {
        if (rowDarkCounts[y] <= 4) {
            blankCount++; if (blankCount >= blankThreshold) { cutY = y; break; }
        } else { blankCount = 0; }
    }
    if (cutY < h && cutY > 100) {
        const trimmedCanvas = document.createElement('canvas');
        trimmedCanvas.width = w; trimmedCanvas.height = cutY;
        const tCtx = trimmedCanvas.getContext('2d');
        tCtx.drawImage(canvas, 0, 0, w, cutY, 0, 0, w, cutY);
        return trimmedCanvas;
    }
    return canvas;
}

function generateSilhouetteCanvas(figCanvas, filterMode, threshold = 220) {
    const w = figCanvas.width; const h = figCanvas.height;
    const srcCtx = figCanvas.getContext('2d');
    const imgData = srcCtx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const binMap = new Uint8Array(w * h);
    for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
        binMap[i / 4] = gray < threshold ? 1 : 0;
    }

    if (filterMode !== 'off') {
        const visitedMap = new Uint8Array(w * h); const components = [];
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = y * w + x;
                if (binMap[idx] === 1 && !visitedMap[idx]) {
                    const comp = []; const q = [idx]; visitedMap[idx] = 1;
                    while (q.length > 0) {
                        const cur = q.pop(); comp.push(cur);
                        const cx = cur % w; const cy = Math.floor(cur / w);
                        const neighbors = [[cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1], [cx+1, cy+1], [cx-1, cy-1], [cx+1, cy-1], [cx-1, cy+1]];
                        for (const [nx, ny] of neighbors) {
                            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                                const nIdx = ny * w + nx;
                                if (binMap[nIdx] === 1 && !visitedMap[nIdx]) { visitedMap[nIdx] = 1; q.push(nIdx); }
                            }
                        }
                    }
                    components.push(comp);
                }
            }
        }
        if (components.length > 1) {
            components.sort((a, b) => b.length - a.length);
            const mainPotterySize = components[0].length;
            for (let i = 1; i < components.length; i++) {
                if (components[i].length < mainPotterySize * 0.05 && components[i].length < 3200) {
                    for (const pIdx of components[i]) { binMap[pIdx] = 0; }
                }
            }
        }
    }

    const bgMap = new Uint8Array(w * h); const queue = [];
    for (let x = 0; x < w; x++) {
        if (binMap[x] === 0) { bgMap[x] = 1; queue.push(x); }
        if (binMap[(h - 1) * w + x] === 0) { bgMap[(h - 1) * w + x] = 1; queue.push((h - 1) * w + x); }
    }
    for (let y = 0; y < h; y++) {
        if (binMap[y * w] === 0) { bgMap[y * w] = 1; queue.push(y * w); }
        if (binMap[y * w + (w - 1)] === 0) { bgMap[y * w + (w - 1)] = 1; queue.push(y * w + (w - 1)); }
    }
    while (queue.length > 0) {
        const idx = queue.pop();
        const cx = idx % w; const cy = Math.floor(idx / w);
        const neighbors = [[cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]];
        for (const [nx, ny] of neighbors) {
            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                const nIdx = ny * w + nx;
                if (binMap[nIdx] === 0 && bgMap[nIdx] === 0) { bgMap[nIdx] = 1; queue.push(nIdx); }
            }
        }
    }
    const outCanvas = document.createElement('canvas');
    outCanvas.width = w; outCanvas.height = h;
    const outCtx = outCanvas.getContext('2d');
    const outImgData = outCtx.createImageData(w, h); const outBuf = outImgData.data;
    for (let i = 0; i < w * h; i++) {
        const pIdx = i * 4;
        if (bgMap[i] !== 1) { outBuf[pIdx] = 0; outBuf[pIdx+1] = 0; outBuf[pIdx+2] = 0; outBuf[pIdx+3] = 255; }
        else { outBuf[pIdx] = 255; outBuf[pIdx+1] = 255; outBuf[pIdx+2] = 255; outBuf[pIdx+3] = 255; }
    }
    outCtx.putImageData(outImgData, 0, 0);
    return outCanvas;
}

function calculateScaleFactor(pdfOrigRatio, targetRatio) {
    const renderScale = document.getElementById('renderQuality').value === 'light' ? 4.0 : 8.0;
    return (1.0 / renderScale) * (targetRatio / pdfOrigRatio);
}

function skeletonize(grid, width, height) {
    let current = new Uint8Array(grid);
    let changed = true;
    
    function get(x, y) {
        if (x < 0 || x >= width || y < 0 || y >= height) return 0;
        return current[y * width + x];
    }

    while (changed) {
        changed = false;
        let deletable1 = [];
        
        for (let y = 1; y < height - 1; y++) {
            for (let x = 1; x < width - 1; x++) {
                if (get(x, y) === 1) {
                    let p2 = get(x, y-1), p3 = get(x+1, y-1), p4 = get(x+1, y), p5 = get(x+1, y+1);
                    let p6 = get(x, y+1), p7 = get(x-1, y+1), p8 = get(x-1, y), p9 = get(x-1, y-1);
                    
                    let B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
                    let A = 0;
                    if (p2 === 0 && p3 === 1) A++; if (p3 === 0 && p4 === 1) A++;
                    if (p4 === 0 && p5 === 1) A++; if (p5 === 0 && p6 === 1) A++;
                    if (p6 === 0 && p7 === 1) A++; if (p7 === 0 && p8 === 1) A++;
                    if (p8 === 0 && p9 === 1) A++; if (p9 === 0 && p2 === 1) A++;
                    
                    if (B >= 2 && B <= 6 && A === 1 && (p2 * p4 * p6 === 0) && (p4 * p6 * p8 === 0)) {
                        deletable1.push(y * width + x);
                    }
                }
            }
        }
        if (deletable1.length > 0) {
            changed = true;
            for (let idx of deletable1) current[idx] = 0;
        }
        
        let deletable2 = [];
        for (let y = 1; y < height - 1; y++) {
            for (let x = 1; x < width - 1; x++) {
                if (get(x, y) === 1) {
                    let p2 = get(x, y-1), p3 = get(x+1, y-1), p4 = get(x+1, y), p5 = get(x+1, y+1);
                    let p6 = get(x, y+1), p7 = get(x-1, y+1), p8 = get(x-1, y), p9 = get(x-1, y-1);
                    
                    let B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
                    let A = 0;
                    if (p2 === 0 && p3 === 1) A++; if (p3 === 0 && p4 === 1) A++;
                    if (p4 === 0 && p5 === 1) A++; if (p5 === 0 && p6 === 1) A++;
                    if (p6 === 0 && p7 === 1) A++; if (p7 === 0 && p8 === 1) A++;
                    if (p8 === 0 && p9 === 1) A++; if (p9 === 0 && p2 === 1) A++;
                    
                    if (B >= 2 && B <= 6 && A === 1 && (p2 * p4 * p8 === 0) && (p2 * p6 * p8 === 0)) {
                        deletable2.push(y * width + x);
                    }
                }
            }
        }
        if (deletable2.length > 0) {
            changed = true;
            for (let idx of deletable2) current[idx] = 0;
        }
    }
    return current;
}

function generateDetailedLineEpsString(figCanvas, scaleFactor) {
    const w = figCanvas.width;
    const h = figCanvas.height;
    const ctx = figCanvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const rawGrid = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const gray = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
            if (gray < 210) {
                rawGrid[y * w + x] = 1;
            }
        }
    }

    const skeletonGrid = skeletonize(rawGrid, w, h);
    const visited = new Uint8Array(w * h);
    let psSegments = [];

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const idx = y * w + x;
            if (skeletonGrid[idx] === 1 && !visited[idx]) {
                let path = [];
                let q = [[x, y]];
                visited[idx] = 1;

                while(q.length > 0) {
                    let [cx, cy] = q.pop();
                    path.push({x: cx, y: cy});

                    const neighbors = [[cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1], [cx+1, cy+1], [cx-1, cy-1], [cx+1, cy-1], [cx-1, cy+1]];
                    for (let [nx, ny] of neighbors) {
                        if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                            let nIdx = ny * w + nx;
                            if (skeletonGrid[nIdx] === 1 && !visited[nIdx]) {
                                visited[nIdx] = 1;
                                q.push([nx, ny]);
                            }
                        }
                    }
                }

                if (path.length >= 2) {
                    psSegments.push(`${(path[0].x * scaleFactor).toFixed(3)} ${((h - path[0].y) * scaleFactor).toFixed(3)} m`);
                    for (let i = 1; i < path.length; i++) {
                        psSegments.push(`${(path[i].x * scaleFactor).toFixed(3)} ${((h - path[i].y) * scaleFactor).toFixed(3)} l`);
                    }
                }
            }
        }
    }

    const bboxW = (w * scaleFactor).toFixed(2);
    const bboxH = (h * scaleFactor).toFixed(2);

    return `%!PS-Adobe-3.0 EPSF-3.0
%%Creator: Archaeological Artifact Vectorizer
%%BoundingBox: 0 0 ${Math.ceil(w * scaleFactor)} ${Math.ceil(h * scaleFactor)}
%%HiResBoundingBox: 0.00 0.00 ${bboxW} ${bboxH}
%%EndComments
/m {moveto} bind def
/l {lineto} bind def
gsave
0.5 setlinewidth
0 setgray
newpath
${psSegments.join('\n')}
stroke
grestore
%%EOF
`;
}

function generateSolidPolygonEpsString(silCanvas, scaleFactor) {
    const w = silCanvas.width;
    const h = silCanvas.height;
    const ctx = silCanvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const gridW = w + 2;
    const gridH = h + 2;
    const grid = new Uint8Array(gridW * gridH);
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const gray = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
            if (gray < 128) {
                grid[(y + 1) * gridW + (x + 1)] = 1;
            }
        }
    }

    const edges = new Map();
    const addEdge = (v1, v2) => {
        let arr = edges.get(v1);
        if (!arr) { arr = []; edges.set(v1, arr); }
        arr.push(v2);
    };

    for (let y = 1; y < gridH; y++) {
        for (let x = 1; x < gridW; x++) {
            const isBlack = grid[y * gridW + x];
            const topBlack = grid[(y - 1) * gridW + x];
            const leftBlack = grid[y * gridW + (x - 1)];

            const vTopLeft = (y - 1) * (gridW + 1) + (x - 1);
            const vTopRight = (y - 1) * (gridW + 1) + x;
            const vBottomLeft = y * (gridW + 1) + (x - 1);

            if (isBlack && !topBlack) addEdge(vTopRight, vTopLeft);
            else if (!isBlack && topBlack) addEdge(vTopLeft, vTopRight);

            if (isBlack && !leftBlack) addEdge(vTopLeft, vBottomLeft);
            else if (!isBlack && leftBlack) addEdge(vBottomLeft, vTopLeft);
        }
    }

    let psPaths = [];

    for (const [startV, outs] of edges.entries()) {
        while (outs.length > 0) {
            let currentV = startV;
            let path = [];
            
            while (true) {
                let currentOuts = edges.get(currentV);
                if (!currentOuts || !currentOuts.length) break;
                
                const nextV = currentOuts.pop();
                path.push(currentV);
                currentV = nextV;
                
                if (currentV === startV) break;
            }
            
            if (path.length > 2) {
                let coords = path.map(v => {
                    return { x: (v % (gridW + 1)) - 1, y: Math.floor(v / (gridW + 1)) - 1 };
                });

                let area = 0;
                for (let i = 0; i < coords.length; i++) {
                    const p1 = coords[i];
                    const p2 = coords[(i + 1) % coords.length];
                    area += (p1.x * p2.y - p2.x * p1.y);
                }
                area = Math.abs(area) / 2;

                if (area > 100) {
                    psPaths.push(`${(coords[0].x * scaleFactor).toFixed(3)} ${((h - coords[0].y) * scaleFactor).toFixed(3)} m`);
                    for (let i = 1; i < coords.length; i++) {
                        psPaths.push(`${(coords[i].x * scaleFactor).toFixed(3)} ${((h - coords[i].y) * scaleFactor).toFixed(3)} l`);
                    }
                    psPaths.push("cp");
                }
            }
        }
    }

    const bboxW = (w * scaleFactor).toFixed(2);
    const bboxH = (h * scaleFactor).toFixed(2);

    return `%!PS-Adobe-3.0 EPSF-3.0
%%Creator: Archaeological Artifact Vectorizer - Silhouette
%%BoundingBox: 0 0 ${Math.ceil(w * scaleFactor)} ${Math.ceil(h * scaleFactor)}
%%HiResBoundingBox: 0.00 0.00 ${bboxW} ${bboxH}
%%EndComments
/m {moveto} bind def
/l {lineto} bind def
/cp {closepath} bind def
gsave
0 setgray
newpath
${psPaths.join('\n')}
eofill
grestore
%%EOF
`;
}

function renderIndividualPottery(subCanvas, titleText, pdfOrigRatio, targetRatio, filterMode) {
    const resultsContainer = document.getElementById('results');
    
    const defaultThreshold = 220;
    const highResSilCanvas = generateSilhouetteCanvas(subCanvas, filterMode, defaultThreshold);
    const scaleFactor = calculateScaleFactor(pdfOrigRatio, targetRatio);

    const epsString = generateSolidPolygonEpsString(highResSilCanvas, scaleFactor);
    const fullLinesEpsString = generateDetailedLineEpsString(subCanvas, scaleFactor);

    const exportRawCanvas = subCanvas; 
    const exportSilCanvas = highResSilCanvas;

    const renderScale = document.getElementById('renderQuality').value === 'light' ? 4.0 : 8.0;
    const logicalWidthPt = exportRawCanvas.width / renderScale * (targetRatio / pdfOrigRatio) * 72;
    const logicalWidthMm = (logicalWidthPt * 0.352778).toFixed(1);
    
    const scaleMessage = `${t('outputScaleRatio')} <strong>${(targetRatio / pdfOrigRatio).toFixed(3)}</strong> | ${t('paperWidth')} <strong>${logicalWidthMm} mm</strong>`;

    const item = {
        title: titleText,
        rawCanvas: exportRawCanvas, 
        silCanvas: exportSilCanvas,
        epsString: epsString,
        fullLinesEpsString: fullLinesEpsString,
        scaleMessage: scaleMessage,
        fingerprint: null,
        selected: true,
        
        highResRawCanvas: subCanvas,
        scaleFactor: scaleFactor,
        filterMode: filterMode,
        threshold: defaultThreshold,
        itemPdfOrigRatio: pdfOrigRatio,

        trimX: 0,
        trimY: 0,
        trimW: subCanvas.width,
        trimH: subCanvas.height
    };

    extractedItems.push(item);
    resultsContainer.appendChild(createCardElement(item));
}
