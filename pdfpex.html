<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFページ抽出ツール（考古学対応）</title>
    
    <!-- 外部ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "MS Mincho", "MS 明朝", serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c3e50;
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"], select, input[type="text"], button {
            font-family: "MS Mincho", "MS 明朝", serif;
            padding: 8px 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px 16px;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #e67e22;
        }
        .btn-secondary:hover {
            background-color: #d35400;
        }
        #loading {
            display: none;
            color: #e67e22;
            font-weight: bold;
            margin: 10px 0;
        }
        #thumbnail-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 15px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #eaeaea;
        }
        .thumb-card {
            border: 2px solid #ccc;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .thumb-card.selected {
            border-color: #27ae60;
            background: #e8f8f5;
        }
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            cursor: crosshair;
        }
        .canvas-wrapper canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            display: block;
        }
        .crop-box {
            position: absolute;
            border: 2px dashed #e74c3c;
            background: rgba(231, 76, 60, 0.3);
            pointer-events: none;
            display: none;
        }
        .thumb-info input {
            font-size: 0.9rem;
            margin-top: 8px;
            width: 100%;
        }
        .badge {
            font-size: 0.85rem;
            color: #555;
        }
        .toolbar-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="ui-title">PDFページ抽出ツール（考古学対応）</h1>
        <div>
            <label for="lang-select" style="display:inline; color:#fff;" id="ui-lang-label">言語:</label>
            <select id="lang-select" style="width: auto; display:inline;" onchange="changeLanguage()">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="ko">한국어</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
    </header>

    <div class="control-group">
        <label for="pdf-file" id="ui-file-label">報告書PDFファイルを選択:</label>
        <input type="file" id="pdf-file" accept="application/pdf" onchange="loadPDF(event)">
    </div>

    <div id="loading">処理中... 少々お待ちください。</div>

    <div class="control-group">
        <h3 id="ui-preview-title">抽出ページ選択・範囲指定</h3>
        <p id="ui-preview-desc" class="badge">
            ・クリック：ページの抽出選択/解除<br>
            ・<b>画像上をドラッグ</b>：ページ番号（数字）を正確に囲むと自動再認識します。
        </p>
        <div class="toolbar-group">
            <button id="apply-all-btn" class="btn-secondary" onclick="applyROIAllPages()" disabled>ドラッグ選択範囲を全ページに適用して再認識</button>
        </div>
        <div id="thumbnail-container"></div>
    </div>

    <button id="process-btn" onclick="executeExtraction()" disabled>抽出・保存実行</button>
</div>

<script>
    const i18n = {
        ja: {
            title: "PDFページ抽出ツール（考古学対応）",
            langLabel: "言語:",
            fileLabel: "報告書PDFファイルを選択:",
            previewTitle: "抽出ページ選択・範囲指定",
            previewDesc: "・クリック：ページの抽出選択/解除\n・画像上をドラッグ：ページ番号のある場所を正確に赤枠で囲むと自動再認識します。",
            applyAllBtn: "ドラッグ選択範囲を全ページに適用して再認識",
            processBtn: "抽出・保存実行",
            loading: "処理中... 少々お待ちください。",
            alertNoSelect: "抽出するページが選択されていません。"
        },
        en: {
            title: "PDF Page Extractor (Archaeology)",
            langLabel: "Lang:",
            fileLabel: "Select Report PDF File:",
            previewTitle: "Select Pages & Drag Region",
            previewDesc: "・Click: Select/Deselect page\n・Drag on image: Enclose page number with a red box to re-recognize.",
            applyAllBtn: "Apply Dragged Region to All Pages",
            processBtn: "Execute Extraction & Save",
            loading: "Processing... Please wait.",
            alertNoSelect: "No pages selected for extraction."
        },
        zh: {
            title: "PDF页面提取工具（考古专用）",
            langLabel: "语言:",
            fileLabel: "选择報告PDF文件:",
            previewTitle: "选择页面与指定区域",
            previewDesc: "・点击：选择/取消选择页面\n・拖拽：框选页码位置以重新识别。",
            applyAllBtn: "将框选区域应用至所有页面",
            processBtn: "执行提取并保存",
            loading: "处理中...请稍候。",
            alertNoSelect: "未选择要提取的页面。"
        },
        ko: {
            title: "PDF 페이지 추출 도구 (고고학 대응)",
            langLabel: "언어:",
            fileLabel: "보고서 PDF 파일 선택:",
            previewTitle: "추출 페이지 선택 및 영역 지정",
            previewDesc: "・클릭: 페이지 선택/해제\n・드래그: 페이지 번호 위치를 빨간 상자로 지정하여 재인식.",
            applyAllBtn: "지정한 영역을 모든 페이지에 적용",
            processBtn: "추출 및 저장実行",
            loading: "처리 중... 잠시 기다려주세요.",
            alertNoSelect: "추출할 페이지가 선택되지 않았습니다."
        },
        fr: {
            title: "Extracteur de pages PDF (Archéologie)",
            langLabel: "Langue:",
            fileLabel: "Sélectionner le fichier PDF:",
            previewTitle: "Sélection des pages & Zone",
            previewDesc: "・Clic: Sélectionner/Désélectionner\n・Glisser: Entourez le numéro de page pour le réanalyser.",
            applyAllBtn: "Appliquer la zone à toutes les pages",
            processBtn: "Exécuter l'extraction",
            loading: "Traitement en cours...",
            alertNoSelect: "Aucune page sélectionnée."
        },
        es: {
            title: "Extractor de páginas PDF (Arqueología)",
            langLabel: "Idioma:",
            fileLabel: "Seleccionar archivo PDF:",
            previewTitle: "Seleccionar área",
            previewDesc: "・Clic: Seleccionar/Deseleccionar\n・Arrastrar: Enmarque el número de página para re-reconocer.",
            applyAllBtn: "Aplicar área a todas las páginas",
            processBtn: "Ejecutar extracción y guardar",
            loading: "Procesando... Por favor espere.",
            alertNoSelect: "No se han seleccionado páginas."
        }
    };

    function changeLanguage() {
        const lang = document.getElementById('lang-select').value;
        const dict = i18n[lang];
        document.getElementById('ui-title').innerText = dict.title;
        document.getElementById('ui-lang-label').innerText = dict.langLabel;
        document.getElementById('ui-file-label').innerText = dict.fileLabel;
        document.getElementById('ui-preview-title').innerText = dict.previewTitle;
        document.getElementById('apply-all-btn').innerText = dict.applyAllBtn;
        document.getElementById('process-btn').innerText = dict.processBtn;
    }

    let loadedPdfBytes = null;
    let pdfDocGlobal = null;
    let originalFileName = "";
    let pageDataList = [];
    let lastSelectedROI = null;
    let ocrWorkerGlobal = null;

    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function parseNombreNumber(str) {
        if (!str) return null;
        
        // 1. '-53-' や '- 53 -' のようなハイフン表記を優先検出
        const hyphenMatch = str.match(/[-─—–-]\s*(\d+)\s*[-─—–-]/);
        if (hyphenMatch) return hyphenMatch[1];

        // 2. 図キャプション内の数字（例: 「第1図」「(1/6)」）を除外
        let cleaned = str.replace(/第\s*\d+\s*図/g, '')
                         .replace(/\(\s*\d+\s*\/\s*\d+\s*\)/g, '')
                         .replace(/\d+\/\d+/g, '');

        // 3. 残りの文字列から単独の数字列を抽出
        const match = cleaned.match(/(?:^|[^\d])(\d+)(?:[^\d]|$)/);
        return match ? match[1] : null;
    }

    // MediaBox（全領域）を基準にViewportを取得する関数（PDF.js内部構造に合わせて修正）
    function getFullViewport(page, scale) {
        const mediaBox = page._pageInfo?.mediaBox;
        if (mediaBox && Array.isArray(mediaBox)) {
            page.viewBox = [...mediaBox];
        }
        return page.getViewport({ scale: scale });
    }

    async function detectPageNumberFromROI(page, roi) {
        const viewport = getFullViewport(page, 1.0);

        // 1. テキスト抽出（テキスト層が存在する場合）
        try {
            const textContent = await page.getTextContent();

            for (const item of textContent.items) {
                if (!item.str || !item.str.trim()) continue;
                
                const tx = item.transform[4];
                const ty = item.transform[5];
                const [vx, vy] = viewport.convertToViewportPoint(tx, ty);
                
                const rx = vx / viewport.width;
                const ry = vy / viewport.height;

                if (rx >= roi.x && rx <= (roi.x + roi.w) && ry >= roi.y && ry <= (roi.y + roi.h)) {
                    const parsed = parseNombreNumber(item.str.trim());
                    if (parsed) return parsed;
                }
            }
        } catch (e) {
            console.warn("Text Extraction Warning:", e);
        }

        // 2. OCR処理（高解像度 4.0倍 + 黒線太線化）
        try {
            const scale = 4.0;
            const fullViewport = getFullViewport(page, scale);

            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = Math.floor(fullViewport.width);
            fullCanvas.height = Math.floor(fullViewport.height);
            const fullCtx = fullCanvas.getContext('2d');

            fullCtx.fillStyle = '#ffffff';
            fullCtx.fillRect(0, 0, fullCanvas.width, fullCanvas.height);

            const renderContext = {
                canvasContext: fullCtx,
                viewport: fullViewport,
                annotationMode: pdfjsLib.AnnotationMode.ENABLE
            };
            await page.render(renderContext).promise;

            const cropX = fullViewport.width * roi.x;
            const cropY = fullViewport.height * roi.y;
            const cropW = Math.max(fullViewport.width * roi.w, 20);
            const cropH = Math.max(fullViewport.height * roi.h, 20);

            const padding = 30;
            const paddedCanvas = document.createElement('canvas');
            paddedCanvas.width = Math.floor(cropW + padding * 2);
            paddedCanvas.height = Math.floor(cropH + padding * 2);
            const paddedCtx = paddedCanvas.getContext('2d');

            paddedCtx.fillStyle = '#ffffff';
            paddedCtx.fillRect(0, 0, paddedCanvas.width, paddedCanvas.height);
            paddedCtx.drawImage(fullCanvas, cropX, cropY, cropW, cropH, padding, padding, cropW, cropH);

            const width = paddedCanvas.width;
            const height = paddedCanvas.height;
            const imgData = paddedCtx.getImageData(0, 0, width, height);
            const data = imgData.data;

            const gray = new Uint8Array(width * height);
            for (let i = 0; i < data.length; i += 4) {
                let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                avg = avg < 200 ? Math.max(0, avg - 60) : 255;
                gray[i / 4] = avg;
            }

            const dilated = new Uint8Array(width * height);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let minVal = 255;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            const val = gray[(y + dy) * width + (x + dx)];
                            if (val < minVal) minVal = val;
                        }
                    }
                    dilated[y * width + x] = minVal;
                }
            }

            for (let i = 0; i < dilated.length; i++) {
                const v = dilated[i];
                const idx = i * 4;
                data[idx] = v;
                data[idx + 1] = v;
                data[idx + 2] = v;
                data[idx + 3] = 255;
            }
            paddedCtx.putImageData(imgData, 0, 0);

            const pngDataUrl = paddedCanvas.toDataURL('image/png');

            if (ocrWorkerGlobal) {
                const ret = await ocrWorkerGlobal.recognize(pngDataUrl);
                const parsed = parseNombreNumber(ret.data.text);
                if (parsed) return parsed;
            }
        } catch (err) {
            console.warn("OCR Processing Error:", err);
        }

        return null;
    }

    async function autoDetectPageNumber(page) {
        // ノンブル位置（最下部中央付近）を最優先で検索
        const rois = [
            { x: 0.15, y: 0.88, w: 0.70, h: 0.12 }, // 最下部中央領域（ノンブル位置）
            { x: 0.0,  y: 0.80, w: 1.00, h: 0.20 }, // 下部20%全体
            { x: 0.0,  y: 0.00, w: 1.00, h: 0.15 }  // 上部15%全体
        ];

        for (const roi of rois) {
            const num = await detectPageNumberFromROI(page, roi);
            if (num) return num;
        }
        return null;
    }

    async function loadPDF(event) {
        const file = event.target.files[0];
        if (!file) return;

        originalFileName = file.name.replace(/\.[^/.]+$/, "");
        showLoading(true);
        await sleep(50);

        try {
            const arrayBuffer = await file.arrayBuffer();
            loadedPdfBytes = new Uint8Array(arrayBuffer);

            const loadingTask = pdfjsLib.getDocument({
                data: loadedPdfBytes.slice(0),
                cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                cMapPacked: true,
                standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
            });
            
            pdfDocGlobal = await loadingTask.promise;
            
            const container = document.getElementById('thumbnail-container');
            container.innerHTML = '';
            pageDataList = [];

            if (typeof Tesseract !== 'undefined' && !ocrWorkerGlobal) {
                try {
                    ocrWorkerGlobal = await Tesseract.createWorker('eng');
                    await ocrWorkerGlobal.setParameters({
                        tessedit_char_whitelist: '0123456789-—– ',
                        tessedit_pageseg_mode: '6'
                    });
                } catch (e) {
                    console.warn("Tesseract Init Error:", e);
                }
            }

            for (let i = 1; i <= pdfDocGlobal.numPages; i++) {
                const page = await pdfDocGlobal.getPage(i);
                
                const detectedNum = await autoDetectPageNumber(page) || String(i);
                const suggestedName = `${originalFileName}_p${detectedNum}`;

                pageDataList.push({
                    pageNumber: i,
                    selected: false,
                    suggestedName: suggestedName,
                    detectedNum: detectedNum
                });

                const card = document.createElement('div');
                card.className = 'thumb-card';
                card.dataset.index = i - 1;

                const wrapper = document.createElement('div');
                wrapper.className = 'canvas-wrapper';

                const canvas = document.createElement('canvas');
                
                // CropBoxにトリミングされずMediaBox（全幅全高）をレンダリング
                const viewport = getFullViewport(page, 1.2);
                
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                const context = canvas.getContext('2d');
                
                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, canvas.width, canvas.height);

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport,
                    annotationMode: pdfjsLib.AnnotationMode.ENABLE
                };

                await page.render(renderContext).promise;

                const cropBox = document.createElement('div');
                cropBox.className = 'crop-box';

                wrapper.appendChild(canvas);
                wrapper.appendChild(cropBox);

                const infoDiv = document.createElement('div');
                infoDiv.className = 'thumb-info';
                infoDiv.innerHTML = `
                    <span class="badge" id="badge-${i - 1}">PDF P.${i} (本文p.${detectedNum})</span>
                    <input type="text" id="input-${i - 1}" value="${suggestedName}" onclick="event.stopPropagation()" onchange="updateFileName(${i - 1}, this.value)">
                `;

                card.appendChild(wrapper);
                card.appendChild(infoDiv);
                container.appendChild(card);

                setupDragSelection(wrapper, cropBox, i - 1, card);
                page.cleanup();
            }

            document.getElementById('process-btn').disabled = false;
        } catch (error) {
            alert("PDF読み込みエラー: " + error.message);
        } finally {
            showLoading(false);
        }
    }

    function setupDragSelection(wrapper, cropBox, pageIndex, card) {
        let isDragging = false;
        let startX = 0, startY = 0;

        wrapper.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            isDragging = true;
            const rect = wrapper.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            cropBox.style.left = startX + 'px';
            cropBox.style.top = startY + 'px';
            cropBox.style.width = '0px';
            cropBox.style.height = '0px';
            cropBox.style.display = 'block';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = wrapper.getBoundingClientRect();
            const currentX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            const currentY = Math.max(0, Math.min(e.clientY - rect.top, rect.height));

            const width = Math.abs(currentX - startX);
            const height = Math.abs(currentY - startY);
            const left = Math.min(startX, currentX);
            const top = Math.min(startY, currentY);

            cropBox.style.left = left + 'px';
            cropBox.style.top = top + 'px';
            cropBox.style.width = width + 'px';
            cropBox.style.height = height + 'px';
        });

        window.addEventListener('mouseup', async (e) => {
            if (!isDragging) return;
            isDragging = false;

            const rect = wrapper.getBoundingClientRect();
            const width = parseFloat(cropBox.style.width) || 0;
            const height = parseFloat(cropBox.style.height) || 0;

            if (width < 8 || height < 8) {
                cropBox.style.display = 'none';
                toggleSelect(pageIndex, card);
                return;
            }

            const left = parseFloat(cropBox.style.left);
            const top = parseFloat(cropBox.style.top);

            const roi = {
                x: left / rect.width,
                y: top / rect.height,
                w: width / rect.width,
                h: height / rect.height
            };

            lastSelectedROI = roi;
            document.getElementById('apply-all-btn').disabled = false;

            showLoading(true);
            await sleep(50);

            const page = await pdfDocGlobal.getPage(pageIndex + 1);
            const num = await detectPageNumberFromROI(page, roi);
            if (num) {
                updateSinglePageUI(pageIndex, num);
            }
            showLoading(false);
        });
    }

    function updateSinglePageUI(index, num) {
        const name = `${originalFileName}_p${num}`;
        pageDataList[index].suggestedName = name;
        pageDataList[index].detectedNum = num;

        const badgeEl = document.getElementById(`badge-${index}`);
        const inputEl = document.getElementById(`input-${index}`);
        if (badgeEl) badgeEl.innerText = `PDF P.${index + 1} (本文p.${num})`;
        if (inputEl) inputEl.value = name;
    }

    async function applyROIAllPages() {
        if (!lastSelectedROI || !pdfDocGlobal) return;

        showLoading(true);
        await sleep(50);

        try {
            for (let i = 0; i < pageDataList.length; i++) {
                const page = await pdfDocGlobal.getPage(i + 1);
                const num = await detectPageNumberFromROI(page, lastSelectedROI);
                if (num) {
                    updateSinglePageUI(i, num);
                }
            }
        } catch (e) {
            alert("一括処理中にエラーが発生しました: " + e.message);
        } finally {
            showLoading(false);
        }
    }

    function toggleSelect(index, cardElement) {
        pageDataList[index].selected = !pageDataList[index].selected;
        if (pageDataList[index].selected) {
            cardElement.classList.add('selected');
        } else {
            cardElement.classList.remove('selected');
        }
    }

    function updateFileName(index, value) {
        pageDataList[index].suggestedName = value;
    }

    async function executeExtraction() {
        const selectedPages = pageDataList.filter(p => p.selected);
        const lang = document.getElementById('lang-select').value;
        const dict = i18n[lang];

        if (selectedPages.length === 0) {
            alert(dict.alertNoSelect);
            return;
        }

        showLoading(true);
        await sleep(50);

        try {
            const srcDoc = await PDFLib.PDFDocument.load(loadedPdfBytes.slice(0));
            const extractedFiles = [];

            for (const item of selectedPages) {
                const newDoc = await PDFLib.PDFDocument.create();
                const [copiedPage] = await newDoc.copyPages(srcDoc, [item.pageNumber - 1]);
                newDoc.addPage(copiedPage);

                const pdfBytes = await newDoc.save();
                extractedFiles.push({
                    name: `${item.suggestedName}.pdf`,
                    bytes: pdfBytes
                });
            }

            if (extractedFiles.length === 1) {
                downloadBlob(new Blob([extractedFiles[0].bytes], { type: 'application/pdf' }), extractedFiles[0].name);
            } else {
                const zip = new JSZip();
                extractedFiles.forEach(file => {
                    zip.file(file.name, file.bytes);
                });
                const content = await zip.generateAsync({ type: 'blob' });
                downloadBlob(content, `${originalFileName}_extracted.zip`);
            }

        } catch (error) {
            alert("抽出処理エラー: " + error.message);
        } finally {
            showLoading(false);
        }
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
