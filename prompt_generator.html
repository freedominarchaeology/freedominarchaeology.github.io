<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高精度オフラインプロンプトジェネレーター</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"MS Mincho"', '"MS 明朝"', 'Hiragino Mincho ProN', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: "MS Mincho", "MS 明朝", "Hiragino Mincho ProN", serif;
        }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col selection:bg-indigo-500 selection:text-white">

    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/20">
                    AI
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">高精度オフラインプロンプトジェネレーター</h1>
                    <p class="text-xs text-slate-400">完全オフライン・メモリ最適化Webアプリ要件ビルダー</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                    完全オフライン動作
                </span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Input Form -->
        <section class="lg:col-span-6 bg-slate-950/60 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800/80">
                    <h2 class="text-lg font-bold text-white flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        アプリ要件の入力
                    </h2>
                    <button type="button" onclick="resetForm()" class="text-xs text-slate-400 hover:text-red-400 font-medium transition-colors">クリア</button>
                </div>

                <form id="promptForm" class="space-y-4" onsubmit="return false;">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-1.5">
                            アプリのタイトル / 概要 <span class="text-indigo-400">*</span>
                        </label>
                        <input type="text" id="appTitle" class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all" placeholder="例：ドラッグ＆ドロップ対応タスク管理カンバンボードアプリ">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-1.5">
                            主な機能要件（箇条書き）
                        </label>
                        <textarea id="appFeatures" rows="3" class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all" placeholder="例：&#10;・タスクの追加、編集、削除&#10;・ローカルストレージへの自動保存&#10;・検索およびフィルター機能"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-1.5">
                            デザイン・UI/UXの要望
                        </label>
                        <textarea id="appDesign" rows="2" class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all" placeholder="例：ダークモード基調のスタイリッシュなモダンデザイン、レスポンシブ対応"></textarea>
                    </div>

                    <!-- Additional language requirement selector -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-1.5">
                            標準対応言語（複数選択可 / 生成プロンプトに反映）
                        </label>
                        <div class="grid grid-cols-3 gap-2 bg-slate-900 p-3 rounded-xl border border-slate-700 text-xs">
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="lang" value="日本語" checked class="rounded text-indigo-600 focus:ring-indigo-500"><span>日本語</span></label>
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="lang" value="英語" checked class="rounded text-indigo-600 focus:ring-indigo-500"><span>英語</span></label>
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="lang" value="中国語" checked class="rounded text-indigo-600 focus:ring-indigo-500"><span>中国語</span></label>
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="lang" value="韓国語" checked class="rounded text-indigo-600 focus:ring-indigo-500"><span>韓国語</span></label>
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="lang" value="フランス語" checked class="rounded text-indigo-600 focus:ring-indigo-500"><span>フランス語</span></label>
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="lang" value="スペイン語" checked class="rounded text-indigo-600 focus:ring-indigo-500"><span>スペイン語</span></label>
                        </div>
                    </div>
                </form>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-800/80">
                <button type="button" onclick="generatePrompt()" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-200 transform active:scale-98 flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span>完璧なプロンプトを生成する</span>
                </button>
            </div>
        </section>

        <!-- Right Column: Output & Actions -->
        <section class="lg:col-span-6 bg-slate-950/60 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800/80">
                    <h2 class="text-lg font-bold text-white flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        生成されたプロンプト
                    </h2>
                    <span id="charCount" class="text-xs text-slate-400 font-mono">0文字</span>
                </div>

                <div class="relative">
                    <textarea id="promptOutput" readonly rows="16" class="w-full rounded-xl border border-slate-800 bg-slate-900 p-4 font-mono text-xs text-slate-300 leading-relaxed focus:outline-none resize-none shadow-inner" placeholder="左側のフォームを入力して「完璧なプロンプトを生成する」ボタンを押してください..."></textarea>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-800/80 grid grid-cols-2 gap-3">
                <button type="button" onclick="copyPrompt()" class="py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-all duration-200 shadow-sm flex items-center justify-center space-x-2 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    <span>クリップボードにコピー</span>
                </button>
                <button type="button" onclick="downloadPrompt()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl transition-all duration-200 border border-slate-700 flex items-center justify-center space-x-2 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>(.txt)で保存</span>
                </button>
            </div>
        </section>

    </main>

    <footer class="mt-auto py-6 text-center text-xs text-slate-500 border-t border-slate-800 bg-slate-950/80">
        <p>高精度オフラインプロンプトジェネレーター &copy; 2026 - メモリ最適化・堅牢セキュア設計</p>
    </footer>

    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 text-white text-sm py-2.5 px-6 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center space-x-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMessage">通知メッセージ</span>
    </div>

    <script>
        /**
         * プロンプト生成コアロジック
         * ユーザーの入力内容と指定された厳しい要件群を合成して完璧なプロンプトを作成します。
         */
        function generatePrompt() {
            try {
                const title = document.getElementById('appTitle').value.trim();
                const features = document.getElementById('appFeatures').value.trim();
                const design = document.getElementById('appDesign').value.trim();

                // 選択された言語の収集
                const selectedLangs = [];
                document.querySelectorAll('input[name="lang"]:checked').forEach(cb => {
                    selectedLangs.push(cb.value);
                });

                if (!title) {
                    showToast('「アプリのタイトル / 概要」を入力してください。');
                    document.getElementById('appTitle').focus();
                    return;
                }

                const langsStr = selectedLangs.length > 0 ? selectedLangs.join('・') : '日本語・英語';

                // 合成プロンプト文字列の構築
                const promptText = `【役割（Role）】
あなたは優秀なフロントエンドエンジニアです。以下の厳格な制約および要件をすべて満たす完全なWebアプリケーションを作成してください。

【目的・概要（Goal）】
${title}

【機能要件（Features）】
${features ? features.split('\n').map((item, idx) => `${idx + 1}. ${item.trim()}`).join('\n') : '1. 直感的でスムーズな操作ができる基本機能一式'}

【デザイン・UI/UX要件（Design/UI）】
- ${design || 'モダンで洗練された美しいデザイン'}
- レスポンシブ対応（スマートフォン、タブレット、PC全画面対応）
- Tailwind CSS（CDN経由）を使用して視覚的に美しいUIに整えてください。

【厳格な技術制約と品質基準（Technical Constraints & Standards）】
1. 完全オフライン対応の単一HTML形式:
   - すべてのHTML、CSS、JavaScriptコードを「単一のHTMLファイル（index.html）」内にすべてまとめて記述してください。外部ファイルへの分割は禁止します。
   - 外部CDNを利用する場合でも、完全オフライン環境においてページレイアウトが絶対に崩れない堅牢なレイアウト構造にしてください。

2. メモリ最適化と即時解放:
   - 使用するメモリは常に最小限に抑え、不要となった変数、DOM参照、タイマー、イベントリスナーはガベージコレクションが効くように即時破棄・解放できる設計（メモリリーク防止）にしてください。

3. 堅牢性とセキュアな設計:
   - セキュアで堅牢なコードを書き、入力値のバリデーションや例外処理（try-catchブロック）を徹底してください。

4. フォントおよび文字化け防止:
   - フォントには汎用的なシステムフォントおよび「MS明朝（"MS Mincho", "MS 明朝", "Hiragino Mincho ProN", serif）」を指定し、文字化けが一切起きないようにしてください。
   - HTMLのhead内には必ず <meta charset="UTF-8"> を記述してください。

5. 多言語対応（i18n）:
   - 画面上に「言語選択ドロップダウン」を配置し、多言語対応（${langsStr}）を実装してください。
   - ドロップダウンで言語を切り替えた際、即座に画面上のテキストが選択された言語に動的に切り替わる仕組みを組み込んでください。

6. コードの完全性とエラー検証:
   - 省略コード（...など）やプレースホルダーは一切使用せず、すぐにブラウザで実行可能な「完全なHTMLコード」をフルサイズで出力してください。
   - 出力前に構文エラーやロジックバグがないかを自己検証し、メモリ適正化が十分に図られていることを確認してください。

【出力の流れ（Output Format）】
- 解説文は最小限にし、コードブロックに完成した単一HTMLコードのみを出力してください。`;

                const outputElem = document.getElementById('promptOutput');
                outputElem.value = promptText;
                document.getElementById('charCount').textContent = promptText.length + '文字';

                showToast('完璧なプロンプトを生成しました！');

                // メモリ適正化のための一時変数解放
                // GCに優しいクリーンアップ
            } catch (err) {
                console.error('Prompt generation error:', err);
                showToast('プロンプト生成中にエラーが発生しました。');
            }
        }

        /**
         * クリップボードコピー機能
         */
        function copyPrompt() {
            const outputElem = document.getElementById('promptOutput');
            const text = outputElem.value;

            if (!text) {
                showToast('コピーするプロンプトがありません。');
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('クリップボードにコピーしました！');
                }).catch(() => {
                    fallbackCopy(outputElem);
                });
            } else {
                fallbackCopy(outputElem);
            }
        }

        /**
         * フォールバックコピー
         */
        function fallbackCopy(element) {
            element.select();
            try {
                document.execCommand('copy');
                showToast('クリップボードにコピーしました！');
            } catch (err) {
                showToast('コピーに失敗しました。手動で選択してコピーしてください。');
            }
        }

        /**
         * テキストファイル(.txt)としてダウンロード
         */
        function downloadPrompt() {
            const text = document.getElementById('promptOutput').value;
            if (!text) {
                showToast('ダウンロードするプロンプトがありません。');
                return;
            }

            try {
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ai_offline_app_prompt.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast('プロンプトファイルをダウンロードしました！');
            } catch (err) {
                console.error('Download error:', err);
                showToast('ダウンロードに失敗しました。');
            }
        }

        /**
         * フォームリセット
         */
        function resetForm() {
            document.getElementById('appTitle').value = '';
            document.getElementById('appFeatures').value = '';
            document.getElementById('appDesign').value = '';
            document.getElementById('promptOutput').value = '';
            document.getElementById('charCount').textContent = '0文字';
            showToast('入力内容をリセットしました。');
        }

        /**
         * トースト通知表示
         */
        function showToast(message) {
            const toast = document.getElementById('toast');
            const messageSpan = document.getElementById('toastMessage');
            messageSpan.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
