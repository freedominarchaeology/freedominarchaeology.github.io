<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本国内土木工事概要設計アプリ | Civil Engineering Design App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: "MS Mincho", "MS 明朝", "Hiragino Mincho ProN", ui-serif, Georgia, serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .sans-text {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        /* Print styles */
        @media print {
            body {
                background-color: #ffffff;
            }
            no-print {
                display: none;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hard-hat text-amber-400 text-2xl"></i>
                <h1 class="text-xl sm:text-2xl font-bold tracking-wider" data-i18n="app_title">日本国内土木工事概要設計アプリ（史跡整備特化）</h1>
            </div>
            <div class="flex items-center space-x-3">
                <label for="languageSelect" class="sans-text text-sm text-slate-300 flex items-center gap-1">
                    <i class="fa-solid fa-globe"></i> <span data-i18n="lang_label">言語:</span>
                </label>
                <select id="languageSelect" onchange="changeLanguage(this.value)" class="sans-text bg-slate-800 border border-slate-700 text-white text-sm rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ko">한국어</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Input Form -->
        <section class="lg:col-span-5 bg-white rounded-lg shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between border-b pb-3 mb-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-blue-600"></i>
                        <span data-i18n="form_heading">整備完成状況・条件入力</span>
                    </h2>
                    <span class="sans-text text-xs bg-blue-50 text-blue-700 font-semibold px-2.5 py-1 rounded border border-blue-200" data-i18n="badge_reverse">逆算設計方式</span>
                </div>

                <form id="designForm" class="space-y-4" onsubmit="event.preventDefault(); calculateDesign();">
                    <!-- Project Name -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_project_name">工事名称</label>
                        <input type="text" id="projectName" value="史跡〇〇公園整備工事（第1期）" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>

                    <!-- Target Completion Status -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_completion_status">完成状態（ゴール）の選択</label>
                        <select id="completionStatus" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="updateDefaultValues()">
                            <option value="stone_wall" data-i18n="opt_stone_wall">石垣復元および周辺盛土・芝生化</option>
                            <option value="path_paving" data-i18n="opt_path_paving">園路整備（バリアフリー石畳・透水性舗装）</option>
                            <option value="ruins_protection" data-i18n="opt_ruins_protection">遺構保護盛土および表土剥ぎ・整地</option>
                            <option value="plaza_grading" data-i18n="opt_plaza_grading">史跡広場造成・排水施設整備</option>
                        </select>
                    </div>

                    <!-- Volume / Scale -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_soil_volume">設計土量 (m³)</label>
                            <input type="number" id="soilVolume" value="1200" min="10" max="100000" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_area">施工面積 (m²)</label>
                            <input type="number" id="workArea" value="2500" min="10" max="500000" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                    </div>

                    <!-- Soil Condition & Constraints -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_soil_type">土質・地盤区分</label>
                            <select id="soilType" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="normal" data-i18n="soil_normal">第1種・第2種土砂（普通土）</option>
                                <option value="soft_rock" data-i18n="soil_soft_rock">軟岩（リッパ施工）</option>
                                <option value="cultural" data-i18n="soil_cultural">文化財保護（手掘り・小型重機併用）</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_dump_distance">ダンプ運搬距離 (km)</label>
                            <input type="number" id="dumpDistance" value="15" min="1" max="100" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                    </div>

                    <!-- Execution Button -->
                    <button type="submit" class="sans-text w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200 flex items-center justify-center gap-2 shadow mt-4">
                        <i class="fa-solid fa-calculator"></i>
                        <span data-i18n="btn_calculate">逆算設計・積算書作成を実行</span>
                    </button>
                </form>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-200 text-xs text-slate-500 sans-text">
                <p><i class="fa-solid fa-circle-info text-blue-500"></i> <span data-i18n="footer_notice">国交省・地方自治体土木工事積算基準書および文化庁「史跡等の整備にあたってのガイドライン」準拠</span></p>
            </div>
        </section>

        <!-- Right Column: Results & Specifications -->
        <section class="lg:col-span-7 bg-white rounded-lg shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
            <div id="resultContainer" class="space-y-6">
                <div class="flex items-center justify-between border-b pb-3">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-file-invoice text-amber-600"></i>
                        <span data-i18n="result_heading">概要設計書・作業工程・積算骨格</span>
                    </h2>
                    <button onclick="window.print()" class="sans-text no-print text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded border border-slate-300 flex items-center gap-1 transition">
                        <i class="fa-solid fa-print"></i> <span data-i18n="btn_print">印刷 / PDF保存</span>
                    </button>
                </div>

                <!-- Initial Placeholder / Output Area -->
                <div id="outputContent" class="space-y-6 text-sm">
                    <div class="p-4 bg-amber-50 border border-amber-200 rounded text-amber-800">
                        <p class="font-bold mb-1"><i class="fa-solid fa-triangle-exclamation"></i> <span data-i18n="init_msg_title">設計実行待ち</span></p>
                        <p class="sans-text text-xs" data-i18n="init_msg_desc">左側のフォームから「整備完成状況」および条件を入力し、「逆算設計・積算書作成を実行」ボタンを押してください。</p>
                    </div>

                    <div class="opacity-50 space-y-4 pointer-events-none">
                        <div class="bg-slate-50 p-4 rounded border border-slate-200">
                            <h3 class="font-bold text-slate-700 mb-2">1. 逆算工種フロー（完成状態からの逆算）</h3>
                            <div class="h-4 bg-slate-200 rounded w-3/4 mb-2"></div>
                            <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded border border-slate-200">
                            <h3 class="font-bold text-slate-700 mb-2">2. 必要機械・人員リスト</h3>
                            <div class="h-4 bg-slate-200 rounded w-full mb-2"></div>
                            <div class="h-4 bg-slate-200 rounded w-5/6"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Metadata info -->
            <div class="mt-6 pt-4 border-t border-slate-200 flex justify-between items-center text-xs text-slate-400 sans-text">
                <span id="generationTime">Generated: -</span>
                <span>Version 2.6.0-stable</span>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-100 border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 sans-text">
            &copy; 2026 日本国内土木工事概要設計アプリ All Rights Reserved.
        </div>
    </footer>

        let currentLang = 'ja';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            if (!t) return;

            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });

            // If calculation has already been run, re-render results in new language
            if (window.lastCalculationData) {
                renderResults(window.lastCalculationData);
            }
        }

        function updateDefaultValues() {
            const status = document.getElementById('completionStatus').value;
            const volInput = document.getElementById('soilVolume');
            const areaInput = document.getElementById('workArea');
            
            if (status === 'stone_wall') {
                volInput.value = 1500;
                areaInput.value = 2000;
            } else if (status === 'path_paving') {
                volInput.value = 400;
                areaInput.value = 3500;
            } else if (status === 'ruins_protection') {
                volInput.value = 2500;
                areaInput.value = 5000;
            } else if (status === 'plaza_grading') {
                volInput.value = 1000;
                areaInput.value = 1800;
            }
        }

        function calculateDesign() {
            try {
                const projectName = document.getElementById('projectName').value.trim();
                const status = document.getElementById('completionStatus').value;
                const volume = parseFloat(document.getElementById('soilVolume').value);
                const area = parseFloat(document.getElementById('workArea').value);
                const soilType = document.getElementById('soilType').value;
                const distance = parseFloat(document.getElementById('dumpDistance').value);

                if (isNaN(volume) || isNaN(area) || isNaN(distance)) {
                    alert("有効な数値を入力してください。");
                    return;
                }

                // Reverse engineering logic to determine work items, machinery, and personnel
                let mach1 = "バックホウ (0.45m³山積)", mach2 = "10tダンプトラック", mach3 = "振動ローラー (4t)";
                let pers1 = "特殊作業員 (文化財対応) 2名", pers2 = "普通作業員 3名", pers3 = "施工管理技士 1名";

                if (soilType === 'cultural') {
                    mach1 = "小型バックホウ (0.1m³)", mach2 = "2tダンプトラック", mach3 = "ハンドガイドローラー";
                    pers1 = "文化財専門作業員 5名", pers2 = "普通作業員 4名", pers3 = "主任技術者(土木) 1名";
                } else if (soilType === 'soft_rock') {
                    mach1 = "ブルドーザ (リッパ付 15t)", mach2 = "10tダンプトラック", mach3 = "タイヤローラー (8-20t)";
                    pers1 = "発破技士/重機オペ 2名", pers2 = "普通作業員 2名", pers3 = "監理技術者 1名";
                }

                // Cost estimation model based on MLIT standards (mock proportional calculation)
                const directCost = Math.round(volume * 4500 + area * 2800 + distance * 15000);
                const tempCost = Math.round(directCost * 0.10);
                const siteCost = Math.round(directCost * 0.15);
                const totalCost = directCost + tempCost + siteCost;

                const data = {
                    projectName,
                    status,
                    volume,
                    area,
                    soilType,
                    distance,
                    mach1, mach2, mach3,
                    pers1, pers2, pers3,
                    directCost, tempCost, siteCost, totalCost
                };

                window.lastCalculationData = data;
                renderResults(data);

                // Update generation timestamp
                const now = new Date();
                document.getElementById('generationTime').textContent = `Generated: ${now.toLocaleString()}`;

            } catch (error) {
                console.error("Calculation Error:", error);
                alert("計算処理中にエラーが発生しました。入力内容を確認してください。");
            }
        }

        function renderResults(data) {
            const t = translations[currentLang];
            const container = document.getElementById('outputContent');

            const statusText = document.querySelector(`#completionStatus option[value="${data.status}"]`)?.textContent || data.status;
            const soilText = document.querySelector(`#soilType option[value="${data.soilType}"]`)?.textContent || data.soilType;

            container.innerHTML = `
                <div class="bg-blue-50 border border-blue-200 rounded p-4 text-slate-800 space-y-2">
                    <h3 class="font-bold text-blue-900 text-base">${t.res_title}</h3>
                    <p><strong>${t.label_project_name}:</strong> ${escapeHTML(data.projectName)}</p>
                    <p><strong>${t.label_completion_status}:</strong> ${escapeHTML(statusText)}</p>
                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 mt-2 pt-2 border-t border-blue-200">
                        <span>${t.label_soil_volume}: <strong>${data.volume.toLocaleString()} m³</strong></span>
                        <span>${t.label_area}: <strong>${data.area.toLocaleString()} m²</strong></span>
                        <span>${t.label_soil_type}: <strong>${escapeHTML(soilText)}</strong></span>
                        <span>${t.label_dump_distance}: <strong>${data.distance} km</strong></span>
                    </div>
                </div>

                <!-- Section 1: Reverse Workflow -->
                <div class="space-y-2">
                    <h4 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-rotate-left text-blue-600"></i> ${t.sec1}
                    </h4>
                    <ol class="list-decimal list-inside space-y-1 text-xs bg-slate-50 p-3 rounded border border-slate-200">
                        <li><strong>${t.item_prep}</strong>：現地測量、文化財試掘調査、仮囲い設置</li>
                        <li><strong>${t.item_exc}</strong>：${escapeHTML(soilText)}による表土剥ぎおよび土工掘削</li>
                        <li><strong>${t.item_trans}</strong>：${escapeHTML(data.mach2)}による残土処分場・土捨場への搬送 (${data.distance}km)</li>
                        <li><strong>${t.item_fill}</strong>：敷均し、バックホウおよび${escapeHTML(data.mach3)}による締固め</li>
                        <li><strong>${t.item_finish}</strong>：完成形状確認、表面整正および環境美化</li>
                    </ol>
                </div>

                <!-- Section 2: Machinery & Personnel -->
                <div class="space-y-2">
                    <h4 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-truck-monster text-amber-600"></i> ${t.sec2}
                    </h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border border-slate-200">
                            <thead class="bg-slate-100 text-slate-700 border-b">
                                <tr>
                                    <th class="p-2 border-r">${t.table_work_item}</th>
                                    <th class="p-2 border-r">${t.table_machinery}</th>
                                    <th class="p-2">${t.table_personnel}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="border-b">
                                    <td class="p-2 border-r">${t.item_exc}</td>
                                    <td class="p-2 border-r">${escapeHTML(data.mach1)}</td>
                                    <td class="p-2">${escapeHTML(data.pers1)}</td>
                                </tr>
                                <tr class="border-b">
                                    <td class="p-2 border-r">${t.item_trans}</td>
                                    <td class="p-2 border-r">${escapeHTML(data.mach2)} (3台)</td>
                                    <td class="p-2">運転手 3名</td>
                                </tr>
                                <tr>
                                    <td class="p-2 border-r">${t.item_fill}</td>
                                    <td class="p-2 border-r">${escapeHTML(data.mach3)}</td>
                                    <td class="p-2">${escapeHTML(data.pers2)}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Section 3: Cost Estimation Structure -->
                <div class="space-y-2">
                    <h4 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-yen-sign text-emerald-600"></i> ${t.sec3}
                    </h4>
                    <div class="bg-slate-50 p-3 rounded border border-slate-200 text-xs space-y-1.5">
                        <div class="flex justify-between py-1 border-b border-slate-200">
                            <span>${t.unit_price_direct}</span>
                            <span class="font-mono font-bold">¥ ${data.directCost.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between py-1 border-b border-slate-200 text-slate-600">
                            <span>${t.unit_temp}</span>
                            <span class="font-mono">¥ ${data.tempCost.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between py-1 border-b border-slate-200 text-slate-600">
                            <span>${t.unit_site}</span>
                            <span class="font-mono">¥ ${data.siteCost.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between py-1.5 text-sm font-bold text-slate-900 bg-amber-100/50 px-2 rounded">
                            <span>${t.unit_total}</span>
                            <span class="font-mono text-emerald-700">¥ ${data.totalCost.toLocaleString()}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // XSS Prevention Utility
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initial default execution on load
        window.addEventListener('DOMContentLoaded', () => {
            try {
                calculateDesign();
            } catch (e) {
                console.error("Init error:", e);
            }
        });
    </script>
