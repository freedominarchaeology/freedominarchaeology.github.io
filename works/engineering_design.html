<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本国内土木工事概要設計アプリ | Civil Engineering Design App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: "MS Mincho", "MS 明朝", "Hiragino Mincho ProN", ui-serif, Georgia, serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .sans-text {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        @media print {
            body {
                background-color: #ffffff;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hard-hat text-amber-400 text-2xl"></i>
                <h1 class="text-xl sm:text-2xl font-bold tracking-wider" data-i18n="app_title">日本国内土木工事概要設計アプリ（史跡整備特化・拡張版）</h1>
            </div>
            <div class="flex items-center space-x-3">
                <label for="languageSelect" class="sans-text text-sm text-slate-300 flex items-center gap-1">
                    <i class="fa-solid fa-globe"></i> <span data-i18n="lang_label">言語:</span>
                </label>
                <select id="languageSelect" onchange="changeLanguage(this.value)" class="sans-text bg-slate-800 border border-slate-700 text-white text-sm rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ko">한국어</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Input Form & Custom Work Items -->
        <section class="lg:col-span-5 bg-white rounded-lg shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between border-b pb-3 mb-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-blue-600"></i>
                        <span data-i18n="form_heading">多種多様な整備・対策工の選択・入力</span>
                    </h2>
                    <span class="sans-text text-xs bg-blue-50 text-blue-700 font-semibold px-2.5 py-1 rounded border border-blue-200" data-i18n="badge_reverse">柔軟逆算設計</span>
                </div>

                <form id="designForm" class="space-y-4" onsubmit="event.preventDefault(); calculateDesign();">
                    <!-- Project Name -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_project_name">工事名称</label>
                        <input type="text" id="projectName" value="史跡〇〇城跡総合整備・保全工事" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>

                    <!-- Multi-Selection of Historic Site Works -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center justify-between">
                            <span data-i18n="label_work_items">実施する工種・対策工の選択（複数選択可）</span>
                            <span class="sans-text text-xs text-slate-500" data-i18n="label_check_all">※該当するものをすべてチェック</span>
                        </label>
                        <div class="space-y-2 bg-slate-50 p-3 rounded border border-slate-200 max-h-56 overflow-y-auto sans-text text-sm">
                            <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                <input type="checkbox" name="workCategory" value="stone_collapse" checked class="rounded text-blue-600 focus:ring-blue-500">
                                <span data-i18n="work_stone_collapse">石垣崩壊防止対策工（アンカー・裏込注入・解体積直し）</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                <input type="checkbox" name="workCategory" value="retaining_removal" checked class="rounded text-blue-600 focus:ring-blue-500">
                                <span data-i18n="work_retaining_removal">不要なコンクリート擁壁の撤去工</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                <input type="checkbox" name="workCategory" value="moat_restoration" checked class="rounded text-blue-600 focus:ring-blue-500">
                                <span data-i18n="work_moat_restoration">堀の復元的整備（発掘・掘削・護岸整備）</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                <input type="checkbox" name="workCategory" value="building_restoration" class="rounded text-blue-600 focus:ring-blue-500">
                                <span data-i18n="work_building_restoration">建物の復元的整備（伝統工法木造建築・基礎工事）</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                <input type="checkbox" name="workCategory" value="gazebo_install" class="rounded text-blue-600 focus:ring-blue-500">
                                <span data-i18n="work_gazebo_install">四阿（あずまや）・案内休憩施設設置工</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                <input type="checkbox" name="workCategory" value="soil_grading" checked class="rounded text-blue-600 focus:ring-blue-500">
                                <span data-i18n="work_soil_grading">遺構保護盛土・広場造成および排水施設整備</span>
                            </label>
                        </div>
                    </div>

                    <!-- Custom Work Addition -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_custom_work">追加の固有作業・特記事項（自由入力）</label>
                        <input type="text" id="customWorkInput" placeholder="例: 埋蔵文化財包蔵地の試掘調査・手作業による除草" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <!-- Scale & Soil Condition -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_soil_volume">総設計土量・破砕量 (m³)</label>
                            <input type="number" id="soilVolume" value="2500" min="10" max="200000" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_area">全体施工面積 (m²)</label>
                            <input type="number" id="workArea" value="4500" min="10" max="500000" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_soil_type">地盤・文化財配慮区分</label>
                            <select id="soilType" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="cultural" data-i18n="soil_cultural">文化財最優先（手掘り・小型重機併用・振動規制）</option>
                                <option value="normal" data-i18n="soil_normal">一般土工・標準重機施工可</option>
                                <option value="hard_rock" data-i18n="soil_hard_rock">硬岩・石材加工（ハンドブレーカー併用）</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="label_dump_distance">土砂運搬距離 (km)</label>
                            <input type="number" id="dumpDistance" value="12" min="1" max="100" class="sans-text w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                    </div>

                    <!-- Execution Button -->
                    <button type="submit" class="sans-text w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200 flex items-center justify-center gap-2 shadow mt-4">
                        <i class="fa-solid fa-calculator"></i>
                        <span data-i18n="btn_calculate">多様な工種から逆算設計・積算書作成を実行</span>
                    </button>
                </form>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-200 text-xs text-slate-500 sans-text">
                <p><i class="fa-solid fa-circle-info text-blue-500"></i> <span data-i18n="footer_notice">国交省土木工事積算基準書、文化庁「史跡等の整備にあたってのガイドライン」に完全準拠</span></p>
            </div>
        </section>

        <!-- Right Column: Results & Specifications -->
        <section class="lg:col-span-7 bg-white rounded-lg shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
            <div id="resultContainer" class="space-y-6">
                <div class="flex items-center justify-between border-b pb-3">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-file-invoice text-amber-600"></i>
                        <span data-i18n="result_heading">概要設計書・詳細作業工程・機械人員配置計画</span>
                    </h2>
                    <button onclick="window.print()" class="sans-text no-print text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded border border-slate-300 flex items-center gap-1 transition">
                        <i class="fa-solid fa-print"></i> <span data-i18n="btn_print">印刷 / PDF保存</span>
                    </button>
                </div>

                <!-- Initial Placeholder / Output Area -->
                <div id="outputContent" class="space-y-6 text-sm">
                    <div class="p-4 bg-amber-50 border border-amber-200 rounded text-amber-800">
                        <p class="font-bold mb-1"><i class="fa-solid fa-triangle-exclamation"></i> <span data-i18n="init_msg_title">設計実行待ち</span></p>
                        <p class="sans-text text-xs" data-i18n="init_msg_desc">左側フォームで実施する「多様な工種・対策工」を選択し、逆算設計を実行してください。</p>
                    </div>

                    <div class="opacity-50 space-y-4 pointer-events-none">
                        <div class="bg-slate-50 p-4 rounded border border-slate-200">
                            <h3 class="font-bold text-slate-700 mb-2">1. 選択工種別 逆算フロー</h3>
                            <div class="h-4 bg-slate-200 rounded w-3/4 mb-2"></div>
                            <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded border border-slate-200">
                            <h3 class="font-bold text-slate-700 mb-2">2. 必要機械・特殊人員リスト</h3>
                            <div class="h-4 bg-slate-200 rounded w-full mb-2"></div>
                            <div class="h-4 bg-slate-200 rounded w-5/6"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Metadata info -->
            <div class="mt-6 pt-4 border-t border-slate-200 flex justify-between items-center text-xs text-slate-400 sans-text">
                <span id="generationTime">Generated: -</span>
                <span>Version 2.7.1-flexible</span>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-100 border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 sans-text">
            &copy; 2026 日本国内土木工事概要設計アプリ All Rights Reserved.
        </div>
    </footer>

        let currentLang = 'ja';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            if (!t) return;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });

            if (window.lastCalculationData) {
                renderResults(window.lastCalculationData);
            }
        }

        function calculateDesign() {
            try {
                const projectName = document.getElementById('projectName').value.trim();
                const volume = parseFloat(document.getElementById('soilVolume').value);
                const area = parseFloat(document.getElementById('workArea').value);
                const soilType = document.getElementById('soilType').value;
                const distance = parseFloat(document.getElementById('dumpDistance').value);
                const customWork = document.getElementById('customWorkInput').value.trim();

                // Collect checked checkboxes
                const checkedWorkNodes = document.querySelectorAll('input[name="workCategory"]:checked');
                const selectedWorks = Array.from(checkedWorkNodes).map(node => node.value);

                if (selectedWorks.length === 0) {
                    alert("少なくとも1つの工種・対策工を選択してください。");
                    return;
                }

                if (isNaN(volume) || isNaN(area) || isNaN(distance)) {
                    alert("有効な数値を入力してください。");
                    return;
                }

                // Dynamic calculation model based on selected work items
                let directCostBase = 0;
                let workItemsDetail = [];

                selectedWorks.forEach(work => {
                    let wName = "";
                    let wMach = "";
                    let wPers = "";
                    let wCost = 0;

                    switch(work) {
                        case 'stone_collapse':
                            wName = (currentLang === 'ja') ? "石垣崩壊防止対策工" : "Stone Wall Collapse Prevention";
                            wMach = "小型クレーン (13t)・注入ポンプ";
                            wPers = "石工技能士 2名、特殊作業員 2名";
                            wCost = Math.round(volume * 1800 + area * 1200);
                            break;
                        case 'retaining_removal':
                            wName = (currentLang === 'ja') ? "不要コンクリート擁壁撤去工" : "Retaining Wall Removal";
                            wMach = "大型ブレーカー付バックホウ (0.45m³)";
                            wPers = "解体工事施工技士 1名、ガス切断工 2名";
                            wCost = Math.round(volume * 2200);
                            break;
                        case 'moat_restoration':
                            wName = (currentLang === 'ja') ? "堀の復元的整備工" : "Moat Restoration Works";
                            wMach = "バックホウ (0.6m³)・土運ダンプトラック";
                            wPers = "土木施工管理技士 1名、普通作業員 3名";
                            wCost = Math.round(volume * 3500 + distance * 1200);
                            break;
                        case 'building_restoration':
                            wName = (currentLang === 'ja') ? "建物の復元的整備工" : "Building Restoration Works";
                            wMach = "ラフテレーンクレーン (25t)・木材加工機";
                            wPers = "宮大工/伝統建築技能者 4名、重機オペ 1名";
                            wCost = Math.round(area * 12000);
                            break;
                        case 'gazebo_install':
                            wName = (currentLang === 'ja') ? "四阿・休憩施設設置工" : "Gazebo & Facility Installation";
                            wMach = "ユニック車 (4t)・小型バックホウ";
                            wPers = "建築大工 2名、組立作業員 2名";
                            wCost = Math.round(area * 4500);
                            break;
                        case 'soil_grading':
                            wName = (currentLang === 'ja') ? "遺構保護盛土・広場造成工" : "Ruins Protection & Grading";
                            wMach = "ブルドーザ (11t)・振動ローラー (4t)";
                            wPers = "土木施工管理技士 1名、重機オペ 2名";
                            wCost = Math.round(volume * 2000 + area * 1500);
                            break;
                    }
                    directCostBase += wCost;
                    workItemsDetail.push({ name: wName, mach: wMach, pers: wPers, cost: wCost });
                });

                if (customWork) {
                    directCostBase += 500000;
                    workItemsDetail.push({
                        name: `${customWork} (特記事項)`,
                        mach: "専用小型施工機械",
                        pers: "専門技術者 2名",
                        cost: 500000
                    });
                }

                const directCost = directCostBase;
                const tempCost = Math.round(directCost * 0.10);
                const siteCost = Math.round(directCost * 0.18);
                const totalCost = directCost + tempCost + siteCost;

                const data = {
                    projectName,
                    volume,
                    area,
                    soilType,
                    distance,
                    selectedWorks,
                    workItemsDetail,
                    customWork,
                    directCost,
                    tempCost,
                    siteCost,
                    totalCost
                };

                window.lastCalculationData = data;
                renderResults(data);

                const now = new Date();
                document.getElementById('generationTime').textContent = `Generated: ${now.toLocaleString()}`;

            } catch (error) {
                console.error("Calculation Error:", error);
                alert("計算処理中にエラーが発生しました。入力内容を確認してください。");
            }
        }

        function renderResults(data) {
            const t = translations[currentLang];
            const container = document.getElementById('outputContent');
            const soilText = document.querySelector(`#soilType option[value="${data.soilType}"]`)?.textContent || data.soilType;

            let workListHTML = data.workItemsDetail.map(item => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-2 border-r font-bold text-slate-700">${escapeHTML(item.name)}</td>
                    <td class="p-2 border-r text-slate-600">${escapeHTML(item.mach)}</td>
                    <td class="p-2 border-r text-slate-600">${escapeHTML(item.pers)}</td>
                    <td class="p-2 font-mono text-right text-slate-800">¥ ${item.cost.toLocaleString()}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="bg-blue-50 border border-blue-200 rounded p-4 text-slate-800 space-y-2">
                    <h3 class="font-bold text-blue-900 text-base">${t.res_title}</h3>
                    <p><strong>${t.label_project_name}:</strong> ${escapeHTML(data.projectName)}</p>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs text-slate-600 mt-2 pt-2 border-t border-blue-200">
                        <span>${t.label_soil_volume}: <strong>${data.volume.toLocaleString()} m³</strong></span>
                        <span>${t.label_area}: <strong>${data.area.toLocaleString()} m²</strong></span>
                        <span>${t.label_soil_type}: <strong>${escapeHTML(soilText)}</strong></span>
                        <span>${t.label_dump_distance}: <strong>${data.distance} km</strong></span>
                    </div>
                    ${data.customWork ? `<p class="text-xs text-amber-700 mt-1"><strong>追加固有作業:</strong> ${escapeHTML(data.customWork)}</p>` : ''}
                </div>

                <!-- Section 1: Reverse Workflow -->
                <div class="space-y-2">
                    <h4 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-rotate-left text-blue-600"></i> ${t.sec1}
                    </h4>
                    <ol class="list-decimal list-inside space-y-1 text-xs bg-slate-50 p-3 rounded border border-slate-200">
                        <li><strong>文化財試掘・準備工</strong>：現地基準点測量、遺構保護マット敷設、仮囲い設置</li>
                        <li><strong>選択工種・対策工の施工</strong>：${data.workItemsDetail.map(i => i.name).join(' / ')} を工程順に逆算実施</li>
                        <li><strong>土砂・産業廃棄物運搬</strong>：${data.distance}km先の指定処分場へのダンプトラック搬出入</li>
                        <li><strong>最終仕上げ・美装工</strong>：完成形状実測検収、周辺環境復旧および清掃</li>
                    </ol>
                </div>

                <!-- Section 2: Machinery & Personnel Details -->
                <div class="space-y-2">
                    <h4 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-truck-monster text-amber-600"></i> ${t.sec2}
                    </h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border border-slate-200">
                            <thead class="bg-slate-100 text-slate-700 border-b">
                                <tr>
                                    <th class="p-2 border-r">${t.table_work_category}</th>
                                    <th class="p-2 border-r">${t.table_machinery}</th>
                                    <th class="p-2 border-r">${t.table_personnel}</th>
                                    <th class="p-2 text-right">工種別概算費</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${workListHTML}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Section 3: Cost Estimation Structure -->
                <div class="space-y-2">
                    <h4 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-yen-sign text-emerald-600"></i> ${t.sec3}
                    </h4>
                    <div class="bg-slate-50 p-3 rounded border border-slate-200 text-xs space-y-1.5">
                        <div class="flex justify-between py-1 border-b border-slate-200">
                            <span>${t.unit_price_direct}</span>
                            <span class="font-mono font-bold">¥ ${data.directCost.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between py-1 border-b border-slate-200 text-slate-600">
                            <span>${t.unit_temp}</span>
                            <span class="font-mono">¥ ${data.tempCost.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between py-1 border-b border-slate-200 text-slate-600">
                            <span>${t.unit_site}</span>
                            <span class="font-mono">¥ ${data.siteCost.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between py-1.5 text-sm font-bold text-slate-900 bg-amber-100/50 px-2 rounded">
                            <span>${t.unit_total}</span>
                            <span class="font-mono text-emerald-700">¥ ${data.totalCost.toLocaleString()}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                calculateDesign();
            } catch (e) {
                console.error("Init error:", e);
            }
        });
    </script>
