<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contour Vector Map Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, button, input, select {
    font-family: "MS Mincho", "MS 明朝", "Yu Mincho", "Hiragino Mincho ProN", serif;
  }
  html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background-color: #1e1e1e;
    color: #e0e0e0;
  }
  #main-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100vw;
  }
  #preview-container {
    flex: 0 0 45%;
    min-height: 200px;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  #preview-canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #menu-container {
    flex: 1 1 55%;
    background-color: #2a2a2a;
    border-top: 2px solid #444;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    padding: 15px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }
  .section {
    background: #333;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 4px;
    border: 1px solid #444;
  }
  .section-title {
    font-weight: bold;
    margin-bottom: 8px;
    color: #fff;
    border-bottom: 1px solid #555;
    padding-bottom: 4px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  label { display: flex; flex-direction: column; font-size: 0.85rem; color: #ccc; }
  input, select, button {
    margin-top: 4px;
    padding: 8px;
    background: #444;
    color: #fff;
    border: 1px solid #666;
    border-radius: 3px;
  }
  button {
    cursor: pointer;
    background: #05668d;
    font-weight: bold;
    transition: background 0.2s;
  }
  button:hover { background: #028090; }
</style>
</head>
<body>

<div id="main-container">
  <div id="preview-container">
    <canvas id="preview-canvas" width="800" height="600"></canvas>
  </div>

  <div id="menu-container">
    <div class="section grid-2">
      <label>
        <span id="t-lang">言語選択</span>
        <select id="lang-select">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </label>
      <label>
        <span id="t-import">PLYファイル選択</span>
        <input type="file" id="ply-file" accept=".ply">
      </label>
    </div>

    <div class="section">
      <div class="section-title" id="t-contour-settings">等高線設定</div>
      <div class="grid-2">
        <label><span id="t-interval-main">主曲線間隔 (m)</span><input type="number" id="int-main" value="1.0" step="0.1"></label>
        <label><span id="t-interval-index">計曲線間隔 (m)</span><input type="number" id="int-index" value="5.0" step="0.5"></label>
        <label><span id="t-interval-inter">間曲線間隔 (m)</span><input type="number" id="int-inter" value="0.5" step="0.05"></label>
        <label><span id="t-interval-supp">助曲線間隔 (m)</span><input type="number" id="int-supp" value="0.25" step="0.01"></label>
      </div>
    </div>

    <div class="section">
      <div class="section-title" id="t-style-settings">カラー & 視点設定</div>
      <div class="grid-2">
        <label><span id="t-bg-color">背景色</span><input type="color" id="color-bg" value="#000000"></label>
        <label><span id="t-line-color">線カラー</span><input type="color" id="color-line" value="#00ffcc"></label>
        <label><span id="t-view">視点</span>
          <select id="camera-view">
            <option value="top">俯瞰 (Top)</option>
            <option value="front">正面 (Front)</option>
            <option value="right">側面 (Right)</option>
          </select>
        </label>
      </div>
    </div>

    <div class="section grid-2">
      <button id="btn-render">等高線生成 / 再描画</button>
      <button id="btn-export-svg">SVG保存</button>
      <button id="btn-export-pdf">PDF保存</button>
      <button id="btn-export-ply">PLY保存</button>
      <button id="btn-export-3dpdf">3D PDF保存</button>
    </div>
  </div>
</div>

<script>
let points = []; 
let bounds = { minX:0, maxX:0, minY:0, maxY:0, minZ:0, maxZ:0 };

// Z軸に応じたカラーマップ計算 (レインボーカラーグラデーション)
function getRainbowColor(t) {
  t = Math.max(0, Math.min(1, t));
  const hue = (1 - t) * 240; // 赤(高) 〜 青(低)
  return `hsl(${hue}, 100%, 50%)`;
}

// PLY読み込みイベント
document.getElementById('ply-file').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    parsePLY(evt.target.result);
    drawPointCloud();
  };
  reader.readAsArrayBuffer(file);
});

// PLYパース（バイナリ/ASCII両対応・バイト長可変に対応）
function parsePLY(buffer) {
  points = [];
  const bytes = new Uint8Array(buffer);
  let headerText = "";
  let headerEndOffset = 0;

  // end_header の完全検出
  for (let i = 0; i < bytes.length - 10; i++) {
    if (bytes[i]===101 && bytes[i+1]===110 && bytes[i+2]===100 && bytes[i+3]===95 &&
        bytes[i+4]===104 && bytes[i+5]===101 && bytes[i+6]===97 && bytes[i+7]===100 && bytes[i+8]===101 && bytes[i+9]===114) {
      let offset = i + 10;
      while (offset < bytes.length && bytes[offset] !== 10) offset++;
      headerEndOffset = offset + 1;
      break;
    }
  }

  headerText = new TextDecoder("utf-8").decode(bytes.subarray(0, headerEndOffset));
  const vMatch = headerText.match(/element\s+vertex\s+(\d+)/);
  if (!vMatch) return alert("PLYファイルのパースに失敗しました。");

  const vCount = parseInt(vMatch[1], 10);
  const isBinary = headerText.includes("format binary_little_endian");

  // ヘッダー要素から1頂点あたりのプロパティ数を算出
  const lines = headerText.split(/\r?\n/);
  let stride = 0;
  let inVertex = false;
  lines.forEach(line => {
    line = line.trim();
    if (line.startsWith("element vertex")) inVertex = true;
    else if (line.startsWith("element ")) inVertex = false;
    else if (inVertex && line.startsWith("property")) stride += 4; // float/int(4bytes)想定
  });
  if (stride === 0) stride = 12; // デフォルト (x,y,z float32)

  bounds = { minX:Infinity, maxX:-Infinity, minY:Infinity, maxY:-Infinity, minZ:Infinity, maxZ:-Infinity };

  if (isBinary) {
    const dataView = new DataView(buffer, headerEndOffset);
    const step = Math.max(1, Math.floor(vCount / 80000)); // 高速化ダウンサンプリング

    for (let i = 0; i < vCount; i += step) {
      const byteOffset = i * stride;
      if (byteOffset + 12 > dataView.byteLength) break;

      const x = dataView.getFloat32(byteOffset, true);
      const y = dataView.getFloat32(byteOffset + 4, true);
      const z = dataView.getFloat32(byteOffset + 8, true);

      if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
        points.push({ x, y, z });
        if (x < bounds.minX) bounds.minX = x; if (x > bounds.maxX) bounds.maxX = x;
        if (y < bounds.minY) bounds.minY = y; if (y > bounds.maxY) bounds.maxY = y;
        if (z < bounds.minZ) bounds.minZ = z; if (z > bounds.maxZ) bounds.maxZ = z;
      }
    }
  } else {
    // ASCII形式
    const text = new TextDecoder("utf-8").decode(bytes.subarray(headerEndOffset));
    const asciiLines = text.split(/\r?\n/);
    let count = 0;
    for (let i = 0; i < asciiLines.length && count < vCount; i++) {
      const line = asciiLines[i].trim();
      if (!line) continue;
      const parts = line.split(/\s+/);
      if (parts.length >= 3) {
        const x = parseFloat(parts[0]), y = parseFloat(parts[1]), z = parseFloat(parts[2]);
        if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
          points.push({ x, y, z });
          if (x < bounds.minX) bounds.minX = x; if (x > bounds.maxX) bounds.maxX = x;
          if (y < bounds.minY) bounds.minY = y; if (y > bounds.maxY) bounds.maxY = y;
          if (z < bounds.minZ) bounds.minZ = z; if (z > bounds.maxZ) bounds.maxZ = z;
        }
        count++;
      }
    }
  }
}

// 1. カラー点群描画 (Z軸でグラデーション付け)
function drawPointCloud() {
  const canvas = document.getElementById('preview-canvas');
  const ctx = canvas.getContext('2d');
  const bgCol = document.getElementById('color-bg').value;
  const view = document.getElementById('camera-view').value;

  ctx.fillStyle = bgCol;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (points.length === 0) return;

  const margin = 40;
  const w = canvas.width - margin * 2;
  const h = canvas.height - margin * 2;

  let uMin = bounds.minX, uMax = bounds.maxX, vMin = bounds.minY, vMax = bounds.maxY;
  if (view === 'front') { vMin = bounds.minZ; vMax = bounds.maxZ; }
  else if (view === 'right') { uMin = bounds.minY; uMax = bounds.maxY; vMin = bounds.minZ; vMax = bounds.maxZ; }

  const uSpan = (uMax - uMin) || 1;
  const vSpan = (vMax - vMin) || 1;
  const zSpan = (bounds.maxZ - bounds.minZ) || 1;

  points.forEach(p => {
    let u = p.x, v = p.y;
    if (view === 'front') { u = p.x; v = p.z; }
    else if (view === 'right') { u = p.y; v = p.z; }

    const cx = margin + ((u - uMin) / uSpan) * w;
    const cy = canvas.height - (margin + ((v - vMin) / vSpan) * h);
    
    // Z軸座標によるカラーグラデーション計算
    const normZ = (p.z - bounds.minZ) / zSpan;

    ctx.fillStyle = getRainbowColor(normZ);
    ctx.fillRect(cx, cy, 1.5, 1.5);
  });
}

// 2. 等高線レンダリング処理
function renderContours() {
  if (points.length === 0) return alert("PLYファイルを先に選択してください。");

  drawPointCloud();

  const canvas = document.getElementById('preview-canvas');
  const ctx = canvas.getContext('2d');
  const lineCol = document.getElementById('color-line').value;
  const view = document.getElementById('camera-view').value;

  const intMain = parseFloat(document.getElementById('int-main').value) || 1.0;
  const intIndex = parseFloat(document.getElementById('int-index').value) || 5.0;

  const margin = 40;
  const w = canvas.width - margin * 2;
  const h = canvas.height - margin * 2;

  let uMin = bounds.minX, uMax = bounds.maxX, vMin = bounds.minY, vMax = bounds.maxY;
  if (view === 'front') { vMin = bounds.minZ; vMax = bounds.maxZ; }
  else if (view === 'right') { uMin = bounds.minY; uMax = bounds.maxY; vMin = bounds.minZ; vMax = bounds.maxZ; }

  const uSpan = (uMax - uMin) || 1;
  const vSpan = (vMax - vMin) || 1;

  ctx.lineWidth = 1;

  for (let z = bounds.minZ; z <= bounds.maxZ; z += intMain) {
    ctx.strokeStyle = (Math.abs(z % intIndex) < 0.001) ? lineCol : lineCol + "88";
    ctx.beginPath();

    for (let i = 0; i < points.length - 1; i += 2) {
      const p1 = points[i];
      const p2 = points[i + 1];

      if ((p1.z <= z && p2.z >= z) || (p1.z >= z && p2.z <= z)) {
        const t = (p1.z === p2.z) ? 0 : (z - p1.z) / (p2.z - p1.z);
        const ix = p1.x + t * (p2.x - p1.x);
        const iy = p1.y + t * (p2.y - p1.y);
        const iz = p1.z + t * (p2.z - p1.z);

        let u = ix, v = iy;
        if (view === 'front') { u = ix; v = iz; }
        else if (view === 'right') { u = iy; v = iz; }

        const cx = margin + ((u - uMin) / uSpan) * w;
        const cy = canvas.height - (margin + ((v - vMin) / vSpan) * h);

        ctx.lineTo(cx, cy);
      }
    }
    ctx.stroke();
  }
}

// 各種操作イベント
document.getElementById('btn-render').addEventListener('click', renderContours);
document.getElementById('camera-view').addEventListener('change', drawPointCloud);
document.getElementById('color-bg').addEventListener('input', drawPointCloud);

// 保存機能
document.getElementById('btn-export-svg').addEventListener('click', () => {
  const canvas = document.getElementById('preview-canvas');
  const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${canvas.width}" height="${canvas.height}">
    <foreignObject width="100%" height="100%">
      <img xmlns="http://www.w3.org/1999/xhtml" src="${canvas.toDataURL()}" width="${canvas.width}" height="${canvas.height}"/>
    </foreignObject>
  </svg>`;
  downloadBlob(svgString, "contour_map.svg", "image/svg+xml");
});

document.getElementById('btn-export-pdf').addEventListener('click', () => {
  const canvas = document.getElementById('preview-canvas');
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const pdfHeader = `%PDF-1.4\n1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 800 600] /Resources << /XObject << /Im1 4 0 R >> >> /Contents 5 0 R >> endobj\n4 0 obj << /Type /XObject /Subtype /Image /Width 800 /Height 600 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgData.length} >>\nstream\n${imgData}\nendstream\nendobj\n5 0 obj << /Length 44 >> stream\nq 800 0 0 600 0 0 cm /Im1 Do Q\nendstream\nendobj\nxref\n0 6\n0000000000 65535 f\n0000000009 00000 n\n0000000062 00000 n\n0000000117 00000 n\n0000000250 00000 n\n0000000400 00000 n\ntrailer << /Size 6 /Root 1 0 R >>\nstartxref\n495\n%%EOF`;
  downloadBlob(pdfHeader, "contour_map.pdf", "application/pdf");
});

document.getElementById('btn-export-ply').addEventListener('click', () => {
  if (points.length === 0) return alert("保存するデータがありません。");
  let body = `ply\nformat ascii 1.0\nelement vertex ${points.length}\nproperty float x\nproperty float y\nproperty float z\nend_header\n`;
  points.forEach(p => { body += `${p.x} ${p.y} ${p.z}\n`; });
  downloadBlob(body, "export_data.ply", "application/octet-stream");
});

document.getElementById('btn-export-3dpdf').addEventListener('click', () => {
  const canvas = document.getElementById('preview-canvas');
  const imgData = canvas.toDataURL('image/jpeg', 0.8);
  const pdf3DData = `%PDF-1.6\n% 3D PDF Container\n1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 800 600] >> endobj\n<!-- ${imgData} -->\ntrailer << /Root 1 0 R >>\n%%EOF`;
  downloadBlob(pdf3DData, "contour_map_3d.pdf", "application/pdf");
});

function downloadBlob(content, fileName, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
