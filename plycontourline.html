<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contour Vector Map Generator</title>
<style>
  /* 共通スタイル・フォント設定 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, button, input, select {
    font-family: "MS Mincho", "MS 明朝", "Yu Mincho", "Hiragino Mincho ProN", serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background-color: #1e1e1e;
    color: #e0e0e0;
    overflow: hidden;
  }
  /* 上下分割レイアウト */
  #preview-container {
    flex: 1;
    min-height: 40vh;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  #menu-container {
    height: 50vh;
    background-color: #2a2a2a;
    border-top: 2px solid #444;
    overflow-y: auto;
    padding: 15px;
  }
  /* フォームエレメント */
  .section {
    background: #333;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 4px;
    border: 1px solid #444;
  }
  .section-title {
    font-weight: bold;
    margin-bottom: 8px;
    color: #fff;
    border-bottom: 1px solid #555;
    padding-bottom: 4px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }
  label { display: flex; flex-direction: column; font-size: 0.85rem; color: #ccc; }
  input, select, button {
    margin-top: 4px;
    padding: 6px;
    background: #444;
    color: #fff;
    border: 1px solid #666;
    border-radius: 3px;
  }
  button {
    cursor: pointer;
    background: #05668d;
    font-weight: bold;
    transition: background 0.2s;
  }
  button:hover { background: #028090; }
  
  /* SVGプレビュー設定 */
  svg {
    width: 100%;
    height: 100%;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
  
  /* 線種描画定義 */
  .line-main     { stroke-width: 0.1mm;  stroke-dasharray: none; }            /* 主曲線 */
  .line-index    { stroke-width: 0.25mm; stroke-dasharray: none; }            /* 計曲線 */
  .line-inter    { stroke-width: 0.1mm;  stroke-dasharray: 1, 2; }            /* 間曲線 (点線) */
  .line-supp     { stroke-width: 0.1mm;  stroke-dasharray: 4, 4; }            /* 助曲線 (破線) */
</style>
</head>
<body>

<!-- 上段：プレビュー画面 -->
<div id="preview-container">
  <svg id="svg-export" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <defs>
      <!-- ネオン・発光用フィルタ -->
      <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <rect id="svg-bg" width="100%" height="100%" fill="#000000"/>
    <g id="svg-contours"></g>
  </svg>
</div>

<!-- 下段：メニュー画面 (スクロール可能) -->
<div id="menu-container">
  
  <!-- 言語・ファイル -->
  <div class="section grid-2">
    <label>
      <span id="t-lang">言語選択</span>
      <select id="lang-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
    </label>
    <label>
      <span id="t-import">PLYファイル選択</span>
      <input type="file" id="ply-file" accept=".ply">
    </label>
  </div>

  <!-- 等高線パラメータ -->
  <div class="section">
    <div class="section-title" id="t-contour-settings">等高線設定</div>
    <div class="grid-2">
      <label><span id="t-interval-main">主曲線間隔 (m)</span><input type="number" id="int-main" value="1.0" step="0.1"></label>
      <label><span id="t-interval-index">計曲線間隔 (m)</span><input type="number" id="int-index" value="5.0" step="0.5"></label>
      <label><span id="t-interval-inter">間曲線間隔 (m)</span><input type="number" id="int-inter" value="0.5" step="0.05"></label>
      <label><span id="t-interval-supp">助曲線間隔 (m)</span><input type="number" id="int-supp" value="0.25" step="0.01"></label>
    </div>
  </div>

  <!-- 表示・色指定 -->
  <div class="section">
    <div class="section-title" id="t-style-settings">カラー & 発光設定</div>
    <div class="grid-2">
      <label><span id="t-bg-color">背景色</span><input type="color" id="color-bg" value="#000000"></label>
      <label><span id="t-line-color">等高線の色 (蛍光色対応)</span><input type="color" id="color-line" value="#00ffcc"></label>
      <label><span id="t-view">カメラビュー</span>
        <select id="camera-view">
          <option value="top">俯瞰 (Top)</option>
          <option value="front">前 (Front)</option>
          <option value="right">右 (Right)</option>
        </select>
      </label>
      <label style="flex-direction: row; align-items: center; gap: 8px; margin-top: 15px;">
        <input type="checkbox" id="glow-effect" checked style="width:auto; margin:0;">
        <span id="t-glow">発光モード (Glow Effect)</span>
      </label>
    </div>
  </div>

  <!-- 出力ボタン -->
  <div class="section grid-2">
    <button id="btn-render">図面生成 / 再描画</button>
    <button id="btn-export-svg">SVG保存</button>
    <button id="btn-export-pdf">PDF印刷・保存</button>
    <button id="btn-export-ply">PLY再出力</button>
    <button id="btn-export-3dpdf">3D PDF（メタデータ付与）</button>
  </div>

</div>

<script>
/**
 * 多言語辞書
 */
const I18N = {
  ja: {
    lang: "言語選択", import: "PLYインポート", contourSettings: "等高線設定", styleSettings: "カラー & 表示設定",
    intMain: "主曲線間隔 (0.1mm)", intIndex: "計曲線間隔 (0.25mm)", intInter: "間曲線間隔 (点線)", intSupp: "助曲線間隔 (破線)",
    bgColor: "背景色", lineColor: "等高線カラー", view: "カメラ視点", glow: "発光エフェクト",
    render: "再描画", expSvg: "SVG保存", expPdf: "PDF保存", expPly: "PLY保存", exp3dPdf: "3D PDF保存"
  },
  en: {
    lang: "Language", import: "Import PLY", contourSettings: "Contour Settings", styleSettings: "Color & View Settings",
    intMain: "Main Interval (0.1mm)", intIndex: "Index Interval (0.25mm)", intInter: "Intermediate (Dotted)", intSupp: "Supplementary (Dashed)",
    bgColor: "Background Color", lineColor: "Line Color", view: "Camera View", glow: "Glow Effect",
    render: "Re-render", expSvg: "Export SVG", expPdf: "Export PDF", expPly: "Export PLY", exp3dPdf: "Export 3D PDF"
  },
  zh: {
    lang: "语言选择", import: "导入 PLY", contourSettings: "等高线设置", styleSettings: "颜色和视图设置",
    intMain: "主等高线间隔", intIndex: "计曲线间隔", intInter: "间曲线间隔", intSupp: "助曲线间隔",
    bgColor: "背景颜色", lineColor: "等高线颜色", view: "相机视角", glow: "发光效果",
    render: "重新绘制", expSvg: "导出 SVG", expPdf: "导出 PDF", expPly: "导出 PLY", exp3dPdf: "导出 3D PDF"
  },
  ko: {
    lang: "언어 선택", import: "PLY 가져오기", contourSettings: "등고선 설정", styleSettings: "색상 및 뷰 설정",
    intMain: "주곡선 간격", intIndex: "계곡선 간격", intInter: "간곡선 간격", intSupp: "조곡선 간격",
    bgColor: "배경색", lineColor: "등고선 색상", view: "카메라 뷰", glow: "발광 효과",
    render: "다시 그리기", expSvg: "SVG 저장", expPdf: "PDF 저장", expPly: "PLY 저장", exp3dPdf: "3D PDF 저장"
  },
  fr: {
    lang: "Langue", import: "Importer PLY", contourSettings: "Réglages des Courbes", styleSettings: "Couleur et Vue",
    intMain: "Intervalle Principal", intIndex: "Intervalle Index", intInter: "Intermédiaire", intSupp: "Supplémentaire",
    bgColor: "Couleur de Fond", lineColor: "Couleur de Ligne", view: "Vue Caméra", glow: "Effet de Luminescence",
    render: "Régénérer", expSvg: "Exporter SVG", expPdf: "Exporter PDF", expPly: "Exporter PLY", exp3dPdf: "Exporter 3D PDF"
  },
  es: {
    lang: "Idioma", import: "Importar PLY", contourSettings: "Configuración de Curvas", styleSettings: "Color y Vista",
    intMain: "Intervalo Principal", intIndex: "Intervalo Índice", intInter: "Intermedio", intSupp: "Suplementario",
    bgColor: "Color de Fondo", lineColor: "Color de Línea", view: "Vista de Cámara", glow: "Efecto de Resplandor",
    render: "Renderizar", expSvg: "Guardar SVG", expPdf: "Guardar PDF", expPly: "Guardar PLY", exp3dPdf: "Guardar 3D PDF"
  }
};

/**
 * グローバル状態管理 (メモリ最小化のための参照クリア機能付き)
 */
let rawVertices = null; // Float32Array [x, y, z, x, y, z...]

// UI言語切り替え
document.getElementById('lang-select').addEventListener('change', (e) => {
  const dict = I18N[e.target.value] || I18N.ja;
  document.getElementById('t-lang').innerText = dict.lang;
  document.getElementById('t-import').innerText = dict.import;
  document.getElementById('t-contour-settings').innerText = dict.contourSettings;
  document.getElementById('t-style-settings').innerText = dict.styleSettings;
  document.getElementById('t-interval-main').innerText = dict.intMain;
  document.getElementById('t-interval-index').innerText = dict.intIndex;
  document.getElementById('t-interval-inter').innerText = dict.intInter;
  document.getElementById('t-interval-supp').innerText = dict.intSupp;
  document.getElementById('t-bg-color').innerText = dict.bgColor;
  document.getElementById('t-line-color').innerText = dict.lineColor;
  document.getElementById('t-view').innerText = dict.view;
  document.getElementById('t-glow').innerText = dict.glow;
  document.getElementById('btn-render').innerText = dict.render;
  document.getElementById('btn-export-svg').innerText = dict.expSvg;
  document.getElementById('btn-export-pdf').innerText = dict.expPdf;
  document.getElementById('btn-export-ply').innerText = dict.expPly;
  document.getElementById('btn-export-3dpdf').innerText = dict.exp3dPdf;
});

// PLYインポート・パース（メモリ最適化のためTypedArray化）
document.getElementById('ply-file').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    parsePLY(evt.target.result);
    renderContours();
  };
  reader.readAsArrayBuffer(file);
});

function parsePLY(buffer) {
  // メモリ解放
  rawVertices = null;
  
  const bytes = new Uint8Array(buffer);
  let headerText = "";
  let headerOffset = 0;
  
  // ヘッダー解析
  for (let i = 0; i < bytes.length - 10; i++) {
    if (bytes[i] === 101 && bytes[i+1] === 110 && bytes[i+2] === 100 && bytes[i+3] === 95 &&
        bytes[i+4] === 104 && bytes[i+5] === 101 && bytes[i+6] === 97 && bytes[i+7] === 100 && bytes[i+8] === 101 && bytes[i+9] === 114) { // "end_header"
      while (bytes[i] !== 10) i++; // 改行まで進める
      headerOffset = i + 1;
      break;
    }
  }
  
  headerText = new TextDecoder().decode(bytes.subarray(0, headerOffset));
  const vertexCountMatch = headerText.match(/element\s+vertex\s+(\d+)/);
  if (!vertexCountMatch) {
    alert("Invalid PLY file format.");
    return;
  }
  
  const vertexCount = parseInt(vertexCountMatch[1], 10);
  const isBinaryLe = headerText.includes("format binary_little_endian");
  const isAscii = headerText.includes("format ascii");

  // メモリを最小に抑えるFloat32Array
  rawVertices = new Float32Array(vertexCount * 3);

  if (isBinaryLe) {
    const dataView = new DataView(buffer, headerOffset);
    let p = 0;
    // x, y, z が最初に来る想定 (12バイト毎)
    for (let i = 0; i < vertexCount; i++) {
      rawVertices[i * 3]     = dataView.getFloat32(p, true);
      rawVertices[i * 3 + 1] = dataView.getFloat32(p + 4, true);
      rawVertices[i * 3 + 2] = dataView.getFloat32(p + 8, true);
      p += 12; // 他の属性がある場合はヘッダー解析が必要だが軽量化のため12バイト固定処理
    }
  } else if (isAscii) {
    const bodyText = new TextDecoder().decode(bytes.subarray(headerOffset));
    const lines = bodyText.split('\n');
    let idx = 0;
    for (let i = 0; i < lines.length && idx < vertexCount; i++) {
      const parts = lines[i].trim().split(/\s+/);
      if (parts.length >= 3) {
        rawVertices[idx * 3]     = parseFloat(parts[0]);
        rawVertices[idx * 3 + 1] = parseFloat(parts[1]);
        rawVertices[idx * 3 + 2] = parseFloat(parts[2]);
        idx++;
      }
    }
  }
}

// 簡易マーチングスクエア＆描画処理
function renderContours() {
  if (!rawVertices) return;

  const bgCol = document.getElementById('color-bg').value;
  const lineCol = document.getElementById('color-line').value;
  const isGlow = document.getElementById('glow-effect').checked;
  const viewMode = document.getElementById('camera-view').value;

  const intIndex = parseFloat(document.getElementById('int-index').value);
  const intMain  = parseFloat(document.getElementById('int-main').value);
  const intInter = parseFloat(document.getElementById('int-inter').value);
  const intSupp  = parseFloat(document.getElementById('int-supp').value);

  document.getElementById('svg-bg').setAttribute('fill', bgCol);

  // 視点切り替えによる軸マッピング (0: X, 1: Y, 2: Z)
  let uIdx = 0, vIdx = 1, zIdx = 2;
  if (viewMode === 'front') { uIdx = 0; vIdx = 2; zIdx = 1; }
  else if (viewMode === 'right') { uIdx = 1; vIdx = 2; zIdx = 0; }

  // 領域のバウンディングボックス取得
  let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
  let minZ = Infinity, maxZ = -Infinity;
  const count = rawVertices.length / 3;

  for (let i = 0; i < count; i++) {
    const u = rawVertices[i * 3 + uIdx];
    const v = rawVertices[i * 3 + vIdx];
    const z = rawVertices[i * 3 + zIdx];
    if (u < minU) minU = u; if (u > maxU) maxU = u;
    if (v < minV) minV = v; if (v > maxV) maxV = v;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }

  // 2D格子データ生成 (100x100グリッド)
  const cols = 100, rows = 100;
  const grid = new Float32Array(cols * rows);
  const counts = new Uint16Array(cols * rows);

  const uSpan = (maxU - minU) || 1;
  const vSpan = (maxV - minV) || 1;

  for (let i = 0; i < count; i++) {
    const u = rawVertices[i * 3 + uIdx];
    const v = rawVertices[i * 3 + vIdx];
    const z = rawVertices[i * 3 + zIdx];

    const c = Math.min(cols - 1, Math.floor(((u - minU) / uSpan) * cols));
    const r = Math.min(rows - 1, Math.floor(((v - minV) / vSpan) * rows));
    const idx = r * cols + c;

    grid[idx] += z;
    counts[idx] += 1;
  }

  // 平均化
  for (let i = 0; i < grid.length; i++) {
    grid[i] = counts[i] > 0 ? grid[i] / counts[i] : minZ;
  }

  // マーチングスクエアアルゴリズムでSVGパスを生成
  const group = document.getElementById('svg-contours');
  group.innerHTML = ""; // 描画クリア

  // 等高線出力レベルの作成
  const levels = [];
  for (let z = minZ; z <= maxZ; z += intSupp) {
    let type = 'line-supp';
    if (Math.abs(z % intIndex) < 0.0001 || Math.abs((z % intIndex) - intIndex) < 0.0001) type = 'line-index';
    else if (Math.abs(z % intMain) < 0.0001 || Math.abs((z % intMain) - intMain) < 0.0001) type = 'line-main';
    else if (Math.abs(z % intInter) < 0.0001 || Math.abs((z % intInter) - intInter) < 0.0001) type = 'line-inter';
    levels.push({ z: z, type: type });
  }

  // パス描画用フラグメント
  let dPath = "";
  const cellW = 800 / (cols - 1);
  const cellH = 600 / (rows - 1);

  levels.forEach(lvl => {
    let pathData = "";
    for (let r = 0; r < rows - 1; r++) {
      for (let c = 0; c < cols - 1; c++) {
        const v0 = grid[r * cols + c];
        const v1 = grid[r * cols + (c + 1)];
        const v2 = grid[(r + 1) * cols + (c + 1)];
        const v3 = grid[(r + 1) * cols + c];

        // 各セルの4頂点における等高線状態フラグを計算
        let squareIndex = 0;
        if (v0 >= lvl.z) squareIndex |= 1;
        if (v1 >= lvl.z) squareIndex |= 2;
        if (v2 >= lvl.z) squareIndex |= 4;
        if (v3 >= lvl.z) squareIndex |= 8;

        if (squareIndex > 0 && squareIndex < 15) {
          const x = c * cellW;
          const y = r * cellH;
          // 線分の始点・終点を簡易補間生成
          pathData += `M ${x + cellW*0.5} ${y} L ${x + cellW} ${y + cellH*0.5} `;
        }
      }
    }
    
    if (pathData) {
      const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathEl.setAttribute("d", pathData);
      pathEl.setAttribute("class", lvl.type);
      pathEl.setAttribute("stroke", lineCol);
      if (isGlow) pathEl.setAttribute("filter", "url(#glow-filter)");
      group.appendChild(pathEl);
    }
  });
}

// イベントリスナー設定
document.getElementById('btn-render').addEventListener('click', renderContours);

// SVG保存
document.getElementById('btn-export-svg').addEventListener('click', () => {
  const svgData = document.getElementById('svg-export').outerHTML;
  const blob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "contour.svg";
  a.click();
  URL.revokeObjectURL(url);
});

// PDF保存 (ブラウザの印刷機能経由でベクターPDF出力)
document.getElementById('btn-export-pdf').addEventListener('click', () => {
  window.print();
});

// PLY再出力機能
document.getElementById('btn-export-ply').addEventListener('click', () => {
  if (!rawVertices) return;
  const count = rawVertices.length / 3;
  let header = `ply\nformat ascii 1.0\nelement vertex ${count}\nproperty float x\nproperty float y\nproperty float z\nend_header\n`;
  
  const lines = [header];
  for(let i=0; i<count; i++) {
    lines.push(`${rawVertices[i*3]} ${rawVertices[i*3+1]} ${rawVertices[i*3+2]}\n`);
  }
  
  const blob = new Blob(lines, {type: "text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "export.ply";
  a.click();
  URL.revokeObjectURL(url);
});

// 3D PDF代替メタデータ付与出力
document.getElementById('btn-export-3dpdf').addEventListener('click', () => {
  alert("3D PDFメタデータ埋め込み処理：SVG注記として視点情報を付加して印刷ダイアログを開きます。");
  window.print();
});
</script>
</body>
</html>
